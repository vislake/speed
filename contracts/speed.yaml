        id:
          type: string
          description: Application-generated UUID. Pass this to rotate or revoke.
        key:
          type: string
          description: >-
            The raw, plaintext credential the caller must record now. It
            authenticates as itself; nothing else this fragment returns ever
            reproduces it.
        prefix:
          type: string
          description: The display-safe portion also visible later through list.
        scopes:
          type: array
          items:
            type: string
        createdBy:
          type: string
          description: The authn user id of whoever issued this key.
        expiresAt:
          type: string
          format: date-time
        auditRecordMissing:
          type: boolean
          description: >-
            True only when the key was created and is usable but this
            operation's own bookkeeping did not fully land: for
            integration_createAPIKey, the creation audit record was not written;
            for integration_rotateAPIKey, the predecessor's revocation (and the
            audit record of it) did not complete, so the caller must not assume
            the predecessor is revoked. Absent or false: every record was
            written normally. The gap is a platform bookkeeping failure, never a
            defect of the key.
    IntegrationAPIKeySummary:
      type: object
      description: >-
        One row of integration_listAPIKeys' response -- every field of the
        stored key except the raw value and its hash (Service.List's own
        "credential-material-free" contract).
      properties:
        id:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: When this key last authenticated a request. Null until first use.
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
        expired:
          type: boolean
        creatorLeft:
          type: boolean
          description: >-
            Whether CreatedBy is no longer an active member of the tenant -- a
            display flag only, computed through the optional MembershipChecker
            seam; false when no seam is wired, exactly as if every creator were
            still active.
    IntegrationListAPIKeysResponse:
      type: object
      properties:
        apiKeys:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationAPIKeySummary'
    IntegrationWebhookSubscriptionSummary:
      type: object
      description: >-
        One webhook subscription as every read of this fragment exposes it:
        every field of the stored subscription except the signing secret
        (Service.WebhookSubscriptionSummary). active=false means delivery is
        paused -- the subscription exists, but no domain event fans out to it
        until an update sets active=true.
      properties:
        id:
          type: string
          description: >-
            Application-generated UUID. Pass this to update, delete, restore or
            the deliveries log.
        url:
          type: string
          description: The receiving endpoint deliveries are POSTed to.
        eventTypes:
          type: array
          items:
            type: string
          description: >-
            The public event types this subscription wants delivered; every
            entry is some registered EventMapping's public type.
        active:
          type: boolean
          description: The subscription's delivery gate; false means paused.
        createdBy:
          type: string
          description: The authn user id of whoever configured this subscription.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IntegrationCreatedWebhookSubscription:
      type: object
      description: >-
        Service.CreateWebhookSubscription's result: the one and only place the
        raw signing secret is ever available, mirroring
        IntegrationCreatedAPIKey's own "shown once" contract. secret is never
        logged and never returned again by any other operation.
      properties:
        id:
          type: string
          description: Application-generated UUID. Pass this to update, delete or restore.
        url:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        secret:
          type: string
          description: >-
            The raw HMAC signing secret the caller must record now. A receiver
            verifies this subscription's signatures with it; nothing this
            fragment returns after this call ever reproduces it.
        active:
          type: boolean
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        auditRecordMissing:
          type: boolean
          description: >-
            True only when the subscription was created and is delivering but
            the operation's audit record was not written -- a platform
            bookkeeping gap, never a defect of the subscription or its secret.
            Absent or false: the record was written normally.
    IntegrationListWebhookSubscriptionsResponse:
      type: object
      properties:
        webhookSubscriptions:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationWebhookSubscriptionSummary'
    IntegrationCreateWebhookSubscriptionRequest:
      type: object
      description: >-
        A new subscription's configuration. Both fields are mandatory; the empty
        eventTypes set is refused (a subscription that would never match
        anything is never created).
      required:
        - url
        - eventTypes
      properties:
        url:
          type: string
          description: >-
            The receiving endpoint. Validated before anything is persisted: must
            be a reachable http/https URL whose host is neither private,
            loopback nor otherwise blocked (go/integration's SSRF rules).
        eventTypes:
          type: array
          items:
            type: string
          description: >-
            The non-empty set of public event types to deliver. Every entry must
            be some registered EventMapping's public type.
    IntegrationUpdateWebhookSubscriptionRequest:
      type: object
      description: >-
        A partial update: a field that is absent leaves the corresponding stored
        value unchanged (nil means no change, exactly as
        Service.UpdateWebhookSubscription's input treats it). A present but
        empty eventTypes is refused, identically to create.
      properties:
        url:
          type: string
          description: >-
            Replaces the stored URL after the identical validation create
            applies.
        eventTypes:
          type: array
          items:
            type: string
          description: >-
            Replaces the stored selection after the identical non-empty /
            known-type validation create applies.
        active:
          type: boolean
          description: >-
            Flips the subscription's delivery gate. false pauses delivery; true
            resumes it -- the step a restored subscription needs to deliver
            again.
    IntegrationWebhookDeliverySummary:
      type: object
      description: >-
        One delivery attempt row of integration_listWebhookDeliveries -- every
        field of the stored delivery except the raw payload bytes
        (Service.WebhookDeliverySummary).
      properties:
        id:
          type: string
          description: Application-generated delivery id.
        subscriptionId:
          type: string
          description: The subscription this attempt delivers for.
        eventType:
          type: string
        eventVersion:
          type: string
        status:
          type: string
          description: >-
            One of the delivery pipeline's status vocabulary: "pending",
            "failed", "delivered" or "dead_letter" (the terminal state after the
            bounded retry horizon; see Service.handleDeliveryJob's own doc
            comment).
        attempts:
          type: integer
          description: How many times this delivery has been attempted.
        lastStatusCode:
          type: integer
          nullable: true
          description: >-
            The receiver's HTTP status on the last attempt. Null when no attempt
            has produced one yet.
        lastError:
          type: string
          description: The last attempt's failure reason, empty when none.
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          description: When a delivered attempt succeeded. Null until then.
        createdAt:
          type: string
          format: date-time
    IntegrationListWebhookDeliveriesResponse:
      type: object
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationWebhookDeliverySummary'
    IntegrationError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text: code is a stable machine-readable identifier
        naming exactly one failure, and params carries the structured per-code
        details when the failure has any. The server never renders a message --
        a client maps each code to its own locale's text.
      properties:
        code:
          type: string
          example: integration.key_not_found
        params:
          type: object
          additionalProperties: true
    OrgNode:
      type: object
      description: One node of a tenant's organization tree.
      properties:
        id:
          type: string
          description: Application-generated UUID.
        parentId:
          type: string
          description: The parent node's id, or "" on the tenant root.
        path:
          type: string
          description: >-
            The materialized path from the tenant root down to and including
            this node (see go/org/path.go). Read-only.
        depth:
          type: integer
          description: The number of ancestors; 0 on the tenant root.
        name:
          type: string
        kind:
          type: string
          description: >-
            The tenant's own business classification of the node (for example
            "group", "region", "store"); org does not enumerate legal values.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrgCreateNodeRequest:
      type: object
      required:
        - name
      properties:
        parentId:
          type: string
          description: Absent or "" creates the tenant's root node instead of a child.
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          default: ''
    OrgRenameNodeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    OrgMoveNodeRequest:
      type: object
      required:
        - parentId
      properties:
        parentId:
          type: string
          description: The new parent's id.
    OrgListNodesResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/OrgNode'
    OrgMembership:
      type: object
      description: One person's binding to a node of a tenant's organization tree.
      properties:
        membershipId:
          type: string
        userId:
          type: string
          description: >-
            An id in authn's users table, carried as an opaque string -- org
            stores no other identity data about the user and never treats the id
            as anything but a reference.
        nodeId:
          type: string
        status:
          type: string
          description: One of "active", "invited", "suspended".
        createdAt:
          type: string
          format: date-time
    OrgListMembersResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrgMembership'
    OrgCreateInvitationRequest:
      type: object
      required:
        - email
        - nodeId
      properties:
        email:
          type: string
          description: The invitee's address.
        nodeId:
          type: string
          description: The node the invitee will be bound to on acceptance.
        locale:
          type: string
          description: >-
            The RECIPIENT's preferred language for the invitation email, an IETF
            tag such as "en-US" or "zh-CN" -- something the inviting operator,
            who knows the invitee, supplies explicitly, since the server has no
            request of the invitee's own to read a language preference from at
            invite-creation time. Omitted, or naming a language the platform
            carries no message catalog for, falls back to the platform default;
            it is NEVER inferred from the inviting operator's own browser or UI
            language.
    OrgAcceptInvitationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    OrgInvitation:
      type: object
      description: >-
        A pending (or resolved) offer to join the tenant. The invitee's address
        is deliberately absent from this schema: it is PII, encrypted at rest,
        and org's own convention (see invite.go) is never to echo it into
        anything that leaves the process boundary. The address's blind index is
        absent for the same reason, stated more strongly: HMAC non-invertibility
        (go/dbkit/blind_index.go) resists offline dictionary attacks, never an
        online oracle. Invitation creation accepts a caller-chosen address, so a
        caller who can create invitations can collect (address, index) pairs
        under this deployment's key, and an index echoed in a response would
        turn that dictionary into a membership test for the address of every
        listed invitation. A listed row carries only identifiers that do not
        name the invitee: its invitation id, the node it binds to, its status,
        expiry and timestamps.
      properties:
        id:
          type: string
        nodeId:
          type: string
        status:
          type: string
          description: One of "pending", "accepted", "revoked".
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    OrgListInvitationsResponse:
      type: object
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/OrgInvitation'
    OrgError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text: code is a stable machine-readable identifier
        naming exactly one failure, and params carries the structured per-code
        details when the failure has any. The server never renders a message --
        a client maps each code to its own locale's text.
      properties:
        code:
          type: string
          example: org.node_not_found
        params:
          type: object
          additionalProperties: true
    PkiSigningKey:
      type: object
      description: >-
        One pki_signing_keys row's public state -- never a private key or key
        reference.
      properties:
        kid:
          type: string
        purpose:
          type: string
        algorithm:
          type: string
        status:
          type: string
          description: '"pending", "active", "retiring", "retired" or "revoked".'
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        retiringAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        revocationReason:
          type: string
        createdAt:
          type: string
          format: date-time
    PkiRevokeSigningKeyRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          description: >-
            Why this key is being revoked. Recorded on the row and in the audit
            trail.
    PkiCertificate:
      type: object
      description: >-
        One pki_certificates row's public state -- never a private key or key
        reference.
      properties:
        id:
          type: string
        authorityId:
          type: string
        purpose:
          type: string
        subject:
          type: string
        sans:
          type: array
          items:
            type: string
        serial:
          type: string
        status:
          type: string
          description: '"active" or "revoked".'
        keyDelivered:
          type: boolean
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        revocationReason:
          type: string
        createdAt:
          type: string
          format: date-time
    PkiRevokeCertificateRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          description: >-
            Why this certificate is being revoked. Recorded on the ledger and in
            the audit trail.
    PkiJwks:
      type: object
      description: >-
        An RFC 7517 JSON Web Key Set. Each entry's shape depends on its key type
        ("kty") per the JWK spec, so individual key fields are deliberately not
        enumerated here.
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
    PkiError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text: code is a stable machine-readable identifier
        naming exactly one failure, and params carries the structured per-code
        details when the failure has any. The server never renders a message --
        a client maps each code to its own locale's text.
      properties:
        code:
          type: string
          example: pki.certificate_revoked
        params:
          type: object
          additionalProperties: true
    SharingShare:
      type: object
      description: >-
        One share's own metadata, as its owner sees it. Deliberately carries no
        token (see sharing_createShare's own description for why) and no
        password (Share.PasswordHash is never serialized anywhere on this
        surface -- only whether one is set).
      properties:
        id:
          type: string
          description: Application-generated UUID.
        resourceRef:
          type: string
          description: The opaque reference to the resource this share exposes.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When this share stops being accessible. Never absent -- every share
            carries an expiry.
        maxViews:
          type: integer
          description: The view ceiling this share was created with; absent when unlimited.
        viewCount:
          type: integer
          description: How many accesses have been granted so far.
        passwordProtected:
          type: boolean
          description: >-
            Whether an access password is required. Never the password or its
            hash.
        sensitive:
          type: boolean
          description: >-
            Whether this share was created against a resource carrying sensitive
            personal information (the sensitive-resource confirmation).
        revokedAt:
          type: string
          format: date-time
          description: When this share was revoked; absent for a live share.
        createdAt:
          type: string
          format: date-time
    SharingCreateShareRequest:
      type: object
      required:
        - resourceRef
      properties:
        resourceRef:
          type: string
          minLength: 1
          description: >-
            The opaque reference to the resource being shared, typically another
            module's own key scheme (e.g. a go/storage object id). Never
            interpreted by this module.
        expiresAt:
          type: string
          format: date-time
          description: >-
            An explicit expiry, which must lie strictly in the future and no
            more than 30 days from now -- the platform's maximum share lifetime
            (the explicit-expiry ceiling); anything else is refused with
            sharing.expiry_out_of_range. Omit to use the tenant's configured
            default (falling back to a fixed default when none is configured).
        forever:
          type: boolean
          description: >-
            Requests a share that never expires. Always refused with
            sharing.expiry_required -- there is no way to make this surface
            create a never-expiring share; the field exists so a deliberate
            attempt to do so fails loudly and specifically.
        maxViews:
          type: integer
          description: >-
            Caps the number of granted accesses. Must be positive when given;
            omit for unlimited views.
        password:
          type: string
          description: >-
            An optional additional access password. Never stored or returned as
            given; see SharingShare's own passwordProtected field.
        sensitive:
          type: boolean
          description: >-
            Marks the shared resource as carrying sensitive personal
            information. A true value fires this module's one audit action.
    SharingCreateShareResponse:
      type: object
      required:
        - share
        - token
      properties:
        share:
          $ref: '#/components/schemas/SharingShare'
        token:
          type: string
          description: >-
            The share's bearer token, in the exact form /api/v1/sharing/access's
            token query parameter expects. Returned here exactly once -- see
            this operation's own description.
    SharingListSharesResponse:
      type: object
      properties:
        shares:
          type: array
          description: Every share of the caller's tenant, newest first.
          items:
            $ref: '#/components/schemas/SharingShare'
    SharingAccessLogEntry:
      type: object
      description: One recorded access attempt against a share, granted or denied alike.
      properties:
        id:
          type: string
          description: Application-generated UUID.
        occurredAt:
          type: string
          format: date-time
        ip:
          type: string
          description: The viewer's address as the access request observed it.
        userAgent:
          type: string
          description: The viewer's User-Agent header value, as given.
        referrer:
          type: string
          description: The viewer's Referer header value, as given.
        outcome:
          type: string
          description: >-
            "granted" or "denied" -- deliberately never which of Access's five
            refusal reasons applied; see this operation's own description.
    SharingListAccessLogResponse:
      type: object
      properties:
        entries:
          type: array
          description: The share's access log, newest first.
          items:
            $ref: '#/components/schemas/SharingAccessLogEntry'
    SharingError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text: code is a stable machine-readable identifier
        naming exactly one failure, and params carries the structured per-code
        details when the failure has any. The server never renders a message --
        a client maps each code to its own locale's text.
      required:
        - code
      properties:
        code:
          type: string
          description: The structured code naming this failure.
        params:
          type: object
          additionalProperties: true
          description: Structured parameters for the code, when any apply.
    StorageObject:
      type: object
      description: >-
        One object's metadata. Which fields are populated depends on the
        object's state: an uploading row (the create response) carries the
        declaration and the upload deadline; a completed row additionally
        carries the finalized size, media type, checksum and dimensions. The
        object's storage key never appears on this surface.
      properties:
        id:
          type: string
          description: Application-generated UUID.
        state:
          type: string
          description: >-
            "uploading" or "completed". A deleting row is never visible on this
            surface.
        declaredSize:
          type: integer
          format: int64
          description: The size the uploader declared at create time, in bytes.
        declaredType:
          type: string
          description: The media type declared at create time.
        declaredChecksum:
          type: string
          description: >-
            The SHA-256 declared at create time, as 64 lowercase hex characters;
            absent when none was declared.
        size:
          type: integer
          format: int64
          description: >-
            The finalized byte count, verified against the declaration at
            complete time.
        mimeType:
          type: string
          description: The media type probed from the bytes at complete time.
        checksumSha256:
          type: string
          description: >-
            The SHA-256 of the finalized (sanitized) bytes, as 64 lowercase hex
            characters.
        width:
          type: integer
          description: The probed pixel width; images only.
        height:
          type: integer
          description: The probed pixel height; images only.
        expiresAt:
          type: string
          format: date-time
          description: >-
            The retention deadline after which the object is swept; absent when
            the object never expires.
        uploadExpiresAt:
          type: string
          format: date-time
          description: >-
            The deadline by which the content had to arrive. It binds only the
            upload lifecycle, and it stays present on completed rows as the
            record of when that window closed.
        createdAt:
          type: string
          format: date-time
        derivatives:
          type: array
          description: >-
            The object's derived artifacts, oldest first; empty when none exist
            yet. Only the single-object get carries this array: list responses
            are metadata only.
          items:
            $ref: '#/components/schemas/StorageObjectDerivative'
    StorageCreateObjectRequest:
      type: object
      required:
        - declaredSize
        - declaredType
      properties:
        declaredSize:
          type: integer
          format: int64
          description: >-
            The object's size in bytes. Must be positive and within the host's
            per-object ceiling.
        declaredType:
          type: string
          minLength: 1
          description: >-
            The object's media type, such as "image/jpeg" or "image/png". The
            server canonicalizes it (parameters stripped, case-folded) and
            checks it against the host's allowlist.
        declaredChecksum:
          type: string
          description: >-
            The expected SHA-256 of the content, as 64 lowercase hex characters,
            verified at complete time. Omit to skip that check.
        expiresAt:
          type: string
          format: date-time
          description: >-
            An absolute retention deadline after which the object is swept. Must
            be in the future and within the host's lifetime ceiling. Omit to let
            the default apply: an upload that names no deadline lives exactly
            the host's configured maximum lifetime -- the ordinary upload is
            never silently permanent, and this surface offers no never-expiring
            spelling (a host whose product needs permanent objects requests them
            explicitly through ObjectService, behind the host's own
            WithNoExpiryAllowed configuration).
    StorageListObjectsResponse:
      type: object
      properties:
        objects:
          type: array
          description: One page of completed objects, newest first.
          items:
            $ref: '#/components/schemas/StorageObject'
    StorageObjectDerivative:
      type: object
      description: >-
        A derived artifact of an object. Derivative bytes are produced from the
        sanitized original, and a derivative never carries the original's
        metadata.
      properties:
        id:
          type: string
          description: Application-generated UUID.
        kind:
          type: string
          description: 'The derivation that produced it: currently "thumbnail".'
        mimeType:
          type: string
          description: The derivative's media type.
        size:
          type: integer
          format: int64
          description: The derivative's byte count.
        width:
          type: integer
          description: The derivative's pixel width; images only.
        height:
          type: integer
          description: The derivative's pixel height; images only.
        createdAt:
          type: string
          format: date-time
    StorageError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text: code is a stable machine-readable identifier
        naming exactly one failure, and params carries the structured per-code
        details when the failure has any. The server never renders a message --
        a client maps each code to its own locale's text.
      properties:
        code:
          type: string
          example: storage.object_not_found
        params:
          type: object
          additionalProperties: true
    ConfigPublicSnapshot:
      type: object
      description: >-
        The public display answer: every Public configuration item's effective
        value for the tenant, plus the enabled feature flags. Never carries a
        Sensitive value -- Sensitive and Public are mutually exclusive by
        declaration validation.
      required:
        - config
        - features
      properties:
        config:
          type: object
          additionalProperties: true
          description: >-
            Public items keyed by their configuration key. The set of keys is
            dynamic -- each module declares its own Public items on pkgcore's
            registry -- so no closed property schema exists for it; a value is a
            string, boolean or integer (a duration as its canonical "1m30s"
            text). An item with no value at any reachable scope and no declared
            Default is omitted rather than reported as null.
        features:
          type: array
          items:
            type: string
          description: >-
            The enabled feature-flag keys, sorted ascending. Always present --
            an empty list is `[]`, never null. Each key is a flag whose
            effective value and every flag it depends on report enabled.
    ConfigSystemFeatures:
      type: object
      description: The enablement half of the public snapshot, on its own.
      required:
        - features
      properties:
        features:
          type: array
          items:
            type: string
          description: >-
            The enabled feature-flag keys, sorted ascending. Always present --
            an empty list is `[]`, never null.
    ConfigError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text: code is a stable machine-readable identifier
        naming exactly one failure, and params carries the structured per-code
        details when the failure has any. The server never renders a message --
        a client maps each code to its own locale's text.
      required:
        - code
      properties:
        code:
          type: string
          description: The structured code naming this failure.
        params:
          type: object
          additionalProperties: true
          description: Structured parameters for the code, when any apply.
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: >-
        A ChatProviderRegistry or ImageProviderRegistry name, for example
        "chat.openai-compatible" or "image.openai-compatible" -- the same
        provider string CredentialService's methods already take.
      schema:
        type: string
    KeyID:
      name: keyId
      in: path
      required: true
      schema:
        type: string
    SubscriptionID:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
    NodeID:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    KID:
      name: kid
      in: path
      required: true
      description: A signing key's id (JWT kid).
      schema:
        type: string
    CertificateID:
      name: certificateId
      in: path
      required: true
      description: >-
        An application-generated UUID naming a certificate of the caller's
        tenant.
      schema:
        type: string
    AuthorityID:
      name: authorityId
      in: path
      required: true
      description: An application-generated UUID naming a certificate authority.
      schema:
        type: string
    ShareID:
      name: shareId
      in: path
      required: true
      description: An application-generated UUID naming a share of the caller's tenant.
      schema:
        type: string
    ObjectID:
      name: objectId
      in: path
      required: true
      description: An application-generated UUID naming an object of the caller's tenant.
      schema:
        type: string
