      tags:
        - admin
      summary: Cross-tenant notification send-record search.
      description: >-
        Wraps notification.SendRecordRepository.ListByFilter. tenantId absent
        means every tenant in admin's own ledger (a per-tenant loop under
        tenancy.WithSystemContext); present means the single-tenant path.
      parameters:
