openapi: 3.0.3
info:
  title: speed
  description: "The speed application-wide OpenAPI document: the redocly join of the eleven platform-module fragments (admin, ai-gateway, authn, billing, config, integration, notification, org, pki, sharing and storage), regenerated by `task api:merge` and committed. Each module fragment stays authoritative for its own operations; this merged document is the frontend SDK's generation input and the linted whole-surface view."
  version: 0.0.0
tags:
  - name: authn
    x-displayName: authn
  - name: authn (authenticated)
    x-displayName: authn (authenticated)
  - name: notification
    x-displayName: notification
  - name: billing
    x-displayName: billing
  - name: admin
    x-displayName: admin
  - name: ai-gateway
    x-displayName: ai-gateway
  - name: integration
    x-displayName: integration
  - name: org
    x-displayName: org
  - name: pki
    x-displayName: pki
  - name: sharing
    x-displayName: sharing
  - name: storage
    x-displayName: storage
  - name: config
    x-displayName: config
paths:
  /api/v1/authn/register:
    servers: []
    post:
      operationId: authn_register
      tags:
        - authn
      summary: Register a new account.
      description: >-
        At least one of email and phone must be present. The response is the
        created account with no password field, ever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnRegisterRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnUser'
        '400':
          description: >-
            Neither email nor phone was supplied, or the password failed policy
            (authn.identifier_required, authn.password_too_short,
            authn.password_too_long, authn.password_too_weak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '409':
          description: >-
            The email or phone already belongs to an account
            (authn.email_already_registered, authn.phone_already_registered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '429':
          description: >-
            The per-IP registration rate limit was exceeded
            (authn.rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/login/password:
    servers: []
    post:
      operationId: authn_loginWithPassword
      tags:
        - authn
      summary: Sign in with an email or phone identifier and a password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnLoginWithPasswordRequest'
      responses:
        '200':
          description: A new session's token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '401':
          description: >-
            The single answer to every failed sign-in
            (authn.invalid_credentials, with no parameters): an unknown
            identifier, a wrong password, an account with no password or a
            suspended account, and a correct password whose account resolves no
            active membership in the requested tenant -- membership is asked
            only after the password verified, so an answer naming it would
            certify the password to an anonymous caller. The real reason is
            recorded on the login-history row for the operator and the account
            owner's own security page, never returned (see go/authn/errors.go).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '403':
          description: >-
            Password sign-in is turned off as a channel on this deployment
            (authn.channel_disabled, with params.channel naming the flag key --
            "authn.password_login"). The channel check runs before the
            identifier is read, so with the flag off every request to this
            endpoint is refused identically, and the flag is public
            configuration the login page reads pre-authentication. It is the
            operation's only 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '429':
          description: >-
            The account or IP is rate-limited or locked out (authn.rate_limited,
            authn.account_locked). The response carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/login/sms/request:
    servers: []
    post:
      operationId: authn_requestSMSCode
      tags:
        - authn
      summary: Request a one-time SMS sign-in code for a phone number.
      description: >-
        Always answers 202 whether or not the phone number belongs to an account
        -- go/authn/verification.go's RequestSMSCode never discloses
        registration status. There is nothing here for a legitimate caller to
        branch on either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnRequestSMSCodeRequest'
      responses:
        '202':
          description: The request was accepted (a code was sent, or silently was not).
        '429':
          description: >-
            The phone number or IP is rate-limited (authn.rate_limited). The
            response carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/login/sms:
    servers: []
    post:
      operationId: authn_loginWithSMSCode
      tags:
        - authn
      summary: Sign in with a phone number and the SMS code sent to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnLoginWithSMSCodeRequest'
      responses:
        '200':
          description: A new session's token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '401':
          description: >-
            The code was missing, wrong, expired, locked or already used
            (authn.verification_code_invalid -- one answer for every reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '429':
          description: The phone number or IP is rate-limited (authn.rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/token/refresh:
    servers: []
    post:
      operationId: authn_refreshToken
      tags:
        - authn
      summary: Rotate a refresh token for a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnRefreshTokenRequest'
      responses:
        '200':
          description: >-
            A new access token, and a new refresh token replacing the presented
            one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '401':
          description: >-
            The refresh token is unknown, expired, or was already consumed
            (authn.refresh_token_invalid, authn.refresh_token_reused -- the
            latter revokes the whole token family and the session as a side
            effect).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/logout:
    servers: []
    post:
      operationId: authn_logout
      tags:
        - authn (authenticated)
      summary: Sign out the calling session.
      description: >-
        Revokes the session the caller's own access token belongs to. Every
        other device's session is untouched -- see revoke-others for that.
      responses:
        '204':
          description: The session was revoked (or already was).
  /api/v1/authn/social/{provider}/authorize:
    servers: []
    get:
      operationId: authn_socialAuthorize
      tags:
        - authn
      summary: Build the authorization URL for a social sign-in channel.
      description: >-
        Signed in and calling this with a valid Principal turns the flow into
        BINDING a new identity to the caller's own account instead of signing in
        -- see the callback operation's response.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          example: google
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The URL to send the browser to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnSocialAuthorizeResponse'
        '400':
          description: >-
            The channel is unknown, or the redirect URI is not on the
            deployment's allowlist (authn.provider_unknown,
            authn.redirect_uri_not_allowed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/social/{provider}/callback:
    servers: []
    post:
      operationId: authn_socialCallback
      tags:
        - authn
      summary: Complete a social sign-in or account-binding authorization flow.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnSocialCallbackRequest'
      responses:
        '200':
          description: >-
            The completed flow: a new session (tokens set) for a sign-in, or the
            bound identity alone (tokens unset) for an already-signed-in caller
            binding a new channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnSocialLoginResponse'
        '401':
          description: >-
            The state was invalid, expired or already used, or the provider
            refused the code (authn.oauth_state_invalid,
            authn.social_exchange_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '409':
          description: >-
            The verified email belongs to an existing account this channel is
            not trusted to auto-link to (authn.identity_requires_binding), or
            the external identity is already bound to a different account
            (authn.identity_already_bound).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/identities:
    servers: []
    get:
      operationId: authn_listIdentities
      tags:
        - authn (authenticated)
      summary: List the caller's own bound external identities.
      responses:
        '200':
          description: The caller's bound identities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnListIdentitiesResponse'
  /api/v1/authn/identities/{identityId}:
    servers: []
    delete:
      operationId: authn_unbindIdentity
      tags:
        - authn (authenticated)
      summary: Unbind one of the caller's own external identities.
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The identity was unbound.
        '404':
          description: >-
            No such identity, or it does not belong to the caller
            (authn.identity_not_found -- the same answer either way, so the
            endpoint never confirms another account's binding).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '409':
          description: >-
            Unbinding would leave the account with no way to sign in at all
            (authn.last_login_method).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/mfa/totp/enroll:
    servers: []
    post:
      operationId: authn_enrollTOTP
      tags:
        - authn (authenticated)
      summary: Start TOTP enrollment for the caller's account.
      description: >-
        Replaces any existing TOTP factor (pending or active) with a fresh
        pending one, which must be confirmed with authn_confirmTOTP before it
        can satisfy a step-up.
      responses:
        '200':
          description: The shared secret and its otpauth:// provisioning URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnEnrollTOTPResponse'
  /api/v1/authn/mfa/totp/confirm:
    servers: []
    post:
      operationId: authn_confirmTOTP
      tags:
        - authn (authenticated)
      summary: Confirm a pending TOTP enrollment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnConfirmTOTPRequest'
      responses:
        '200':
          description: >-
            The factor is now active. The response carries ten recovery codes in
            PLAINTEXT -- the only time they are ever available in that form; the
            caller must show them to the user immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnRecoveryCodesResponse'
        '400':
          description: >-
            No pending enrollment exists, one is already active, or the code did
            not validate (authn.mfa_not_enrolled, authn.mfa_already_enrolled,
            authn.mfa_invalid_code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/mfa/recovery-codes/regenerate:
    servers: []
    post:
      operationId: authn_regenerateRecoveryCodes
      tags:
        - authn (authenticated)
      summary: Discard the caller's recovery codes and issue a fresh batch.
      description: >-
        Requires an ACTIVE TOTP factor; every previous code stops working at
        once.
      responses:
        '200':
          description: The new recovery codes, in plaintext, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnRecoveryCodesResponse'
        '400':
          description: No active TOTP factor exists (authn.mfa_not_enrolled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/mfa/step-up:
    servers: []
    post:
      operationId: authn_verifyStepUp
      tags:
        - authn (authenticated)
      summary: Re-prove a second factor for the caller's CURRENT session.
      description: >-
        Mints a fresh access token whose amr carries the factor just verified,
        without otherwise changing the session (the refresh token is untouched).
        The elevation lives only in that access token's own lifetime -- a later
        natural refresh reverts to the session's original amr.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnVerifyStepUpRequest'
      responses:
        '200':
          description: A freshly minted access token carrying the enriched amr.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '401':
          description: >-
            The code was refused. A code that was never valid -- a wrong TOTP
            code, or a recovery code no issued row matches -- answers
            authn.mfa_invalid_code; a code that was valid but is spent -- one
            whose single-use guard already consumed it, or whose recovery-code
            row is marked used -- answers authn.mfa_code_used instead, so a
            holder of a consumed code is told it is spent rather than asked to
            retry a code that can never verify again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '429':
          description: The step-up rate limit was exceeded (authn.rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/tenant/switch:
    servers: []
    post:
      operationId: authn_switchTenant
      tags:
        - authn (authenticated)
      summary: Reissue an access token for a different tenant, reusing the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnSwitchTenantRequest'
      responses:
        '200':
          description: A freshly minted access token for the target tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '403':
          description: >-
            The caller is not an active member of the target tenant
            (authn.tenant_membership_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/me:
    servers: []
    get:
      operationId: authn_getMe
      tags:
        - authn (authenticated)
      summary: Return the caller's own authenticated identity.
      responses:
        '200':
          description: The calling Principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnPrincipal'
  /api/v1/authn/me/preferences:
    servers: []
    get:
      operationId: authn_getPreferences
      tags:
        - authn (authenticated)
      summary: Return the caller's own locale and timezone preferences.
      responses:
        '200':
          description: >-
            The caller's stored preferences; an empty field means "not chosen
            yet".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnPreferences'
    patch:
      operationId: authn_updatePreferences
      tags:
        - authn (authenticated)
      summary: Update the caller's own locale and timezone preferences.
      description: >-
        A partial update: an absent field leaves the stored value unchanged, and
        an empty string clears it (the platform default applies again). A
        non-empty value must be storable -- the locale one of the languages the
        deployment's catalog ships, the timezone a known IANA zone name -- or
        the update is refused with a coded 400 and nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnUpdatePreferencesRequest'
      responses:
        '200':
          description: The caller's preferences as stored after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnPreferences'
        '400':
          description: >-
            A supplied locale or timezone value is not storable
            (authn.invalid_locale, authn.invalid_timezone).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/sessions:
    servers: []
    get:
      operationId: authn_listSessions
      tags:
        - authn (authenticated)
      summary: List every one of the caller's own sessions (their device list).
      description: >-
        Includes revoked sessions -- Status tells them apart -- so the owner can
        see which device they signed out and when. is_current marks the session
        the request's own access token belongs to.
      responses:
        '200':
          description: The caller's sessions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnListSessionsResponse'
  /api/v1/authn/sessions/{sessionId}:
    servers: []
    delete:
      operationId: authn_revokeSession
      tags:
        - authn (authenticated)
      summary: Sign out one of the caller's own devices.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The session was revoked.
        '404':
          description: >-
            No such session, or it does not belong to the caller
            (authn.session_not_found -- the same answer either way, so the
            endpoint never confirms another account's session id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/sessions/revoke-others:
    servers: []
    post:
      operationId: authn_revokeOtherSessions
      tags:
        - authn (authenticated)
      summary: Sign out every one of the caller's sessions except the current one.
      responses:
        '200':
          description: How many sessions were revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnRevokeOtherSessionsResponse'
  /api/v1/authn/login-history:
    servers: []
    get:
      operationId: authn_listLoginHistory
      tags:
        - authn (authenticated)
      summary: List the caller's own recent login attempts, successful or not.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: The caller's login history, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnListLoginHistoryResponse'
  /api/v1/notifications/messages:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_listMessages
      summary: List the caller's inbox messages, newest first.
      description: >-
        Returns the caller's own inbox rows (recipient_user_id matches the
        subject seam's caller), newest first, ordered by created_at then id so
        paging is stable. Messages whose expiry passed are still listed --
        expiry governs the unread predicate only (read_at IS NULL AND expiry not
        passed), never list membership -- but a message that reached its
        expiry_at renders with the unread affordance already gone, which is what
        the frontend's per-row state derives from read_at. group filters to one
        notification group (a type-classification namespace like
        "appointments"); unknown groups answer an empty list, never an error.
      parameters:
        - in: query
          name: group
          description: Return only messages of this notification group.
          schema:
            type: string
        - in: query
          name: limit
          description: >-
            The maximum number of rows to return. The module's read surface caps
            the page at 200 rows; larger limits are refused rather than silently
            truncated.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          description: The number of rows to skip before the returned page.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The requested page of the caller's inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListMessagesResponse'
        '400':
          description: limit or offset was not a valid integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/unread-count:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_getUnreadCount
      summary: Count the caller's unread inbox messages.
      description: >-
        The number of the caller's inbox rows whose read_at is still nil and
        whose expiry_at -- when set -- has not passed (the module's unread
        predicate, applied with the server's own clock). A message that is
        unread but expired does not count, and a read-then-expired message never
        counts twice.
      responses:
        '200':
          description: The count of unread messages, possibly zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/read-all:
    servers: []
    post:
      tags:
        - notification
      operationId: notification_markAllMessagesRead
      summary: Mark every unread message of the caller as read.
      description: >-
        Applies the same unread predicate as the unread count to the caller's
        own rows: every message that was still unread becomes read, expired or
        not (marking read is not gated on expiry, only counting is). The answer
        names how many rows the call actually flipped, so a client can
        distinguish "nothing was unread" from "everything was already read"
        without a second round trip.
      responses:
        '200':
          description: The messages that this call marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/{messageId}/read:
    servers: []
    post:
      tags:
        - notification
      operationId: notification_markMessageRead
      summary: Mark one of the caller's messages as read.
      description: >-
        Marks the named message read. Idempotent: a message already read answers
        204 exactly like a first read. The row must be the caller's own and
        exist in the caller's tenant; a message id that is unknown, expired into
        a different tenant, or belongs to another recipient answers 404 -- never
        another user's message state.
      parameters:
        - in: path
          name: messageId
          required: true
          description: The id of the message to mark read.
          schema:
            type: string
      responses:
        '204':
          description: The message is read (it already was, or this call marked it).
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: The message id names no message of the caller's own inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/types:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_listTypes
      summary: List the notification types this tenant's deployment declares.
      description: >-
        The live type directory: every notification type every module of the
        host declared at bootstrap (the registry's frozen taxonomy -- new types
        arrive with a new release, never at runtime), each with its group
        classification, its default channel set for a recipient who has
        expressed no preference, and whether the recipient may opt out of it at
        all (the module's non-unsubscribable types carry delivery the host
        guarantees, such as security or billing receipts). description is the
        type's copy rendered from the declaring module's own locale bundle in
        the language the caller's chain resolves: the request's Accept-Language
        (the frontend's own language chain, resolved client-side and transported
        here), then the caller's stored profile locale, then the platform
        default en-US -- the same catalog delivery renders from, so the
        directory a client renders is the copy its recipient would have
        received. Responses vary by Accept-Language and carry the Vary header
        accordingly.
      responses:
        '200':
          description: The declared notification types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListTypesResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/preferences:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_listPreferences
      summary: List the caller's channel preferences per notification type.
      description: >-
        The caller's effective channel preference for every declared
        notification type: a type the caller never touched answers with its
        default channel set, one they opted out of on some channels answers the
        surviving set. Every declared type appears exactly once, so a client
        renders one row per type without merging against the type directory.
        Channel vocabulary is the module's closed set: in_app, email, sms.
      responses:
        '200':
          description: The caller's preference state per declared type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListPreferencesResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/preferences/{typeKey}/{channel}:
    servers: []
    put:
      tags:
        - notification
      operationId: notification_updatePreference
      summary: Enable or disable one channel of one notification type for the caller.
      description: >-
        Sets whether the caller wants delivery over channel for typeKey.
        enabled=true restores a channel the caller had opted out of;
        enabled=false is the opt-out, refused for a type whose unsubscribable
        flag is false (delivery the host guarantees must not be switched off
        through a preference). The answer is the type's updated effective state
        (channels), so a client applying a toggle can overwrite its row from the
        response without recomputing the merge. Channel vocabulary is the
        module's closed set: in_app, email, sms.
      parameters:
        - in: path
          name: typeKey
          required: true
          description: >-
            The type key, <module>.<entity>.<action> (for example
            "clinic.appointment_reminder").
          schema:
            type: string
        - in: path
          name: channel
          required: true
          description: The channel to enable or disable.
          schema:
            type: string
            enum:
              - in_app
              - email
              - sms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUpdatePreferenceRequest'
      responses:
        '200':
          description: The type's updated effective channel state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '400':
          description: >-
            The request body was missing or malformed, channel was not a known
            channel, or enabled=false was asked for a type whose unsubscribable
            flag is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: typeKey names no declared notification type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_listContacts
      summary: List the tenant's verified and pending contacts.
      description: >-
        The tenant's external-recipient roster, newest first: every address this
        tenant has put through the module's consent flow. The list is
        tenant-scoped, not per-user -- a contact belongs to the tenant that
        verified it, so any identified caller of the tenant sees the roster the
        tenant's staff manages. A contact row never echoes its address: the
        plaintext address is PII and the blind-index column would be an offline
        brute-force surface, so a list consumer sees id, channel, status and
        timestamps only -- which is all the UI's manage-addresses surface needs
        (the address itself is shown at the moment of submission, never
        re-served).
      responses:
        '200':
          description: The tenant's contacts, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListContactsResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
    post:
      tags:
        - notification
      operationId: notification_createContact
      summary: Add a contact address to the tenant's roster through double opt-in.
      description: >-
        Registers channel address as a contact of the tenant and starts the
        module's consent flow: the row is created pending and a verification
        code is sent to the address (the one message the module's security rule
        allows to an unverified address -- the verification message itself --
        rate limited per tenant and per recipient). The address is normalized
        before storage (email lowercased, phone to E.164) and encrypted at rest
        under a blind-index column for exact-match dedupe. Submitting an address
        already on file (any status) answers the existing contact unchanged and
        sends nothing -- re-adding is not a resend, resend is its own operation.
        Codes expire; delivery to the address is refused until the contact is
        verified, by the delivery pipeline's send-time recheck, never only at
        enqueue time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreateContactRequest'
      responses:
        '201':
          description: >-
            The contact row -- freshly created pending, or the already existing
            row when this address was on file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationContact'
        '400':
          description: >-
            The request body was missing or malformed, channel was not email or
            sms, or address had no valid form for its channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: The caller has asked for too many verification codes; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts/{contactId}/verify:
    servers: []
    post:
      tags:
        - notification
      operationId: notification_verifyContact
      summary: Verify a pending contact with its code.
      description: >-
        Answers the code that was sent to the contact's address. A correct code
        within its expiry verifies the contact -- the consent record the
        delivery pipeline's send-time recheck demands -- and answers the
        verified row; a wrong or expired code leaves the contact pending and
        answers 400. The contact must be the tenant's own and still pending:
        resubmitting to one already verified answers 400 just like a wrong code
        -- wrong, expired, replayed and already-verified are deliberately one
        answer -- while an unsubscribed or bounced contact answers 409, its
        address never messaged again. Attempts are rate limited.
      parameters:
        - in: path
          name: contactId
          required: true
          description: The id of the pending contact to verify.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationVerifyContactRequest'
      responses:
        '200':
          description: The contact, now verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationContact'
        '400':
          description: >-
            The request body was missing or malformed, or the code did not
            verify: wrong, expired, replayed, or aimed at a contact that is
            already verified -- deliberately one answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: The contact id names no contact of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '409':
          description: >-
            The contact has unsubscribed or bounced and will not be messaged
            again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: Too many verification attempts; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts/{contactId}/resend:
    servers: []
    post:
      tags:
        - notification
      operationId: notification_resendContactCode
      summary: Issue a fresh verification code to a still-pending contact.
      description: >-
        Re-issues the verification code of a pending contact -- the flow for a
        code that expired before it was entered. Only a pending contact can be
        resent to: an unsubscribed or bounced contact answers 409, its address
        never messaged again, and one already verified answers 400 like a wrong
        code (deliberately one answer). The fresh code replaces the old one;
        rate limited like the original send.
      parameters:
        - in: path
          name: contactId
          required: true
          description: The id of the pending contact to resend to.
          schema:
            type: string
      responses:
        '204':
          description: A fresh code is on its way to the contact's address.
        '400':
          description: >-
            The code did not verify: wrong, expired, replayed, or aimed at a
            contact that is already verified -- deliberately one answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: The contact id names no contact of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '409':
          description: >-
            The contact has unsubscribed or bounced and will not be messaged
            again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: The caller has asked for too many verification codes; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/billing/credits/balance:
    servers: []
    get:
      tags:
        - billing
      operationId: billing_getCreditBalance
      summary: Read the caller's tenant credit balance.
      description: >-
        The tenant's current credit balance: how many credits are freely
        spendable (available) and how many are set aside by not-yet- resolved
        reservations (reserved). A tenant that has never been granted or charged
        credits -- no ledger rows at all -- answers an all-zero balance, never
        an error, so the credit view renders a zero state rather than a
        missing-resource refusal. The number is read from the same
        CreditService.Balance call business code uses, so this route and a
        service-side reservation never disagree about what the tenant holds.
      responses:
        '200':
          description: The tenant's current credit balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCreditBalance'
        '500':
          description: An unexpected server failure (billing.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
  /api/v1/billing/credits/transactions:
    servers: []
    get:
      tags:
        - billing
      operationId: billing_listCreditTransactions
      summary: List the caller's tenant's recent credit transactions, newest first.
      description: >-
        The recent window of the tenant's append-only credit ledger: at most
        limit rows (1-100, default 50), newest first. Every balance movement the
        tenant ever experienced is a row here and only here: a grant (type
        "grant", status "confirmed") is a top-up, an expire (type "expire",
        status "confirmed") a single-phase deduction, and a deduct row is the
        two-phase reservation lifecycle itself -- status "pending" while its
        credits sit in the balance's reserved bucket, "confirmed" once the
        reservation became a permanent spend, "refunded" once it was released
        back to available. A refund is therefore observable as that one deduct
        row's status transition (plus the balance delta the balance route
        reports), never as a row that silently disappears or a balance-only
        change with no ledger trace. The window is served from the module's full
        newest-first listing; this surface offers no keyset-paginated read over
        the whole ledger -- a credit view needs the recent rows, and the ledger
        itself is reconstructable in full service-side.
      parameters:
        - name: limit
          in: query
          required: false
          description: The page size, from 1 through 100. Defaults to 50.
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: The matching credit transactions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingListCreditTransactionsResponse'
        '400':
          description: >-
            limit is outside the 1-100 bound (billing.invalid_limit), or is not
            an integer at all (billing.invalid_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
        '500':
          description: An unexpected server failure (billing.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
  /api/v1/billing/invoices:
    servers: []
    get:
      tags:
        - billing
      operationId: billing_listInvoices
      summary: List the caller's tenant's invoices, newest first.
      description: >-
        The tenant's billing documents, newest first -- every Invoice row the
        module's plain-Go lifecycle wrote for the tenant (invoice.go's
        CreateInvoice/MarkPaid/Void; nothing writes invoices over HTTP, so this
        read and the lifecycle can never disagree about what exists). At most
        limit rows (1-100, default 50). Newest first is creation order, the same
        ordering key the credit-transactions listing uses -- never the period an
        invoice bills, since a voided document and its replacement need not
        share cycle dates. Status is the lifecycle's own closed vocabulary:
        "open" awaiting payment, "paid" settled in full, "void" canceled before
        payment. A tenant that has never been issued an invoice answers an empty
        array, never an error, so the invoice page renders an empty state rather
        than a missing-resource refusal. The window is served from the module's
        full newest-first listing; this surface offers no keyset-paginated read
        over a whole history -- an invoice page needs the recent documents, and
        the full history stays reconstructable service-side.
      parameters:
        - name: limit
          in: query
          required: false
          description: The page size, from 1 through 100. Defaults to 50.
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: The matching invoices, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingListInvoicesResponse'
        '400':
          description: >-
            limit is outside the 1-100 bound (billing.invalid_limit), or is not
            an integer at all (billing.invalid_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
        '500':
          description: An unexpected server failure (billing.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
  /api/v1/billing/invoices/{id}:
    servers: []
    get:
      tags:
        - billing
      operationId: billing_getInvoice
      summary: Get one of the caller's tenant's invoices.
      description: >-
        The full shape of one billing document: the row the module's plain-Go
        lifecycle wrote, exactly as the model carries it (see BillingInvoice's
        own description and billing_listInvoices' for the status vocabulary).
        The read is tenant-scoped like every other operation on this surface: id
        must name an invoice of the caller's own tenant.
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            An application-generated UUID naming an invoice of the caller's
            tenant (Invoice.ID).
          schema:
            type: string
      responses:
        '200':
          description: The invoice's full shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '404':
          description: >-
            id names no invoice of the caller's tenant -- never created, or
            another tenant's. code is always billing.invoice_not_found for both
            reasons, so the answer discloses nothing about whether the id exists
            at all: a caller can only ever learn about its own tenant's
            invoices, and an id that is not one of them is indistinguishable
            from one that never existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
        '500':
          description: An unexpected server failure (billing.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
  /api/v1/admin/tenants:
    servers: []
    get:
      operationId: admin_listTenants
      tags:
        - admin
      summary: List the operator-facing tenant ledger.
      description: >-
        Record-only: this ledger is an operator convenience, never the
        authoritative source of tenant existence -- a tenant with no ledger row
        is reported active, not refused (see TenantService.Status's own doc
        comment).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AdminTenantStatus'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The matching ledger rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListTenantsResponse'
    post:
      operationId: admin_createTenant
      tags:
        - admin
      summary: Manually register a tenant ledger row.
      description: >-
        For pre-registering a tenant's name before any business write has
        happened (for example, before an operator opens an account for a new
        customer). The ledger is also populated automatically: a tenant's root
        org-node creation event lazily registers an active row, without
        overwriting an operator's own edits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateTenantRequest'
      responses:
        '201':
          description: The ledger row was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        '400':
          description: tenantId was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '409':
          description: A ledger row for this tenantId already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/tenants/{id}:
    servers: []
    get:
      operationId: admin_getTenant
      tags:
        - admin
      summary: Read one tenant ledger row.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The ledger row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        '404':
          description: No ledger row exists for this tenant id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
    patch:
      operationId: admin_updateTenant
      tags:
        - admin
      summary: Rename, suspend or resume a tenant ledger row.
      description: >-
        Writing status=suspended here records the ledger row's status; the
        refusal that makes it bite belongs to tenancy's own status-resolution
        gate -- wired to this ledger through TenantService.Status, it refuses
        every request against a tenant it reports suspended. Suspension has no
        route of its own.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateTenantRequest'
      responses:
        '200':
          description: The updated ledger row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        '404':
          description: No ledger row exists for this tenant id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/users:
    servers: []
    get:
      operationId: admin_searchUsers
      tags:
        - admin
      summary: Cross-tenant user search.
      description: >-
        Exactly one of email, phone or displayNamePrefix must be given, in that
        precedence order when more than one is present -- see
        authn.UserSearchQuery's own doc comment.
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: displayNamePrefix
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The matching users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSearchUsersResponse'
        '400':
          description: The query named none of email, phone or displayNamePrefix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/users/{id}/memberships:
    servers: []
    get:
      operationId: admin_listUserMemberships
      tags:
        - admin
      summary: List every tenant a user currently has an active membership in.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The tenants this user belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListUserMembershipsResponse'
  /api/v1/admin/impersonation:
    servers: []
    get:
      operationId: admin_listImpersonationGrants
      tags:
        - admin
      summary: List currently-active impersonation grants.
      responses:
        '200':
          description: The active grants.
