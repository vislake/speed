          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/usage-summary:
    servers: []
    get:
      operationId: admin_getUsageSummary
      tags:
        - admin
      summary: Cross-tenant usage/billing dashboard.
      description: >-
        Stitched from go/metering's and go/billing's already-real, per-tenant
        query methods, looped once per tenant in admin's own ledger under
        tenancy.WithSystemContext, the audited system-context wrapper -- no new
        database table. meteringSummaries/creditBalance/activeSubscription are
