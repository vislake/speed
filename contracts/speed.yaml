    BillingCreditBalance:
      type: object
      description: >-
        The caller's tenant credit balance. The two buckets never overlap: a
        credit is in exactly one of available or reserved. The number a credit
        view renders is available -- what the tenant can spend right now.
      properties:
        available:
          type: integer
          format: int64
          description: The freely spendable credit count.
        reserved:
          type: integer
          format: int64
          description: >-
            The credit count set aside by reservations whose jobs have not
            reached a terminal status yet (each one a deduct row at status
            "pending" in the ledger).
        updatedAt:
          type: string
          format: date-time
          description: When the balance row was last touched by a ledger mutation.
      required:
        - available
        - reserved
        - updatedAt
    BillingCreditTransaction:
      type: object
      description: >-
        One append-only entry in the tenant's credit ledger. Amount is always
        positive; the entry's direction is implied by type and status together,
        never a signed value. A deduct row is inserted at status "pending" by
        the reservation half of the two-phase pattern, then moved in place to
        "confirmed" (permanent spend) or "refunded" (released back to available)
        -- the refund IS that status transition on the same row, never a second
        row.
      properties:
        id:
          type: string
          description: >-
            The ledger row's id: an application-generated UUID for a grant or
            expire row, or the caller's own idempotency key for a deduct row.
            Not globally unique across tenants.
        type:
          type: string
          enum:
            - grant
            - deduct
            - expire
          description: >-
            The entry's kind: "grant" is a top-up (a plan's included credits, an
            admin top-up), "deduct" the two-phase reservation, "expire" a
            single-phase deduction. "refund" is deliberately not a row type -- a
            refund is a deduct row whose status became "refunded" (see status).
        status:
          type: string
          enum:
            - pending
            - confirmed
            - refunded
          description: >-
            The entry's resolution state. Grant and expire rows are single-phase
            and always "confirmed". A deduct row is "pending" while its
            reservation is outstanding, "confirmed" after the reservation was
            settled as a permanent spend, "refunded" after it was released back
            to the balance.
        amount:
          type: integer
          format: int64
          description: >-
            The credit count this entry moves, always positive: a confirmed
            deduct permanently removed it, a refunded deduct removed nothing
            net, a grant added it, an expire removed it.
        reason:
          type: string
          description: >-
            A short note recorded when the entry was written (for example
            "smilesim:<job id>" for a smile-simulation reservation, "demo:seed"
            for a boot-time demo grant). Free text on the ledger; the credit
            view may display it verbatim.
        createdAt:
          type: string
          format: date-time
          description: When the entry was written.
      required:
        - id
        - type
        - status
        - amount
        - reason
        - createdAt
    BillingListCreditTransactionsResponse:
      type: object
      description: One page of the tenant's recent credit transactions.
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/BillingCreditTransaction'
          description: >-
            At most limit rows, newest first; empty when the tenant has no
            ledger rows yet.
      required:
        - transactions
    BillingInvoice:
      type: object
      description: >-
        One billing document of the caller's tenant, exactly as the module's
        channel-agnostic Invoice model (go/billing/invoice.go) carries it -- and
        therefore the detail shape of billing_getInvoice and the row shape of
        billing_listInvoices at once, since the model has no extra detail fields
        a separate get-shape would add: no line items, no payment-channel
        reference of any kind -- an invoice records a Subscription's billing
        cycle and its amount, never which channel, if any, collected it. Money
        is flattened the same way the model stores it: amountCents plus its ISO
        4217 currency, never a floating-point amount.
      properties:
        id:
          type: string
          description: The invoice's application-generated UUID.
        subscriptionId:
          type: string
          description: >-
            The id of the Subscription this invoice bills -- an ID reference
            only, never an embedded subscription (no cross-module foreign keys;
            this is an in-module reference under the same discipline).
        status:
          type: string
          enum:
            - open
            - paid
            - void
          description: >-
            The invoice's lifecycle state: "open" is awaiting payment, "paid"
            settled in full, "void" canceled before payment (e.g. a subscription
            canceled before its invoice was paid). Paid and void are terminal --
            the invoice is the record of the settlement or the cancellation, and
            neither is ever rewritten.
        amountCents:
          type: integer
          format: int64
          description: >-
            The invoice amount in the currency's minor unit (cents for a
            two-decimal currency like USD or CNY).
        currency:
          type: string
          description: The amount's ISO 4217 currency code (e.g. "USD", "CNY").
        periodStart:
          type: string
          format: date-time
          description: When the billed billing cycle starts.
        periodEnd:
          type: string
          format: date-time
          description: When the billed billing cycle ends.
        createdAt:
          type: string
          format: date-time
          description: When the invoice was issued.
        updatedAt:
          type: string
          format: date-time
          description: >-
            When the invoice row was last touched -- a status transition (open
            to paid or void) updates it, an unmodified invoice carries its issue
            time.
      required:
        - id
        - subscriptionId
        - status
        - amountCents
        - currency
        - periodStart
        - periodEnd
        - createdAt
        - updatedAt
    BillingListInvoicesResponse:
      type: object
