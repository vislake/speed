      description: >-
        Wraps compliance.ExportService.Export, which gathers every registered
        participant's data for the tenant, stores it and delivers it as a
        short-lived, single-view go/sharing link. This is necessarily
        asynchronous -- the handler enqueues one go/jobs task and returns
        immediately with its id, never running Export synchronously inside the
        request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminExportAuditEventsRequest'
      responses:
        '202':
          description: The export job was enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExportAuditEventsResponse'
        '400':
          description: tenantId was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/roles:
    servers: []
    get:
      operationId: admin_listDeclaredPermissions
      tags:
        - admin
      summary: List every permission any module has declared.
      description: >-
        Wraps rbac.Service.DeclaredPermissions -- the frozen catalog snapshot,
        not any one subject's own granted permissions (ListPermissions answers
        that, and is not exposed here).
      responses:
        '200':
          description: The declared permission catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListDeclaredPermissionsResponse'
    post:
      operationId: admin_defineRole
      tags:
        - admin
      summary: >-
        Define or update a role inside one tenant, wrapping
        rbac.Service.DefineRole.
