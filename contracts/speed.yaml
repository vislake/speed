  /api/v1/ai-gateway/credentials/{provider}:
    servers: []
    get:
      operationId: aiGateway_getCredential
      tags:
        - ai-gateway
      summary: Report which scope currently answers for a provider.
      description: >-
        The exact CredentialService.Resolve answer for provider under the
        caller's own tenant context: the caller's tenant BYOK row when one
        exists, the platform-wide row otherwise. Never returns the api key --
        only which scope answered and the credential's base URL, so a caller can
        confirm what is configured without ever seeing the secret. A context
        carrying no tenant (a system-context caller) resolves straight to the
        platform-wide row, mirroring Resolve's own documented behavior.
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: The resolved credential's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayCredential'
        '404':
          description: >-
            Neither the caller's tenant nor the platform-wide scope has a
            credential for provider (aigateway.credential_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayError'
  /api/v1/ai-gateway/credentials/{provider}/tenant:
    servers: []
    put:
      operationId: aiGateway_setTenantCredential
      tags:
        - ai-gateway
      summary: Set the caller's own tenant's BYOK credential.
      description: >-
        Writes or overwrites (upsert, keyed on provider and the caller's own
        tenant) the calling tenant's bring-your-own-key credential for provider
        -- CredentialService.SetTenantCredential verbatim, with the owning
        tenant read from the request's already-resolved tenant context, never
        from a request parameter, header or body. Gated on PermissionWrite
        ("ai-gateway:write"), an ordinary tenant-scoped permission -- see this
        fragment's own header for the contrast with the platform write below.
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGatewaySetCredentialRequest'
      responses:
        '200':
          description: The tenant credential was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayCredential'
        '400':
          description: >-
            The request body was missing or malformed, or apiKey was empty
            (aigateway.credential_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayError'
  /api/v1/ai-gateway/credentials/{provider}/platform:
    servers: []
    put:
      operationId: aiGateway_setPlatformCredential
      tags:
        - ai-gateway
      summary: Set the platform-wide default credential.
      description: >-
        Writes or overwrites (upsert, keyed on provider alone -- there is no
        owning tenant) the platform-wide default credential for provider that
        every tenant without its own BYOK row falls back to --
        CredentialService.SetPlatformCredential verbatim. The Handler itself
        builds the audited system-context reason (pkgcore.WithSystemContext
        under SystemPurposeCredentialWrite) this write requires; the caller
        supplies only the credential. This is a MATERIALLY MORE PRIVILEGED
        operation than the tenant-scoped write above -- it changes the default
        every tenant on the platform without its own override resolves to -- and
        is gated on a DISTINCT, more restrictive permission,
        PermissionManagePlatform ("ai-gateway:manage_platform"), never
        PermissionWrite.
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGatewaySetCredentialRequest'
      responses:
        '200':
          description: The platform-wide credential was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayCredential'
        '400':
          description: >-
            The request body was missing or malformed, or apiKey was empty
            (aigateway.credential_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayError'
  /api/v1/integration/apikeys:
    servers: []
    post:
      operationId: integration_createAPIKey
      tags:
        - integration
      summary: Issue a new API key for the caller's tenant.
      description: >-
        The creator is the caller's own authenticated identity (resolved
        server-side, never a request field) -- Service.Create's CreatedBy.
        scopes, when given, must each be one of the creator's own permissions
        right now; an empty or omitted scopes issues a key that authenticates
        identity alone. expiresAt, when given, must be strictly in the future
        and no further out than this deployment's MaxAPIKeyLifetime from now;
        omitted, it defaults to exactly that ceiling. The response's key field
        is the raw, plaintext credential -- the one and only time this API ever
        returns it; nothing else this fragment exposes, including
        integration_listAPIKeys, ever reproduces it.

        A failure recording the operation's audit event AFTER the key row
        committed is answered as this operation's ordinary 201 success, with the
        response's auditRecordMissing field true: the key exists and works
        either way, and key material is never shown twice, so the caller
        persists the credential from the success response and the field declares
        the audit gap (the identical partial-failure contract Service.Create's
        own doc comment documents). The credential deliberately never rides in
        an error envelope: a 5xx body carries no key material, because error
        responses flow into logs, tickets and bug reports that success bodies do
        not.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCreateAPIKeyRequest'
      responses:
        '201':
          description: The key was created. key is shown here exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationCreatedAPIKey'
        '400':
          description: >-
            The request body was malformed, expiresAt was not strictly in the
            future, or expiresAt was further out than this deployment's forced
            expiry ceiling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
        '401':
          description: The caller's identity could not be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
        '403':
          description: A requested scope is not one of the caller's own permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
    get:
      operationId: integration_listAPIKeys
      tags:
        - integration
      summary: List the caller's tenant's API keys.
      description: >-
        Never exposes the raw key or its stored hash -- every summary row omits
        both, per Service.List's own "credential-material-free" contract. Order
        is not guaranteed; a caller that needs one sorts the result itself.
      responses:
        '200':
          description: The caller's tenant's API keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationListAPIKeysResponse'
  /api/v1/integration/apikeys/{keyId}:
    servers: []
    delete:
      operationId: integration_revokeAPIKey
      tags:
        - integration
      summary: Revoke an API key, permanently.
      description: >-
        Sets the key's RevokedAt mark; the key never authenticates again. This
        does not physically remove the row (Service.Revoke's own doc comment) --
        it is refused, not silently no-op'd, against a key that is already
        revoked, since a caller revoking a key it believes is still live has a
        stale view of the world.
      parameters:
        - $ref: '#/components/parameters/KeyID'
      responses:
        '204':
          description: The key was revoked.
        '404':
          description: keyId does not name a key of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
        '409':
          description: The key was already revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
  /api/v1/integration/apikeys/{keyId}/rotate:
    servers: []
    post:
      operationId: integration_rotateAPIKey
      tags:
        - integration
      summary: Issue a replacement key and revoke the named key.
      description: >-
        Create-new-then-revoke-old, not an in-place swap (Service.Rotate's own
        doc comment): the response's id names a BRAND NEW key, never keyId
        itself. The new key carries the predecessor's Scopes and CreatedBy
        forward, re-validated against that creator's CURRENT permissions -- a
        creator whose permissions shrank since the predecessor was issued can
        have this fail with 403 on a scope it no longer holds. ExpiresAt is NOT
        carried forward: the new key gets a fresh full-lifetime expiry. The two
        writes are not one database transaction; a failure revoking the
        predecessor after the replacement was already created is answered as
        this operation's ordinary 200 success, with the response's
        auditRecordMissing field true: the replacement key still exists either
        way (a safe-direction surplus, never a lockout), key material is never
        shown twice, and the field declares that the rotation's own bookkeeping
        did not complete -- a caller seeing it true must not assume the
        predecessor is revoked. See Service.Rotate's own doc comment for the
        full argument.
      parameters:
        - $ref: '#/components/parameters/KeyID'
      responses:
        '200':
          description: >-
            The replacement key. key is shown here exactly once, identically to
            integration_createAPIKey's own contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationCreatedAPIKey'
        '403':
          description: The predecessor's own scopes are no longer all held by its creator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
        '404':
          description: keyId does not name a key of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
        '409':
          description: keyId is already revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
  /api/v1/integration/webhooks:
    servers: []
    post:
      operationId: integration_createWebhookSubscription
      tags:
        - integration
      summary: Subscribe the caller's tenant to a set of public event types.
      description: >-
        The creator is the caller's own authenticated identity, resolved
        server-side through the same SubjectResolver seam
        integration_createAPIKey uses -- never a request field. url is validated
        exactly as Service.CreateWebhookSubscription validates it, before
        anything is persisted: missing is 400, and a URL whose host is
        malformed, unresolvable, or blocked as private/loopback is refused
        outright (the module's two-time SSRF rules). Every eventTypes entry must
        be some registered EventMapping's public type (400 naming the first
        unknown one); the empty set is refused. The response's secret field is
        the raw HMAC signing secret a receiver verifies signatures with -- shown
        here exactly once, the identical contract integration_createAPIKey's own
        key field follows; nothing else this fragment exposes ever reproduces
        it.

        A failure recording the operation's audit event AFTER the subscription
        row committed is answered as this operation's ordinary 201 success, with
        the response's auditRecordMissing field true: the subscription exists
        and is already delivering either way, and its secret is never shown
        twice, so the caller persists it from the success response and the field
        declares the audit gap (the identical partial-failure contract
        Service.CreateWebhookSubscription's own doc comment documents). The
        secret deliberately never rides in an error envelope: a 5xx body carries
        no secret material, because error responses flow into logs, tickets and
        bug reports that success bodies do not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCreateWebhookSubscriptionRequest'
      responses:
        '201':
          description: The subscription was created. secret is shown here exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationCreatedWebhookSubscription'
        '400':
          description: >-
            The request body was malformed, url was missing or failed URL
            validation, or eventTypes was empty or named an unknown public event
            type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
        '401':
          description: The caller's identity could not be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
    get:
      operationId: integration_listWebhookSubscriptions
      tags:
        - integration
      summary: List the caller's tenant's webhook subscriptions.
      description: >-
        Secret-free: every row omits the signing secret, per
        Service.ListWebhookSubscriptions' own contract. Order is not guaranteed;
        a caller that needs one sorts the result itself.
      responses:
        '200':
          description: The caller's tenant's webhook subscriptions.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/IntegrationListWebhookSubscriptionsResponse
  /api/v1/integration/webhooks/{subscriptionId}:
    servers: []
    patch:
      operationId: integration_updateWebhookSubscription
      tags:
        - integration
      summary: Partially update one of the caller's tenant's subscriptions.
      description: >-
        Every request field is optional; one that is absent leaves the
        corresponding stored value unchanged --
        Service.UpdateWebhookSubscription's identical nil-means-no-change
        convention (a partial update, hence PATCH rather than PUT). A present
        but EMPTY eventTypes is refused with 400, exactly as create refuses it:
        there is no supported way to leave a subscription with zero event types
        short of deleting it. url, when present, is validated identically to
        create. Setting active=false is the supported way to pause delivery
        without deleting; setting it back to true is how a restored
        (always-paused) subscription resumes delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationUpdateWebhookSubscriptionRequest'
      parameters:
        - $ref: '#/components/parameters/SubscriptionID'
      responses:
        '200':
          description: The updated subscription, secret-free.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationWebhookSubscriptionSummary'
        '400':
          description: >-
            The request body was malformed, or url/eventTypes failed the
            identical validation create applies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
        '404':
          description: subscriptionId does not name a subscription of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
    delete:
      operationId: integration_deleteWebhookSubscription
      tags:
        - integration
      summary: Delete one of the caller's tenant's subscriptions.
      description: >-
        Mark-deletes the subscription (WebhookSubscription's dbkit.SoftDeletable
        adoption): its row stays in place -- hidden from every read this
        fragment performs -- and its past delivery rows are left as history. A
        delivery already enqueued settles exactly as it always did
        (Service.DeleteWebhookSubscription's own doc comment). Undo with POST
        /webhooks/{subscriptionId}/restore.
      parameters:
        - $ref: '#/components/parameters/SubscriptionID'
      responses:
        '204':
          description: The subscription was deleted.
        '404':
          description: subscriptionId does not name a subscription of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
  /api/v1/integration/webhooks/{subscriptionId}/restore:
    servers: []
    post:
      operationId: integration_restoreWebhookSubscription
      tags:
        - integration
      summary: Undo a subscription's deletion.
      description: >-
        Undoes the mark-delete integration_deleteWebhookSubscription made. The
        restored subscription is always PAUSED (active=false), whatever active
        held when it was deleted -- resuming automatic outbound delivery to a
        URL nobody has looked at since is never implicit, so delivery restarts
        only after an explicit integration_updateWebhookSubscription setting
        active=true (Service.RestoreWebhookSubscription's own doc comment). 404
        answers both an unknown subscriptionId and one that exists but is not
        currently deleted -- the same collapsed not-found signal the
        Service-level Restore reports, so a caller cannot tell the cases apart.
      parameters:
        - $ref: '#/components/parameters/SubscriptionID'
      responses:
        '204':
          description: The subscription was restored, paused.
        '404':
          description: >-
            subscriptionId names no subscription of the caller's tenant, or one
            that is not currently deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
  /api/v1/integration/webhooks/{subscriptionId}/deliveries:
    servers: []
    get:
      operationId: integration_listWebhookDeliveries
      tags:
        - integration
      summary: List one subscription's most recent delivery attempts.
      description: >-
        Newest first, at most limit rows; an absent or non-positive limit falls
        back to the module's own default (defaultRecentDeliveriesLimit, 50 --
        see Service.ListRecentWebhookDeliveries), and a limit above the declared
        maximum (100) is clamped to it. subscriptionId is NOT verified to exist:
        an id that names nothing, or a subscription of another tenant, returns
        an empty list exactly as a genuine subscription with zero deliveries
        would -- there is no observable difference, and telling the cases apart
        would let a caller enumerate another tenant's subscription ids (the same
        no-enumeration answer the 404s above give). Rows carry no payload: the
        raw event body is an implementation detail of the send pipeline, never
        exposed to subscription-management callers.
      parameters:
        - $ref: '#/components/parameters/SubscriptionID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
          description: >-
            Maximum rows to return. Absent or non-positive falls back to the
            module's default of 50; a value above 100 is clamped to 100.
      responses:
        '200':
          description: The subscription's recent delivery attempts, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationListWebhookDeliveriesResponse'
        '400':
          description: limit was not a non-negative integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationError'
  /api/v1/org/nodes:
    servers: []
    post:
      operationId: org_createNode
      tags:
        - org
      summary: Create a node in the caller's tenant's organization tree.
      description: >-
        parentId absent or empty creates the tenant's single root node
        (TreeService.CreateRoot); parentId present creates a child beneath it
        (TreeService.CreateChild). A tenant may have at most one root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreateNodeRequest'
      responses:
        '201':
          description: The node was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgNode'
        '400':
          description: >-
            The request body was missing or malformed, the name was empty or too
            long, or the depth bound would be exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '404':
          description: parentId does not name a node of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '409':
          description: >-
            The tenant already has a root (creating a second one), or another
            child of the same parent already has this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
    get:
      operationId: org_listNodes
      tags:
        - org
      summary: List nodes of the caller's tenant's organization tree.
      description: >-
        With parentId, returns that node's direct children
        (TreeService.Children). Without it, returns the whole tree -- the root
        together with every node beneath it (TreeService.Subtree) -- or an empty
        list when the tenant has no root yet.
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The matching nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgListNodesResponse'
        '404':
          description: parentId does not name a node of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
  /api/v1/org/nodes/{nodeId}:
    servers: []
    get:
      operationId: org_getNode
      tags:
        - org
      summary: Get one node of the caller's tenant's organization tree.
      parameters:
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgNode'
        '404':
          description: nodeId does not name a node of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
    patch:
      operationId: org_renameNode
      tags:
        - org
      summary: Rename a node.
      parameters:
        - $ref: '#/components/parameters/NodeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgRenameNodeRequest'
      responses:
        '200':
          description: The renamed node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgNode'
        '400':
          description: The name was empty or too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '404':
          description: nodeId does not name a node of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '409':
          description: Another sibling already has this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
    delete:
      operationId: org_deleteNode
      tags:
        - org
      summary: Delete a node.
      description: >-
        Deleting a node with children reports 409 unless cascade=true, in which
        case the whole subtree is removed in one statement. Re-parenting orphans
        to the grandparent is never done (it would silently widen every affected
        member's data scope). The tenant root can never be deleted, and neither
        can a node with members bound to it or beneath it -- move them first.
      parameters:
        - $ref: '#/components/parameters/NodeID'
        - name: cascade
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: The node (and, with cascade, its subtree) was deleted.
        '404':
          description: nodeId does not name a node of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '409':
          description: >-
            The node has children and cascade was not set, the node is the
            tenant root, or the node has members bound inside it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
  /api/v1/org/nodes/{nodeId}/move:
    servers: []
    post:
      operationId: org_moveNode
      tags:
        - org
      summary: Re-parent a node, carrying its whole subtree with it.
      parameters:
        - $ref: '#/components/parameters/NodeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgMoveNodeRequest'
      responses:
        '200':
          description: The moved node, with its new path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgNode'
        '400':
          description: The move would exceed the tree's depth bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '404':
          description: nodeId or parentId does not name a node of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '409':
          description: >-
            The target is the node itself or one of its own descendants, or a
            sibling of the target already has this node's name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
  /api/v1/org/members:
    servers: []
    get:
      operationId: org_listMembers
      tags:
        - org
      summary: List the members bound to a node's subtree.
      description: >-
        With nodeId, returns the members bound to that node or to anything
        beneath it (MemberService.List) -- standing at a group node returns
        every store's members beneath it, standing at one store returns that
        store's alone. Without nodeId, returns the whole tenant's roster (every
        member bound anywhere under the root), or an empty list when the tenant
        has no root yet.
      parameters:
        - name: nodeId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The matching members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgListMembersResponse'
        '404':
          description: nodeId does not name a node of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
  /api/v1/org/members/{userId}:
    servers: []
    delete:
      operationId: org_removeMember
      tags:
        - org
      summary: Remove a member from the caller's tenant.
      description: >-
        Refuses to remove the tenant's last active member (409): somebody has to
        be able to invite the next person in, and there is no privileged path
        back into an emptied tenant.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The membership was removed.
        '404':
          description: userId is not a member of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '409':
          description: userId is the tenant's last active member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
  /api/v1/org/invitations:
    servers: []
    post:
      operationId: org_createInvitation
      tags:
        - org
      summary: Invite a person into the caller's tenant, at a node.
      description: >-
        The invitee's address is normalized, indexed and rate-limited (per
        tenant and, separately, per recipient) before anything is stored; an
        earlier pending invitation for the same address is revoked so only the
        newest link works. The invitation email's language is resolved by the
        invitation chain and stored on the invitation at creation time, so a
        later send renders the same language: the optional locale field below
        (the invitee's explicitly named language) first, then the recipient's
        stored profile when one can be confirmed, then the requesting caller's
        own Accept-Language (the frontend's language chain, transported here),
        then the platform default en-US. Omitting locale therefore no longer
        means "the platform default" outright -- it means the chain continues to
        the requester's language, and only a request naming no usable language
        lands on the default. The response never carries the invitation token:
        it is a bearer credential handed to the invitee alone, through the
        message this endpoint sends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreateInvitationRequest'
      responses:
        '201':
          description: The invitation was created (and, unless disabled, sent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgInvitation'
        '400':
          description: The address had no valid form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '403':
          description: Invitations are turned off for this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '404':
          description: nodeId does not name a node of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '429':
          description: The per-tenant or per-recipient invitation rate limit was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
    get:
      operationId: org_listInvitations
      tags:
        - org
      summary: List the caller's tenant's pending invitations.
      description: >-
        Expiry is evaluated at acceptance time, not by a sweeper, so an
        expired-but-unaccepted row is still listed here as pending; expiresAt
        tells the caller it is stale.
      responses:
        '200':
          description: The caller's tenant's pending invitations, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgListInvitationsResponse'
  /api/v1/org/invitations/accept:
    servers: []
    post:
      operationId: org_acceptInvitation
      tags:
        - org
      summary: Accept an invitation, joining the tenant that issued it.
      description: >-
        The tenant comes from the invitation token itself, resolved server-side
        -- never from the caller's access token, a parameter, a header or the
        body. The caller needs no membership in, and typically holds no token
        for, the inviting tenant: that is the entire situation a freshly invited
        person is in, which is also why an invitation link may point at any host
        that reaches this endpoint rather than only at the inviting tenant's
        own. The token is hashed and resolved through the module's narrow
        non-tenant-scoped token index (see invitation.go's
        invitationTokenIndex); every status check, the single-use claim and the
        membership creation then run strictly inside the tenant the index row
        names, exactly as they always have, and a caller whose request already
        carries that tenant is served unchanged. Who the membership binds is the
        caller identity the host's SubjectResolver attests (401 when it cannot),
        never a value the request body supplies -- the body carries the token
        only, and an unrecognized token reports 404 and reveals nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgAcceptInvitationRequest'
      responses:
        '200':
          description: The new (or already-held) membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMembership'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '404':
          description: The token matches no invitation org ever issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
        '409':
          description: The invitation was already accepted, was revoked, or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgError'
  /api/v1/pki/signing-keys/{kid}/revoke:
    servers: []
    post:
      operationId: pki_revokeSigningKey
      tags:
        - pki
      summary: Revoke a signing key.
      description: >-
        Transitions the signing key to revoked, of any prior status (pending,
        active or retiring), publishing pki.signing_key.revoked and immediately
        excluding the key from every future ActiveSigner and VerificationKeys
        answer. Idempotent: revoking an already-revoked key still answers 200
        with its current (unchanged) state.
      parameters:
        - $ref: '#/components/parameters/KID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PkiRevokeSigningKeyRequest'
      responses:
        '200':
          description: The signing key's current state, now revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiSigningKey'
        '400':
          description: reason was missing or empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiError'
        '404':
          description: kid does not name a signing key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiError'
  /api/v1/pki/certificates/{certificateId}/revoke:
    servers: []
    post:
      operationId: pki_revokeCertificate
      tags:
        - pki
      summary: Revoke a certificate.
      description: >-
        Transitions the caller's tenant's certificate to revoked, records a
        revocation-ledger entry consumed by the issuing authority's next CRL
        generation, and publishes pki.certificate.revoked. Idempotent: revoking
        an already-revoked certificate still answers 200 with its current
        (unchanged) state.
      parameters:
        - $ref: '#/components/parameters/CertificateID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PkiRevokeCertificateRequest'
      responses:
        '200':
          description: The certificate's current state, now revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiCertificate'
        '400':
          description: reason was missing or empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiError'
        '404':
          description: certificateId does not name a certificate of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiError'
  /api/v1/pki/jwks:
    servers: []
    get:
      operationId: pki_getKeyJwks
      tags:
        - pki
      summary: Fetch the key-lifecycle layer's JWKS for one purpose.
      description: >-
        The active and retiring public keys of purpose, as an RFC 7517 JSON Web
        Key Set, for an external verifier of tokens this deployment signs. Never
        includes a pending key, and never a private key or key reference. A
        purpose with no active or retiring key answers 200 with an empty key
        set, never an error.
      parameters:
        - name: purpose
          in: query
          required: true
          description: The signing-key purpose to export, e.g. "authn.access_token".
          schema:
            type: string
      responses:
        '200':
          description: The purpose's key-lifecycle JWKS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiJwks'
  /api/v1/pki/authorities/{authorityId}/jwks:
    servers: []
    get:
      operationId: pki_getAuthorityJwks
      tags:
        - pki
      summary: Fetch an authority's certificate-chain JWKS.
      description: >-
        authorityId's own public key plus every ancestor authority's, up to and
        including the root, one JWK per authority keyed by its id, as an RFC
        7517 JSON Web Key Set -- the X.509 layer's JWKS export, for pushing to
        an external system such as a data-plane cluster. Never a private key.
      parameters:
        - $ref: '#/components/parameters/AuthorityID'
      responses:
        '200':
          description: The authority's certificate-chain JWKS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiJwks'
        '404':
          description: authorityId does not name an authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiError'
  /api/v1/pki/authorities/{authorityId}/crl:
    servers: []
    get:
      operationId: pki_getAuthorityCrl
      tags:
        - pki
      summary: Fetch an authority's current CRL.
      description: >-
        The most recently generated Certificate Revocation List for authorityId,
        PEM encoded, exactly as CAService.GenerateCRL (or the periodic
        pki.crl_regenerate job) last wrote it -- this operation never generates
        one itself, it only serves the stored document.
      parameters:
        - $ref: '#/components/parameters/AuthorityID'
      responses:
        '200':
          description: The authority's current CRL, PEM encoded.
          content:
            application/x-pem-file:
              schema:
                type: string
        '404':
          description: >-
            authorityId does not name an authority, or that authority has never
            had a CRL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiError'
  /api/v1/sharing/access:
    servers: []
    get:
      operationId: sharing_accessShare
      tags:
        - sharing
      summary: Access a share's content by bearer token.
      description: >-
        Resolves token into the share it names -- through Service.AccessPublic,
        which resolves the request's tenant from the token itself before
        Service.Access's own ordinary rules ever run -- and, when access is
        granted, streams the resource behind the share's ResourceRef (resolved
        through the host's own sharing.ResourceResolver seam; see module.go's
        WithResourceResolver).


        Every refusal reason -- an unrecognized token, a revoked, expired or
        view-exhausted share, or a missing or wrong password -- answers with the
        exact same 404 body, per this module's outward-identical-answer rule:
        probing this endpoint teaches an outside caller nothing about which of
        those reasons actually applied. A resource that could not be opened
        AFTER access was already granted is a distinct, undisguised 502 -- see
        SharingError's own description and sharing.ErrResourceUnavailable's doc
        comment for why that case must not be folded into the same 404.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: >-
            The share's bearer token, exactly as returned once by the
            owner-facing Service.Create call. Never the share's own id, and
            never accepted from anywhere but this query parameter (the
            multi-tenant isolation rule's spirit extended to this module's own
            bearer credential: there is exactly one legitimate source for it).
        - name: X-Sharing-Password
          in: header
          required: false
          schema:
            type: string
          description: >-
            The share's access password, presented only when the share requires
            one (Share.PasswordHash set). Carried as a header, deliberately not
            a second query parameter: a query parameter routinely lands in
            server access logs and in a subsequently loaded page's Referer
            header, and this module's own established rule (repository.go's
            byTokenHash doc comment) is that a credential this module verifies
            never travels anywhere past the caller who presented it. The bearer
            token itself is this module's one already-accepted exception to that
            rule -- it is the URL itself, by the module's own design (Share's
            doc comment) -- so putting the SECOND credential a share may require
            in the URL too would be a strictly weaker property than what this
            module already ships, not merely an equally weak one.
      responses:
        '200':
          description: >-
            Access was granted and the resource behind the share's ResourceRef
            was read successfully. Content-Type reflects the resource's own
            resolved media type (or application/octet-stream when it could not
            be determined); Content-Length is present when the resolver reported
            a known size.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store" on every response this route writes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: >-
            The token is unrecognized, or the share it names is revoked,
            expired, view-exhausted, or password-protected and the presented
            password (or its absence) did not match -- deliberately
            indistinguishable from one another. code is always
            sharing.not_accessible.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store" on every response this route writes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
        '429':
          description: >-
            The caller's IP address or the presented token has exceeded this
            module's rate-limit budget (ratelimit.go). code is always
            sharing.rate_limited, with a "dimension" parameter naming which of
            the two tripped and a "retry_after_seconds" parameter.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store" on every response this route writes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
        '502':
          description: >-
            Access to the share itself was granted -- a real view was already
            recorded -- but the resource behind its ResourceRef could not be
            read: no ResourceResolver was wired, or the wired one failed to open
            it. code is always sharing.resource_unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store" on every response this route writes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
  /api/v1/sharing/shares:
    servers: []
    post:
      operationId: sharing_createShare
      tags:
        - sharing
      summary: Create a new share link in the caller's tenant.
      description: >-
        A thin translation of Service.Create: resourceRef is required and must
        be non-empty (sharing.resource_ref_required), forever, when true, is
        always refused (sharing.expiry_required -- the module's this the most
        common source of data leaks, and this surface must never be able to
        bypass that refusal), maxViews, when given, must be positive
        (sharing.invalid_max_views), and expiresAt, when omitted, resolves
        through the tenant's configured default (falling back to a fixed default
        when none is configured). An expiresAt that IS given must lie strictly
        in the future and no more than 30 days from now -- the platform's
        maximum share lifetime, the same ceiling applies to the default -- or it
        is refused with sharing.expiry_out_of_range, so a far-future timestamp
        can never smuggle in the effectively-never-expiring link the module
        forbids. token is returned inside the response body exactly once and is
        never retrievable again by any other operation on this surface -- not
        even sharing_getShare, whose response carries no token field at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharingCreateShareRequest'
      responses:
        '201':
          description: >-
            The share was created. token is present in this response only -- see
            this operation's own description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingCreateShareResponse'
        '400':
          description: >-
            resourceRef was empty, forever was true, maxViews was non-positive,
            expiresAt could not be resolved, or expiresAt was outside the
            allowed expiry bounds (not strictly in the future, or more than 30
            days out).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
        '429':
          description: >-
            The caller's tenant has exceeded this module's share-creation
            rate-limit budget (ratelimit.go). code is always
            sharing.rate_limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
    get:
      operationId: sharing_listShares
      tags:
        - sharing
      summary: List the caller's tenant's shares, newest first.
      description: >-
        Metadata only, exactly like storage_listObjects' own listing promise: no
        access log, no token (a share's token is returned exactly once, by
        sharing_createShare, and is never derivable from any stored value this
        surface could serve).

        Keyset-paginated, following storage_listObjects' own keyset-cursor
        shape: the page returns up to limit shares (1-200, default 50) ordered
        newest first, and the caller echoes the last row's id as the next page's
        beforeId. A row inserted between two fetches shifts nothing. A beforeId
        naming no share of the caller's tenant -- a cursor that never existed,
        or another tenant's share -- reports 404, indistinguishable on purpose
        (a share has no deletion path, so a cursor names a row or nothing at
        all). Revoked and expired shares stay listed: an owner-facing listing
        must still show what happened to a share that is gone.
      parameters:
        - name: limit
          in: query
          required: false
          description: The page size, from 1 through 200. Defaults to 50.
          schema:
            type: integer
            default: 50
        - name: beforeId
          in: query
          required: false
          description: >-
            Return only shares ordered before the one with this id (the keyset
            cursor); the last page's final row id.
          schema:
            type: string
      responses:
        '200':
          description: The caller tenant's shares, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingListSharesResponse'
        '400':
          description: limit is outside the 1-200 bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
        '404':
          description: >-
            beforeId does not name a share of the caller's tenant. code is
            always sharing.share_not_found, the same safe-to-disclose code
            sharing_getShare answers for an unknown id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
  /api/v1/sharing/shares/{shareId}:
    servers: []
    get:
      operationId: sharing_getShare
      tags:
        - sharing
      summary: Get one share's own metadata.
      description: >-
        A thin translation of Service.Get. Carries no token (see
        sharing_createShare's own description) and no access log (see
        sharing_listShareAccessLog).
      parameters:
        - $ref: '#/components/parameters/ShareID'
      responses:
        '200':
          description: The share's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingShare'
        '404':
          description: >-
            shareId does not name a share of the caller's tenant. code is always
            sharing.share_not_found -- unlike the access route's
            sharing.not_accessible, this code is safe to disclose: the caller
            here is the tenant that owns (or claims to own) the share,
            addressing it by its own internal id, never an external viewer
            holding a bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
  /api/v1/sharing/shares/{shareId}/revoke:
    servers: []
    post:
      operationId: sharing_revokeShare
      tags:
        - sharing
      summary: Revoke a share, with immediate effect.
      description: >-
        A thin translation of Service.Revoke, followed by a Service.Get of the
        same row to return its now-revoked state -- Revoke itself returns no
        value. Idempotent, matching Service.Revoke's own contract: revoking an
        already-revoked share still answers 200 with its current (unchanged)
        state, never a 404 or a 409. Revocation takes effect on the very next
        check against /api/v1/sharing/access -- there is no cache anywhere in
        this module to invalidate, so revocation and a spent view take effect on
        the very next access check.
      parameters:
        - $ref: '#/components/parameters/ShareID'
      responses:
        '200':
          description: The share's current state, now revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingShare'
        '404':
          description: shareId does not name a share of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
  /api/v1/sharing/shares/{shareId}/access-log:
    servers: []
    get:
      operationId: sharing_listShareAccessLog
      tags:
        - sharing
      summary: List every recorded access attempt against a share, newest first.
      description: >-
        A thin translation of Service.ListAccessLog: every access attempt
        recorded against the share, granted or denied alike, per the module's
        mandatory every-access-is-logged rule -- an owner-facing "who viewed
        this and how many times" answer. Denied attempts are recorded too, and
        deliberately without distinguishing which of Access's refusal reasons
        applied (outcome is only ever "granted" or "denied"), so this
        owner-facing report cannot itself be scraped to learn what the
        outward-identical-answer rule requires an outside prober never learn.
      parameters:
        - $ref: '#/components/parameters/ShareID'
      responses:
        '200':
          description: The share's access log, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingListAccessLogResponse'
        '404':
          description: shareId does not name a share of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingError'
  /api/v1/storage/objects:
    servers: []
    post:
      operationId: storage_createObject
      tags:
        - storage
      summary: Declare an upload in the caller's tenant.
      description: >-
        Create is the first step of the three-step upload lifecycle: it
        validates the declaration and records an uploading object whose
        uploadExpiresAt bounds how long the caller has to PUT the content. The
        declaration carries a positive declaredSize within the host's per-object
        ceiling, a non-empty declaredType (the server canonicalizes it and
        checks it against the host's media-type allowlist), an optional
        declaredChecksum of 64 lowercase hex characters, and an optional
        absolute retention deadline in the future and within the host's lifetime
        ceiling. The response is the upload descriptor: object metadata plus the
        deadline. Content itself never travels on this endpoint -- the upload
        and download endpoints carry bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageCreateObjectRequest'
      responses:
        '201':
          description: The upload was declared; the caller may now upload content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageObject'
        '400':
          description: >-
            The request body was missing or malformed, the declared size was
            non-positive or above the per-object ceiling, the declared type is
            not on the allowlist, the declared checksum is not a valid SHA-256
            hex string, or the retention deadline is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
    get:
      operationId: storage_listObjects
      tags:
        - storage
      summary: List the caller's tenant's completed objects, newest first.
      description: >-
        Keyset-paginated: the page returns up to limit objects (1-200, default
        50) ordered newest first, and the caller echoes the last row's id as the
        next page's beforeId. A row inserted between two fetches shifts nothing.
        A beforeId naming no completed object of the caller's tenant -- a cursor
        that never existed, one deleted since, or another tenant's object --
        reports 404, indistinguishable on purpose. List returns metadata only:
        no item carries derivatives, because a list must never fan out one query
        per row.
      parameters:
        - name: limit
          in: query
          required: false
          description: The page size, from 1 through 200. Defaults to 50.
          schema:
            type: integer
            default: 50
        - name: beforeId
          in: query
          required: false
          description: >-
            Return only objects ordered before the one with this id (the keyset
            cursor); the last page's final row id.
          schema:
            type: string
      responses:
        '200':
          description: The matching completed objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageListObjectsResponse'
        '400':
          description: limit is outside the 1-200 bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
        '404':
          description: beforeId does not name a completed object of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
  /api/v1/storage/objects/{objectId}:
    servers: []
    get:
      operationId: storage_getObject
      tags:
        - storage
      summary: Get one completed object's metadata.
      description: >-
        The full metadata of a completed object of the caller's tenant,
        including its derivatives -- an empty array when none have been derived
        yet. Uploading rows are not visible here (their descriptor was the
        create response), and deleting rows are not visible anywhere on this
        surface: both answer 404 like ids that never existed.
      parameters:
        - $ref: '#/components/parameters/ObjectID'
      responses:
        '200':
          description: The object's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageObject'
        '404':
          description: objectId names no completed object of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
    delete:
      operationId: storage_deleteObject
      tags:
        - storage
      summary: Permanently delete an object of the caller's tenant.
      description: >-
        Deletion removes the object's bytes, every derivative's bytes and all of
        its rows, and is irreversible. An object still uploading reports 409:
        only the expiry sweep reclaims uploads, once their window closes. An
        object already deleting -- an interrupted delete, which a mid-protocol
        store failure can leave behind -- is resumed to completion and answers
        204. An id naming no completed or deleting object of the caller's tenant
        -- never created, already deleted, or another tenant's -- reports 404,
        indistinguishable on purpose, so a repeated delete answers 404 after the
        first 204.
      parameters:
        - $ref: '#/components/parameters/ObjectID'
      responses:
        '204':
          description: >-
            The object was deleted, or its interrupted deletion was resumed to
            completion.
        '404':
          description: >-
            objectId names no completed or deleting object of the caller's
            tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
        '409':
          description: The object is still uploading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
  /api/v1/storage/objects/{objectId}/content:
    servers: []
    put:
      operationId: storage_uploadObjectContent
      tags:
        - storage
      summary: Upload one declared object's bytes.
      description: >-
        The second step of the upload lifecycle: the request body is the
        object's raw bytes, streamed. The upload binds to the declaration: it is
        accepted only while the object is uploading and before its
        uploadExpiresAt, and the body's length must match the declared size
        exactly -- a Content-Length that disagrees with the declared size is a
        400, and a stream that ends early or overruns is a 409 once the bytes
        are counted against the declaration. The content is deliberately NOT
        inspected here: the media type was declared at create and is probed from
        the stored bytes at complete, and the declared checksum is verified
        there too, so this endpoint stays a dumb byte pipe. A caller that skips
        it and completes directly gets content_missing.
      parameters:
        - $ref: '#/components/parameters/ObjectID'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: The bytes were stored.
        '400':
          description: The body's Content-Length disagrees with the declared size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
        '404':
          description: objectId does not name an object of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
        '409':
          description: >-
            The object is not uploading, its upload window has closed (the
            content is treated as never-arriving), or the stored byte count does
            not match the declared size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
    get:
      operationId: storage_getObjectContent
      tags:
        - storage
      summary: Stream a completed object's bytes.
      description: >-
        The raw bytes of a completed object of the caller's tenant, served with
        the media type probed from the bytes at complete time (the sanitized,
        metadata-stripped form). Only completed objects are readable: uploading
        and deleting rows answer 404 like everything else this surface hides.
      parameters:
        - $ref: '#/components/parameters/ObjectID'
      responses:
        '200':
          description: The object's bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: objectId names no completed object of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
  /api/v1/storage/objects/{objectId}/complete:
    servers: []
    post:
      operationId: storage_completeObject
      tags:
        - storage
      summary: Finalize a declared and uploaded object.
      description: >-
        The last step of the upload lifecycle. Complete revalidates the stored
        bytes against the declaration -- their count against the declared size
        and their SHA-256 against the declared checksum when one was given --
        and probes their real media type, which must be on the module's
        allowlist and, when a type was declared, agree with it. Images are
        decoded within the module's pixel ceiling and sanitized: metadata such
        as EXIF/GPS is stripped before the bytes are finalized, and the stored
        content is replaced with the sanitized form, so the checksum and type
        verified are the sanitized bytes'. Only a row still uploading with its
        window open can be finalized, so a completion racing the window's end or
        a concurrent reclaim cannot commit behind them. The response is the
        finalized object's metadata; thumbnail derivation is enqueued
        asynchronously, and its result shows up by polling getObject's
        derivatives array.
      parameters:
        - $ref: '#/components/parameters/ObjectID'
      responses:
        '200':
          description: The object was finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageObject'
        '400':
          description: >-
            The probed media type is not on the allowlist or disagrees with the
            declared one, the image exceeds the pixel ceiling, or the image
            could not be decoded for probing or sanitization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
        '404':
          description: objectId does not name an object of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
        '409':
          description: >-
            The object is not uploading, its content never arrived or its upload
            window closed, or the stored bytes do not match the declared size or
            checksum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageError'
  /api/v1/config/public:
    servers: []
    get:
      operationId: config_getPublicConfig
      tags:
        - config
      summary: Read the tenant's public configuration snapshot.
      description: >-
        The pre-auth display answer for the tenant the request's host resolves
        to: every Public item's effective value plus the sorted list of enabled
        feature flags, exactly what a login page needs to render its brand and
        chrome. `config` is keyed by configuration key and its entries are
        dynamic -- modules declare their own Public items against pkgcore's
        registry, so no closed property set exists here; a value is the JSON
        native its declared type has (string, boolean, integer) and a duration
        renders as its canonical "1m30s" text. `features` is never absent and
        never null: an empty enablement list is `[]`. No Sensitive item can
        appear (pkgcore's declaration validation makes Sensitive and Public
        mutually exclusive), so the snapshot is safe to serve to anyone.

        An item the resolve walk cannot serve is omitted from `config` rather
        than failing the response -- an item with no value at any reachable
        scope and no declared Default, or one whose stored row cannot be decoded
        under its declared type. Per-item tolerance is this endpoint's contract:
        one unset or corrupt item must not take the endpoint, and with it the
        login page, down for every tenant.

        Each value is resolved narrow-to-wide for the resolved tenant: the
        tenant tier first, then the platform (system) tier, then the item's
        declared default.
      responses:
        '200':
          description: >-
            The public snapshot for the tenant the request's host resolves to,
            or the platform-default tier when it resolves to none.
          headers:
            Cache-Control:
              schema:
                type: string
              description: >-
                Always "public, max-age=60" on a successful answer: public
                configuration is display-only, per-tenant content that changes
                only when an operator writes a row.
            Vary:
              schema:
                type: string
              description: >-
                Always "Host" on a successful answer: the snapshot is resolved
                for the tenant the request's host maps to, and an intermediary
                that normalizes the authority must not be free to collapse two
                tenants' answers into one cache entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigPublicSnapshot'
        '405':
          description: >-
            The request's method is neither GET nor HEAD. code is always
            config.method_not_allowed, and the response carries `Allow: GET,
            HEAD`.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store" on every refusal this endpoint writes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigError'
        '429':
          description: >-
            The caller's address has spent the request budget shared by both
            operations (ratelimit.go). code is always config.rate_limited, with
            a "dimension" parameter naming the tripped dimension ("ip") and a
            "retry_after_seconds" parameter naming how long until the window
            recovers.
          headers:
            Cache-Control:
              schema:
                type: string
              description: >-
                Always "no-store": a cached 429 would keep refusing requests
                past the window its own retry_after_seconds announced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigError'
        '500':
          description: >-
            The configs table could not be read, or the rate limiter's store
            could not answer the check (it fails closed): code is always
            config.storage_error. The same status answers
            config.service_not_attached in the wiring window between the
            module's Register and Attach, a host wiring bug -- neither response
            ever carries the underlying cause.
          headers:
            Cache-Control:
              schema:
                type: string
              description: >-
                Always "no-store": a cached 500 would hide the recovery of
                whatever failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigError'
  /api/v1/config/features:
    servers: []
    get:
      operationId: config_getSystemFeatures
      tags:
        - config
      summary: Read the tenant's enabled feature-flag list.
      description: >-
        The enablement half of the public snapshot alone, for a client that only
        needs to know what is on: the sorted list of declared feature flags that
        IsEnabled reports enabled for the tenant the request's host resolves to
        -- a flag's effective value at every tier (tenant row, else system row,
        else its declared default) and every flag it depends on, recursively.
        Never absent and never null: an empty enablement list is `[]`.
        Everything config_getPublicConfig documents applies here unchanged --
        host-based tenant resolution, pre-auth status, the method contract, the
        item-level `features` semantics and the caching contract.
      responses:
        '200':
          description: >-
            The enabled feature flags for the tenant the request's host resolves
            to, or the platform-default tier when it resolves to none.
          headers:
            Cache-Control:
              schema:
                type: string
              description: >-
                Always "public, max-age=60" on a successful answer -- see
                config_getPublicConfig's own header.
            Vary:
              schema:
                type: string
              description: >-
                Always "Host" on a successful answer -- see
                config_getPublicConfig's own header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSystemFeatures'
        '405':
          description: >-
            The request's method is neither GET nor HEAD. code is always
            config.method_not_allowed, and the response carries `Allow: GET,
            HEAD`.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always "no-store" on every refusal this endpoint writes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigError'
        '429':
          description: >-
            The caller's address has spent the request budget shared by both
            operations (ratelimit.go). code is always config.rate_limited, with
            a "dimension" parameter naming the tripped dimension ("ip") and a
            "retry_after_seconds" parameter naming how long until the window
            recovers.
          headers:
            Cache-Control:
              schema:
                type: string
              description: >-
                Always "no-store": a cached 429 would keep refusing requests
                past the window its own retry_after_seconds announced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigError'
        '500':
          description: >-
            The configs table could not be read, or the rate limiter's store
            could not answer the check (it fails closed): code is always
            config.storage_error. The same status answers
            config.service_not_attached in the wiring window between the
            module's Register and Attach, a host wiring bug -- neither response
            ever carries the underlying cause.
          headers:
            Cache-Control:
              schema:
                type: string
              description: >-
                Always "no-store": a cached 500 would hide the recovery of
                whatever failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigError'
components:
  schemas:
    AuthnRegisterRequest:
      type: object
      required:
        - password
      properties:
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        display_name:
          type: string
        locale:
          type: string
          description: >-
            Preferred language for backend-generated content addressed to this
            account. Registration validation is lenient: a value the
            deployment's catalog does not ship is stored as empty (the platform
            default en-US applies) rather than refusing the registration.
        timezone:
          type: string
          description: >-
            The browser-reported IANA timezone name (for example
            "Asia/Shanghai"), the registration-time initial value of the
            account's display timezone. Lenient like locale: a name that is not
            a known IANA zone is stored as empty (the platform default UTC
            applies) rather than refusing the registration.
    AuthnUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        phone:
          type: string
        display_name:
          type: string
        locale:
          type: string
          description: >-
            The language backend-generated content for this account renders in.
            Empty means "not chosen yet" and the platform default (en-US)
            applies.
        timezone:
          type: string
          description: >-
            The IANA timezone name (for example "Asia/Shanghai") this account's
            times are rendered in. Empty means "not chosen yet" and the platform
            default (UTC) applies.
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    AuthnLoginWithPasswordRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: An email address or phone number.
        password:
          type: string
        tenant_id:
          type: string
          description: >-
            Requests this tenant's first access token; empty means the caller's
            first tenant. A request, never a grant.
        device:
          type: string
    AuthnRequestSMSCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
    AuthnLoginWithSMSCodeRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
        code:
          type: string
        tenant_id:
          type: string
        device:
          type: string
    AuthnRefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    AuthnTokenPair:
      type: object
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: >-
            Absent when this response did not mint a new refresh token (a tenant
            switch or a step-up, both of which reuse the caller's existing one).
        refresh_expires_at:
          type: string
          format: date-time
        principal:
          $ref: '#/components/schemas/AuthnPrincipal'
    AuthnPrincipal:
      type: object
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
        session_id:
          type: string
        email:
          type: string
        amr:
          type: array
          items:
            type: string
    AuthnPreferences:
      type: object
      properties:
        locale:
          type: string
          description: >-
            The language backend-generated content for this account renders in.
            Empty means "not chosen yet" and the platform default (en-US)
            applies; a stored value is always one of the languages the
            deployment's catalog ships.
        timezone:
          type: string
          description: >-
            The IANA timezone name (for example "Asia/Shanghai") this account's
            times are rendered in. Empty means "not chosen yet" and the platform
            default (UTC) applies.
    AuthnUpdatePreferencesRequest:
      type: object
      properties:
        locale:
          type: string
          description: >-
            The requested locale. Absent leaves the stored value unchanged; an
            empty string clears it; any other value must be one of the languages
            the deployment's catalog ships, or the update is refused with
            authn.invalid_locale and nothing is written.
        timezone:
          type: string
          description: >-
            The requested IANA timezone name. Absent leaves the stored value
            unchanged; an empty string clears it; any other value must be a
            known IANA zone (the process-local pseudo-zone is not storable), or
            the update is refused with authn.invalid_timezone and nothing is
            written.
    AuthnSocialAuthorizeResponse:
      type: object
      properties:
        authorize_url:
          type: string
    AuthnSocialCallbackRequest:
      type: object
      required:
        - code
        - state
      properties:
        code:
          type: string
        state:
          type: string
        tenant_id:
          type: string
    AuthnSocialLoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthnUser'
        identity:
          $ref: '#/components/schemas/AuthnIdentity'
        tokens:
          $ref: '#/components/schemas/AuthnTokenPair'
        created:
          type: boolean
        bound:
          type: boolean
        auto_linked:
          type: boolean
    AuthnIdentity:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    AuthnListIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/AuthnIdentity'
    AuthnEnrollTOTPResponse:
      type: object
      properties:
        secret:
          type: string
        provisioning_uri:
          type: string
    AuthnConfirmTOTPRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    AuthnRecoveryCodesResponse:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    AuthnVerifyStepUpRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    AuthnSwitchTenantRequest:
      type: object
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
    AuthnSession:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        device:
          type: string
        user_agent:
          type: string
        ip:
          type: string
        amr:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: >-
            When the session stops working. Expiry is enforced at use time and
            never written back to the row, so a session whose status is still
            "active" can have an expires_at in the past: a caller renders such a
            row as expired, never as a live device.
        revoke_reason:
          type: string
          enum:
            - logout
            - user_revoked
            - revoke_others
            - security_revoked
          description: >-
            Why the session stopped, exported only on a revoked session. The
            value is a tiered projection, never the reason stored on the session
            row: a reason recording the owner's own action exports as itself --
            "logout" (this device signed itself out), "user_revoked" (the owner
            revoked this one session from their device list), "revoke_others"
            (the owner signed out every other session) -- while a reason
            recording a security mechanism's action (today: a detected
            refresh-token replay) never exports as itself: every such reason
            folds into the single generic value "security_revoked", which tells
            the owner that a security mechanism, not the owner, closed the
            session without naming which mechanism. A security-aware caller
            renders "security_revoked" as a security event worth acting on, and
            never renders the mechanisms behind it. An active session carries no
            revoke_reason.
        is_current:
          type: boolean
    AuthnListSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AuthnSession'
    AuthnRevokeOtherSessionsResponse:
      type: object
      properties:
        revoked_count:
          type: integer
    AuthnLoginAttempt:
      type: object
      properties:
        id:
          type: string
        method:
          type: string
        result:
          type: string
        failure_reason:
          type: string
