          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImpersonationGrant'
        '404':
          description: No grant exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '409':
