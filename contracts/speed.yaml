          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/audit-events:
    servers: []
    get:
      operationId: admin_listAuditEvents
      tags:
        - admin
      summary: Query the audit trail, single-tenant or cross-tenant.
      description: >-
        A thin HTTP shell over compliance.AuditQuery -- see AuditService's own
        doc comment. tenantId absent means "every tenant this operator is
        entitled to see" (the cross-tenant, system-context-gated path); present
        means the single-tenant path. onBehalfOf narrows the result to rows
        written during an impersonation session whose real administrator (the
        row's on-behalf-of identity) is the given id -- the
        impersonation-accountability read dimension: an administrator never
        appears as the actor on such a row, so only this filter can answer "what
        did this administrator do through impersonation".
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: onBehalfOf
          in: query
          required: false
          schema:
            type: string
        - name: resource
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: success
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The matching audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListAuditEventsResponse'
  /api/v1/admin/audit-events/export:
    servers: []
    post:
      operationId: admin_exportAuditEvents
      tags:
        - admin
