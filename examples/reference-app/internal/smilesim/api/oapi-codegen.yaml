# Generator configuration for the smilesim domain's OpenAPI fragment
# (openapi.yaml in this directory, per docs/internal/21-api-contract.md's
# module-asset convention: every module keeps its spec at <module>/api/
# openapi.yaml). The fragment's handlers live in the app's cmd/server
# (the demo-glue assembly, mirrors of notes' own handler/handler-internal
# split: notes implements its generated interface inside the module, the
# case and smile-simulation surfaces implement theirs in the app, with a
# compile-time assertion at the bottom of the owning cmd/server file).
#
# The module's generated surface is regenerated with oapi-codegen v2.8.0,
# pinned at exactly that version in the three commands that must move
# together: Taskfile.yml's api:gen:app task command,
# .github/workflows/full-check.yml's reference-app job's regeneration
# step and this file's output -- both run the same
# `go run .../cmd/oapi-codegen@v2.8.0 -config oapi-codegen.yaml
# openapi.yaml` from this directory, passing this file as their config.
# The generated file's header records the generator version, so any
# regeneration with a different tool version shows up as drift in CI's
# regenerate-then-diff check.
#
# generate.std-http-server emits the pure net/http ServerInterface -- plain
# (w http.ResponseWriter, r *http.Request) method signatures with path
# parameters bound as extra typed arguments -- which is what the app's
# ServeMux-based wiring implements, plus the Handler/HandlerFromMux/
# HandlerWithOptions registration helpers whose method+path patterns are
# derived from the spec fragment itself (no hand-written registration of
# the same patterns -- the spec fragment is the only hand-maintained copy
# of path+method truth).
#
# output-options.name-normalizer: the default normalizer would name a spec
# property "id" as the Go field Id; ToCamelCaseWithInitialisms applies the
# standard Go initialism list (ID among them) so generated field names match
# this repository's naming (PhotoObjectID, jobID path parameter).
#
# Optional spec properties stay optional in Go as pointers (the generator
# default): the handler sets every pointer it responds with, so presence on
# the wire is always explicit -- e.g. SmilesimJobStatus.OutputObjectID is
# nil unless the handler means to emit the key, which is what keeps the
# conditional fields conditional exactly as the hand-written mirror types
# did.
package: api
generate:
  models: true
  std-http-server: true
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
output: smilesim-server.gen.go
