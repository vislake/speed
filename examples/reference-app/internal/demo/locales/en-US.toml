# demo module's English (en-US) copy.
#
# Like its Chinese sibling this file carries two families of ids: the
# template copy of the demo.patient_reminder notification type, and the
# template copy of the demo.simulation_ready notification type (dispatched
# when internal/smilesim's own smilesim.EventSimulationCompleted event
# fires with Succeeded: true -- see module.go's TypeKeySimulationReady doc
# comment for why the event name and the notification type key are two
# different strings) -- both following the template-id convention
# go/notification/render.go documents -- type key, channel and part in
# order (<type_key>.<channel>.<part>, e.g.
# demo.patient_reminder.email.subject), plus one "<type_key>.description"
# row per type for the type catalog. The patient-reminder type's templates
# take no parameters -- the demo patient-message route only triggers the
# send and the copy is fixed text -- while the simulation-ready type's SMS
# takes the completing simulation's job id as {{.simulation_job_id}}: the
# dispatch (internal/app/demo/demo_notification.go's smilesim completion glue)
# carries it both as copy and as the per-occurrence marker that keeps two
# completed simulations for the same recipient from collapsing into one
# delivery (the derived delivery key hashes the dispatch's params).
#
# The copy is rendered by the notification module out of the merged catalog
# Kernel.Bootstrap assembles from each module's Locales() -- which is exactly
# why demo must exist as a member of the bootstrap module set (see the
# package comment in module.go) -- and demo itself never reads these files.
#
# File contract (see go/pkgcore/i18n): every message is one flat top-level
# entry -- no grouped sections -- and zh-CN.toml and en-US.toml must carry
# identical id sets.
#
# The ids matching an apperr.Error.Code also feed the frontend's
# platform error-copy bundle (tools/gen_platform_error_bundle.py
# derives it from the module catalogs), so the text below is what a
# client renders for that code; an id with no code behind it is
# backend-only content and never enters that bundle.

"demo.patient_reminder.email.subject" = "Your check-up reminder"
"demo.patient_reminder.email.body_text" = "This is Smile Studio's reminder that your smile check-up appointment is coming up. If the time no longer suits you, simply reply to this email to reschedule."
"demo.patient_reminder.sms.text" = "Smile Studio reminder: your smile check-up appointment is coming up. Reply to this message if you need to reschedule."
"demo.patient_reminder.description" = "Sent when a contact's check-up appointment is drawing near."

"demo.simulation_ready.sms.text" = "Smile Studio: your smile simulation ({{.simulation_job_id}}) is ready to view."
"demo.simulation_ready.description" = "Sent when a requested smile simulation finishes generating."
