# demo 模块面向用户的中文（zh-CN）文案。
#
# 本文件携带两种 id：demo 模块声明的 notification 类型
# demo.patient_reminder 的模板文案，以及 demo.simulation_ready 类型（当
# internal/smilesim 自己的 smilesim.EventSimulationCompleted 事件以
# Succeeded: true 触发时派发——事件名与通知类型 key 为何是两个不同的字符串，
# 见 module.go 的 TypeKeySimulationReady 注释）的模板文案，均遵循
# go/notification/render.go 文档化的模板 id 约定——类型 key、渠道、部件依次
# 排列（<type_key>.<channel>.<part>，如 demo.patient_reminder.email.subject），
# 各加一条 "<type_key>.description" 供类型目录展示；面向收件人的参数以
# {{.snake_case}} 占位符拼写。病人提醒类型的模板不带参数——demo 病人提醒路由
# 只触发发送，文案本身是固定文本——而 simulation-ready 类型的短信模板接收完成
# 的模拟任务 id 作为 {{.simulation_job_id}}：派发（internal/app/demo/demo_notification.go
# 的 smilesim 完成态胶水代码）携带它既作文案，也作区分每次发生的事件标记——两次
# 为同一收件人完成的模拟是两次独立的发生，各自投递，不会因为派发参数相同而在
# 派生投递键上坍缩成一次（派生投递键对派发的参数做哈希）。
#
# 这些文案在 dispatch 时由 notification 模块从合并目录渲染（Kernel.Bootstrap
# 把 demo 模块的 Locales() 收进目录后冻结），demo 模块自身从不读取它们——
# 这正是 demo 必须作为 bootstrap 模块集一员存在的原因（见 module.go 的包
# 注释）。
#
# 文件契约（见 go/pkgcore/i18n）：每条消息是扁平的一条顶层条目——不允许
# 分组 section——且 zh-CN.toml 与 en-US.toml 必须携带完全相同的 id 集合。
#
# 与 apperr.Error.Code 对应的 id 同时是前端平台错误文案包的来源：该包由
# tools/gen_platform_error_bundle.py 从各模块文案目录生成，客户端按错误码
# 渲染的就是下面这段文案；没有对应错误码的 id 属于纯后端内容，不会进入该文案包。

"demo.patient_reminder.email.subject" = "您的复诊提醒"
"demo.patient_reminder.email.body_text" = "这是 Smile Studio 给您的复诊提醒：您预约的微笑检查即将到来。如需改期，请直接回复本邮件。"
"demo.patient_reminder.sms.text" = "Smile Studio 复诊提醒：您预约的微笑检查即将到来。如需改期，请回复短信说明。"
"demo.patient_reminder.description" = "当联系人的预约复诊临近时发送。"

"demo.simulation_ready.sms.text" = "Smile Studio：您的微笑模拟（{{.simulation_job_id}}）已生成，请查看。"
"demo.simulation_ready.description" = "当请求的微笑模拟生成完成时发送。"
