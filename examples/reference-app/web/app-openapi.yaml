openapi: 3.0.3
info:
  title: reference-app
  description: "The reference-app application OpenAPI document: the redocly join of the application own three fragments (notes, cases and smilesim), regenerated by `task api:gen:app` and committed. Each fragment stays authoritative for its own operations; this merged document is the app-owned SDK generation input and the linted whole-surface view (docs/internal/21-api-contract.md)."
  version: 0.0.0
tags:
  - name: notes
    x-displayName: notes
  - name: cases
    x-displayName: cases
  - name: smilesim
    x-displayName: smilesim
paths:
  /api/v1/notes:
    servers: []
    post:
      operationId: notes_createNote
      tags:
        - notes
      summary: Create a note for the caller's tenant.
      description: >-
        The tenant is always the one tenancy.Middleware already resolved from
        the request; there is no tenant_id field anywhere on this request, by
        design (root CLAUDE.md's multi-tenant isolation rule).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotesCreateNoteRequest'
      responses:
        '201':
          description: The note was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesNote'
        '400':
          description: >-
            The request body was missing, malformed, had empty text, or text
            exceeding the maxLength declared below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesError'
    get:
      operationId: notes_listNotes
      tags:
        - notes
      summary: List every note belonging to the caller's tenant.
      responses:
        '200':
          description: The caller's tenant's notes, oldest registration order first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesListNotesResponse'
  /api/v1/notes/{noteId}:
    servers: []
    delete:
      operationId: notes_deleteNote
      tags:
        - notes
      summary: Mark a note as deleted for the caller's tenant.
      description: >-
        The tenant is always the one tenancy.Middleware already resolved from
        the request, and the note id names a note belonging to that tenant alone
        -- never a tenant_id request field, by design (root CLAUDE.md's
        multi-tenant isolation rule). The delete is a mark-delete
        (dbkit.SoftDeletable): the row stays in place with deleted_at/deleted_by
        set, hidden from the list operation, and restorable through
        notes_restoreNote until a retention sweep physically reaps it. Deleting
        an already-deleted note answers 404 exactly like an unknown or another
        tenant's id -- the refusal is uniform, so a caller cannot learn which
        case it hit.
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
          description: The note's application-generated UUID.
      responses:
        '204':
          description: The note was marked deleted.
        '401':
          description: >-
            The request could not be attributed to a user
            (notes.subject_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesError'
        '404':
          description: >-
            No live note of the caller's tenant carries that id -- the note does
            not exist, belongs to another tenant, or is already deleted
            (notes.note_not_found). The answer is uniform across the three
            cases, exactly like the 404 the repository's other operations answer
            for a cross-tenant id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesError'
  /api/v1/notes/{noteId}/restore:
    servers: []
    post:
      operationId: notes_restoreNote
      tags:
        - notes
      summary: Restore a previously deleted note for the caller's tenant.
      description: >-
        The inverse of notes_deleteNote: clears the mark-delete's
        deleted_at/deleted_by so the note is visible to the list operation
        again, with its text and creator untouched. Restoring a note that is not
        currently deleted -- because it was never deleted, is unknown to this
        tenant, or belongs to another tenant -- answers 404 uniformly
        (notes.note_not_found), so a caller cannot learn which case it hit.
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
          description: The note's application-generated UUID.
      responses:
        '204':
          description: The note was restored.
        '401':
          description: >-
            The request could not be attributed to a user
            (notes.subject_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesError'
        '404':
          description: >-
            No currently-deleted note of the caller's tenant carries that id --
            the note is live, does not exist, or belongs to another tenant
            (notes.note_not_found). The answer is uniform across the three
            cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesError'
  /api/v1/cases:
    servers: []
    post:
      operationId: cases_createCase
      tags:
        - cases
      summary: Create a case under the caller's tenant.
      description: >-
        The case groups one patient (the clinic-given name required, the
        optional clinic-given reference) with the photos of the case as
        already-uploaded go/storage object ids, in attachment order. Both the
        photo list and the reference may be absent or empty -- a case can be
        created for an intake whose photos arrive later. There is deliberately
        no tenant_id field and no creator field anywhere on the request: the
        tenant is the one tenancy.Middleware already resolved into the request
        context, and the creator comes from the host's SubjectResolver seam,
        never from the request (a request no resolver can attribute is refused
        with cases.subject_unresolved before the body is even read).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasesCreateCaseRequest'
      responses:
        '201':
          description: The case was created, with its photos in attachment order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesCase'
        '400':
          description: >-
            The request body was missing or malformed, or a documented bound was
            violated (cases.invalid_request_body, cases.patient_name_required,
            cases.patient_name_too_long, cases.patient_ref_too_long,
            cases.photo_object_id_required, cases.photo_object_id_too_long,
            cases.duplicate_photo_object, cases.too_many_photos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '401':
          description: >-
            The request could not be attributed to a user
            (cases.subject_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '409':
          description: >-
            A named photo object is already attached to another case of the same
            tenant (cases.photo_already_attached).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '500':
          description: An unexpected server failure (cases.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
    get:
      operationId: cases_listCases
      tags:
        - cases
      summary: List every case of the caller's tenant.
      description: >-
        Lists every case of the caller's tenant, newest first -- the
        clinic-scoped list: everyone who treats a patient together in one
        practice sees the same cases, and only the tenant boundary hides a case
        (proven by the cross-tenant refusal tests, never by the creator column).
        Each entry carries its photos in attachment order (an empty list for a
        case whose photos arrive later). The list needs no creator attribution
        at all: any authenticated member of the tenant may read it, and the
        creator a create request is attributed with is recorded on the case row,
        never used to hide or filter the clinic's list.
      responses:
        '200':
          description: The caller's tenant's cases, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesListResponse'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '500':
          description: An unexpected server failure (cases.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
  /api/v1/cases/photos/upload:
    servers: []
    post:
      operationId: cases_uploadPhoto
      tags:
        - cases
      summary: Upload one patient photo to the caller's tenant.
      description: >-
        Uploads one patient photo as a go/storage object of the caller's tenant
        and returns its object id -- the value a case create's photo_object_ids
        list then references. The operation is this surface's one-shot form of
        go/storage's three-step upload protocol: the handler runs
        create/upload/complete itself, computing the declared size and checksum
        from the decoded bytes (so no declared-vs-arrived mismatch is possible)
        and letting storage's own probe of the stored bytes decide the media
        type and refuse what is not an acceptable image. The bytes travel
        base64-encoded in JSON because this surface's frontend transport (the
        generated operations over @speed/api-client) is JSON-only; the upload
        page decodes nothing -- the browser file's bytes are base64-encoded
        once, client-side. An uploaded photo is NOT yet attached to any case:
        attachment happens when a case create names the object id, and the
        one-tenant-one-case-per-photo rule (cases.photo_already_attached) then
        applies like it does to any other object id. A photo never attached to a
        case is reclaimed by go/storage's own expiry sweep like any other
        object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasesUploadPhotoRequest'
      responses:
        '201':
          description: >-
            The photo was uploaded and completed; the answer names its object
            id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesUploadPhotoResponse'
        '400':
          description: >-
            The request body was missing or malformed, or a documented bound was
            violated (cases.invalid_request_body, cases.photo_content_required,
            cases.photo_content_invalid, cases.photo_content_too_large,
            cases.photo_rejected).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '500':
          description: An unexpected server failure (cases.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
  /api/v1/cases/{caseId}/photos/{photoObjectID}/content:
    servers: []
    get:
      operationId: cases_getPhotoContent
      tags:
        - cases
      summary: Read one photo of one case of the caller's tenant.
      description: >-
        Reads one photo of one case of the caller's tenant -- the bytes of the
        go/storage object a case photo references, base64-encoded in JSON with
        the media type storage's probe assigned at complete time, so the case
        view can render it (a blob URL built from the decoded bytes). The photo
        is addressed by its object id -- the value the case detail's photos
        entries carry -- never by a position the client would have to guess. An
        unknown case id, and a case of another tenant, both answer
        cases.not_found; a photo object id the case does not carry -- or whose
        object no longer exists in storage -- answers cases.photo_not_found;
        both refusals are deliberately indistinguishable from the same answer an
        unrelated request would get, so a caller can never probe another
        tenant's attachments.
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
          description: The case's application-generated id.
        - name: photoObjectID
          in: path
          required: true
          schema:
            type: string
          description: >-
            The photo's go/storage object id, as the case detail's photos
            entries carry it.
      responses:
        '200':
          description: The photo's bytes, with the media type storage's probe assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesPhotoContent'
        '400':
          description: >-
            The photo's bytes exceed the bound the surface can serve in one
            answer (cases.photo_content_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '404':
          description: >-
            No such case under the caller's tenant (cases.not_found), or no such
            photo on that case (cases.photo_not_found) -- the same answer for
            another tenant's case or photo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '500':
          description: An unexpected server failure (cases.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
  /api/v1/cases/{caseId}:
    servers: []
    get:
      operationId: cases_getCase
      tags:
        - cases
      summary: Read one case of the caller's tenant.
      description: >-
        Reads one case of the caller's tenant with its photos in attachment
        order. An unknown case id, and a case of another tenant, both answer
        cases.not_found -- never a cross-tenant confirmation of a case's
        existence.
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
          description: The case's application-generated id.
      responses:
        '200':
          description: The case, with its photos in attachment order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesCase'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '404':
          description: >-
            No such case under the caller's tenant (cases.not_found -- the same
            answer for another tenant's case id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '500':
          description: An unexpected server failure (cases.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
  /api/v1/smile-simulation/simulate:
    servers: []
    post:
      operationId: smilesim_simulate
      tags:
        - smilesim
      summary: Enqueue one smile-simulation job for a completed photo.
      description: >-
        The photo must be an existing, completed go/storage object of the
        caller's own tenant; the job itself is async -- the 202 answer carries
        only its job id, and the job-status route below is how its outcome is
        observed. Options are optional: an absent options object (or an absent
        field inside it) inherits the service's documented default for that
        dimension, while an explicitly present out-of-vocabulary or out-of-range
        value is refused with its coded smilesim.* 400 before anything is
        reserved or enqueued. A recipient_user_id, when given, receives a
        completion notification once the job reaches a terminal status. There is
        deliberately no tenant_id field anywhere on this request: the tenant is
        the one tenancy.Middleware already resolved into the request context
        (root CLAUDE.md's multi-tenant isolation rule).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmilesimSimulateRequest'
      responses:
        '202':
          description: >-
            The simulation job was enqueued; poll the job-status route for its
            outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimJobRef'
        '400':
          description: >-
            The request body was missing or malformed, photo_object_id was
            absent, or an explicitly present option was out of vocabulary or out
            of range (smilesim.unsupported_smile_style,
            smilesim.unsupported_tooth_shade, smilesim.strength_out_of_range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '401':
          description: The access token was missing or invalid (authn.token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '409':
          description: >-
            The credit reservation was refused: the tenant's balance cannot
            cover one simulation's cost (billing's coded 409).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '500':
          description: An unexpected server failure (smilesim.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
  /api/v1/smile-simulation/jobs/{jobID}:
    servers: []
    get:
      operationId: smilesim_getJob
      tags:
        - smilesim
      summary: Poll one smile-simulation job's live status.
      description: >-
        Answers the same jobs.Queue this app shares with go/ai-gateway: the
        status is the job's live status, an unknown or another tenant's job id
        answers 404 exactly like an unknown one. Once the job has succeeded, the
        answer carries the generated image's go/storage object id and the real
        vendor usage the job recorded; when a durable per-photo record exists
        for the job, it also echoes the effective options the simulation was
        generated with.
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
          description: The job id the simulate route's 202 answer carried.
      responses:
        '200':
          description: The job's live status, plus outcome fields once it is terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimJobStatus'
        '401':
          description: The access token was missing or invalid (authn.token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '404':
          description: >-
            No such job under the caller's tenant, or the job belongs to another
            tenant (jobs.job_not_found -- the same answer either way).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '500':
          description: An unexpected server failure (smilesim.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
  /api/v1/smile-simulation/photos/{photoObjectID}/simulations:
    servers: []
    get:
      operationId: smilesim_listPhotoSimulations
      tags:
        - smilesim
      summary: List every simulation generated from one photo.
      description: >-
        Lists every simulation generated from the photo under the caller's
        tenant, newest first -- the P3 gallery's data source for one case photo.
        Each entry carries the effective options it was generated with, its live
        status and, once the job succeeded, its output object id. An unknown
        photo id is an empty list, not an error: this route reads the durable
        per-photo result index, which simply holds no rows for a photo nothing
        was generated from.
      parameters:
        - name: photoObjectID
          in: path
          required: true
          schema:
            type: string
          description: >-
            The go/storage object id of the photo the simulations were generated
            from.
      responses:
        '200':
          description: The photo's simulations, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimPhotoSimulations'
        '401':
          description: The access token was missing or invalid (authn.token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '500':
          description: An unexpected server failure (smilesim.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
  /api/v1/smile-simulation/photos/{photoObjectID}/simulations/{jobID}/content:
    servers: []
    get:
      operationId: smilesim_getSimulationContent
      tags:
        - smilesim
      summary: Read one simulation's generated image content.
      description: >-
        Serves the stored bytes of the image one simulation job generated,
        base64-encoded in JSON with the media type go/storage's probe assigned
        -- the same JSON-only transport the cases surface's photo-content route
        uses, so the comparison view can render the result beside the original
        photo. The simulation is addressed the way the per-photo enumeration
        lists it: by its generation job's id under the photo it was generated
        from. The job-status route stays the poll for the outcome; this route is
        the read of the bytes once the job has succeeded. A job the photo has no
        record of under the caller's tenant answers 404
        (smilesim.simulation_not_found), a job that has not succeeded answers
        404 (smilesim.output_not_ready), and a succeeded simulation whose stored
        bytes no longer exist answers 404 (smilesim.output_not_found) -- each
        refusal the same outward shape, never probing whether another tenant's
        object still exists.
      parameters:
        - name: photoObjectID
          in: path
          required: true
          schema:
            type: string
          description: >-
            The go/storage object id of the photo the simulation was generated
            from.
        - name: jobID
          in: path
          required: true
          schema:
            type: string
          description: The generation job's id, as the per-photo enumeration lists it.
      responses:
        '200':
          description: >-
            The generated image's stored bytes, base64-encoded with the
            probe-assigned media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimSimulationContent'
        '401':
          description: The access token was missing or invalid (authn.token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '404':
          description: >-
            The photo has no such simulation under the caller's tenant
            (smilesim.simulation_not_found), the job has not succeeded yet
            (smilesim.output_not_ready), or the stored bytes of a succeeded
            simulation no longer exist (smilesim.output_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '500':
          description: An unexpected server failure (smilesim.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
components:
  schemas:
    NotesCreateNoteRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The note's placeholder content.
    NotesNote:
      type: object
      properties:
        id:
          type: string
          description: Application-generated UUID.
        text:
          type: string
        created_at:
          type: string
          format: date-time
    NotesListNotesResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NotesNote'
    NotesError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code through its
        own i18n catalog, populated from this module's Locales() resources for
        the codes documented in its error index.
      properties:
        code:
          type: string
          example: notes.text_required
        params:
          type: object
          additionalProperties: true
    CasesCreateCaseRequest:
      type: object
      required:
        - patient_name
      properties:
        patient_name:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            The patient's display name as the clinic entered it at intake.
            Required, length-bounded in the application (SQLite does not enforce
            a VARCHAR length limit, so the check lives in the service).
        patient_ref:
          type: string
          maxLength: 64
          description: >-
            The optional clinic-given identifier for the patient (a chart
            number, an internal reference). An absent or empty value means the
            clinic gave none.
        photo_object_ids:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
          description: >-
            The case's initial photos, in attachment order: references to
            already-uploaded go/storage objects of the caller's tenant. Optional
            -- an absent or empty list creates a case with no photos yet. Each
            entry must be a non-empty object id, unique within the list and not
            already attached to another case of the same tenant.
      description: The create route's request body.
    CasesPhoto:
      type: object
      required:
        - object_id
      properties:
        object_id:
          type: string
          description: >-
            The referenced go/storage photo object's id -- the value that feeds
            the smile-simulation surface's per-photo enumeration.
      description: One photo of a case, as a case read answers it.
    CasesCase:
      type: object
      required:
        - id
        - patient_name
        - patient_ref
        - creator_user_id
        - created_at
        - photos
      properties:
        id:
          type: string
          description: The case's application-generated id.
        patient_name:
          type: string
          description: The patient's display name as the clinic entered it.
        patient_ref:
          type: string
          description: >-
            The clinic-given patient reference; empty means the clinic gave
            none.
        creator_user_id:
          type: string
          description: >-
            The user id of the staff member who created the case, as the host's
            SubjectResolver seam attributed the create request. Recorded on the
            row for the case's history; the clinic's case list is NOT filtered
            by it (every member of the tenant sees every case of the tenant).
        created_at:
          type: string
          format: date-time
          description: When the case was created, whole seconds, UTC.
        photos:
          type: array
          items:
            $ref: '#/components/schemas/CasesPhoto'
          description: >-
            The case's photos in attachment order. Always present -- an empty
            list for a case whose photos arrive later.
      description: >-
        A case as the create answer, the list entries and the detail answer all
        render it -- one shape a P3 view renders with one component.
    CasesListResponse:
      type: object
      required:
        - cases
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CasesCase'
          description: The caller's tenant's cases, newest first.
      description: The list route's 200 answer.
    CasesUploadPhotoRequest:
      type: object
      required:
        - content_base64
      properties:
        content_base64:
          type: string
          minLength: 1
          description: >-
            The photo's bytes, base64-encoded (standard alphabet with padding,
            as the browser's FileReader data URL carries them). The decoded
            bytes must be non-empty and at most the surface's upload bound;
            storage's own probe of the stored bytes decides whether they are an
            acceptable image.
      description: The photo-upload route's request body.
    CasesUploadPhotoResponse:
      type: object
      required:
        - object_id
      properties:
        object_id:
          type: string
          description: >-
            The completed go/storage photo object's id -- the value a case
            create's photo_object_ids list references to attach the photo to a
            case.
      description: The photo-upload route's 201 answer.
    CasesPhotoContent:
      type: object
      required:
        - media_type
        - content_base64
      properties:
        media_type:
          type: string
          description: >-
            The media type storage's probe assigned to the bytes at complete
            time (the sanitized form), e.g. image/jpeg.
        content_base64:
          type: string
          description: >-
            The photo's stored bytes, base64-encoded -- the value a case view
            decodes into a blob URL it renders.
      description: The photo-content route's 200 answer.
    CasesError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code through its
        own i18n catalog.
      properties:
        code:
          type: string
          example: cases.patient_name_required
        params:
          type: object
          additionalProperties: true
    SmilesimSimulateRequest:
      type: object
      required:
        - photo_object_id
      properties:
        photo_object_id:
          type: string
          minLength: 1
          description: The completed go/storage object id of the patient photo to simulate.
        recipient_user_id:
          type: string
          description: >-
            The user id of the recipient to notify once the job reaches a
            terminal status. Omitted (or empty) enqueues the job with no
            notification.
        options:
          $ref: '#/components/schemas/SmilesimSimulationOptions'
      description: >-
        The simulate route's request body. Every options field is a
        pointer-shaped optional: an omitted field inherits the service's
        documented default, while an explicitly present field -- including an
        out-of-range strength of 0 -- is passed through verbatim and refused by
        the service's own validation rather than silently replaced by a default.
    SmilesimSimulationOptions:
      type: object
      properties:
        smile_style:
          type: string
          enum:
            - subtle
            - natural
            - bright
          description: >-
            The character of the simulated smile. Defaults to natural when
            omitted.
        tooth_shade:
          type: string
          enum:
            - natural
            - white
            - ultra-white
          description: >-
            The tooth color the simulated smile is asked to show. Defaults to
            natural when omitted.
        strength:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          description: >-
            How strongly the transformation moves the photo toward the requested
            smile: the lower bound is exclusive (0 is a billed no-op and is
            refused) and 1 is the complete simulated smile. Defaults to full
            strength when omitted.
      description: >-
        One simulation's parameterized option set, shared by the simulate
        route's request body and by every response that echoes the effective
        options a simulation was generated with.
    SmilesimJobRef:
      type: object
      required:
        - job_id
      properties:
        job_id:
          type: string
          description: >-
            The enqueued go/jobs job's id -- the value the job-status route's
            {jobID} path parameter takes.
      description: >-
        The simulate route's 202 answer: a reference to the async job, which has
        not run yet.
    SmilesimUsage:
      type: object
      required:
        - image_count
        - steps
        - resolution_tier
      properties:
        image_count:
          type: integer
          description: How many images the vendor generated for the job.
        steps:
          type: integer
          description: The inference step count the vendor reported.
        resolution_tier:
          type: string
          description: >-
            The resolution tier the vendor generated at (its normalized size
            string).
      description: The real vendor usage a succeeded job recorded.
    SmilesimJobStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - running
            - retrying
            - succeeded
            - dead_letter
            - cancelled
          description: The job's live go/jobs status.
        options:
          $ref: '#/components/schemas/SmilesimSimulationOptions'
          description: >-
            The effective options the job was generated with, present when a
            durable per-photo record exists for it.
        output_object_id:
          type: string
          description: >-
            The generated image's go/storage object id, present once the job has
            succeeded.
        usage:
          $ref: '#/components/schemas/SmilesimUsage'
          description: >-
            The real vendor usage the job recorded, present once it has
            succeeded.
        error:
          type: string
          description: >-
            The job's recorded failure message, present when the job carries one
            (dead-lettered, cancelled after a failed attempt, or retrying).
      description: The job-status route's 200 answer for one job.
    SmilesimSimulation:
      type: object
      required:
        - job_id
        - photo_object_id
        - options
        - status
        - created_at
      properties:
        job_id:
          type: string
          description: The generation job's id.
        photo_object_id:
          type: string
          description: >-
            The go/storage object id of the photo the simulation was generated
            from -- the enumeration's grouping key, echoed per entry for a
            caller rendering a row on its own.
        options:
          $ref: '#/components/schemas/SmilesimSimulationOptions'
          description: The effective option set that produced this simulation.
        status:
          type: string
          enum:
            - pending
            - running
            - retrying
            - succeeded
            - dead_letter
            - cancelled
          description: >-
            The job's live status, read from the queue at call time -- never a
            snapshot stored by the service, so an enumeration always reflects
            what a job-status poll would answer right now.
        created_at:
          type: string
          format: date-time
          description: When the generation was requested, whole seconds, UTC.
        output_object_id:
          type: string
          description: >-
            The generated image's go/storage object id, present only when the
            job has succeeded and its result names one.
        error:
          type: string
          description: >-
            The job's recorded failure message, present only when the job
            carries one.
      description: One simulation in the per-photo enumeration.
    SmilesimPhotoSimulations:
      type: object
      required:
        - simulations
      properties:
        simulations:
          type: array
          items:
            $ref: '#/components/schemas/SmilesimSimulation'
          description: The photo's simulations, newest first.
      description: The per-photo enumeration route's 200 answer.
    SmilesimSimulationContent:
      type: object
      required:
        - media_type
        - content_base64
      properties:
        media_type:
          type: string
          description: >-
            The media type go/storage's probe assigned to the stored bytes at
            complete time.
        content_base64:
          type: string
          description: >-
            The stored bytes, base64-encoded -- the same JSON-carried transport
            the cases surface's photo-content route uses.
      description: The simulation-content read's 200 answer for one generated image.
    SmilesimError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code through its
        own i18n catalog.
      properties:
        code:
          type: string
          example: smilesim.invalid_request_body
        params:
          type: object
          additionalProperties: true
x-tagGroups:
  - name: notes
    tags:
      - notes
  - name: cases
    tags:
      - cases
  - name: smilesim
    tags:
      - smilesim
