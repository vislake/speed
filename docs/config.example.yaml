# config.example.yaml -- a template for the optional config-file source of
# go/pkgcore/config's bootstrap loader. Copy it, replace the placeholder
# values with real ones, and point config.WithConfigFile at the copy.
#
# The loader accepts YAML or JSON; config.example.json beside this file is
# the same example in the other format. It is DERIVED from this file by
# tools/configrefgen, never hand-written, so the pair cannot disagree about
# a key or a value, and the generator's unit test loads both through the
# real loader.
#
# The loader resolves every bootstrap key from four sources, highest priority
# first:
#
#   1. command-line flags        --authn.blind_index_key=...
#   2. environment variables     SPEED_AUTHN__BLIND_INDEX_KEY=...
#   3. this config file          authn.blind_index_key: ...
#   4. the defaults the host already set on its target struct
#
# A declared key material's field -- typed []byte and tagged "derive" on the
# host's loader target -- gains a fifth source between the file and the
# default: the root-key derivation (see the note below). An explicit value
# must be exactly 64 hex characters; quote it here so the YAML parser keeps
# it text, since an unquoted all-digit value is read as a number.
#
# An absent file is skipped silently (it is a local-development convenience,
# never a requirement); a file that exists but cannot be parsed is a hard
# error. Keys in any source that map onto no target-struct field are ignored,
# and matching is case-insensitive in every source.
#
# The env spelling of a key replaces each "." level of nesting with a double
# underscore and prefixes SPEED_: the key "authn.blind_index_key" is read
# from SPEED_AUTHN__BLIND_INDEX_KEY. A single underscore is never a nesting
# marker: SPEED_AUTHN_BLIND_INDEX_KEY does not resolve to
# authn.blind_index_key. Field names map to keys lowercased and dotted, so
# the target struct field Authn.Blind_Index_Key is the key
# "authn.blind_index_key".
#
# The key set below is the platform key surface: the process-start key
# material the platform modules declare on the registry's bootstrap seat and
# a host must feed. A real deployment injects each key from a secret store,
# or derives it from one 32-byte root key through the platform composition:
# pkgcore.BootstrapKeyPurpose fixes one purpose string per declared key
# path, and dbkit.DeriveBootstrapKey turns the root key plus that purpose
# into the key's material -- the function a host installs with the loader's
# WithKeyDerivation, naming its root-key source with WithRootKey or
# WithRootKeyEnv. docs/config-reference.md's bootstrap section states each
# key's contract, purpose string and unset fallback.
#
# IMPORTANT: this file is a template to copy, not a file any process in this
# repository reads: nothing here points WithConfigFile at it (an absent
# file is skipped silently, which is how every boot in this repository runs).
# The mechanism it demonstrates is real and exercised all the same:
# tools/configrefgen's config_example.go carries the struct this exact file
# loads against, and its unit test loads this file through the real loader, so
# the format demonstrated here is load-verified, never aspirational.

# --- Platform keys ---------------------------------------------------------
# The exact key set the platform modules declare, grouped by declaring
# module. REPLACE_WITH_64_HEX_CHARS stands in for a hex-encoded 32-byte key
# (`openssl rand -hex 32`); never commit real material -- a real deployment
# injects each key from a secret store, or derives it from one 32-byte root
# key through the platform composition described above.

authn:
  # HMAC key authn indexes its users.email_index and phone_index
  # blind-index columns with; it must stay identical across restarts, or
  # every already-stored index becomes unfindable.
  #   env:  SPEED_AUTHN__BLIND_INDEX_KEY=...
  #   flag: --authn.blind_index_key=...
  # A real deployment injects this key from a secret store, or derives it
  # from one 32-byte root key; see docs/config-reference.md.
  blind_index_key: REPLACE_WITH_64_HEX_CHARS

  # AES key sealing authn's encrypted PII columns (email, phone, TOTP
  # secrets), deliberately separate from every other module's key material
  # and from the blind-index key above.
  #   env:  SPEED_AUTHN__PII_CIPHER_KEY=...
  #   flag: --authn.pii_cipher_key=...
  # A real deployment injects this key from a secret store, or derives it
  # from one 32-byte root key; see docs/config-reference.md.
  pii_cipher_key: REPLACE_WITH_64_HEX_CHARS

config:
  # The AES cipher key the config module seals every Sensitive
  # dynamic-configuration value with; the key that encrypts the configs
  # table cannot live in the table, so it comes from the host's process-start
  # input.
  #   env:  SPEED_CONFIG__CIPHER_KEY=...
  #   flag: --config.cipher_key=...
  # A real deployment injects this key from a secret store, or derives it
  # from one 32-byte root key; see docs/config-reference.md.
  cipher_key: REPLACE_WITH_64_HEX_CHARS

notification:
  # HMAC key the notification module's blind indexers index its encrypted
  # contact addresses with; one key serves the email and phone indexers,
  # whose canonical forms are disjoint.
  #   env:  SPEED_NOTIFICATION__CONTACT_INDEX_KEY=...
  #   flag: --notification.contact_index_key=...
  # A real deployment injects this key from a secret store, or derives it
  # from one 32-byte root key; see docs/config-reference.md.
  contact_index_key: REPLACE_WITH_64_HEX_CHARS

org:
  # HMAC key org's blind indexer indexes invitation email addresses with;
  # separate from every cipher key, because an AES key never doubles as an
  # HMAC key.
  #   env:  SPEED_ORG__INVITATION_EMAIL_INDEX_KEY=...
  #   flag: --org.invitation_email_index_key=...
  # A real deployment injects this key from a secret store, or derives it
  # from one 32-byte root key; see docs/config-reference.md.
  invitation_email_index_key: REPLACE_WITH_64_HEX_CHARS

pki:
  # AES key sealing go/pki's LocalSigner private-key column, the key authn's
  # access tokens are ultimately signed with.
  #   env:  SPEED_PKI__LOCAL_KEY_CIPHER_KEY=...
  #   flag: --pki.local_key_cipher_key=...
  # A real deployment injects this key from a secret store, or derives it
  # from one 32-byte root key; see docs/config-reference.md.
  local_key_cipher_key: REPLACE_WITH_64_HEX_CHARS
