# gitleaks configuration for the speed monorepo.
#
# The default rule set is extended (no rule is disabled or added): this
# file exists only to carry the allowlists the tree genuinely needs.
# Findings in the go/observability redaction tests are planted fixtures,
# not leaks: the observability module's redaction layer is tested by
# logging deliberately secret-shaped stand-in values and asserting they
# never reach a sink in plaintext (see the file-header comment in
# go/observability/redact_test.go -- "testSecret and friends are stand-in
# secret values the tests below log and then assert never reach the sink
# in plaintext"). Those literals are the point of the code, so the three
# files are exempted by path -- the allowlists block below lists them.
#
# Every exemption below is scoped to exact, named files -- the two
# exceptions being the regex-scoped blocks (the saasctl appconfig
# identifier spellings and the pki wiring-test fixture key), each
# matching an exact literal rather than a file -- and the scan keeps
# firing on every other file in the tree and in the commit history (the
# security pipeline's secrets job checks out the full history -- see
# .github/workflows/security.yml). Real credentials must never enter
# these files either -- code review and the files' own fixture-only
# comments guard that, and the repository holds no real credentials
# anywhere (see the SECRETS note in .github/workflows/security.yml). Any
# further allowlist need must arrive with its own justification in this
# comment, naming the exact files it covers and why each one's match is
# not a real credential.
#
# Later rounds added their own synthetic, secret-shaped fixtures as new
# modules landed encrypted-field, blind-index, cipher and payment-gateway
# tests -- the same pattern as the observability block above, just for
# different modules -- plus the user-facing documentation and example
# files whose whole purpose is showing a placeholder in a shape gitleaks'
# default `generic-api-key`/`curl-auth-header` rules key on. Each group
# below was re-verified against gitleaks 8.30.1 (the pinned version
# .github/workflows/security.yml downloads and checksum-verifies) run
# against the real, current tree and full commit history before being
# added, per that section's own file-by-file reasoning.
#
# One later exemption is scoped by regex rather than by path, because its
# false positive is a different class from the fixture and placeholder
# groups above: identifier references, not planted values. go/saasctl's
# appconfig twin (go/saasctl/internal/appconfig/appconfig.go) names the
# S3 secret key of a generated project's bootstrap surface -- the
# S3SecretKeyEnv environment-variable-name constant (APP_S3_SECRET_KEY),
# the Config.S3SecretKey field and its Config.S3SecretKeyFromEnv
# provenance flag -- while the key's value is the APP_S3_SECRET_KEY
# environment variable a host injects at runtime, never a literal in the
# file. gitleaks' default generic-api-key rule matched the Go expression
# `cfg.S3SecretKey, cfg.S3SecretKeyFromEnv` (introduced by commit
# 6c20870, where it then stood at line 311) because the rule's span
# tolerates the identifier's dots and the separating comma, and the
# identifier alone clears the rule's entropy floor. The block below
# allowlists the two exact identifier spellings the rule can
# capture; scoping to those spellings rather than to the file keeps the
# rule firing on genuine secret-shaped values everywhere else, this file
# included, and was re-verified against the same pinned gitleaks 8.30.1
# over the full history.
#
# A second regex-scoped exemption covers a planted fixture value rather
# than identifier references: go/pki/unittest/settings_wiring_test.go's
# wiringTestCipherKey is the fixed 32-hex key its suite registers the
# pki_local_key_enc GORM serializer under -- the same fixed literal
# pki's in-package tests use -- so the suite can create authorities
# whose generated private keys are stored through that serializer in its
# own throwaway database. The literal is a sequential hex run
# ("0123456789abcdef" twice), never random key material. Scoping to the
# exact value rather than to the file keeps generic-api-key firing on
# every other secret-shaped value in that file and in every other file,
# the same posture the saasctl block above records.

title = "speed gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "redaction-test fixtures: secret-shaped stand-in values planted on purpose by the go/observability redaction tests"
paths = [
  "go/observability/redact_test.go",
  "go/observability/middleware_test.go",
  "go/observability/example_test.go",
]

[[allowlists]]
description = "encrypted-field / blind-index / payment-webhook test fixture keys: fixed, hard-coded 32-byte hex strings (and one hard-coded Stripe-shaped webhook secret) that each file's own doc comment names as a fixture -- registering a GORM field-encryption or blind-index serializer under a known key so the test can assert round-trip behaviour without touching a real key store, mirroring go/dbkit's own encryption_test.go precedent. go/ai-gateway/model_test.go's testCipherKey and go/pki/repository_test.go's testLocalKeyCipherKey are both the fixed literal \"0123456789abcdef0123456789abcdef\", explicitly documented as mirroring one another; examples/reference-app/internal/attestation/service_test.go's testPKICipherKey carries the same fixed literal again -- the file's own comment says it mirrors go/pki's own test registration, registering once per test process so that suite can exercise pki's serializers from a binary that cannot bootstrap the module; go/notification/contact_test.go's testCipherKey/testEmailIndexKey/testPhoneIndexKey trio (and its byte-for-byte integration-tier twin in go/notification/integration_test/postgres_leg_test.go, which the twin's own header comment says exists only so that external test binary stands alone) are three deliberately distinct fixture keys proving an index key never doubles as the encryption key; go/billing/gateway/stripe/gateway_test.go's testWebhookSecret is fed only to a fakeBackend that never dials a real network connection, so it is never verified against Stripe's real webhook-signing logic"
paths = [
  "go/ai-gateway/model_test.go",
  "go/billing/gateway/stripe/gateway_test.go",
  "go/pki/repository_test.go",
  "go/notification/contact_test.go",
  "go/notification/integration_test/postgres_leg_test.go",
  "examples/reference-app/internal/attestation/service_test.go",
]

[[allowlists]]
description = "go/pki/unittest/settings_wiring_test.go: the wiring suite's wiringTestCipherKey is the fixed 32-hex fixture key under which the suite registers the pki_local_key_enc GORM serializer, so its end-to-end configuration cases can create authorities whose generated private keys are stored through that serializer in the suite's own throwaway SQLite database -- the same fixed literal pki's in-package tests use (go/pki/repository_test.go's testLocalKeyCipherKey). The literal is a sequential hex run (0123456789abcdef twice), never random key material and never a credential to anything; the allowlist is scoped to this exact value rather than to the file, so generic-api-key keeps firing on every other secret-shaped value in this file and in every other file"
regexes = [
  '''0123456789abcdef0123456789abcdef''',
]

[[allowlists]]
description = "saasctl config-loading test fixture keys: go/saasctl/internal/appconfig/appconfig_test.go's configKeyHex/orgIndexKeyHex and go/saasctl/internal/config/print_test.go's copies of the same values are deliberately patterned, non-random hex literals (a strictly ascending run \"000102...1e1f\" and a strictly descending run \"ffe0f1...ddee\") used only to prove that appconfig.Load parses APP_CONFIG__CIPHER_KEY/APP_ORG__INVITATION_EMAIL_INDEX_KEY from the environment and that saasctl config print never renders their bytes -- print_test.go's own TestPrintNeverRendersTheKeyBytes asserts the opposite property gitleaks is checking for, that these values are exactly what must never reach real output"
paths = [
  "go/saasctl/internal/appconfig/appconfig_test.go",
  "go/saasctl/internal/config/print_test.go",
]

[[allowlists]]
description = "examples/reference-app/.env.example: a template file whose entire purpose is showing the shape of a real environment variable without a real value -- every flagged line is the literal placeholder string REPLACE_WITH_64_HEX_CHARS on a key variable: APP_ROOT_KEY in the file as it stands (the six key-material variables below it are empty assignments, resolved from it by derivation when it is set), and the key variables' earlier flat spellings in the commits the full-history scan still visits (SPEED_CONFIG_KEY/SPEED_ORG_INDEX_KEY/SPEED_NOTIFICATION_INDEX_KEY before the APP_ prefix, then APP_CONFIG_KEY/APP_ORG_INDEX_KEY/APP_NOTIFICATION_INDEX_KEY) -- and the file's own header comment already tells a reader to generate a real key with `openssl rand -hex 32` rather than use what is checked in here"
paths = [
  "examples/reference-app/.env.example",
]

[[allowlists]]
description = "the reference-app walkthrough's anonymous-request refusal sample: examples/reference-app/README.md and its docs-site twins (content.en and content.zh-cn walkthrough-reference-app.md) each authenticate one example request with the literal placeholder `Authorization: Bearer not-a-real-token`, a string chosen specifically to read as fake rather than as a redacted real token; the curl-auth-header rule fires on any Bearer header, so no placeholder spelling can avoid it"
paths = [
  "examples/reference-app/README.md",
  "docs/site/content.en/docs/user-guide/walkthrough-reference-app.md",
  "docs/site/content.zh-cn/docs/user-guide/walkthrough-reference-app.md",
]

[[allowlists]]
description = "go/pki/AGENTS.md: the flagged line is documentation prose describing the envelope-mode key-handling mechanism (\"...generates a real ed25519 key pair in-process, PKCS8-marshals the private half, and immediately wraps it with the external service's own encrypt operation...\") -- there is no literal secret value anywhere on the line, and gitleaks' generic-api-key rule is matching the prose's own high-entropy-looking run of words describing PKCS8 marshalling, not a credential"
paths = [
  "go/pki/AGENTS.md",
]

[[allowlists]]
description = "saasctl appconfig S3-secret-key identifier references: go/saasctl/internal/appconfig/appconfig.go names the S3 secret key of a generated project's bootstrap surface by identifier only -- the S3SecretKeyEnv environment-variable-name constant (APP_S3_SECRET_KEY), the Config.S3SecretKey field and its Config.S3SecretKeyFromEnv provenance flag -- while the key's value is the APP_S3_SECRET_KEY environment variable a host injects at runtime, never a literal in the file. The default generic-api-key rule flagged the Go expression `cfg.S3SecretKey, cfg.S3SecretKeyFromEnv` (introduced by commit 6c20870, line 311 then) because the rule's span tolerates the identifier's dots and the separating comma, and the identifier alone clears the rule's entropy floor; the match is an identifier reference, not a credential. Scoping the allowlist to the two exact identifier spellings rather than to the file keeps generic-api-key firing on genuine secret-shaped values everywhere else -- including any future literal value written into this same file"
regexes = [
  '''cfg\.S3SecretKey(?:FromEnv)?''',
]

[[allowlists]]
description = "reference-app e2e self-registration password (historical): the literal 'e2e-invite-population-2026' is the password e2e/add-a-colleague.spec.ts's self-registration gate submits when it signs a NEW practice up -- a value the suite's own self-registration test creates for an account that exists nowhere else, submitted to an endpoint that accepts any new account the policy permits, never a credential to anything pre-existing. It entered the tree in commit 00bc02ff and now lives in that commit's history, which the daily secret-leakage scan covers, so it cannot be retired by editing the current tree alone; the current tree carries the lower-entropy 'e2e-invite-pass-2026' instead, and the allowlist is scoped by path so generic-api-key keeps firing on genuine secret-shaped values anywhere else"
paths = [
  "examples/reference-app/web/e2e/add-a-colleague.spec.ts",
]

[[allowlists]]
description = "go/billing/gateway/stripe integration-tier webhook-verification fixture: stripe_mock_leg_test.go's testWebhookSecret (whsec_test_secret_0123456789, introduced by commit a286dbec) is the signing secret of the real-HTTP webhook-delivery leg in webhook_delivery_test.go, which signs a genuinely delivered payload with it through the stripe-go SDK's own webhook test helper and verifies the receiving path through Gateway.VerifyWebhook's stripe-go webhook-signature verification -- the integration-tier twin of the identical whsec_-prefixed fixture in the already-allowlisted unit tier (gateway_test.go). The whsec_ prefix is the shape Stripe webhook signing secrets carry and the shape the stripe-go SDK's own webhook fixtures use, so a fixture of that shape is what exercises the verification path the way production receives it; the value itself is an obviously fake test literal that signs and verifies only inside the test's own delivery and corresponds to no real account or endpoint anywhere -- a fixture, never a credential to anything. Scoped by path so generic-api-key keeps firing on genuine secret-shaped values in every other file and in the rest of the commit history"
paths = [
  "go/billing/gateway/stripe/integration_test/stripe_mock_leg_test.go",
]

[[allowlists]]
description = "the committed docs/config.example.yaml / docs/config.example.json pair and tools/configrefgen/config_example.go's placeholder constant: the pair is the committed config-file template whose whole purpose is showing the platform key surface's shape with the literal placeholder REPLACE_WITH_64_HEX_CHARS in every key slot -- never a real value, and the file's own header tells a reader to generate one with `openssl rand -hex 32` and keep it out of the repository; the pair lived at the repository root before the move into docs/ (commit 80650828), and the full-history scan reports those earlier commits' placeholder lines under the root spellings config.example.json / config.example.yaml, so the two root spellings are listed below alongside the current paths; config_example.go's configExampleKeyPlaceholder defines that same literal as the constant the load-verification test compares the parsed file against, so it carries no key material either. Mirrors the examples/reference-app/.env.example block above for the same placeholder; scoped by path so generic-api-key keeps firing on genuine secret-shaped values everywhere else"
paths = [
  "docs/config.example.yaml",
  "docs/config.example.json",
  "config.example.yaml",
  "config.example.json",
  "tools/configrefgen/config_example.go",
]

[[allowlists]]
description = "the generated configuration reference's env face: the repository-root .env.example the configrefgen generator emitted alongside the config.example pair above -- every flagged line is the literal placeholder string REPLACE_WITH_64_HEX_CHARS on a key variable, never a real value; the reference later became declaration-sourced and the generated file left the tree, so the full-history scan meets it only in the commits that carried it. The pattern is anchored to the exact root spelling so the grant covers this one retired file rather than any .env.example that may appear elsewhere -- examples/reference-app/.env.example above stays its own, narrower grant"
paths = [
  '''^\.env\.example$''',
]

[[allowlists]]
description = "tools/test_check_env_example_consistency.py: the env-example consistency checker's own fixture suite. Its fixtures are synthetic bootstrap declarations and .env.example bodies fed to the checker -- the flagged lines are the same literal placeholder REPLACE_WITH_64_HEX_CHARS on a key variable the production example carries, spelled inside the fixtures so the suite proves the checker accepts a matching key set and fires on drift in either direction. The suite asserts key sets, never values: the fixtures' placeholder spelling is what makes them read like the real files, and no key material is present to assert on"
paths = [
  "tools/test_check_env_example_consistency.py",
]

[[allowlists]]
description = "examples/reference-app/flowtests/server_config_equivalence_test.go: the reference app's server-config equivalence suite. Its rootSecret fixture is the fixed 64-hex root key material the suite feeds as APP_ROOT_KEY through both composition paths to prove they derive the same keys -- the value must be valid 64-hex key material (the derivation rejects any other shape), so the fixture's shape is load-bearing rather than decorative, and it only ever feeds the suite's own in-process composition cases, never a real deployment or key store"
paths = [
  "examples/reference-app/flowtests/server_config_equivalence_test.go",
]

[[allowlists]]
description = "docs/site/content.en/docs/user-guide/modules/identity/authn.md: the flagged span is documentation prose listing the sign-in channels the module deliberately does not implement -- the provider names in that list read to the default generic-api-key rule as a high-entropy-looking value next to the word for passkey support. There is no literal secret value anywhere on the line; it is a prose false positive of the same class as go/pki/AGENTS.md above"
paths = [
  "docs/site/content.en/docs/user-guide/modules/identity/authn.md",
]
