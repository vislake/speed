# gitleaks configuration for the speed monorepo.
#
# The default rule set is extended (no rule is disabled or added): this
# file exists only to carry the allowlists the tree genuinely needs.
# Findings in the go/observability redaction tests are planted fixtures,
# not leaks: the observability module's redaction layer is tested by
# logging deliberately secret-shaped stand-in values and asserting they
# never reach a sink in plaintext (see the file-header comment in
# go/observability/redact_test.go -- "testSecret and friends are stand-in
# secret values the tests below log and then assert never reach the sink
# in plaintext"). Those literals are the point of the code, so the three
# files are exempted by path -- the allowlists block at the bottom of
# this file lists them.
#
# Every exemption below is scoped to exact, named files -- the single
# exception being the regex-scoped saasctl appconfig block at the very
# bottom, which matches two exact Go identifier spellings rather than a
# file -- and the scan keeps
# firing on every other file in the tree and in the commit history (the
# security pipeline's secrets job checks out the full history -- see
# .github/workflows/security.yml). Real credentials must never enter
# these files either -- code review and the files' own fixture-only
# comments guard that, and the repository holds no real credentials
# anywhere (see the SECRETS note in .github/workflows/security.yml). Any
# further allowlist need must arrive with its own justification in this
# comment, naming the exact files it covers and why each one's match is
# not a real credential.
#
# Later rounds added their own synthetic, secret-shaped fixtures as new
# modules landed encrypted-field, blind-index, cipher and payment-gateway
# tests -- the same pattern as the observability block above, just for
# different modules -- plus two genuinely user-facing documentation
# files whose whole purpose is showing a placeholder in a shape gitleaks'
# default `generic-api-key`/`curl-auth-header` rules key on. Each group
# below was re-verified against gitleaks 8.30.1 (the pinned version
# .github/workflows/security.yml downloads and checksum-verifies) run
# against the real, current tree and full commit history before being
# added, per that section's own file-by-file reasoning.
#
# One later exemption is scoped by regex rather than by path, because its
# false positive is a different class from the fixture and placeholder
# groups above: identifier references, not planted values. go/saasctl's
# appconfig twin (go/saasctl/internal/appconfig/appconfig.go) names the
# S3 secret key of a generated project's bootstrap surface -- the
# S3SecretKeyEnv environment-variable-name constant (APP_S3_SECRET_KEY),
# the Config.S3SecretKey field and its Config.S3SecretKeyFromEnv
# provenance flag -- while the key's value is the APP_S3_SECRET_KEY
# environment variable a host injects at runtime, never a literal in the
# file. gitleaks' default generic-api-key rule matched the Go expression
# `cfg.S3SecretKey, cfg.S3SecretKeyFromEnv` (introduced by commit
# 6c20870, where it then stood at line 311) because the rule's span
# tolerates the identifier's dots and the separating comma, and the
# identifier alone clears the rule's entropy floor. The block at the
# bottom allowlists the two exact identifier spellings the rule can
# capture; scoping to those spellings rather than to the file keeps the
# rule firing on genuine secret-shaped values everywhere else, this file
# included, and was re-verified against the same pinned gitleaks 8.30.1
# over the full history.

title = "speed gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "redaction-test fixtures: secret-shaped stand-in values planted on purpose by the go/observability redaction tests"
paths = [
  "go/observability/redact_test.go",
  "go/observability/middleware_test.go",
  "go/observability/example_test.go",
]

[[allowlists]]
description = "encrypted-field / blind-index / payment-webhook test fixture keys: fixed, hard-coded 32-byte hex strings (and one hard-coded Stripe-shaped webhook secret) that each file's own doc comment names as a fixture -- registering a GORM field-encryption or blind-index serializer under a known key so the test can assert round-trip behaviour without touching a real key store, mirroring go/dbkit's own encryption_test.go precedent. go/ai-gateway/model_test.go's testCipherKey and go/pki/repository_test.go's testLocalKeyCipherKey are both the fixed literal \"0123456789abcdef0123456789abcdef\", explicitly documented as mirroring one another; go/notification/contact_test.go's testCipherKey/testEmailIndexKey/testPhoneIndexKey trio (and its byte-for-byte integration-tier twin in go/notification/integration_test/postgres_leg_test.go, which the twin's own header comment says exists only so that external test binary stands alone) are three deliberately distinct fixture keys proving an index key never doubles as the encryption key; go/billing/gateway/stripe/gateway_test.go's testWebhookSecret is fed only to a fakeBackend that never dials a real network connection, so it is never verified against Stripe's real webhook-signing logic"
paths = [
  "go/ai-gateway/model_test.go",
  "go/billing/gateway/stripe/gateway_test.go",
  "go/pki/repository_test.go",
  "go/notification/contact_test.go",
  "go/notification/integration_test/postgres_leg_test.go",
]

[[allowlists]]
description = "saasctl config-loading test fixture keys: go/saasctl/internal/appconfig/appconfig_test.go's configKeyHex/orgIndexKeyHex and go/saasctl/internal/config/print_test.go's copies of the same values are deliberately patterned, non-random hex literals (a strictly ascending run \"000102...1e1f\" and a strictly descending run \"ffe0f1...ddee\") used only to prove that appconfig.Load parses APP_CONFIG_KEY/APP_ORG_INDEX_KEY from the environment and that saasctl config print never renders their bytes -- print_test.go's own TestPrintNeverRendersTheKeyBytes asserts the opposite property gitleaks is checking for, that these values are exactly what must never reach real output"
paths = [
  "go/saasctl/internal/appconfig/appconfig_test.go",
  "go/saasctl/internal/config/print_test.go",
]

[[allowlists]]
description = "examples/reference-app/.env.example: a template file whose entire purpose is showing the shape of a real environment variable without a real value -- every flagged line is the literal placeholder string REPLACE_WITH_64_HEX_CHARS (APP_CONFIG_KEY, APP_ORG_INDEX_KEY, APP_NOTIFICATION_INDEX_KEY), and the file's own header comment already tells a reader to generate a real key with `openssl rand -hex 32` rather than use what is checked in here"
paths = [
  "examples/reference-app/.env.example",
]

[[allowlists]]
description = "examples/reference-app/README.md: the \"Try it\" curl walkthrough authenticates one example request with the literal placeholder `Authorization: Bearer not-a-real-token`, a string chosen specifically to read as fake rather than as a redacted real token"
paths = [
  "examples/reference-app/README.md",
]

[[allowlists]]
description = "go/pki/AGENTS.md: the flagged line is documentation prose describing the envelope-mode key-handling mechanism (\"...generates a real ed25519 key pair in-process, PKCS8-marshals the private half, and immediately wraps it with the external service's own encrypt operation...\") -- there is no literal secret value anywhere on the line, and gitleaks' generic-api-key rule is matching the prose's own high-entropy-looking run of words describing PKCS8 marshalling, not a credential"
paths = [
  "go/pki/AGENTS.md",
]

[[allowlists]]
description = "saasctl appconfig S3-secret-key identifier references: go/saasctl/internal/appconfig/appconfig.go names the S3 secret key of a generated project's bootstrap surface by identifier only -- the S3SecretKeyEnv environment-variable-name constant (APP_S3_SECRET_KEY), the Config.S3SecretKey field and its Config.S3SecretKeyFromEnv provenance flag -- while the key's value is the APP_S3_SECRET_KEY environment variable a host injects at runtime, never a literal in the file. The default generic-api-key rule flagged the Go expression `cfg.S3SecretKey, cfg.S3SecretKeyFromEnv` (introduced by commit 6c20870, line 311 then) because the rule's span tolerates the identifier's dots and the separating comma, and the identifier alone clears the rule's entropy floor; the match is an identifier reference, not a credential. Scoping the allowlist to the two exact identifier spellings rather than to the file keeps generic-api-key firing on genuine secret-shaped values everywhere else -- including any future literal value written into this same file"
regexes = [
  '''cfg\.S3SecretKey(?:FromEnv)?''',
]

[[allowlists]]
description = "reference-app e2e self-registration password (historical): the literal 'e2e-invite-population-2026' is the password e2e/add-a-colleague.spec.ts's self-registration gate submits when it signs a NEW practice up -- a value the suite's own self-registration test creates for an account that exists nowhere else, submitted to an endpoint that accepts any new account the policy permits, never a credential to anything pre-existing. It entered the tree in commit 00bc02ff and now lives in that commit's history, which the daily secret-leakage scan covers, so it cannot be retired by editing the current tree alone; the current tree carries the lower-entropy 'e2e-invite-pass-2026' instead, and the allowlist is scoped by path so generic-api-key keeps firing on genuine secret-shaped values anywhere else"
paths = [
  "examples/reference-app/web/e2e/add-a-colleague.spec.ts",
]

[[allowlists]]
description = "go/billing/gateway/stripe integration-tier webhook-verification fixture: stripe_mock_leg_test.go's testWebhookSecret (whsec_test_secret_0123456789, introduced by commit a286dbec) is the signing secret of the real-HTTP webhook-delivery leg in webhook_delivery_test.go, which signs a genuinely delivered payload with it through the stripe-go SDK's own webhook test helper and verifies the receiving path through Gateway.VerifyWebhook's stripe-go webhook-signature verification -- the integration-tier twin of the identical whsec_-prefixed fixture in the already-allowlisted unit tier (gateway_test.go). The whsec_ prefix is the shape Stripe webhook signing secrets carry and the shape the stripe-go SDK's own webhook fixtures use, so a fixture of that shape is what exercises the verification path the way production receives it; the value itself is an obviously fake test literal that signs and verifies only inside the test's own delivery and corresponds to no real account or endpoint anywhere -- a fixture, never a credential to anything. Scoped by path so generic-api-key keeps firing on genuine secret-shaped values in every other file and in the rest of the commit history"
paths = [
  "go/billing/gateway/stripe/integration_test/stripe_mock_leg_test.go",
]
