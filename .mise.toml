# Toolchain versions for local development, pinned by mise (https://mise.jdx.dev).
# `mise install` from the repository root sets up everything `make check` needs.
#
# The `go` version MIRRORS go.work's `go` directive, because the Go toolchain
# reads go.work and never this file. Two files stating one version drift unless
# something checks them, which is what tools/check_toolchain.py does: bump the
# directive and this mirror together.
#
# The remaining tools are pinned here and nowhere else, so they have no mirror
# to drift from and the gate does not check them.

[tools]
# Mirror of go.work's `go` directive.
go = "1.26.8"
# Pinned here only; .golangci.yml carries the configuration, not the version.
golangci-lint = "2.11.4"
# Pinned here only; `make tools-test` needs 3.11 or newer, for tomllib.
python = "3.14.7"
