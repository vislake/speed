# Toolchain versions for local development, pinned by mise (https://mise.jdx.dev).
#
# Some versions here MIRROR an authoritative source elsewhere in the
# repository, because the tool that consumes them reads that source and not
# this file; .mise.toml exists for `mise install` (the Taskfile setup task's
# toolchain leg). Two files that both state a version drift unless something
# checks them, which is why tools/check_toolchain.py fails when a mirror no
# longer equals its source. Bump the authoritative source and this file
# together. Mirrored tools, with their sources:
#   task          the Taskfile.yml header comment -- "task 3.53.1 (the
#                 version verified against this file)" -- the one tool
#                 whose only pin lives there
#   go            go.work's `go` directive
#   node          web/.nvmrc
#   pnpm          web/package.json's packageManager field
# The remaining tools are pinned here and nowhere else, so they have no
# mirror to drift from and the gate does not check them.

[tools]
# Mirror of the Taskfile.yml header's task pin.
task = "3.53.1"
# Mirror of go.work's `go` directive.
go = "1.26.8"
# Mirror of web/.nvmrc.
node = "24"
# Mirror of web/package.json's packageManager (the version after "pnpm@").
pnpm = "11.1.2"
# Pinned here only; .golangci.yml carries the configuration, not the version.
golangci-lint = "2.11.4"
# Pinned here only; the docs site build takes the version from this file.
hugo = "0.165.0"
