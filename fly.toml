# fly.toml app configuration file generated for speed-reference-app on 2026-09-06T03:03:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'speed-reference-app'
primary_region = 'sin'

[build]
  dockerfile = 'examples/reference-app/Dockerfile'

[env]
  PORT = '8080'
  APP_DB_PATH = '/data/reference-app.db'
  APP_DEPLOYMENT_MODE = 'standalone'
  # APP_TRUSTED_PROXIES declares which peers may carry the platform-injected
  # forwarding headers authn reads (go/authn's WithTrustedProxies), so this
  # app's session/login-history records carry the real client address
  # instead of the proxy's own -- the acceptance finding this declaration
  # closes, where every recorded address was the proxy's internal
  # 172.16.45.218. This app's http_service is reachable only through Fly's
  # proxy, which connects to the machine over its private IPv4 address --
  # observed here as 172.16.45.218, inside 172.16.0.0/12, Fly's private
  # IPv4 space -- and, for 6PN (WireGuard) traffic, a Fly-routed fdaa::/16
  # address. Both ranges are unreachable as source addresses from the
  # public internet, which is what makes declaring them safe on this
  # single-machine deployment; Fly's proxy overwrites the Fly-Client-IP
  # header on every request it forwards, so a client can never smuggle a
  # header through it. A deployment that attaches other Fly apps to this
  # app's private network should narrow the declaration to its own subnet.
  APP_TRUSTED_PROXIES = '172.16.0.0/12, fdaa::/16'

[[mounts]]
  source = 'reference_app_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
