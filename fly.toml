# fly.toml app configuration file generated for speed-reference-app on 2026-09-06T03:03:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'speed-reference-app'
primary_region = 'sin'

[build]
  dockerfile = 'examples/reference-app/Dockerfile'

[env]
  PORT = '8080'
  APP_DB_PATH = '/data/reference-app.db'
  APP_DEPLOYMENT_MODE = 'standalone'

[[mounts]]
  source = 'reference_app_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
