version: '3'

# Task definitions for the speed monorepo.
#
# NOTE ON PACKAGE PATTERNS
# The repository root is a Go workspace (go.work) but is not itself a module, so
# relative patterns do not resolve from here:
#   $ go vet ./...
#   pattern ./...: directory prefix . does not contain modules listed in go.work
# Anything that must span every module therefore uses the import-path pattern
# github.com/vislake/speed/go/... instead of ./... .

vars:
  ALL_PKGS: github.com/vislake/speed/go/...

tasks:
  default:
    desc: List the available tasks.
    cmds:
      - task --list
    silent: true

  setup:
    desc: Sync the Go workspace so every module agrees on shared dependency versions.
    cmds:
      - go work sync

  test:
    desc: Run unit tests with the race detector and coverage.
    # go/pkgcore, go/dbkit, go/tenancy, go/observability and go/jobs now have
    # real code and tests; every other module under go/ is still a stub with
    # no test files. This still only runs pkgcore's -- widen to {{.ALL_PKGS}}
    # to pick up dbkit, tenancy, observability and jobs too, and once more
    # modules land. examples/reference-app is a separate module outside go/
    # (its own go.mod), so {{.ALL_PKGS}} would not reach it even after
    # widening; it needs its own `go test ./...` run from
    # examples/reference-app, e.g. a dedicated task once this one is widened.
    cmds:
      - go test ./go/pkgcore/... -race -cover

  lint:
    desc: Vet every module. golangci-lint is the project standard but is not wired in yet.
    cmds:
      - go vet {{.ALL_PKGS}}
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          echo "note: golangci-lint is installed and .golangci.yml is present, but this task"
          echo "      deliberately does not invoke it yet -- the modules are still stubs."
          echo "      Run 'golangci-lint run' manually. See docs/internal/20-quality-and-security.md."
        else
          echo "note: golangci-lint is NOT installed. It is required for full linting per"
          echo "      docs/internal/20-quality-and-security.md, and it is not yet wired"
          echo "      into this Taskfile. Only 'go vet' ran above."
        fi

  dev:
    desc: Not implemented -- this task does not yet wire up a standalone-mode run.
    cmds:
      - |
        echo "dev: not implemented yet."
        echo
        echo "go/pkgcore, go/dbkit, go/tenancy, go/observability and go/jobs have"
        echo "real implementations now, and"
        echo "examples/reference-app/cmd/server is a real, runnable standalone-mode server"
        echo "built on them -- see examples/reference-app/README.md. Run it directly:"
        echo "    cd examples/reference-app && go run ./cmd/server"
        echo
        echo "This task itself does not run that yet: it has no hot reload and no"
        echo "frontend, so it is not the 'backend + frontend in standalone deployment mode with hot"
        echo "reload' target the root CLAUDE.md's Planned Commands describe. Every other"
        echo "module under go/ is still a stub (go.mod + doc.go + AGENTS.md)."
        echo
        echo "See docs/internal/15-roadmap.md for the delivery order."
        exit 1
