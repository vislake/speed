version: '3'

# Task definitions for the speed monorepo.
#
# NOTE ON PACKAGE PATTERNS
# The repository root is a Go workspace (go.work) but is not itself a module, so
# relative patterns do not resolve from here:
#   $ go vet ./...
#   pattern ./...: directory prefix . does not contain modules listed in go.work
# Anything that must span every module therefore uses the import-path pattern
# github.com/vislake/speed/go/... instead of ./... .
#
# The commands planned in docs/internal/19-dev-workflow.md and the root
# CLAUDE.md are either implemented honestly or present as an explicit
# "not implemented yet" stub that exits non-zero; nothing here promises
# behaviour the repository cannot yet deliver. The discipline checkers in
# tools/ are intentionally wired into no task: docs/internal/18-cicd.md's
# discipline table assigns them to CI workflows, and they run directly,
# exactly as tools/README.md documents. Two of the three are wired today:
# tools/scan_cjk.py runs in fast-check's repo-checks job
# (.github/workflows/fast-check.yml) and tools/check_i18n_keys.py runs in
# the docs-check pipeline (.github/workflows/docs-check.yml), which fires
# on doc/i18n-touching PRs; only tools/check_repo_isolation.py is still
# wired into no workflow, so it keeps running directly until its row lands
# in a future round.
#
# NOTE ON RUNNING IN ANOTHER DIRECTORY
# Commands that must run from a module directory rather than the workspace
# root use `cd "..." && ...` inside the command string. The per-command `dir:`
# option of the Taskfile schema is NOT used: task 3.53.1 (the version verified
# against this file) silently ignores it and runs the command from the
# taskfile's own directory -- which, for a pattern like ./..., is exactly the
# go.work-root failure this file's NOTE ON PACKAGE PATTERNS describes. Task-
# level `dir:` works, but these tasks interleave root-level and module-level
# legs, so the shell cd is the honest form.

vars:
  ALL_PKGS: github.com/vislake/speed/go/...
  # examples/reference-app is its own module with its own go.mod. It is listed
  # in go.work but lives outside go/, so patterns over {{.ALL_PKGS}} never
  # reach it: tasks that must exercise it run a dir-scoped command from
  # {{.APP_DIR}} instead.
  APP_DIR: examples/reference-app
  # Modules with a Docker-backed integration tier under integration_test/
  # (go test -tags=integration ./... from the module directory): PostgreSQL via
  # testcontainers for dbkit and tenancy (including tenancy's tenancytest
  # subpackage), Redis via testcontainers for jobs, Redis plus MinIO/S3
  # via testcontainers for pkgcore (its integration_test/ carries both
  # tiers), PostgreSQL plus Redis via testcontainers for config and for
  # rbac (each of their integration_test/ directories carries both legs),
  # PostgreSQL via testcontainers for org (its integration_test/
  # re-runs the A1 materialized-path dialect-identity proof and the
  # tenant-scoped repositories' AssertIsolated suite against a real
  # server), and PostgreSQL via testcontainers for authn (its
  # integration_test/ proves migrations zero-to-head, the mandatory
  # tenancytest isolation suite, blind-index uniqueness and refresh-token
  # rotation, all against real PostgreSQL rather than SQLite -- see
  # go/authn/AGENTS.md's Testing section for why each needs it). This list
  # is the enumeration of the go/ modules' integration_test/ directories:
  # one entry per go/ module that carries one (the reference app also
  # carries a tier -- its own APP_DIR leg of test:full, below, since it
  # lives outside go/). A module shipping a tier without an entry here
  # silently drops out of test:full, so keep the two in step -- verify by
  # listing the integration_test/ directories under go/.
  INTEGRATION_DIRS: go/dbkit go/tenancy go/jobs go/pkgcore go/config go/rbac go/org go/authn

tasks:
  default:
    desc: List the available tasks.
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install the pinned toolchain (mise must be on PATH; skipped with a warning when absent), then sync the Go workspace so every module agrees on shared dependency versions.
    # docs/internal/19-dev-workflow.md plans more for setup: toolchain
    # installation (mise) and database initialization. The toolchain half is
    # now real -- the root .mise.toml pins task/go/node/pnpm/golangci-lint,
    # each version mirroring an authoritative source (go.work, web/.nvmrc,
    # web/package.json, the Taskfile header, setup-go-env's GOLANGCI_VERSION),
    # and the first leg below runs `mise install` against it. The leg warns
    # and continues when mise is not on PATH rather than failing, because the
    # underlying commands stay directly runnable: `mise install` from the
    # repository root once mise is on PATH, and `go work sync` always.
    # Database initialization is still absent by design: standalone mode has
    # nothing to initialize -- the reference app opens its own SQLite file
    # and runs its migrations at server start -- and pre-commit hooks
    # (lefthook) wait for a later round.
    #
    # When the sync moves a module's go.mod/go.sum (a dependency bumped by the
    # workspace union, or a require relabeled), run `go mod tidy` from inside
    # that module and commit both together: sync writes what the workspace
    # needs, and the module's own standalone guard test (go/pkgcore and
    # go/tenancy standalone_build_test.go, which build with GOWORK=off) fails
    # until the module's go.sum also carries the standalone graph entries.
    cmds:
      - |
        if command -v mise >/dev/null 2>&1; then
          mise install
        else
          echo "warning: mise is not on PATH, so the toolchain-install leg was skipped."
          echo "         The root .mise.toml pins task/go/node/pnpm/golangci-lint; install"
          echo "         mise (https://mise.jdx.dev) and re-run 'task setup', or run"
          echo "         'mise install' from the repository root once mise is on PATH."
        fi
      - go work sync

  test:
    desc: Run the unit suite of every real module (workspace and reference app).
    # Deliberately no -race/-cover: this is the fast local loop behind
    # docs/internal/19-dev-workflow.md's "task test" (run the affected
    # modules' tests). The race detector and coverage live in test:full,
    # which also adds the Docker-backed integration tiers.
    cmds:
      - go test {{.ALL_PKGS}}
      - cd "{{.APP_DIR}}" && go test ./...

  test:full:
    desc: Full matrix -- unit suite under -race with coverage, then the Docker-backed integration tiers (PostgreSQL, Redis, MinIO/S3). Requires Docker.
    # docs/internal/19-dev-workflow.md's full matrix will eventually mean dual
    # deployment mode x dual dialect across every module. Until the
    # distributed mode and a second dialect's integration tiers exist, the
    # honest full form is: the whole unit suite under the race detector with
    # coverage, plus the Docker-backed integration tiers. {{.INTEGRATION_DIRS}}
    # carries one entry per module under go/ with an integration_test/
    # directory, so the enumeration cannot drift from the modules that
    # actually ship a tier -- adding a tier means adding its module to that
    # list. Each tier must be run from its own module directory -- the
    # integration build tag is what keeps a plain `go test ./...` from ever
    # touching them.
    cmds:
      - go test -race -cover {{.ALL_PKGS}}
      - cd "{{.APP_DIR}}" && go test -race -cover ./...
      # The reference app's own Docker-backed tier (its integration_test/,
      # testcontainers Redis) is the APP_DIR leg of the same matrix: it
      # boots the real server with a real Redis Streams EventBus -- the
      # standalone-topology + MultiReplicaSafe composition the
      # deployment-composition retrofit proves. Kept out of
      # {{.INTEGRATION_DIRS}} because that list enumerates modules under
      # go/ (see its comment above); full-check.yml mirrors this leg in the
      # reference-app job.
      - cd "{{.APP_DIR}}" && go test -race -tags=integration ./...
      - |
        for d in {{.INTEGRATION_DIRS}}; do
          echo "== go test -race -tags=integration ./... ($d)"
          (cd "$d" && go test -race -tags=integration ./...) || exit 1
        done

  lint:
    desc: Vet every module (workspace and reference app), run golangci-lint per module, then lint the web workspace.
    # go vet over the import-path pattern covers every module under go/ in one
    # workspace-wide pass; the reference app is a separate module outside go/
    # and gets its own dir-scoped vet.
    #
    # golangci-lint is the project standard (docs/internal/20-quality-and-
    # security.md; .golangci.yml at the repo root, v2 schema) and CI enforces
    # it on every pull request (the reusable go-module-ci workflow's
    # golangci-lint leg; the reference app lints in full-check). It cannot run
    # from the workspace root, though: with go.work in effect, golangci-lint
    # v2 effectively lints nothing there (logs "typechecking error ...
    # directory prefix . does not contain modules listed in go.work", reports
    # "0 issues.", and exits nonzero -- 7 on the pinned 2.11.4). The nonzero
    # exit is the safe direction: a root-level invocation fails loudly rather
    # than passing silently having checked nothing. It must run from inside a
    # module directory, so this task loops over the use entries of go.work --
    # which keeps newly scaffolded modules and the reference app covered
    # automatically -- and runs it once per module.
    cmds:
      - go vet {{.ALL_PKGS}}
      - cd "{{.APP_DIR}}" && go vet ./...
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          for d in $(awk 'NF && $1 ~ /^\.\// { gsub(/^"|"$/, "", $1); print $1 }' go.work); do
            echo "== golangci-lint run ./... ($d)"
            (cd "$d" && golangci-lint run ./...) || exit 1
          done
        else
          echo "warning: golangci-lint is not on PATH, so the golangci legs above were"
          echo "         skipped -- CI runs them on every pull request, so a local run that"
          echo "         skips them can be green while the PR fails. Install version 2.11.4,"
          echo "         the version CI pins (.github/actions/setup-go-env/action.yml), from"
          echo "         the release tarball at github.com/golangci/golangci-lint and re-run;"
          echo "         note that 'brew install golangci-lint' pins no version and verifies"
          echo "         no checksum, so it can disagree with CI. With mise on PATH,"
          echo "         'task setup' installs the pinned toolchain from the root .mise.toml"
          echo "         (golangci-lint included; tools/check_toolchain.py keeps the mirrors"
          echo "         honest in CI -- docs/internal/19-dev-workflow.md)."
          echo "         Run it manually from any module directory:  golangci-lint run ./..."
        fi
      - |
        # web/ is a separate pnpm workspace (not part of go.work), and the
        # eleven @speed/* packages plus the reference app's web host
        # (examples/reference-app/web, wired in as an external member of
        # web/pnpm-workspace.yaml) all carry their own lint script (root
        # CLAUDE.md's Repository Status: "pnpm -r lint ... genuinely run
        # and pass today"; CI enforces it per-package in the reusable
        # npm-package-ci workflow). Guarded exactly like the golangci-lint
        # loop above: warn and skip rather than hard-fail when pnpm is not
        # on PATH, so a bare `task lint` still gets as far as it can on a
        # machine that never ran `task setup`.
        if command -v pnpm >/dev/null 2>&1; then
          echo "== pnpm -r lint (web)"
          (cd web && pnpm -r lint) || exit 1
        else
          echo "warning: pnpm is not on PATH, so the frontend lint leg above was"
          echo "         skipped -- CI runs it on every pull request (the reusable"
          echo "         npm-package-ci workflow's lint leg, once per web package and"
          echo "         for the reference app's web host), so a local run that skips"
          echo "         it can be green while the PR fails. With mise on PATH, 'task"
          echo "         setup' installs the pinned Node/pnpm versions (web/.nvmrc,"
          echo "         web/package.json's packageManager field are the single version"
          echo "         sources) from the root .mise.toml. Run it manually from web/:"
          echo "         pnpm -r lint"
        fi

  dev:
    desc: Not implemented -- the planned standalone-mode dev loop (backend + frontend, hot reload) does not exist yet.
    cmds:
      - |
        echo "dev: not implemented yet."
        echo
        echo "What IS runnable today: the reference-app server in standalone deployment"
        echo "mode (single process, SQLite, zero external dependencies), built on the"
        echo "real modules -- pkgcore, dbkit, tenancy, observability, config, jobs,"
        echo "authn, rbac, org and storage. See examples/reference-app/README.md."
        echo "Run it directly:"
        echo "    cd examples/reference-app && go run ./cmd/server"
        echo "It listens on :8080 (override with PORT) and stores to ./reference-app.db"
        echo "(override with SPEED_DB_PATH)."
        echo
        echo "This task itself does not run that: the 'task dev' target promises backend"
        echo "+ frontend in standalone deployment mode with hot reload. The web/ pnpm"
        echo "workspace does exist now -- eleven versioned packages today (web/README.md)"
        echo "plus the reference app's consumer shell at examples/reference-app/web --"
        echo "but none of it is wired into a hot-reload runner or a composed dev loop"
        echo "yet (docs/internal/19-dev-workflow.md,"
        echo "docs/internal/15-roadmap.md)."
        exit 1
    # Without silent, task echoes the whole script block above back as the
    # command line (task: [dev] | ...) before running it, doubling every
    # line. A not-implemented stub exists to print this message, so silent
    # keeps the message the only output; the exit-1 contract is unaffected.
    # Same for seed below -- the only other task that is both a
    # not-implemented stub and marked silent. api:gen and docs:serve were
    # stubs when this note was written; both are real tasks now.
    silent: true

  api:gen:
    desc: Regenerate the generated API surface of every module that ships an OpenAPI fragment -- backend (oapi-codegen types + ServerInterface) for notes, org, storage, authn, notification, sharing and pki, plus the frontend SDK for every fragment in the merged document (orval -> @speed/api-sdk, notes + authn + notification).
    # The backend half of the contract-change flow (docs/internal/
    # 21-api-contract.md's order: edit the spec, regenerate, compile
    # failures reveal every handler to fix) is real for the six modules
    # that ship a fragment: this task runs oapi-codegen, pinned at
    # v2.8.0, over each module's own api/openapi.yaml with that
    # directory's own oapi-codegen.yaml -- rewriting
    # examples/reference-app/internal/notes/api/notes-server.gen.go,
    # go/org/api/org-server.gen.go, go/storage/api/storage-server.gen.go,
    # go/authn/api/authn-server.gen.go,
    # go/notification/api/notification-server.gen.go,
    # go/sharing/api/sharing-server.gen.go and go/pki/api/pki-server.gen.go
    # respectively. Each generated ServerInterface's growth is what makes
    # an un-updated handler stop compiling (the compile-time assertions
    # live in internal/notes/handler.go, go/org/handler.go,
    # go/storage/handler.go, go/authn/handler.go,
    # go/notification/handler.go, go/sharing/handler.go and
    # go/pki/handler.go).
    #
    # The frontend half of the api:gen promise is live for every fragment
    # in the merged document: the api:merge dependency below joins the
    # notes, authn and notification fragments into build/openapi/speed.yaml,
    # and the orval leg below regenerates the @speed/api-sdk package from
    # that merged document -- orval pinned at 8.17.0 and run from web/ via
    # pnpm dlx (orval is never a workspace dependency), followed by
    # web/scripts/orval-nodenext-fixup.mjs -- see that package's
    # AGENTS.md for the seam and the fixup's why. notification joined the
    # merged document when its recipient-facing HTTP surface shipped (the
    # notification round): its fragment feeds the merge and orval like
    # authn's, because its operations are self-service surfaces a
    # consumer shell's SDK calls. org's and storage's fragments feed
    # neither the merge nor orval: org's frontend leg defers to the M1
    # org-web round that joins org into the merged document
    # (go/org/AGENTS.md's deferrals table and
    # docs/internal/21-api-contract.md's implementation-status note);
    # storage's frontend leg defers to that same future extension of the
    # merged document -- org's fragment is queued first, storage's would
    # ride the same regeneration (go/storage/AGENTS.md's deferrals
    # table). sharing's fragment carries the identical backend-only
    # deferral, for the identical reason storage's does: it has no
    # frontend consumer yet, and the public access route it serves is a
    # browser-navigated link, not a call a generated SDK hook would ever
    # make (go/sharing/AGENTS.md's Deferred list). authn's fragment, by
    # contrast, has no "no consumer shell" deferral left: its generated
    # surface has been compile-consumed by @speed/auth-core since the
    # auth-core round. pki's fragment (round 3) is the same shape as
    # org's/storage's: no in-workspace web consumer, its frontend leg
    # deferred for the identical reason -- see go/pki/AGENTS.md's Known
    # limitations. The redocly merge of the fragments into
    # build/openapi/speed.yaml, and its spec lint, live in the api:merge
    # task below -- api:gen DEPENDS on api:merge (deps above), because
    # the merged document is the frontend leg's input: a fragment edit
    # must regenerate through a fresh merge, never through a stale
    # committed speed.yaml. The backend legs stay independent of the
    # merge, per docs/internal/21-api-contract.md's "spec organization
    # and merging" section. Still deferred: breaking-change detection
    # (oasdiff), which waits for the first release baseline (M4).
    #
    # Keep the commands in lockstep with
    # .github/workflows/api-contract.yml's regeneration steps: the same
    # go run from the same seven backend directories, and the same pnpm
    # dlx orval + fixup pair from web/, then a git diff there fails any
    # PR whose spec change was not committed with its regenerated
    # artifact.
    deps:
      - api:merge
    cmds:
      - |
        cd "{{.APP_DIR}}/internal/notes/api" && \
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
          -config oapi-codegen.yaml openapi.yaml
      - |
        cd go/org/api && \
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
          -config oapi-codegen.yaml openapi.yaml
      - |
        cd go/storage/api && \
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
          -config oapi-codegen.yaml openapi.yaml
      - |
        cd web && \
        pnpm dlx orval@8.17.0 --config orval.config.ts && \
        node scripts/orval-nodenext-fixup.mjs
      - |
        cd go/authn/api && \
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
          -config oapi-codegen.yaml openapi.yaml
      - |
        cd go/notification/api && \
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
          -config oapi-codegen.yaml openapi.yaml
      - |
        cd go/sharing/api && \
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
          -config oapi-codegen.yaml openapi.yaml
      - |
        cd go/pki/api && \
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
          -config oapi-codegen.yaml openapi.yaml

  api:merge:
    desc: Merge every module's OpenAPI fragment into build/openapi/speed.yaml, stamp its info block, and lint the result against redocly.yaml's naming-convention rules.
    # docs/internal/21-api-contract.md's "spec organization and merging"
    # section: each module fragment still generates its own backend
    # artifacts independently, but the MERGED document is a real release
    # artifact (build/openapi/speed.yaml, committed -- see .gitignore's
    # carve-out) in its own right once two or more fragments exist (which
    # happened when authn's fragment landed alongside notes', and grew a
    # third member when notification's recipient-facing surface shipped),
    # and it is also the frontend leg's input: api:gen depends on this
    # task (see above), so a fragment edit regenerates through a fresh
    # merge rather than a stale committed speed.yaml. The merge itself
    # stays independent -- api:merge never depends on api:gen.
    #
    # `join`, not `bundle`: bundle expects one root document with $refs into
    # the others; these fragments are peers, each a complete document with
    # its own paths and components -- join is redocly's command for merging
    # documents of that shape. Pinned at 2.51.1, the same pinning discipline
    # as oapi-codegen (v2.8.0) and orval (8.17.0) above -- see redocly.yaml's
    # own header for what the lint step checks and why. join keeps the FIRST
    # input's info block (title, description, version), so between join and
    # lint the deterministic stamp web/scripts/redocly-join-fixup.mjs
    # rewrites title and description to the application level -- without
    # it the merged document, and the generated SDK's "Source:" header,
    # would carry notes' title and a description claiming the merge is
    # still future work. Keep the commands here in lockstep with
    # .github/workflows/api-contract.yml's merge steps.
    cmds:
      - mkdir -p build/openapi
      - >-
        pnpm --package=@redocly/cli@2.51.1 dlx redocly join
        examples/reference-app/internal/notes/api/openapi.yaml
        go/authn/api/openapi.yaml
        go/notification/api/openapi.yaml
        -o build/openapi/speed.yaml
      - node web/scripts/redocly-join-fixup.mjs
      - pnpm --package=@redocly/cli@2.51.1 dlx redocly lint build/openapi/speed.yaml --config redocly.yaml

  docs:serve:
    desc: Preview the docs site (docs/site/) locally with Hugo's live-reload server.
    # docs/site/ is a real Hugo project (theme: hugo-book, pinned as a git
    # submodule) as of this round's machinery decision -- this is no
    # longer the buildless, no-npm, no-network skeleton the previous
    # framing here described (docs/site/README.md's earlier "real
    # skeleton, machinery deferred" note is superseded; see its current
    # text and docs/internal/13-documentation-standards.md's own
    # implementation-status note for what changed and why hugo-book was
    # chosen over Docsy). Previewing now needs the pinned Hugo binary
    # itself (root .mise.toml's `hugo` entry; `mise install` by way of
    # the setup task's toolchain leg) and the theme submodule checked out
    # (`git submodule update --init` if it is not already). The
    # structural check keeping the built output honest in CI is
    # tools/check_docs_site.py (docs-check pipeline), which now builds
    # the site and checks docs/site/public/, not the Markdown source
    # tree. The underlying command is directly runnable without the task
    # CLI:
    #   hugo server --minify --source docs/site
    # `hugo server` watches content/config/layout changes and live-reloads
    # the browser; Ctrl-C stops it. It binds 1313 by default -- pass
    # --port to use another one.
    cmds:
      - hugo server --minify --source docs/site

  seed:
    desc: Not implemented -- no demo-data seeding path exists in the reference app yet.
    cmds:
      - |
        echo "seed: not implemented yet."
        echo
        echo "docs/internal/19-dev-workflow.md plans 'task seed' to generate demo data"
        echo "(two tenants, a multi-level org tree, users and roles, sample plans and"
        echo "subscriptions) that reference-app demos and local debugging depend on."
        echo "The reference app has no seeding path today: cmd/server/server.go only"
        echo "hard-codes two demo Host-to-tenant mappings (acme/globex), and every"
        echo "table starts empty at boot. A real demo-data loader lands with the"
        echo "modules it needs (authn, org, billing -- see examples/reference-app/"
        echo "README.md and docs/internal/14-reference-app.md)."
        echo
        echo "For a manual demo today, run the server and drive it with curl, exactly"
        echo "as examples/reference-app/README.md's 'Try it' section shows."
        exit 1
    silent: true

  new:module:
    desc: Scaffold a new Go module stub under go/<name> and print its registration checklist.
    # Wraps tools/new_module.py; the generator contract is documented in the
    # script's --help epilog and in docs/internal/19-dev-workflow.md's
    # module-generator section. Pass the arguments as CLI vars:
    #   task new:module NAME=sharing DESCRIPTION='...' DESIGN_DOC=docs/internal/NN-name.md
    # The script prints a registration checklist (go.work use entry -- which is
    # itself the lockstep release registration, since the coordinator derives
    # the per-module tag list from go.work at runtime -- CI matrix row, roadmap
    # and navigation rows) for the human to perform -- it never rewrites shared
    # repository files itself.
    cmds:
      # Every variable is quoted: an unquoted {{.NAME}} or {{.DESIGN_DOC}}
      # would let the shell split a value on spaces before the script's own
      # validation sees it. Quoted, a malformed value reaches the script
      # whole and fails there with its own message (exit 2, nothing written).
      - python3 tools/new_module.py '{{.NAME}}' --description '{{.DESCRIPTION}}' --design-doc '{{.DESIGN_DOC}}'

  release:plan:
    desc: Verify the lockstep release plan for one version, offline (M0 round).
    # Wraps tools/release/lockstep-release.py's default verification mode --
    # the offline half of the M0 release machinery (docs/internal/
    # 18-cicd.md, docs/internal/02-repo-and-release.md). The coordinator
    # derives the publishable set at runtime (go.work + web/packages), prints
    # the full one-version plan and exits 0 only when the plan is consistent;
    # nothing is tagged, written or published. Pass the version as a CLI var:
    #   task release:plan VERSION=v1.2.0
    # Real publishing is scheduled for the v1.0 release at M4; .github/
    # workflows/release.yml runs this same verification on its version input.
    cmds:
      # Quoted for the same reason as new:module: a malformed VERSION reaches
      # the script whole and fails there with its own message (exit 2).
      - python3 tools/release/lockstep-release.py '{{.VERSION}}'
