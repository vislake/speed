name: setup-go-env
description: >-
  Install the pinned Go toolchain and module cache; also install
  golangci-lint and its analysis cache when the job lints
  (install-golangci: true).

# Shared Go toolchain setup for every CI job that runs Go commands.
#
# VERSION SOURCE
# This action reads go.work's `go` directive (currently `go 1.25.0`) via
# actions/setup-go's go-version-file input. go.work is the repository's
# single Go toolchain version source for CI -- the one file the action
# resolves. Each module's go.mod also declares a `go` version, but that is
# per-module metadata, not a second source CI reads, and it cannot drift
# above go.work: the go command refuses to load a workspace in which any
# listed module's go.mod demands a newer go than go.work declares. CI
# exercises that guard in pr-check's repo-checks job, whose workspace-wide
# `go build github.com/vislake/speed/go/...` compiles every go/ module's
# packages, the fifteen stubs included. The same load-time check covers
# examples/reference-app too -- go.work lists it, so its go.mod is
# validated on every pr-check run even though no every-PR job builds its
# packages (its unit suite is pr-full's reference-app job to run -- live
# since the second CI layer -- so its packages are built and tested there,
# on full-ci-labeled PRs). (Today the six
# real modules -- go/dbkit, go/jobs, go/observability, go/pkgcore,
# go/ratelimit, go/tenancy -- declare `go 1.25.0`, as does
# examples/reference-app; the fifteen stub modules still say `go 1.23`,
# and tools/new_module.py keeps writing 1.23 for new stubs -- the bare
# directive of a dependency-free module, bumped when the implementation
# round adds its first dependency. That is fine: the guard refuses a
# go.mod above go.work's line, never one below it.) The root .mise.toml
# mirrors this directive for local toolchain installs (the Taskfile setup
# task runs `mise install` against it). The go-version-file input stays
# go.work rather than being repointed at .mise.toml: actions/setup-go can
# only read go.mod, go.work, go.sum or .go-version, so a mise config is
# not a file it can resolve. CI and local installs therefore read two
# files by design, and tools/check_toolchain.py -- wired into pr-check's
# repo-checks job -- is the drift gate proving the .mise.toml mirror
# equals this directive.
#
# GOLANGCI-LINT
# golangci-lint installs only for jobs that lint: callers set the
# install-golangci input below (default false) -- today the reusable
# go-module-ci workflow's golangci-lint leg and the reference-app job of
# pr-full -- so there is exactly one install site, and it is opt-in. The
# other callers (pr-check's repo-checks job, pr-full's integration-tiers
# rows) run Go but never lint; an unconditional install would cost them a
# ~20 MB download plus checksum verify on every job (the RUNNER_TOOL_CACHE
# install dir below is per-job, so the existence guard never short-circuits
# on a fresh runner), a wasted analysis-cache restore, and -- on a cold
# cache key -- the risk that a short non-linting job finishing first saves
# an empty golangci cache under the primary key, which actions/cache never
# overwrites, freezing the lint jobs' cache save for that key's lifetime.
# Opting in instead of out keeps a job that lints but forgets the input
# loud (golangci-lint: command not found at its lint step) rather than
# silently expensive. The version and the tarball sha256 below must be
# bumped together, and the hash updated from the release's
# golangci-lint-<version>-checksums.txt asset.
#
# CACHE
# actions/setup-go's cache: true restores and saves the Go module cache,
# keyed on the hashes of the dependency files listed in
# cache-dependency-path: the workspace sum file plus every module's go.sum.
# The **/go.sum glob picks newly added modules up automatically, so adding a
# module to a CI matrix extends the cache key without touching this file.
#
# golangci-lint's analysis cache is restored the same way for jobs that opt
# into the install, keyed on the same lockfile hashes plus the linter
# version (18-cicd cost-control rule 3: caches keyed on lockfile hashes):
# dependency changes invalidate the analysis results the cache holds. The
# binary itself is not cached -- at roughly 20 MB per job it is cheaper to
# re-download and re-verify the pinned artifact than to store it, and the
# checksum check runs on every job that installs it instead of only on
# cache misses.
#
# Callers must run actions/checkout first: go.work and the go.sum files are
# resolved from the checked-out tree.

inputs:
  install-golangci:
    description: >-
      Install the pinned, checksum-verified golangci-lint binary and restore
      its analysis cache. Set by jobs that run a golangci-lint leg only
      (see the GOLANGCI-LINT section above); jobs that merely test or build
      leave it at the default false.
    # No `type:` key: action.yml inputs have no type (that is a
    # workflow_call/workflow_dispatch-only schema) -- composite inputs are
    # always strings, which is why the steps below compare == 'true' rather
    # than testing the input directly (the string "false" would be truthy).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned Go toolchain and restore module cache
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go.work
        cache: true
        cache-dependency-path: |
          go.work.sum
          **/go.sum
    - name: Restore golangci-lint cache
      if: ${{ inputs.install-golangci == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ~/.cache/golangci-lint
        key: golangci-lint-cache-${{ runner.os }}-2.11.4-${{ hashFiles('go.work.sum', '**/go.sum') }}
        restore-keys: |
          golangci-lint-cache-${{ runner.os }}-2.11.4-
    - name: Install pinned golangci-lint
      if: ${{ inputs.install-golangci == 'true' }}
      shell: bash
      env:
        GOLANGCI_VERSION: "2.11.4"
        # sha256 of golangci-lint-2.11.4-linux-amd64.tar.gz from the release's
        # own golangci-lint-2.11.4-checksums.txt, pinned so a tampered
        # artifact cannot reach CI. Bump version and hash together.
        GOLANGCI_TARBALL_SHA256: "200c5b7503f67b59a6743ccf32133026c174e272b930ee79aa2aa6f37aca7ef1"
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TOOL_CACHE/golangci-lint/${GOLANGCI_VERSION}"
        if [ ! -x "$install_dir/golangci-lint" ]; then
          tmp="$RUNNER_TEMP/golangci-lint.tar.gz"
          curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_VERSION}/golangci-lint-${GOLANGCI_VERSION}-linux-amd64.tar.gz" -o "$tmp"
          echo "${GOLANGCI_TARBALL_SHA256}  $tmp" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$tmp" -C "$install_dir" --strip-components=1
        fi
        echo "$install_dir" >> "$GITHUB_PATH"
