name: docs-check
# Documentation and public-API discipline pipeline: documentation code
# examples compile and run, link checks, zh-CN/en-US i18n key-set parity,
# and config-reference drift detection. Target under 8 minutes (the
# markdown-example and config-reference checks below share the Go toolchain
# installed for the markdown-example step -- the config-reference step
# `go run`s the generator command from examples/reference-app/ against a
# warm module cache, and the markdown-example check adds the two tiny
# throwaway-module `go build`+`go vet` calls; both are cheap in practice
# but the budget line should not lie about what the job does). This
# pipeline is NOT a GitHub
# branch-protection required check: this repository has no native branch
# protection on main at all (`gh api repos/.../branches/main/protection`
# returns 404); fast-check, security and docs-check alike are post-hoc
# signals, never merge gates. Path filtering makes the same point from
# the other side: a PR that touches no listed path never starts this
# workflow, so no check run appears for it at all -- nothing "reports
# neutral" (that status only arises from a job GitHub runs and skips via
# an `if:`, which this file never does), and a run that does start
# reports success or failure like any other check. Either way nothing
# here blocks a merge: main is direct-push by team convention, and the
# after-the-fact signal for a direct push is fast-check's own push
# trigger.
#
# TRIGGER: PRs touching documentation or a public API, via GitHub-native
# path filtering on the pull_request event -- zero third-party actions
# (with a single-job pipeline the event's own path filter is the whole
# gate). The path set below is deliberately not "everything": code-only
# PRs are already covered by fast-check's module matrix and must not
# fire this pipeline, while locale and i18n-contract changes must never
# slip through it.
#
# COVERAGE -- what runs, in step order:
#   * i18n key-set parity: python3 tools/check_i18n_keys.py from the
#     repository root, discovering every locale directory below it
#     (TOML pairs under the Go modules' locales/ trees plus the web
#     packages' JSON bundles) and failing on any zh-CN/en-US key-set
#     drift -- the raw-file half of the i18n discipline, complementing
#     the compiled halves (pkgcore/i18n's ErrParityMismatch check inside
#     the Go module unit suites and @speed/i18n's registerNamespace
#     validation on the web side). The checker is dependency-free
#     (tools/README.md): plain python3 -- no Go toolchain, no package
#     install -- so this job needs no setup step. ubuntu-latest ships
#     the Python >= 3.11 the checker needs (tomllib).
#   * error-code index drift: python3 tools/gen_error_code_index.py
#     --check from the repository root, failing when the documentation
#     site's error-codes page (docs/site/content.en/docs/user-guide/error-codes.md,
#     served at /docs/user-guide/error-codes/) is not what the generator
#     renders from the current Go tree --
#     every code constructed in Go source under go/ and examples/ with a
#     literal code argument (test and generated files excluded), named
#     declaration or inline construction alike, each with its own
#     locales/en-US.toml catalog entry when one exists. Plain python3,
#     no setup step.
#   * error-code index coverage: python3
#     tools/check_error_code_index_coverage.py, running next to the
#     drift check above. The drift check compares the committed index
#     against the generator's own output -- both sides derive from the
#     same scanner, so a construction form the generator does not index
#     is invisible to it. The coverage check derives the expected code
#     set independently from the real tree -- its own scanner,
#     multi-line aware, comment-masked -- and fails printing every code
#     the index has no row for (plus the unindexable classes:
#     non-literal code arguments outside an apperr-constructing
#     helper's body, and helper calls with non-literal arguments), so
#     an extractor blind spot shows as a real diff instead of silent
#     agreement. Plain python3, no setup step.
#   * platform-error bundle drift: python3
#     tools/gen_platform_error_bundle.py --check from the repository
#     root, failing when the committed client bundle
#     (web/packages/i18n/src/platform-errors/locales/{zh-CN,en-US}.json)
#     is not what the generator renders -- the intersection of the
#     apperr census (the Go codes, read through the index generator's
#     own public functions) with the modules' locales/ catalogs, so the
#     frontend's error text comes from the same source the backend
#     renders. Its planted-drift suite (tools/
#     test_gen_platform_error_bundle.py, run first in the step pair
#     below -- the env-example precedent) pins the filter (including the
#     red line that a catalog id with no apperr construction behind it --
#     an invitation email, a notification template, an SMS body -- never
#     enters the bundle), the interpolation and plural-table
#     conversions, the refusal classes, and byte-determinism. Plain
#     python3, no setup step.
#   * docs-site build: python3 tools/check_docs_site.py from the
#     repository root. docs/site/ is a real Hugo project (theme:
#     hugo-book, pinned as a git submodule -- docs/site/README.md has
#     the machinery-decision rationale), so the check runs a real
#     `hugo --minify` build and validates the BUILT output
#     (docs/site/public/, gitignored, never committed): the build
#     itself produces no warnings, every required page is present in
#     both languages (en default/unprefixed, zh-cn under /zh-cn/),
#     llms.txt lands exactly once at the built root, every internal
#     link on a built page resolves, and the offline preview really
#     serves (it spawns the python3 stdlib HTTP server on an ephemeral
#     port and fetches the site root). Needs the pinned Hugo binary
#     (setup-hugo-env step below) and the theme submodule checked out,
#     unlike the dependency-free i18n checker above.
#   * config-reference drift: `go run . --check` from
#     tools/configrefgen/ (the step below runs it after the pinned
#     Go install, sharing that toolchain with the markdown-example
#     check). The reference -- docs/config-reference.md, its
#     machine-readable twin docs/config-reference.json, the derived
#     docs/config.example.json and the docs
#     site's copy of the reference page -- is generated from the live
#     configuration schema and the modules' own declarations: the
#     generator composes a schema-only host (the platform modules that
#     declare configuration items, feature flags or bootstrap keys,
#     plus go/config, on a throwaway in-memory database), freezes the
#     schema with
#     config.Module.Attach, and renders `config.Service.Describe`'s
#     snapshot and the components' `BootstrapKeys` declarations. The reference
#     documents that platform surface only: a host's own bootstrap
#     variables belong to the host and are documented where it lives.
#     A stale
#     committed reference (a module that added, removed or changed an
#     item, a flag or a bootstrap key; a hand-edit of a generated
#     file) fails this step.
#     The generator's own unit suite (tools/configrefgen/*_test.go, run
#     by the tools/configrefgen matrix row in fast-check and
#     full-check) pins the load-verification of
#     docs/config.example.yaml and its JSON twin, the rendered-keys-vs-
#     census correspondence in both directions, and
#     byte-determinism;
#     the PATH SET below adds the declaration sites so an item or key
#     change re-runs this gate on its own PR, the api-contract
#     pattern. Needs the pinned Go toolchain, no Docker.
#   * markdown Go example compile/parse check: python3 tools/
#     check_markdown_examples.py from the repository root. Every fenced
#     ```go block in every AGENTS.md, go/**/README.md,
#     web/packages/*/README.md, the root README.md and docs/adr/*.md is
#     checked (docs/internal/** is deliberately excluded -- see the
#     script's own module docstring for why): a block that opens with
#     its own `package` clause is a claim of real working code and is
#     really `go build`+`go vet`'d, in a throwaway module
#     `replace`-directived onto whichever go/<module> packages its own
#     imports name (the replace directive alone -- not GOPROXY --
#     guarantees this repo's own modules resolve to the tree under
#     review rather than a stale published version, so the default
#     GOPROXY is left alone and only GOWORK=off is set, keeping real
#     third-party transitive dependencies fetchable on a cold module
#     cache); a bare fragment (the overwhelming majority of the corpus
#     -- a partial snippet is a deliberate, legitimate documentation
#     style, not a bug) is instead syntax-checked with `gofmt -e` under
#     several throwaway wrappings (top-level declaration list, function
#     body, interface body, struct body, const/var block), failing only
#     if EVERY wrapping rejects it. Needs the pinned Go toolchain
#     (setup-go-env step below, no golangci-lint install) but no network
#     beyond what actions/checkout and setup-go already needed, and no
#     Docker.
#
# DELIBERATELY NOT WIRED -- docs-engineering items whose tooling does
# not exist yet (wiring them now would be fake checks):
#   * link checking across the docs/ markdown tree (broken anchors/URLs
#     in prose). The docs site's own internal links are already checked
#     (check_docs_site.py, COVERAGE above); this row is the wider
#     docs/-wide check.
#   * per-version release directories for docs/site/ (the site versioned
#     like the code it documents).
#   * the platform-error bundle's Go-side edge: the bundle's census
#     input is the Go tree, but a PR that only removes an apperr
#     construction (leaving its catalog entry behind) never starts this
#     pipeline -- code-only PRs belong to fast-check's module matrix by
#     the trigger design above. The residue is deliberate: the next run
#     on any listed path goes red, naming the stale bundle file, and the
#     fix is the one-line regeneration the gate prints. Wiring go/**
#     here to close it would fire this pipeline on every code-only PR,
#     which is what the path set exists to avoid.
#
# PATH SET -- documentation or i18n/public-API changes only:
#   docs/**                     the design docs this pipeline guards, and
#                                docs/site/ itself (Hugo source: hugo.toml,
#                                content.en/, content.zh-cn/, static/, and
#                                the theme submodule's pointer commit)
#   .claude/**                  skill handbooks (standards documentation)
#   **/AGENTS.md                per-module discipline docs (consumer-facing)
#   go/**/README.md              package READMEs the markdown-example
#   web/packages/*/README.md     checker also scans (root README.md is
#                                already covered by the CLAUDE.md/README.md
#                                line below)
#   **/locales/**                i18n resources -- the check's direct subject
#   go/pkgcore/**                the catalog contract the checker mirrors,
#                                and (see next entry) a dependency of the
#                                corpus's complete markdown examples
#   go/dbkit/**, go/ratelimit/** the two modules whose AGENTS.md carries a
#                                markdown ```go block claiming to be real,
#                                buildable code against them -- a
#                                source-only change to either module with
#                                no markdown edit could otherwise silently
#                                make that example stale with nothing to
#                                catch it (fast-check's own module matrix
#                                never builds markdown fences). Both
#                                examples also import go/pkgcore directly
#                                (pkgcore.TenantID in dbkit's,
#                                pkgcore.KVStore/NewMemoryKVStore in
#                                ratelimit's -- confirmed via
#                                _module_dirs_for_block), which is why
#                                go/pkgcore/** is listed above rather than
#                                the narrower go/pkgcore/i18n/** alone.
#                                Re-run check_markdown_examples.py
#                                --survey and extend this list by hand
#                                whenever a new complete block starts
#                                depending on a module not named here
#   tools/check_i18n_keys.py     the checker itself (self-test on change)
#   tools/check_docs_site.py     the site checker (self-test on change)
#   tools/check_markdown_examples.py       the markdown-example checker
#   tools/test_check_markdown_examples.py  and its own unit test suite
#                                (self-test on change)
#   tools/gen_error_code_index.py      the error-code index generator
#   tools/test_gen_error_code_index.py and its own unit test suite
#                                (self-test on change)
#   tools/check_error_code_index_coverage.py  the error-code index
#                                coverage checker (the independent side
#                                of the generator's drift gate)
#   tools/test_check_error_code_index_coverage.py  and its own unit
#                                test suite (self-test on change)
#   tools/gen_platform_error_bundle.py      the platform-error bundle
#                                generator -- it imports the index
#                                generator's census functions rather
#                                than reading its generated artifacts
#   tools/test_gen_platform_error_bundle.py  and its own unit test suite
#                                (self-test on change)
#   web/packages/i18n/**         the bundle's consumer side: the
#                                ./platform-errors entrypoint's key shape
#                                and the generated locales/ bundle itself
#                                (the **/locales/** line above matches
#                                the JSON files; this entry keeps the
#                                i18n contract package in the set, the
#                                header's "i18n-contract changes must
#                                never slip through" rule)
#   tools/configrefgen/**        the config-reference generator tool
#                                module (self-test on change; its unit
#                                suite also runs under the
#                                tools/configrefgen matrix row in
#                                fast-check and full-check)
#   examples/reference-app/internal/**  the app sources the error-code
#                                index scans (internal/app, internal/cases,
#                                internal/notes, internal/smilesim): the
#                                committed index names the constructing
#                                file and line, so a construction site
#                                moving changes docs/error-codes.json and
#                                its site page
#   go/config/**                 the dynamic-config schema machinery
#                                (item canonicalization and descriptor
#                                semantics) the reference renders
#   go/authn/module.go           the six ConfigItem/FeatureFlag
#   go/metering/module.go          declaration sites the composed schema
#   go/compliance/module.go        snapshot folds -- an item or flag added,
#   go/sharing/module.go           changed or removed here changes the
#   go/pki/module.go               reference, so the gate runs on the
#   go/org/module.go               declaring side, the api-contract pattern
#   go/notification/module.go      the same for a module that declares no
#                                schema but does declare a bootstrap key
#   docs/config.example.yaml     the load-verified bootstrap file-format
#                                example (self-test on change)
#   docs/config.example.json     its derived JSON counterpart, which the
#                                same gate checks for drift (self-test on
#                                change)
#   .github/actions/setup-hugo-env/**  the pinned Hugo install this job
#                                needs (self-test on change)
#   .github/actions/setup-go-env/**    the pinned Go install the markdown-
#                                example check needs (self-test on change)
#   .github/workflows/docs-check.yml   this workflow itself (a change to
#                                what runs on doc/i18n PRs should run it
#                                -- the api-contract precedent)
#   CLAUDE.md, README.md        root docs stating the rules and CI claims
#   Taskfile.yml                dev-workflow docs of the checker commands


on:
  pull_request:
    paths:
      - docs/**
      - .claude/**
      - "**/AGENTS.md"
      - go/**/README.md
      - web/packages/*/README.md
      - "**/locales/**"
      - go/pkgcore/**
      - go/dbkit/**
      - go/ratelimit/**
      - tools/check_i18n_keys.py
      - tools/check_docs_site.py
      - tools/check_markdown_examples.py
      - tools/test_check_markdown_examples.py
      - tools/gen_error_code_index.py
      - tools/test_gen_error_code_index.py
      - tools/check_error_code_index_coverage.py
      - tools/test_check_error_code_index_coverage.py
      - tools/gen_platform_error_bundle.py
      - tools/test_gen_platform_error_bundle.py
      - web/packages/i18n/**
      - tools/configrefgen/**
      - examples/reference-app/internal/**
      - go/config/**
      - go/authn/module.go
      - go/metering/module.go
      - go/compliance/module.go
      - go/sharing/module.go
      - go/pki/module.go
      - go/org/module.go
      - go/notification/module.go
      - docs/config.example.yaml
      - docs/config.example.json
      - .github/actions/setup-hugo-env/**
      - .github/actions/setup-go-env/**
      - .github/workflows/docs-check.yml
      - CLAUDE.md
      - README.md
      - Taskfile.yml
  workflow_dispatch:

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-checks:
    name: docs discipline checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # docs/site/themes/hugo-book is a pinned git submodule -- the
          # docs-site build below needs it checked out.
          submodules: true
      - name: i18n key-set parity (zh-CN vs en-US)
        run: python3 tools/check_i18n_keys.py
      - name: Error-code index drift check
        run: python3 tools/gen_error_code_index.py --check
      - name: Error-code index coverage check
        run: python3 tools/check_error_code_index_coverage.py
      - name: Platform-error bundle generator's planted-drift suite
        # The suite runs first, then the gate over the real tree -- the
        # env-example step pair's order. The red line it plants: a
        # catalog id with no apperr construction behind it (an
        # invitation email, a notification template, an SMS body) must
        # never enter the client bundle.
        run: python3 tools/test_gen_platform_error_bundle.py
      - name: Platform-error bundle drift check
        # Regenerates the client bundle from the apperr census and the
        # modules' locales/ catalogs in memory and fails when either
        # committed file is stale. Plain python3, no setup step.
        run: python3 tools/gen_platform_error_bundle.py --check
      - name: Install pinned Hugo
        uses: ./.github/actions/setup-hugo-env
      - name: Docs-site build (check_docs_site)
        run: python3 tools/check_docs_site.py
      - name: Install pinned Go
        uses: ./.github/actions/setup-go-env
      - name: Markdown Go example compile/parse check
        run: python3 tools/check_markdown_examples.py
      - name: Config reference drift check
        # The reference is generated from the live configuration schema by
        # composing a schema-only host (tools/configrefgen has the full
        # mechanism); this step regenerates it in memory and fails when any
        # committed artifact is stale. Runs from the tool module's own
        # directory because the repository root is a go.work workspace, not
        # a module. Module downloads come from the setup-go-env cache or
        # the network, exactly like the markdown-example check above.
        working-directory: tools/configrefgen
        run: go run . --check
