name: docs-check

# Documentation and public-API discipline pipeline -- docs/internal/
# 18-cicd.md's pipeline table, docs-check row: documentation code examples
# compile and run, link checks, zh-CN/en-US i18n key-set parity, and config-
# reference drift detection. Target under 8 minutes (raised from 5 when the
# markdown-example check below added a second toolchain install -- Go,
# alongside Hugo -- plus two tiny throwaway-module `go build`+`go vet`
# calls; both are cheap in practice but the budget line should not lie
# about what the job now does). This pipeline is also a branch-protection
# required check at 18-cicd's branch-protection section (alongside
# fast-check and security); runs skipped by the path filter report neutral
# and never block a merge.
#
# DESIGN-TABLE TRIGGER: PRs touching documentation or a public API, via
# GitHub-native path filtering on the pull_request event -- zero third-party
# actions (dorny/paths-filter stays future work for the module set, per
# 18-cicd's cost-control section; with a single-job pipeline the event's own
# path filter is the whole gate). The path set below is deliberately not
# "everything": code-only PRs are already covered by fast-check's module
# matrix and must not fire this pipeline, while locale and i18n-contract
# changes must never slip through it.
#
# COVERAGE -- what genuinely runs today
#   * i18n key-set parity (the pipeline's one existing tool): python3
#     tools/check_i18n_keys.py from the repository root, discovering every
#     locale directory below it (today examples/reference-app/internal/
#     notes/locales and go/pkgcore/locales, pkgcore's seed bundle -- TOML
#     pairs -- plus the web JSON bundles under web/packages/i18n/
#     test-utils/locales and web/packages/ui-kit/src/locales) and failing
#     on any zh-CN/en-US key-set drift -- the raw-file half of the i18n
#     discipline, complementing the compiled halves (pkgcore/i18n's
#     ErrParityMismatch check inside the Go module unit suites and
#     @speed/i18n's registerNamespace validation on the web side). The
#     checker
#     is dependency-free (tools/README.md): plain python3 -- no Go
#     toolchain, no package install -- so this job needs no setup step.
#     ubuntu-latest ships the Python >= 3.11 the checker needs (tomllib).
#   * docs-site build: python3 tools/check_docs_site.py from the
#     repository root. docs/site/ is a real Hugo project (theme:
#     hugo-book, pinned as a git submodule -- docs/site/README.md has
#     the machinery-decision rationale) as of the Hugo migration round,
#     so the check runs a real `hugo --minify` build and validates the
#     BUILT output (docs/site/public/, gitignored, never committed):
#     the build itself produces no warnings, every required page is
#     present in both languages (en default/unprefixed, zh-cn under
#     /zh-cn/), llms.txt lands exactly once at the built root, every
#     internal link on a built page resolves, and the offline preview
#     really serves (it spawns the python3 stdlib HTTP server on an
#     ephemeral port and fetches the site root). Needs the pinned Hugo
#     binary (setup-hugo-env step below) and the theme submodule checked
#     out, unlike the dependency-free i18n checker above.
#   * markdown Go example compile/parse check: python3 tools/
#     check_markdown_examples.py from the repository root, closing the
#     "dedicated harness for prose-embedded documentation examples" item
#     this file used to carry in the list below (root CLAUDE.md's
#     Documentation section names the same gap: "Examples embedded in
#     markdown prose (AGENTS.md, READMEs, ADRs) have no compile harness").
#     Every fenced ```go block in every AGENTS.md, go/*/README.md,
#     web/packages/*/README.md, the root README.md and docs/adr/*.md is
#     checked (docs/internal/** is deliberately excluded -- see the
#     script's own module docstring for why): a block that opens with its
#     own `package` clause is a claim of real working code and is really
#     `go build`+`go vet`'d, in a throwaway module `replace`-directived
#     onto whichever go/<module> packages its own imports name (the
#     replace directive alone -- not GOPROXY -- guarantees this repo's own
#     modules resolve to the tree under review rather than a stale
#     published version, so the default GOPROXY is left alone and only
#     GOWORK=off is set, keeping real third-party transitive dependencies
#     fetchable on a cold module cache); a bare
#     fragment (the overwhelming majority of the corpus -- a partial
#     snippet is a deliberate, legitimate documentation style, not a bug)
#     is instead syntax-checked with `gofmt -e` under several throwaway
#     wrappings (top-level declaration list, function body, interface
#     body, struct body, const/var block), failing only if EVERY wrapping
#     rejects it. Needs the pinned Go toolchain (setup-go-env step below,
#     no golangci-lint install) but no network beyond what actions/
#     checkout and setup-go already needed, and no Docker.
#
# DELIBERATELY NOT WIRED HERE -- roadmap M0 docs-engineering items whose
# tooling does not exist yet (wiring them now would be fake checks):
#   * link checking across the docs/ markdown tree (broken anchors/URLs
#     in prose). The docs site's own internal links are already checked
#     (check_docs_site.py, COVERAGE above); this row is the wider
#     docs/-wide check.
#   * config-reference generation drift: the reference is generated from
#     the pkgcore/config schema; generation is not in CI.
#   * error-code index generation drift: tools/gen_error_code_index.py
#     generates docs/error-codes.md from every apperr.* declaration plus
#     each module's own locales/en-US.toml; its own --check mode exists
#     (tools/README.md's own section on it) but is not run here yet.
#   * per-version release directories for docs/site/ (the site versioned
#     like the code it documents) -- still a later (M4) milestone item
#     (docs/site/README.md, docs/internal/13-documentation-standards.md).
#
# PATH SET -- documentation or i18n/public-API changes only:
#   docs/**                     the design docs this pipeline guards, and
#                                docs/site/ itself (Hugo source: hugo.toml,
#                                content.en/, content.zh-cn/, static/, and
#                                the theme submodule's pointer commit)
#   .claude/**                  skill handbooks (standards documentation)
#   **/AGENTS.md                per-module discipline docs (consumer-facing)
#   go/*/README.md               package READMEs the markdown-example
#   web/packages/*/README.md     checker also scans (root README.md is
#                                already covered by the CLAUDE.md/README.md
#                                line below)
#   **/locales/**                i18n resources -- the check's direct subject
#   go/pkgcore/**                the catalog contract the checker mirrors,
#                                and (see next entry) a dependency of both
#                                complete markdown examples in the corpus
#   go/dbkit/**, go/ratelimit/** the two modules a markdown ```go block
#                                currently claims to be real, buildable code
#                                against (go/dbkit/AGENTS.md, go/ratelimit/
#                                AGENTS.md) -- a source-only change to
#                                either module with no markdown edit could
#                                otherwise silently make that example stale
#                                with nothing to catch it (fast-check's own
#                                module matrix never builds markdown
#                                fences). Both examples also import
#                                go/pkgcore directly (pkgcore.TenantID in
#                                dbkit's, pkgcore.KVStore/NewMemoryKVStore
#                                in ratelimit's -- confirmed via
#                                _module_dirs_for_block), which is why
#                                go/pkgcore/** is listed above rather than
#                                the narrower go/pkgcore/i18n/** alone. This
#                                list is exactly the set
#                                check_markdown_examples.py's own --survey
#                                mode reports as owning a "complete" block
#                                today; re-run --survey and extend this
#                                list by hand whenever a new complete block
#                                starts depending on a module not named here
#   tools/check_i18n_keys.py     the checker itself (self-test on change)
#   tools/check_docs_site.py     the site checker (self-test on change)
#   tools/check_markdown_examples.py       the markdown-example checker
#   tools/test_check_markdown_examples.py  and its own unit test suite
#                                (self-test on change)
#   .github/actions/setup-hugo-env/**  the pinned Hugo install this job
#                                needs (self-test on change)
#   .github/actions/setup-go-env/**    the pinned Go install the markdown-
#                                example check needs (self-test on change)
#   CLAUDE.md, README.md        root docs stating the rules and CI claims
#   Taskfile.yml                dev-workflow docs of the checker commands

on:
  pull_request:
    paths:
      - docs/**
      - .claude/**
      - "**/AGENTS.md"
      - go/*/README.md
      - web/packages/*/README.md
      - "**/locales/**"
      - go/pkgcore/**
      - go/dbkit/**
      - go/ratelimit/**
      - tools/check_i18n_keys.py
      - tools/check_docs_site.py
      - tools/check_markdown_examples.py
      - tools/test_check_markdown_examples.py
      - .github/actions/setup-hugo-env/**
      - .github/actions/setup-go-env/**
      - CLAUDE.md
      - README.md
      - Taskfile.yml
  workflow_dispatch:

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-checks:
    name: docs discipline checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # docs/site/themes/hugo-book is a pinned git submodule -- the
          # docs-site build below needs it checked out.
          submodules: true
      - name: i18n key-set parity (zh-CN vs en-US)
        run: python3 tools/check_i18n_keys.py
      - name: Install pinned Hugo
        uses: ./.github/actions/setup-hugo-env
      - name: Docs-site build (check_docs_site)
        run: python3 tools/check_docs_site.py
      - name: Install pinned Go
        uses: ./.github/actions/setup-go-env
      - name: Markdown Go example compile/parse check
        run: python3 tools/check_markdown_examples.py
