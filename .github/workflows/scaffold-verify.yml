name: scaffold-verify

# PIPELINE (docs/internal/18-cicd.md pipeline table, scaffold-verify row):
# generate a fresh project with the CLI, build it, boot it once in each
# deployment mode, and smoke-test it -- the roadmap M4 acceptance: a project
# `saasctl new` and `create-saas-app` generate must boot successfully in
# both the standalone and distributed deployment modes with one command
# each (docs/internal/15-roadmap.md's M4 row).
#
# STATUS -- moved from gated stub toward genuinely running by the
# saasctl-distributed-mode round: this file now wires a REAL job, running
# go/saasctl/integration_test/scaffold_dual_mode_test.go's
# TestScaffoldNewProject_AuthnOrgRbac_BootsInBothDeploymentModes --
# materialize the authn+org+rbac selection (the richest, and the one whose
# server.go exercises authn's "SMS sender" seam's distributed-mode
# conditional injection that a selection with no authn module cannot
# touch), a genuine `go mod tidy` against the real network, a genuine `go
# build`, `saasctl db migrate` and a full boot-and-smoke cycle under the
# standalone default, then the identical migrate-and-boot cycle again under
# APP_DEPLOYMENT_MODE=distributed against real Redis, RustFS
# (S3-compatible) and Mailpit containers this test starts itself --
# mirroring examples/reference-app/integration_test/distributed_mode_test.go's
# own image pins so every Docker-backed tier in this repository exercises
# the same server behavior.
#
# WHAT REMAINS A DELIBERATE, RECORDED GAP -- this file's own single test
# proves ONE of the five legal selections end to end in CI; the other four
# (none, authn, authn+rbac, authn+org) are proven to materialize, tidy and
# build correctly by go/saasctl's own offline unit suite (internal/new's
# golden byte-identity tests, run on every PR via fast-check) plus this
# round's own manually-run B4-style proof recorded in
# go/saasctl/AGENTS.md's Testing section, but do NOT get a per-PR (or
# per-schedule) dual-mode BOOT proof of their own yet -- the same
# "representative subset, explicit reason" shape root CLAUDE.md's
# Reference App section already blesses for go/pki's X.509 layer and
# go/integration's two rounds (running the full generate/tidy(network)/
# build/boot/smoke cycle five times, twice each, would multiply this job's
# Docker and network cost for a property -- the general infrastructure-seam
# wiring in cmd/server/config.go, identical prose across every selection --
# this one test already exercises). create-saas-app and the web-side
# template (frontend-scaffold round, root CLAUDE.md's Reference App
# section) remain entirely unbuilt, so this pipeline covers only the Go
# half of the M4 acceptance; a web-side scaffold-verify leg is a later
# round's work once create-saas-app exists.
#
# TRIGGERS -- the design table calls for daily plus post-release; this
# round wires the daily schedule (03:00 UTC, offset from security.yml's own
# 05:37 UTC daily run so the two do not contend for the same runner
# capacity) plus workflow_dispatch for an on-demand run. The post-release
# trigger is deliberately NOT wired yet: release.yml carries no publish
# credential (permissions: contents: read) and nothing in this repository
# publishes before M4 (root CLAUDE.md's Repository Status), so there is no
# real "post-release" event to hook a verification gate onto today --
# wiring one now would be dead configuration. Wire it alongside real
# publishing at M4.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: scaffold-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-verify:
    name: scaffold verify (authn+org+rbac, dual deployment mode)
    runs-on: ubuntu-latest
    # A cold pull of three container images (Redis, RustFS, Mailpit) plus a
    # real, network-backed `go mod tidy` and two full boot-and-smoke
    # cycles: generous relative to the reusable integration-tiers rows'
    # own 20-minute budget (full-check.yml) since this job also pays for
    # project materialization and two real go builds neither of those rows
    # does.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Go toolchain and module cache
        uses: ./.github/actions/setup-go-env
      - name: Dual-mode scaffold boot (testcontainers, real go mod tidy)
        working-directory: go/saasctl
        run: go test -tags=integration ./integration_test/... -run TestScaffoldNewProject_AuthnOrgRbac_BootsInBothDeploymentModes -v -timeout 15m
