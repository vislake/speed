name: release
# The lockstep release pipeline: offline verification first, then -- for
# a verified version -- the real release.
#
# Manually dispatched with a version number (the `version` input is the
# contract). Job `verify` proves the full lockstep plan for that version
# is consistent -- the coordinator's default mode
# (tools/release/lockstep-release.py) derives the publishable set at
# runtime (go.work use entries under go/ for the Go half, web/packages/*
# for the npm half) and exits 0 only when: the version has release-version
# form; the go/ tree is complete against go.work; web/ package versions
# are uniform and the web/.changeset fixed group covers exactly the
# packages that exist; and no tag for the version exists -- module tags
# go/<module>/<version> or the repo root tag (the bare version, the
# release's milestone reference) -- an existing same-version tag only
# warns ([warn] in the plan): it marks a re-run of a partially completed
# release whose Go tags landed but whose npm half did not, which job
# `publish` recovers by skipping every existing tag and re-walking the
# npm half, where a registry probe skips each package@version that is
# already there. The job then runs the coordinator's own self-tests.
# Job `publish` (needs: verify, and the workflow's write permissions
# live there, not on `verify`) performs the release the verified plan
# names.
#
# THE v0.0.1 DISPOSITION (mechanism landed 2026-09-10; the dispatch is
# the first real end-to-end run): the first real release uses both
# halves of the one-version plan.
#   * Go modules release by pushing the 21 go/<module>/v0.0.1 tags -- the
#     Go multi-module repository convention, under which the Go module
#     proxy serves each module from the tag its path names. The tags are
#     pushed BY THIS WORKFLOW, at the exact commit the run checked out
#     and verified: one dispatch releases everything, the released
#     content is the verified content, and the hand-tagging risk the
#     original design called out ("MUST be scripted; hand-tagging always
#     misses one") is gone. The coordinator script keeps its offline
#     character -- its gated local-only apply mode exists to exercise
#     tag creation against scratch repositories; pushing is a workflow
#     concern, never a script one.
#     With the module tags the workflow also pushes the repo root tag
#     v0.0.1 -- the version milestone reference: one repository-level
#     tag per release saying "the repository is at this version",
#     created at THIS run's checkout (the dispatch-time main tip) under
#     the same skip-if-exists rule. The root tag and the module tags of
#     one version are not expected to share a commit: the module tags
#     stay pinned to their publish commit (fbaaaf98 for v0.0.1) and
#     never move, while the root tag may sit on post-release fix
#     commits -- by design; the full semantics of the two are
#     documented in docs/internal/02-repo-and-release.md.
#   * The twelve npm packages (the web/.changeset fixed group) publish at
#     0.0.1 to the GitHub Packages npm registry
#     (https://npm.pkg.github.com) under the @speed scope, each from its
#     own directory with `npm publish --registry
#     https://npm.pkg.github.com`, authenticated with the built-in
#     GITHUB_TOKEN as the npm token (permissions: packages: write) --
#     the .npmrc pair GitHub documents: the auth line
#     `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}` in the
#     runner's ~/.npmrc plus the scope mapping
#     `@speed:registry=https://npm.pkg.github.com`, so no @speed request
#     can route anywhere else. Publishing to npmjs.org is deferred to
#     v1.0 (M4), with the rest of the deferred list below.
#
# WHAT JOB `publish` DOES, IN ORDER:
#   1. Refuses to push tags while any publishable go/<module>/go.mod
#      still carries a sibling replace (`X => ../X`). The first release
#      must tag a commit whose go.mods name the real versions: consumers
#      resolve sibling requires through the module proxy, where a
#      dependency's own replace directives do not apply. The release
#      commit that applies the cleanup engine -- shipped fixture-tested
#      as pure functions in tools/release/lockstep-release.py -- is
#      prepared before dispatch and pushed to main; this workflow tags
#      whatever commit the run checked out, never a commit it rewrites.
#   2. Creates and pushes this version's tags: the module tags
#      go/<module>/<version> -- the module set derived from go.work
#      with the coordinator's own parser, so the tag set cannot drift
#      from the verified plan -- plus the repo root tag, the bare
#      version itself, the release's milestone reference created at
#      this run's own checkout. The step is idempotent over a re-run:
#      when the verify job's [warn] line appears (a partially completed
#      release -- Go tags landed, npm half did not), each derived tag
#      that already exists is skipped -- module tags and the repo root
#      tag alike, a released tag is never re-created or moved, module
#      proxies cache it -- and only the new tags are pushed. When all
#      of them exist the push is skipped entirely and the run re-walks
#      the npm half.
#   3. Publishes the npm half: pinned pnpm install --frozen-lockfile and
#      a filtered workspace build (the same toolchain and shape the
#      npm-package-ci workflow uses), then, per package in dependency
#      order, `npm publish --registry https://npm.pkg.github.com`. npm
#      knows no workspace: protocol, so each manifest's @speed sibling
#      specifiers (workspace:* in the committed tree; pnpm-lock.yaml
#      records workspace members as links, never versions) are rewritten
#      to the exact release version on the runner copy first -- the
#      rewrite pnpm publish performs at pack time, made explicit -- and
#      a pre-release version (v0.0.1-rc.1 form) publishes under the
#      `next` dist-tag. The loop is idempotent over a re-run, mirroring
#      the tag step: before each publish it probes the registry for
#      @speed/<package>@<version> (npm view against
#      https://npm.pkg.github.com, through the same ~/.npmrc credential
#      the publish uses) and skips a version that is already there --
#      no version is ever published twice (the skip is the
#      double-publish guard on this leg), and a re-run converges from
#      any partial npm state, the first k packages published included.
#
# STILL DEFERRED (this header is the authority): npmjs.org registry
# publishing; changesets-driven versioning and npm provenance; SBOMs and
# the GitHub Release object (changelog + assets); the artifact legs
# (versioned multi-arch image publishing under the lockstep lifecycle --
# the GHCR builds today carry CI tags only -- goreleaser binaries, the
# merged speed.yaml as a Release asset and docs-site version directory);
# oasdiff breaking-change baselining (the v0.0.1 publish commit in this
# repository's history provides the first baseline anchor; the wiring
# is not done); post-release
# scaffold-verify triggers (a real release event exists from v0.0.1 on;
# the trigger wiring is not done); trivy image scanning (the image build
# stays workflow_dispatch-only); and license-scan transitive-dependency
# extension. Each stays scheduled with v1.0 (M4) in
# docs/internal/24-deferral-roadmap.md chapter 5.
#
# Pre-release channels ship v<version>-rc.N first (reference-app
# validates, then the stable release). Rollback policy: released Go tags
# cannot be recalled (module proxies cache), so rollback = patch release,
# never tag deletion; npm packages are deprecated, not deleted.
#
# GATE: one dispatch releases every module under the same version --
# verified offline by the coordinator and its self-tests, then pushed
# and published by this workflow. The v0.0.1 dispatch is that gate's
# first real end-to-end run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. v1.2.0 or a pre-release v1.2.0-rc.1.
        required: true
        type: string
        # Format validation: workflow_dispatch inputs accept no `pattern`
        # key, so this pipeline validates the version in its first step
        # against ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ and aborts the
        # run on a mismatch. The coordinator enforces the same pattern
        # (VERSION_PATTERN in tools/release/lockstep-release.py); the two
        # copies must stay in step.

permissions:
  contents: read

jobs:
  verify:
    name: Verify the lockstep release plan offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        # The same commit-SHA pin every sibling workflow uses (fast-check,
        # api-contract, docs-check, security and reusable-docker-build all
        # checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1,
        # tagged v7.0.1): a floating version tag could silently change what
        # this pipeline runs on and drift from the pinned ones -- a
        # tag-move cannot change a SHA.
        # fetch-depth: 0 (full history incl. tags): the duplicate-version
        # preflight lists tags with `git tag -l`, and actions/checkout's
        # default shallow fetch would see none -- silently neutering it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate the version input format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: version '$VERSION' is not a release-version form:"
            echo "       expected ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ -- the"
            echo "       leading 'v' is required (v1.2.0, v1.2.0-rc.1, ...)."
            exit 1
          fi
          echo "version input '$VERSION' has release-version form"
      - name: Verify the lockstep release plan (coordinator default mode)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Prints the full one-version plan (every go/ module with its
          # go/<module>/<version> tag, every web/ package with the version
          # the changesets fixed group bumps it to) and exits 0 only when
          # the plan is consistent. Nothing is tagged, written or
          # published by this job.
          python3 tools/release/lockstep-release.py "$VERSION"
      - name: Run the coordinator self-tests
        run: |
          # Cleanup-engine fixture tests, go.work/npm drift-gate tests, and
          # the sandbox end-to-end proof (scratch git repository only).
          python3 tools/release/lockstep-release.py --self-test
      - name: Report
        run: |
          echo "offline verification green for ${{ inputs.version }}."
          echo "The publish job of this run performs the real release for"
          echo "that version: the module tags and the repo root tag"
          echo "pushed, the twelve @speed npm packages published to the"
          echo "GitHub Packages registry."

  publish:
    name: Publish ${{ inputs.version }} (Go tags and npm packages)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    # The write permissions live here, on the job that writes -- verify
    # keeps contents: read. contents: write pushes the module tags (and
    # is the credential actions/checkout stored for the push); packages:
    # write publishes the npm packages to the GitHub Packages registry
    # as the built-in GITHUB_TOKEN.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate the version input format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: version '$VERSION' is not a release-version form."
            exit 1
          fi
          echo "version input '$VERSION' has release-version form"
      - name: Push the Go module and repo root tags for this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # First-release guard: a publishable go.mod that still carries a
          # sibling replace (X => ../X) cannot be the released artifact --
          # consumers resolve sibling requires through the Go module proxy,
          # where a dependency's replace directives do not apply. The
          # release commit that applies the fixture-tested cleanup engine
          # (first_release_replace_cleanup in tools/release/lockstep-
          # release.py) is prepared before dispatch; refuse to tag while
          # any module is still in the transition state.
          if grep -lEq '=> \.\./' go/*/go.mod; then
            echo "error: refusing to tag while publishable go.mods still"
            echo "       carry a sibling replace (the transition state a"
            echo "       release must have cleaned before dispatch):"
            grep -lE '=> \.\./' go/*/go.mod | sed 's/^/         /'
            exit 1
          fi
          # Derive the module set from go.work with the coordinator's own
          # parser, so the tag set cannot drift from the verified plan.
          python3 - "$VERSION" > /tmp/module-tags.txt <<'PYEOF'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location(
              "lockstep_release", "tools/release/lockstep-release.py"
          )
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          text = open("go.work", encoding="utf-8").read()
          for entry in m.parse_gowork_uses(text):
              if entry.startswith("go/") and entry.count("/") == 1:
                  print(f"go/{entry[3:]}/{sys.argv[1]}")
          PYEOF
          mapfile -t tags < /tmp/module-tags.txt
          # The repo root tag -- the bare version itself -- is the
          # version milestone reference: the one repository-level tag
          # per release. It joins the module tags under the same
          # skip-if-exists rule and is created at THIS checkout (the
          # dispatch-time main tip). For a re-run of a version released
          # earlier it may therefore point at a NEWER commit than the
          # existing module tags, which stay pinned to their publish
          # commit and never move -- the two are not expected to share
          # a commit; that difference is by design (documented in
          # docs/internal/02-repo-and-release.md).
          tags+=("$VERSION")
          # Re-run recovery: when a partially completed release (Go tags
          # landed, npm half did not) is re-dispatched, derived tags may
          # already exist. A released tag is never re-created or moved
          # (module proxies cache it), so skip each existing tag --
          # module tags and the repo root tag alike -- tag and push only
          # the new ones, and skip the push when all exist. The checkout
          # carries the tags (fetch-depth: 0 above), so the existence
          # check sees the same tag set the push would create.
          new_tags=()
          for t in "${tags[@]}"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "  tag $t already exists -- skipped (re-run recovery)"
            else
              new_tags+=("$t")
            fi
          done
          if [ "${#new_tags[@]}" -eq 0 ]; then
            echo "no new tags: every tag for this version already exists"
            echo " -- this version was released before; this run re-walks"
            echo " the npm half, skipping the versions the registry has"
          else
            if [ "${#new_tags[@]}" -eq 1 ]; then
              echo "Tagging 1 new tag at the verified checkout:"
            else
              echo "Tagging ${#new_tags[@]} new tags at the verified checkout:"
            fi
            for t in "${new_tags[@]}"; do
              git tag "$t"
              echo "  tag $t"
            done
            git push origin "${new_tags[@]/#/refs/tags/}"
            if [ "${#new_tags[@]}" -eq 1 ]; then
              echo "pushed 1 tag"
            else
              echo "pushed ${#new_tags[@]} tags"
            fi
          fi
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        # The same reusable setup npm-package-ci uses: Node from
        # web/.nvmrc, pnpm from web/package.json's packageManager field.
        uses: ./.github/actions/setup-node-env
      - name: Install workspace dependencies (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build the twelve packages
        working-directory: web
        run: |
          # dist/ is gitignored and built per package; each package's
          # build script pulls its @speed dependencies' builds through
          # its own --filter legs. A workspace-filtered recursive build
          # emits every export map the publish packs.
          pnpm -r --filter "@speed/*" build
      - name: Publish the twelve @speed packages to the GitHub Packages registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION_NO_V="${VERSION#v}"
          # The .npmrc pair GitHub documents for package-scoped registry
          # use: the auth line for the GitHub Packages npm host in the
          # runner's own ~/.npmrc (npm expands ${NODE_AUTH_TOKEN} from the
          # environment when it reads the file), plus the @speed scope
          # mapping so no @speed request can route anywhere else. Both
          # lines also make an accidental npmjs.org publish impossible:
          # that registry has no credential and no mapping here.
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n@speed:registry=https://npm.pkg.github.com\n' > "${HOME}/.npmrc"
          # Dependency-first order: every package publishes before any
          # package that depends on it (the manifest rewrite below names
          # real versions, so an in-order publish also leaves no window
          # in which a consumer could resolve a not-yet-published half).
          packages="tokens i18n api-client ui-kit api-sdk auth-core layout-kit billing-ui tenancy-ui auth-ui account-ui product-shell"
          for p in $packages; do
            pkg_json="web/packages/$p/package.json"
            # Re-run recovery on the npm side, mirroring the tag step: a
            # partial publish state (the first k packages made it up)
            # must not fail the re-dispatch. Probe the registry for the
            # exact version first and skip the publish when it is
            # already there -- the probe is read-only and goes through
            # the same ~/.npmrc credential the publish uses (packages:
            # write implies read for the owning installation), and a
            # version that exists is never published or overwritten
            # again.
            if npm view "@speed/$p@$VERSION_NO_V" \
                --registry https://npm.pkg.github.com --json >/dev/null 2>&1; then
              echo "@speed/$p@$VERSION_NO_V already exists on the registry -- skipped (re-run recovery)"
              continue
            fi
            # npm knows no workspace: protocol -- rewrite the @speed
            # sibling specifiers (workspace:* in the committed tree) to
            # the exact release version on this runner copy, mirroring
            # what pnpm publish does at pack time. Committed manifests
            # keep workspace:*; only the published copy is rewritten.
            python3 - "$pkg_json" "$VERSION_NO_V" <<'PYEOF'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          data = json.load(open(path, encoding="utf-8"))
          changed = False
          for field in ("dependencies", "devDependencies", "optionalDependencies"):
              for name, spec in (data.get(field) or {}).items():
                  if name.startswith("@speed/") and spec == "workspace:*":
                      data[field][name] = version
                      changed = True
          if changed:
              with open(path, "w", encoding="utf-8") as fh:
                  json.dump(data, fh, indent=2)
                  fh.write("\n")
          PYEOF
            dist_tag=""
            if [[ "$VERSION" == *-* ]]; then
              # A pre-release version publishes under the `next`
              # dist-tag, never `latest` (the header's pre-release
              # channel policy).
              dist_tag="--tag next"
            fi
            echo "publishing @speed/$p at $VERSION_NO_V"
            (cd "web/packages/$p" && npm publish --registry https://npm.pkg.github.com $dist_tag)
          done
      - name: Report
        run: |
          echo "release run for ${{ inputs.version }} complete: the tag"
          echo "step finished (new tags pushed, existing tags skipped)"
          echo "and the npm half finished (new versions published,"
          echo "versions already on the registry skipped)."
