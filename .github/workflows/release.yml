name: release

# The lockstep release pipeline, M0 status: OFFLINE VERIFICATION ONLY.
#
# Manually dispatched with a version number (the `version` input is the
# contract and stays). This M0 round verifies, for that version, that the
# full lockstep release plan is consistent -- the coordinator's default
# mode (tools/release/lockstep-release.py) derives the publishable set at
# runtime (go.work use entries under go/ for the Go half, web/packages/*
# for the npm half) and exits 0 only when: the version has release-version
# form; no tag for it exists; the go/ tree is complete against go.work;
# web/ package versions are uniform and the web/.changeset fixed group
# covers exactly the packages that exist. The job then runs the
# coordinator's own self-tests (fixture-based cleanup-engine tests and a
# sandbox end-to-end tag proof against a scratch git repository). A valid
# version with green checks passes; an invalid version or any failed check
# fails the run.
#
# THE REAL PUBLISHING SEQUENCE (docs/internal/18-cicd.md, release section)
# IS NOT WIRED AND IS SCHEDULED FOR THE v1.0 RELEASE AT M4. The 18-cicd
# sequence, and what each step waits for:
#   1. preflight -- main branch green, clean workspace, changelog
#      generated; the version-format and duplicate-tag preflights run
#      here already (this job), the rest waits for the release round's
#      process decisions (docs/internal/02-repo-and-release.md).
#   2. full test matrix, any failure aborts -- waits for nothing
#      technical: full-check already runs the Docker-backed integration
#      matrix on full-ci-labelled PRs today; the release round mounts the
#      same reusable workflows here.
#   3. Go release -- one tag per module directory, go/<module>/<version>
#      form, MUST be scripted (hand-tagging always misses one). Tag
#      creation exists in the coordinator as a HARD-GATED local-only mode
#      (--apply requires --allow-local-tag-creation, refused otherwise);
#      pushing the tags waits for M4. The first release additionally
#      scans every module go.mod for transitional
#      `replace ... => ../<module>` lines, rewrites them to the real
#      versions and re-runs go mod tidy (docs/internal/02-repo-and-
#      release.md transition state; a missed line breaks consumer `go
#      get`). The cleanup engine ships today as pure functions
#      (first_release_replace_cleanup in tools/release/lockstep-release
#      .py), exercised ONLY against the fixtures under tools/release/
#      testdata/ -- the live tree keeps its transition state until M4.
#   4. npm release -- changesets fixed version group (bootstrap lives at
#      web/.changeset/config.json), published with provenance -- waits
#      for M4: changesets is not installed in web/ and no publish
#      credential exists in this repository.
#   5. artifacts -- multi-arch (amd64/arm64) images, saasctl binaries
#      (goreleaser), the merged OpenAPI spec speed.yaml (Release asset +
#      @speed/api-sdk + docs-site version directory) -- waits for the
#      artifact round (goreleaser config, image builder, spec merge
#      tooling all land later).
#   6. post-release scaffold-verify on the just-released version --
#      waits for scaffold-verify.yml to leave its gated-stub status.
#   7. outputs -- GitHub Release + changelog + SBOM -- waits for M4.
# Pre-release channels ship v<version>-rc.N first (reference-app
# validates, then the stable release). Rollback policy: released Go tags
# cannot be recalled (module proxies cache), so rollback = patch release,
# never tag deletion; npm packages are deprecated, not deleted. The
# pipeline doc must state this.
#
# WHAT EXISTS TODAY: the offline verification above. No publish
# credential is wired anywhere (permissions: contents: read), so this
# workflow cannot create a release, push a tag or publish an npm package;
# no step here can ever publish for real, by construction.
#
# GATE: roadmap M0 "lockstep release scripts" engineering item (M0 exit
# acceptance: one command releases every module under the same version --
# proven OFFLINE by this job); first end-to-end run at the v1.0 release
# (M4).

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. v1.2.0 or a pre-release v1.2.0-rc.1.
        required: true
        type: string
        # Format validation: workflow_dispatch inputs accept no `pattern`
        # key, so this pipeline validates the version in its first step
        # against ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ and aborts the
        # run on a mismatch. The coordinator enforces the same pattern
        # (VERSION_PATTERN in tools/release/lockstep-release.py); the two
        # copies must stay in step.

permissions:
  contents: read

jobs:
  verify:
    name: Verify the lockstep release plan offline (M0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        # fetch-depth: 0 (full history incl. tags): the duplicate-version
        # preflight lists tags with `git tag -l`, and actions/checkout's
        # default shallow fetch would see none -- silently neutering it.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the version input format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: version '$VERSION' is not a release-version form:"
            echo "       expected ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ -- the"
            echo "       leading 'v' is required (v1.2.0, v1.2.0-rc.1, ...)."
            exit 1
          fi
          echo "version input '$VERSION' has release-version form"
      - name: Verify the lockstep release plan (coordinator default mode)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Prints the full one-version plan (every go/ module with its
          # go/<module>/<version> tag, every web/ package with the version
          # the changesets fixed group bumps it to) and exits 0 only when
          # the plan is consistent. Nothing is tagged, written or
          # published.
          python3 tools/release/lockstep-release.py "$VERSION"
      - name: Run the coordinator self-tests
        run: |
          # Cleanup-engine fixture tests, go.work/npm drift-gate tests, and
          # the sandbox end-to-end proof (scratch git repository only).
          python3 tools/release/lockstep-release.py --self-test
      - name: Report
        run: |
          echo "offline verification green for ${{ inputs.version }} -- the"
          echo "lockstep release machinery is proven. Real publishing is"
          echo "scheduled for the v1.0 release at M4, by design of this M0"
          echo "round; this workflow wires no publish credential."
