name: api-contract

# API-contract discipline pipeline -- docs/internal/18-cicd.md's pipeline
# table, api-contract row: both halves implemented, backend
# (oapi-codegen) and frontend (orval -> @speed/api-sdk). Backs the root
# CLAUDE.md API-contract discipline and docs/internal/21-api-contract.md's
# spec-first order: edit api/openapi.yaml -> task api:gen -> compilation
# failures reveal every handler to fix -> commit spec, generated artifacts
# and implementation in the same PR. Target under 5 minutes; this job
# carries a timeout and stale runs are cancelled via concurrency.
#
# DESIGN-TABLE TRIGGER: PRs touching api/openapi.yaml or the generation
# side of the toolchain, via GitHub-native path filtering on the
# pull_request event -- zero third-party actions (dorny/paths-filter stays
# future work, per 18-cicd's cost-control section). The path set below
# deliberately matches what regeneration can be affected by: the spec
# fragment(s), the generator config, the api:gen task definition, and this
# workflow itself. A PR touching only handler code has nothing to
# regenerate; whether it still implements the interface is a compile
# question, answered by pr-full's reference-app job on full-ci-labeled PRs
# (the reference-app unit suite is not part of pr-check -- see pr-check's
# DELIBERATELY NOT WIRED list).
#
# COVERAGE -- what genuinely runs today
#   * Regeneration consistency: the pinned oapi-codegen (v2.8.0, the exact
#     same go run as Taskfile's api:gen task, run from the same directory)
#     regenerates the notes module's api/notes-server.gen.go from its
#     api/openapi.yaml fragment, then `git diff --exit-code` fails the job
#     if the committed artifact is not what the spec generates -- the
#     21-api-contract.md generated-artifact consistency check for the
#     backend half, catching a spec edit committed without its regenerated
#     artifact.
#   * Compile enforcement: `go build ./...` of examples/reference-app.
#     This is what makes "spec changed, handler not updated" fail here:
#     the regenerated api.ServerInterface grows and Handler's compile-time
#     assertion (internal/notes/handler.go) stops compiling. Without this
#     leg a spec+artifact PR whose handler lagged would pass both this
#     pipeline and pr-check (which does not build the reference app).
#     Precise only for a parameter-free operation, though: an operation
#     carrying a path or query parameter makes the generated file import
#     github.com/oapi-codegen/runtime, which the app's go.mod does not
#     require (nothing parameterized ships yet), so the first such spec
#     change fails earlier -- on the missing module -- rather than on the
#     assertion. Both are hard build failures; only the diagnostic
#     differs, and it resolves itself the moment a real parameterized
#     operation lands with its handler. Pre-adding the require would not
#     help: `go mod tidy` drops an unused dependency.
#   * Frontend-sdk regeneration consistency: the pinned orval (8.17.0 --
#     the exact same `pnpm dlx orval` + nodenext-fixup pair as Taskfile's
#     api:gen frontend leg, run from web/) regenerates @speed/api-sdk's
#     src/index.ts from the same notes fragment, then a second
#     `git diff --exit-code` fails the job if the committed generated
#     package is not what the spec generates -- the generated-artifact
#     consistency check for the frontend half. orval itself is never a
#     workspace dependency (pnpm dlx, no lockfile entry); a version bump
#     is visible in the regenerated header and must land in Taskfile,
#     web/orval.config.ts and this file together.
#
# DELIBERATELY NOT WIRED HERE -- API-contract items whose tooling does
# not exist yet (wiring them now would be fake checks):
#   * spec merging into build/openapi/speed.yaml -- no second module
#     fragment exists yet; the notes fragment is generated from in place.
#     The redocly merge waits for the second fragment (M1).
#   * spec linting (redocly rules) -- lands with the merge above.
#   * breaking-change detection (oasdiff, the release-gate diff against
#     the last release) -- waits for the first release baseline (M4); a
#     recorded mechanism decision, not a fake gate
#     (docs/internal/21-api-contract.md).
#   * merge-conflict checks across fragments -- a single-fragment world has
#     nothing to conflict.
# Each lands with its tooling round; the stub headers of the other gated
# pipelines stay until then.
#
# PATH SET -- spec/generator-toolchain changes only:
#   examples/reference-app/internal/notes/api/**   the notes fragment, its
#                                                  generator config and the
#                                                  backend generated
#                                                  artifact (a hand-edit of
#                                                  the generated file
#                                                  triggers the consistency
#                                                  diff)
#   web/orval.config.ts, web/scripts/**            the frontend generator
#                                                  config and the fixup
#                                                  script behind the regen
#                                                  command
#   web/packages/api-sdk/**                        the generated frontend
#                                                  package (a hand-edit
#                                                  triggers the diff)
#   Taskfile.yml                                   api:gen task (the
#                                                  regeneration command)
#   .github/workflows/api-contract.yml             this workflow itself

on:
  pull_request:
    paths:
      - examples/reference-app/internal/notes/api/**
      - web/orval.config.ts
      - web/scripts/**
      - web/packages/api-sdk/**
      - Taskfile.yml
      - .github/workflows/api-contract.yml
  workflow_dispatch:

concurrency:
  group: api-contract-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-contract:
    name: api contract consistency and compile enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # golangci-lint is deliberately not installed here (setup-go-env's
      # install-golangci input, default false): this job never lints, and an
      # unconditional install would mean a ~15 MB download on every run for
      # nothing. The Go toolchain is what oapi-codegen (go run) and the
      # build leg need; the Go build cache makes repeated runs fast.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: Regenerate the notes module's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task -- keep the two in
        # lockstep (both pin the generator at v2.8.0). Run from the fragment's
        # own directory, where oapi-codegen.yaml's paths are relative.
        run: |
          cd examples/reference-app/internal/notes/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Generated artifact must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in api/notes-server.gen.go is not what"
            echo "api/openapi.yaml generates -- did you change the spec"
            echo "without running 'task api:gen' and committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          }
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        # Mirrors the npm CI jobs (reusable/npm-package-ci.yml): the same
        # composite action, the same single version sources (web/.nvmrc,
        # web/package.json's packageManager field) and the same pnpm store
        # cache keyed on the lockfile hash.
        uses: ./.github/actions/setup-node-env
      - name: Install web workspace dependencies (frozen lockfile)
        # --frozen-lockfile doubles as the importer check: a PR that adds
        # or renames a web/ package without its pnpm-lock.yaml entry fails
        # here.
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Regenerate the frontend SDK from the notes fragment (pinned orval 8.17.0)
        # The same command pair as Taskfile.yml's api:gen frontend leg --
        # keep the two in lockstep (both pin orval at 8.17.0; orval is
        # never a workspace dependency, so the lockfile cannot pin it).
        # Run from web/ with the relative config path, then the
        # nodenext fixup rewrites the mutator import to its explicit .js
        # form (why: @speed/api-sdk's AGENTS.md).
        run: |
          pnpm dlx orval@8.17.0 --config orval.config.ts
          node scripts/orval-nodenext-fixup.mjs
        working-directory: web
      - name: Generated frontend SDK must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in web/packages/api-sdk/src/index.ts is"
            echo "not what the notes fragment generates -- did you change the"
            echo "spec or web/orval.config.ts without running 'task api:gen'"
            echo "and committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          }
      - name: Handler must still implement the generated ServerInterface
        # The compile-enforcement half: if the spec (and with it the
        # generated interface) outgrew Handler, this build fails on
        # handler.go's compile-time assertion and shows exactly which
        # method is missing.
        run: |
          cd examples/reference-app
          go build ./...
