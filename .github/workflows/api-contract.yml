name: api-contract

# API-contract discipline pipeline -- docs/internal/18-cicd.md's pipeline
# table, api-contract row: both halves implemented, backend
# (oapi-codegen) and frontend (orval -> @speed/api-sdk), plus the
# multi-fragment merge (redocly) now that a third fragment exists -- the
# merged document doubles as orval's input, which is why this file's
# steps run the merge before the frontend regeneration. Backs the root
# CLAUDE.md API-contract discipline and docs/internal/21-api-contract.md's
# spec-first order: edit api/openapi.yaml -> task api:gen -> compilation
# failures reveal every handler to fix -> commit spec, generated artifacts
# and implementation in the same PR. Target under 5 minutes; this job
# carries a timeout and stale runs are cancelled via concurrency.
#
# DESIGN-TABLE TRIGGER: PRs touching api/openapi.yaml or the generation
# side of the toolchain, via GitHub-native path filtering on the
# pull_request event -- zero third-party actions (dorny/paths-filter stays
# future work, per 18-cicd's cost-control section). The path set below
# deliberately matches what regeneration can be affected by: the spec
# fragment(s), the generator config, the api:gen task definition, and this
# workflow itself. A PR touching only handler code has nothing to
# regenerate; whether it still implements the interface is a compile
# question, answered by pr-full's reference-app job on full-ci-labeled PRs
# (the reference-app unit suite is not part of pr-check -- see pr-check's
# DELIBERATELY NOT WIRED list) and, for authn, by this workflow's own
# go/authn build leg below (go/authn is a real module built on every
# pr-check run regardless of what changed, so its own compile enforcement
# does not need to wait for full-ci the way the reference app's does).
#
# COVERAGE -- what genuinely runs today (in step order)
#   * Regeneration consistency (notes): the pinned oapi-codegen (v2.8.0,
#     the exact same go run as Taskfile's api:gen task, run from the same
#     directory) regenerates the notes module's api/notes-server.gen.go
#     from its api/openapi.yaml fragment, then `git diff --exit-code`
#     fails the job if the committed artifact is not what the spec
#     generates -- the 21-api-contract.md generated-artifact consistency
#     check for the backend half, catching a spec edit committed without
#     its regenerated artifact.
#   * The same regeneration-consistency check runs a second time for org's
#     fragment (go/org/api/openapi.yaml -> go/org/api/org-server.gen.go),
#     the second module to carry one -- same pinned oapi-codegen invocation,
#     same git diff --exit-code gate, its own step so each fragment's
#     failure is unambiguous in the job log.
#   * Regeneration consistency (storage): the same check runs a third
#     time for storage's fragment (go/storage/api/openapi.yaml ->
#     go/storage/api/storage-server.gen.go), the third module to carry a
#     fragment -- same pinned oapi-codegen invocation, same git diff
#     --exit-code gate, its own step so each fragment's failure is
#     unambiguous in the job log.
#   * Regeneration consistency (notification): the same check runs a
#     fourth time for notification's fragment (go/notification/api/
#     openapi.yaml -> go/notification/api/notification-server.gen.go),
#     this round's addition to the fragment set -- same pinned
#     oapi-codegen invocation, same git diff --exit-code gate, its own
#     step so each fragment's failure is unambiguous in the job log.
#   * Spec merge + info stamp + naming-convention lint: the pinned
#     redocly CLI (2.51.1, the same
#     `pnpm --package=@redocly/cli@2.51.1 dlx redocly ...` invocation as
#     Taskfile's api:merge task) `join`s the three fragments -- notes,
#     authn and notification -- into build/openapi/speed.yaml, then the
#     deterministic
#     `web/scripts/redocly-join-fixup.mjs` stamp rewrites the merged
#     document's info block (join keeps the FIRST fragment's info;
#     without the stamp the application-wide document -- and through
#     orval's header the generated SDK -- would carry notes' title and
#     a description claiming the merge is still future work), then
#     `lint`s the result against redocly.yaml's rules (operationId
#     format, component schema-name format, tag format --
#     docs/internal/21-api-contract.md's naming conventions that avoid
#     merge conflicts), then a `git diff --exit-code` fails the job if
#     the committed build/openapi/speed.yaml is not what the three
#     fragments merge -- plus the stamp -- to today -- the
#     generated-artifact consistency check for the merged document,
#     same shape as the four artifact checks above. These steps sit
#     before the frontend regeneration below because the merged
#     document is that leg's input: order-dependent gates must see the
#     fresh merge first, not a merged document the job itself will
#     overwrite later in the same run.
#   * Frontend-sdk regeneration consistency (merged document): the pinned
#     orval (8.17.0 -- the exact same `pnpm dlx orval` + nodenext-fixup
#     pair as Taskfile's api:gen frontend leg, run from web/) regenerates
#     @speed/api-sdk's src/index.ts from build/openapi/speed.yaml -- the
#     document merged in the step above, covering the notes, authn and
#     notification fragments; org's and storage's fragments are
#     deliberately not part of the merge -- org's because it predates
#     the merge machinery and storage's because it ships its backend leg
#     only, both fragments' frontend halves deferring to their own
#     module AGENTS.md deferrals -- while notification's fragment joined
#     the merged document when its recipient-facing HTTP surface
#     shipped: its operations are self-service surfaces a consumer
#     shell's SDK calls, the same reason authn's fragment is in the
#     merge -- then a `git diff --exit-code` fails the job if
#     the committed generated package is not what the spec generates --
#     the generated-artifact consistency check for the frontend half.
#     orval itself is never a workspace dependency (pnpm dlx, no lockfile
#     entry); a version bump is visible in the regenerated header and
#     must land in Taskfile, web/orval.config.ts and this file together.
#   * Compile enforcement (notes, org, storage and notification):
#     `go build ./...` of examples/reference-app. This is what makes
#     "spec changed, handler not updated" fail here for ANY of the four
#     fragments: examples/reference-app imports go/org, go/storage and
#     go/notification (root CLAUDE.md's mandatory-first-consumer rule),
#     so a regenerated api.ServerInterface that outgrows any Handler's
#     compile-time assertion (internal/notes/handler.go,
#     go/org/handler.go, go/storage/handler.go,
#     go/notification/handler.go) fails this one build step,
#     transitively, with no separate step needed for org's, storage's or
#     notification's own module build. Without this leg a spec+artifact
#     PR whose handler lagged
#     would pass both this pipeline and pr-check (which does not build
#     the reference app). Precise only for a parameter-free operation,
#     though: an operation carrying a path or query parameter makes the
#     generated file import github.com/oapi-codegen/runtime, which the
#     app's go.mod does not require unless something parameterized
#     already ships, so the first such spec change fails earlier -- on
#     the missing module -- rather than on the assertion. Both are hard
#     build failures; only the diagnostic differs, and it resolves
#     itself the moment a real parameterized operation lands with its
#     handler. Pre-adding the require would not help: `go mod tidy`
#     drops an unused dependency.
#   * Regeneration consistency (authn): the identical oapi-codegen v2.8.0
#     invocation over go/authn/api/openapi.yaml, then its own
#     `git diff --exit-code` on go/authn/api/authn-server.gen.go -- the
#     backend half only. authn's frontend half needs no separate leg: it
#     is generated together with notes' and notification's from the
#     merged document above, and @speed/auth-core has compile-consumed
#     the generated surface since the auth-core round (runtime
#     consumption stays with the consumer shells).
#   * Compile enforcement (authn): `go build ./...` of go/authn, the same
#     "spec changed, handler not updated" guarantee notes' reference-app
#     build gives, against go/authn/handler.go's own compile-time
#     assertion.
#
# DELIBERATELY NOT WIRED HERE -- API-contract items whose tooling does
# not exist yet (wiring them now would be fake checks):
#   * breaking-change detection (oasdiff, the release-gate diff against
#     the last release) -- waits for the first release baseline (M4); a
#     recorded mechanism decision, not a fake gate
#     (docs/internal/21-api-contract.md).
#   * a redocly rule enforcing the "/api/v1/<module>" path-prefix
#     convention -- redocly has no subject type that exposes a PathItem's
#     own map key to an assertion (verified empirically against a real
#     merge of the fragments; see redocly.yaml's own trailing comment),
#     so it stays a code-review concern rather than a rule that would not
#     actually check what its name claims.
#   * cross-fragment merge-conflict checks as a gate of their own -- the
#     naming-convention lint above is what keeps fragments from
#     colliding under the merge, and the merged-document diff gate
#     catches a committed speed.yaml that drifted from a fresh merge, so
#     a separate check would only re-check what those already do.
# Each lands with its tooling round; the stub headers of the other gated
# pipelines stay until then.
#
# PATH SET -- spec/generator-toolchain changes only:
#   examples/reference-app/internal/notes/api/**   the notes fragment, its
#                                                  generator config and the
#                                                  backend generated
#                                                  artifact (a hand-edit of
#                                                  the generated file
#                                                  triggers the consistency
#                                                  diff)
#   go/org/api/**                                  org's fragment, its
#                                                  generator config and its
#                                                  own backend generated
#                                                  artifact -- same reasoning
#                                                  as the notes row above
#   go/storage/api/**                             storage's fragment, its
#                                                 generator config and its
#                                                 own backend generated
#                                                 artifact -- same reasoning
#                                                 as the notes row above
#   web/orval.config.ts, web/scripts/**            the frontend generator
#                                                  config and the fixup
#                                                  scripts behind the regen
#                                                  commands
#   web/packages/api-sdk/**                        the generated frontend
#                                                  package (a hand-edit
#                                                  triggers the diff)
#   go/authn/api/**                                 authn's fragment, its
#                                                  generator config and its
#                                                  backend generated
#                                                  artifact
#   go/notification/api/**                          notification's fragment,
#                                                  its generator config and
#                                                  its backend generated
#                                                  artifact
#   redocly.yaml                                   the merge/lint naming-
#                                                  convention rules
#   build/openapi/**                               the committed merged
#                                                  document (a hand-edit
#                                                  triggers the diff)
#   Taskfile.yml                                   api:gen/api:merge tasks
#                                                  (the regeneration
#                                                  commands)
#   .github/workflows/api-contract.yml             this workflow itself

on:
  pull_request:
    paths:
      - examples/reference-app/internal/notes/api/**
      - go/org/api/**
      - go/storage/api/**
      - web/orval.config.ts
      - web/scripts/**
      - web/packages/api-sdk/**
      - go/authn/api/**
      - go/notification/api/**
      - redocly.yaml
      - build/openapi/**
      - Taskfile.yml
      - .github/workflows/api-contract.yml
  workflow_dispatch:

concurrency:
  group: api-contract-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-contract:
    name: api contract consistency and compile enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # golangci-lint is deliberately not installed here (setup-go-env's
      # install-golangci input, default false): this job never lints, and an
      # unconditional install would mean a ~15 MB download on every run for
      # nothing. The Go toolchain is what oapi-codegen (go run) and the
      # build leg need; the Go build cache makes repeated runs fast.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: Regenerate the notes module's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task -- keep the two in
        # lockstep (both pin the generator at v2.8.0). Run from the fragment's
        # own directory, where oapi-codegen.yaml's paths are relative.
        run: |
          cd examples/reference-app/internal/notes/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Generated artifact must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in api/notes-server.gen.go is not what"
            echo "api/openapi.yaml generates -- did you change the spec"
            echo "without running 'task api:gen' and committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          }
      - name: Regenerate org's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's org leg -- keep
        # the two in lockstep (both pin the generator at v2.8.0). Run from
        # the fragment's own directory, where oapi-codegen.yaml's paths are
        # relative, mirroring the notes step above exactly.
        run: |
          cd go/org/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Org's generated artifact must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/org/api/org-server.gen.go is not"
            echo "what go/org/api/openapi.yaml generates -- did you change"
            echo "the spec without running 'task api:gen' and committing"
            echo "the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          }
      - name: Regenerate storage's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's storage leg --
        # keep the two in lockstep (both pin the generator at v2.8.0). Run
        # from the fragment's own directory, where oapi-codegen.yaml's paths
        # are relative, mirroring the notes and org steps above exactly.
        run: |
          cd go/storage/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Storage's generated artifact must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/storage/api/storage-server.gen.go"
            echo "is not what go/storage/api/openapi.yaml generates -- did"
            echo "you change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          }
      - name: Regenerate notification's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's notification
        # leg -- keep the two in lockstep (both pin the generator at
        # v2.8.0). Run from the fragment's own directory, where
        # oapi-codegen.yaml's paths are relative, mirroring the notes,
        # org and storage steps above exactly.
        run: |
          cd go/notification/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Notification's generated artifact must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/notification/api/"
            echo "notification-server.gen.go is not what"
            echo "go/notification/api/openapi.yaml generates -- did you"
            echo "change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          }
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        # Mirrors the npm CI jobs (reusable/npm-package-ci.yml): the same
        # composite action, the same single version sources (web/.nvmrc,
        # web/package.json's packageManager field) and the same pnpm store
        # cache keyed on the lockfile hash. One call serves both Node-based
        # legs of this job: the redocly merge/lint below (its pnpm dlx
        # invocation needs no web/ workspace install) and the web install
        # + orval frontend leg that follows it.
        uses: ./.github/actions/setup-node-env
      - name: Merge every fragment into build/openapi/speed.yaml (pinned redocly 2.51.1)
        # The same command as Taskfile.yml's api:merge task -- keep the two
        # in lockstep (both pin redocly at 2.51.1). `join`, not `bundle`:
        # these fragments are peers, each a complete document, not one root
        # with $refs into the others. This step runs before the frontend
        # regeneration below because build/openapi/speed.yaml is that
        # leg's input: orval must consume the fresh merge, not a merged
        # document this job will overwrite later in the same run.
        run: |
          mkdir -p build/openapi
          pnpm --package=@redocly/cli@2.51.1 dlx redocly join \
            examples/reference-app/internal/notes/api/openapi.yaml \
            go/authn/api/openapi.yaml \
            go/notification/api/openapi.yaml \
            -o build/openapi/speed.yaml
      - name: Stamp the merged document's info block (deterministic post-join fixup)
        # redocly's join keeps the FIRST input's info block, so without
        # this stamp the merged application-wide document inherits the
        # notes fragment's title and a description whose closing sentence
        # claims the merge is still future work -- and orval's generated
        # header would read "Source: notes" for the whole application
        # surface. The same command as Taskfile.yml's api:merge task --
        # keep the two in lockstep. The stamp fails loudly (exit non-zero)
        # if the info block is ever not exactly title/description/version.
        run: node web/scripts/redocly-join-fixup.mjs
      - name: Lint the merged document against the naming-convention rules
        # redocly.yaml's own header explains what each rule checks and why
        # (operationId format, component schema-name format, tag format --
        # docs/internal/21-api-contract.md's naming conventions that avoid
        # merge conflicts
        # table) and what is deliberately not checked yet.
        run: pnpm --package=@redocly/cli@2.51.1 dlx redocly lint build/openapi/speed.yaml --config redocly.yaml
      - name: Generated merged document must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: merging the three fragments (plus the info-block"
            echo "stamp) left the tree dirty. The checked-in"
            echo "build/openapi/speed.yaml is not what the notes, authn"
            echo "and notification fragments"
            echo "(examples/reference-app/internal/notes/api/openapi.yaml,"
            echo "go/authn/api/openapi.yaml and go/notification/api/"
            echo "openapi.yaml) merge -- and web/scripts/redocly-join-"
            echo "fixup.mjs stamps -- to today: did a fragment change"
            echo "without running 'task api:merge' and committing the"
            echo "result? Per docs/internal/21-api-contract.md, spec +"
            echo "generated artifact + implementation ship in the same"
            echo "PR."
            exit 1
          }
      - name: Install web workspace dependencies (frozen lockfile)
        # --frozen-lockfile doubles as the importer check: a PR that adds
        # or renames a web/ package without its pnpm-lock.yaml entry fails
        # here.
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Regenerate the frontend SDK from the merged document (pinned orval 8.17.0)
        # The same command pair as Taskfile.yml's api:gen frontend leg --
        # keep the two in lockstep (both pin orval at 8.17.0; orval is
        # never a workspace dependency, so the lockfile cannot pin it).
        # Run from web/ with the relative config path, then the
        # nodenext fixup rewrites the mutator import to its explicit .js
        # form (why: @speed/api-sdk's AGENTS.md). The input is the merged
        # document produced above -- notes, authn and notification
        # fragments; org's and storage's fragments are deliberately not
        # part of it (see the api:merge task and docs/internal/
        # 21-api-contract.md).
        run: |
          pnpm dlx orval@8.17.0 --config orval.config.ts
          node scripts/orval-nodenext-fixup.mjs
        working-directory: web
      - name: Generated frontend SDK must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in web/packages/api-sdk/src/index.ts is"
            echo "not what the merged document (notes, authn and"
            echo "notification fragments) generates -- did you change the"
            echo "spec or web/orval.config.ts without running 'task api:gen'"
            echo "and committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          }
      - name: Handler must still implement the generated ServerInterface
        # The compile-enforcement half: if a spec change (and with it the
        # generated interface) outgrew its Handler -- notes', org's,
        # storage's or notification's -- this build of the reference app
        # fails on the owning handler.go's compile-time assertion and
        # shows exactly which method is missing.
        run: |
          cd examples/reference-app
          go build ./...
      - name: Regenerate authn's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's authn leg --
        # keep the two in lockstep. Run from the fragment's own directory,
        # where oapi-codegen.yaml's paths are relative, exactly like the
        # notes leg above.
        run: |
          cd go/authn/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Generated authn artifact must match the committed spec
        run: |
          git diff --exit-code || {
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/authn/api/authn-server.gen.go is"
            echo "not what go/authn/api/openapi.yaml generates -- did you"
            echo "change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          }
      - name: authn's Handler must still implement the generated ServerInterface
        # The same compile-enforcement guarantee as the reference-app build
        # above, for authn's own handler.go compile-time assertion. go/authn
        # is a real module (not behind full-ci), so this leg runs on every
        # PR this workflow triggers on, unlike the reference app's build
        # above.
        run: |
          cd go/authn
          go build ./...
