name: api-contract
# API-contract discipline pipeline. Enforces the repository's spec-first
# API-contract order -- edit api/openapi.yaml -> task api:gen ->
# compilation failures reveal every handler to fix -> commit spec,
# generated artifacts and implementation in the same PR -- on both
# halves: backend (oapi-codegen) and frontend (orval -> @speed/api-sdk),
# plus the multi-fragment merge (redocly) whose merged document is
# orval's input, which is why this file's steps run the merge before the
# frontend regeneration. Target under 5 minutes; this job carries a
# timeout and stale runs are cancelled via concurrency.
#
# TRIGGERS: pull_request, path-filtered on the spec/generator-toolchain
# side of the repository, and every direct push to main, path-filtered
# on the same set (main allows direct pushes -- the normal landing path
# here -- and a direct push carries no PR for the pull_request filter to
# see, so without the push trigger a spec pushed without its
# regenerated artifact would reach main with no run of this workflow at
# all). The path set deliberately matches what regeneration can be
# affected by: the spec fragment(s), the generator config, the api:gen
# task definition, and this workflow itself. A change touching only
# handler code has nothing to regenerate; whether it still implements
# the interface is a compile question answered by full-check's
# reference-app job on full-ci-labeled PRs and, for authn, by this
# workflow's own go/authn build leg (go/authn is built on every
# fast-check run regardless of what changed, so its own compile
# enforcement does not wait for full-ci the way the reference app's
# does).
#
# The push trigger shares the pull_request path set because the
# invariant this pipeline checks can only be violated by a change to one
# of those paths: a push touching only unrelated code cannot make a
# committed artifact disagree with its spec, so an unfiltered push run
# would pay the full job on every push for zero information. Cost
# control stays GitHub-native: the same filter duplicated under the push
# key, no third-party action.
# LOCKSTEP: the pull_request path block, the push path block and the
# PATH SET comment below must name the same paths -- when a fragment
# joins, add its api/ directory (and any generator config it needs) to
# all three. The path set names this workflow itself, so the push that
# repairs a forgotten path re-runs the repaired workflow on its own
# change.
#
# COVERAGE -- what runs, in step order:
#   * Fragment-enumeration consistency (manifest drift gate):
#     tools/test_check_api_fragments.py (the planted-drift suite --
#     every drift class the next step detects, reproduced and pinned
#     red-before-fix) and then tools/check_api_fragments.py run right
#     after checkout. The fragment universe this file names in its path
#     filters, its regeneration steps and its merge input list is
#     single-sourced in tools/api_fragments.json; the gate goes red when
#     a fragment is added to the tree but not to the manifest,
#     registered in the manifest but not wired into a leg of this file,
#     or wired into a leg without the manifest (see
#     tools/check_api_fragments.py's docstring for the invariants).
#   * Consistency gates: every regeneration below is followed by a gate
#     that fails the job when the committed artifact is not what the
#     spec generates. The gate is porcelain, `git status --porcelain
#     --untracked-files=all`, not `git diff --exit-code`: `git diff`
#     reports only modifications to TRACKED files, so a regeneration
#     that CREATES a file -- an artifact a new fragment step or
#     generator writes before its first commit -- would pass a diff gate
#     silently (the identical reason fast-check's own workspace gate is
#     porcelain). --untracked-files=all still honours .gitignore, and
#     the status listing doubles as the failure output.
#   * Regeneration consistency, one step per backend fragment: the
#     pinned oapi-codegen v2.8.0 (the same `go run` as Taskfile's
#     api:gen task, run from the fragment's own directory, where
#     oapi-codegen.yaml's paths are relative) regenerates the fragment's
#     committed backend artifact from its api/openapi.yaml, then the
#     fragment's own porcelain gate fails the job if the committed
#     artifact is not what the spec generates. A step per fragment keeps
#     each fragment's failure unambiguous in the job log. The fragments
#     are the eleven platform-module fragments org, storage,
#     notification, sharing, pki, admin, integration, ai-gateway,
#     billing, config and authn; the full list lives in
#     tools/api_fragments.json, the source of truth. The reference app's
#     own notes, cases and smilesim fragments are not part of this
#     pipeline: they regenerate through the app's
#     own generation leg, the consumer-shaped twin of this one that the
#     app runs for its own merged document and SDK (Taskfile's
#     api:gen:app task and full-check.yml's reference-app job;
#     docs/internal/21-api-contract.md records the split).
#   * Spec merge + info stamp + naming-convention lint: the pinned
#     redocly CLI 2.51.1 (the same `pnpm --package=@redocly/cli@2.51.1
#     dlx redocly ...` invocation as Taskfile's api:merge task) `join`s
#     all eleven platform-module fragments (admin, ai-gateway, authn,
#     billing, config, integration, notification, org, pki, sharing and
#     storage) into contracts/speed.yaml, then
#     web/scripts/redocly-join-fixup.mjs stamps the merged document's
#     info block (join keeps the FIRST fragment's info; without the
#     stamp the application-wide document -- and through orval's header
#     the generated SDK -- would carry the first fragment's own title
#     and description), then the result is
#     `lint`ed against redocly.yaml's naming rules (operationId,
#     component schema-name and tag formats, the conventions that keep
#     fragments from colliding under the merge), then the porcelain gate
#     fails the job if the committed contracts/speed.yaml is not
#     what the eleven fragments merge -- plus the stamp -- to.
#     These steps
#     sit before the frontend regeneration because the merged document
#     is that leg's input.
#   * Frontend-sdk regeneration consistency (merged document): the
#     pinned orval 8.17.0 (the same `pnpm dlx orval` + nodenext-fixup
#     pair as Taskfile's api:gen frontend leg, run from web/)
#     regenerates @speed/api-sdk's src/index.ts from
#     contracts/speed.yaml, then its porcelain gate fails the job if
#     the committed generated package is not what the spec generates.
#     orval itself is never a workspace dependency (pnpm dlx, no
#     lockfile entry); a version bump is visible in the regenerated
#     header and must land in Taskfile, web/orval.config.ts and this
#     file together. Every platform module with an HTTP fragment is a
#     merge member: the generated surface is pinned by the consistency
#     gates below and does not rot from being uncalled -- whether a
#     surface has an in-workspace web consumer is a consumption-proof
#     question, not a merge-membership criterion (docs/internal/
#     21-api-contract.md; the reference app consumes its own three
#     fragments through its own app-owned SDK, which is not part of
#     this merged document).
#   * Compile enforcement (all fragments but authn): `go build ./...` of
#     examples/reference-app. The app imports every module among the
#     fragments (go/pki as authn's KeySource), so a regenerated
#     api.ServerInterface that outgrows its module handler's compile-time
#     assertion fails this one build step, transitively, with no
#     separate step per module. Without this leg a
#     spec+artifact change whose handler lagged would pass both this
#     pipeline and fast-check (which does not build the reference app).
#     Precise only for a parameter-free operation, though: an operation
#     carrying a path or query parameter makes the generated file import
#     github.com/oapi-codegen/runtime, which the app's go.mod requires
#     because parameterized operations already ship -- a spec whose
#     first parameterized operation lands without its handler fails on
#     the missing import first. Both are hard build failures; only the
#     diagnostic differs. Pre-adding the require would not help: `go mod
#     tidy` drops an unused dependency.
#   * Compile enforcement (authn): `go build ./...` of go/authn -- the
#     authn regeneration above gets its own build leg so authn's
#     compile enforcement does not wait for full-ci the way the
#     reference app's does.
#
# DELIBERATELY NOT WIRED -- API-contract items without the tooling to
# check them honestly:
#   * breaking-change detection (oasdiff, a diff of the spec against the
#     last release): no release has happened, so no baseline exists to
#     diff against -- a recorded mechanism decision, not a fake gate.
#   * a redocly rule enforcing the "/api/v1/<module>" path-prefix
#     convention: redocly has no subject type that exposes a PathItem's
#     own map key to an assertion (verified empirically against a real
#     merge of the fragments; see redocly.yaml's own trailing comment),
#     so the convention stays a code-review concern rather than a rule
#     that would not actually check what its name claims.
#   * cross-fragment merge-conflict checks as a gate of their own: the
#     naming-convention lint above is what keeps fragments from
#     colliding under the merge, and the merged-document diff gate
#     catches a committed speed.yaml that drifted from a fresh merge, so
#     a separate check would only re-check what those already do.
#   * an app-owned pipeline here for the reference app's own fragments:
#     the app runs its own generation leg (Taskfile api:gen:app) with
#     its own porcelain gate in full-check.yml's reference-app job --
#     the app is a consumer, and consumer-side generation gates belong
#     to the consumer's own CI, which is the shape the app-owned flow
#     seeds (docs/internal/21-api-contract.md).
#
# PATH SET -- spec/generator-toolchain changes only (see LOCKSTEP
# above). Each fragment row covers the fragment's api/ directory, its
# generator config and its backend generated artifact -- a hand-edit of
# the generated file triggers the consistency diff:
#   go/org/api/**
#   go/storage/api/**
#   go/notification/api/**
#   go/sharing/api/**
#   go/pki/api/**
#   go/admin/api/**
#   go/integration/api/**
#   go/ai-gateway/api/**
#   go/authn/api/**
#   go/billing/api/**
#   go/config/api/**
#   (every platform module fragment above joins the merge and the
#   orval leg below -- every platform module with an HTTP fragment is a
#   merge member; the reference app's own notes, cases and smilesim
#   fragments are absent by design, their regeneration belonging to the
#   app's own generation leg)
#   web/orval.config.ts, web/scripts/**              the frontend
#                                                    generator config and
#                                                    the fixup scripts
#                                                    behind the regen
#                                                    commands
#   web/packages/api-sdk/**                           the generated frontend
#                                                    package (a hand-edit
#                                                    triggers the diff)
#   tools/api_fragments.json,                        the fragment manifest --
#   tools/check_api_fragments.py,                    the single machine-
#   tools/test_check_api_fragments.py                readable source of
#                                                    truth the drift-check
#                                                    steps compare every
#                                                    leg of this file
#                                                    against (the
#                                                    planted-drift suite
#                                                    runs first;
#                                                    self-test on change)
#   redocly.yaml                                     the merge/lint
#                                                    naming-convention
#                                                    rules
#   contracts/**                                     the committed merged
#                                                    document (a
#                                                    hand-edit triggers
#                                                    the diff)
#   Taskfile.yml                                     api:gen/api:merge
#                                                    tasks (the
#                                                    regeneration
#                                                    commands)
#   .github/workflows/api-contract.yml               this workflow itself

on:
  pull_request:
    paths:
      - go/org/api/**
      - go/storage/api/**
      - web/orval.config.ts
      - web/scripts/**
      - web/packages/api-sdk/**
      - go/authn/api/**
      - go/billing/api/**
      - go/notification/api/**
      - go/sharing/api/**
      - go/pki/api/**
      - go/admin/api/**
      - go/integration/api/**
      - go/ai-gateway/api/**
      - go/config/api/**
      - tools/api_fragments.json
      - tools/check_api_fragments.py
      - tools/test_check_api_fragments.py
      - redocly.yaml
      - contracts/**
      - Taskfile.yml
      - .github/workflows/api-contract.yml
  workflow_dispatch:
  # Direct pushes to main are the normal landing path here and carry no
  # PR for the pull_request filter above to see, so a spec pushed
  # without its regenerated artifact would reach main with no run of
  # this workflow at all -- this push leg closes that gap. Same path set
  # as the pull_request block above: keep the two in lockstep when a
  # fragment joins.
  push:
    branches: [main]
    paths:
      - go/org/api/**
      - go/storage/api/**
      - web/orval.config.ts
      - web/scripts/**
      - web/packages/api-sdk/**
      - go/authn/api/**
      - go/billing/api/**
      - go/notification/api/**
      - go/sharing/api/**
      - go/pki/api/**
      - go/admin/api/**
      - go/integration/api/**
      - go/ai-gateway/api/**
      - go/config/api/**
      - tools/api_fragments.json
      - tools/check_api_fragments.py
      - tools/test_check_api_fragments.py
      - redocly.yaml
      - contracts/**
      - Taskfile.yml
      - .github/workflows/api-contract.yml

concurrency:
  group: api-contract-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-contract:
    name: api contract consistency and compile enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The fragment-enumeration gate -- the first thing this job runs,
      # before any regeneration. This file names the backend-fragment
      # universe in several places at once (the path filters below, the
      # oapi-codegen regeneration steps, the redocly join input list),
      # places that can drift apart silently. tools/api_fragments.json
      # is the single machine-readable source of truth, and
      # tools/check_api_fragments.py fails when the manifest, the tree
      # and any leg of this file disagree -- see that script's docstring
      # for the checked invariants. Nothing here needs more than the
      # runner's python3, which is why both steps run before the Go
      # toolchain install.
      - name: Fragment-enumeration checker's planted-drift suite (tools/test_check_api_fragments.py)
        # The regression teeth: every drift class the step below detects
        # is reproduced by this suite and must go red before the fix.
        # Selftest first, then the real check -- the license job's order
        # in security.yml.
        run: python3 tools/test_check_api_fragments.py
      - name: Fragment enumeration drift check (tools/check_api_fragments.py)
        run: python3 tools/check_api_fragments.py
      # golangci-lint is deliberately not installed here (setup-go-env's
      # install-golangci input, default false): this job never lints, and an
      # unconditional install would mean a ~15 MB download on every run for
      # nothing. The Go toolchain is what oapi-codegen (go run) and the
      # build leg need; the Go build cache makes repeated runs fast.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: Regenerate org's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's org leg -- keep
        # the two in lockstep (both pin the generator at v2.8.0). Run from
        # the fragment's own directory, where oapi-codegen.yaml's paths are
        # relative, mirroring the org step above exactly.
        run: |
          cd go/org/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Org's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/org/api/org-server.gen.go is not"
            echo "what go/org/api/openapi.yaml generates -- did you change"
            echo "the spec without running 'task api:gen' and committing"
            echo "the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate storage's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's storage leg --
        # keep the two in lockstep (both pin the generator at v2.8.0). Run
        # from the fragment's own directory, where oapi-codegen.yaml's paths
        # are relative, mirroring the org step above exactly.
        run: |
          cd go/storage/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Storage's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/storage/api/storage-server.gen.go"
            echo "is not what go/storage/api/openapi.yaml generates -- did"
            echo "you change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate notification's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's notification
        # leg -- keep the two in lockstep (both pin the generator at
        # v2.8.0). Run from the fragment's own directory, where
        # oapi-codegen.yaml's paths are relative, mirroring the org and
        # storage steps above exactly.
        run: |
          cd go/notification/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Notification's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/notification/api/"
            echo "notification-server.gen.go is not what"
            echo "go/notification/api/openapi.yaml generates -- did you"
            echo "change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate sharing's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's sharing leg --
        # keep the two in lockstep (both pin the generator at v2.8.0). Run
        # from the fragment's own directory, where oapi-codegen.yaml's
        # paths are relative, mirroring the org, storage and notification steps above exactly.
        run: |
          cd go/sharing/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Sharing's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/sharing/api/"
            echo "sharing-server.gen.go is not what"
            echo "go/sharing/api/openapi.yaml generates -- did you change"
            echo "the spec without running 'task api:gen' and committing"
            echo "the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate pki's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's pki leg --
        # keep the two in lockstep (both pin the generator at v2.8.0).
        # Run from the fragment's own directory, where oapi-codegen.yaml's
        # paths are relative, mirroring the org, storage, notification and sharing steps above
        # exactly.
        run: |
          cd go/pki/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Pki's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the COVERAGE
        # note above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/pki/api/pki-server.gen.go is not"
            echo "what go/pki/api/openapi.yaml generates -- did you change"
            echo "the spec without running 'task api:gen' and committing"
            echo "the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate admin's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's admin leg --
        # keep the two in lockstep (both pin the generator at v2.8.0).
        # Run from the fragment's own directory, where oapi-codegen.yaml's
        # paths are relative, mirroring the org, storage, notification, sharing and pki steps
        # above exactly.
        run: |
          cd go/admin/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Admin's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/admin/api/"
            echo "admin-server.gen.go is not what"
            echo "go/admin/api/openapi.yaml generates -- did you change"
            echo "the spec without running 'task api:gen' and committing"
            echo "the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate integration's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's integration
        # leg -- keep the two in lockstep (both pin the generator at
        # v2.8.0). Run from the fragment's own directory, where
        # oapi-codegen.yaml's paths are relative, mirroring the org, storage, notification, sharing and admin
        # steps above exactly.
        run: |
          cd go/integration/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Integration's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/integration/api/"
            echo "integration-server.gen.go is not what"
            echo "go/integration/api/openapi.yaml generates -- did you"
            echo "change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate ai-gateway's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's ai-gateway
        # leg -- keep the two in lockstep (both pin the generator at
        # v2.8.0). Run from the fragment's own directory, where
        # oapi-codegen.yaml's paths are relative, mirroring the org,
        # storage, notification, sharing, admin and integration
        # steps above exactly.
        run: |
          cd go/ai-gateway/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: ai-gateway's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/ai-gateway/api/"
            echo "ai-gateway-server.gen.go is not what"
            echo "go/ai-gateway/api/openapi.yaml generates -- did you"
            echo "change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate billing's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's billing leg --
        # keep the two in lockstep (both pin the generator at v2.8.0).
        # Run from the fragment's own directory, where oapi-codegen.yaml's
        # paths are relative, mirroring the org, storage, notification and sharing steps above
        # exactly.
        # billing's fragment feeds the merge and orval below, like every
        # platform module's fragment does (see the api:merge task).
        run: |
          cd go/billing/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Billing's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/billing/api/"
            echo "billing-server.gen.go is not what"
            echo "go/billing/api/openapi.yaml generates -- did you"
            echo "change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Regenerate config's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's config leg --
        # keep the two in lockstep (both pin the generator at v2.8.0).
        # Run from the fragment's own directory, where oapi-codegen.yaml's
        # paths are relative, mirroring the org, storage, notification,
        # sharing, admin, integration, ai-gateway and billing steps above
        # exactly.
        # config's fragment feeds the merge and orval below, like every
        # platform module's fragment does (see the api:merge task).
        run: |
          cd go/config/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: config's generated artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/config/api/config-server.gen.go is"
            echo "not what go/config/api/openapi.yaml generates -- did you"
            echo "change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        # Mirrors the npm CI jobs (reusable-npm-package-ci.yml): the same
        # composite action, the same single version sources (web/.nvmrc,
        # web/package.json's packageManager field) and the same pnpm store
        # cache keyed on the lockfile hash. One call serves both Node-based
        # legs of this job: the redocly merge/lint below (its pnpm dlx
        # invocation needs no web/ workspace install) and the web install
        # + orval frontend leg that follows it.
        uses: ./.github/actions/setup-node-env
      - name: Merge every fragment into contracts/speed.yaml (pinned redocly 2.51.1)
        # The same command as Taskfile.yml's api:merge task -- keep the two
        # in lockstep (both pin redocly at 2.51.1). `join`, not `bundle`:
        # these fragments are peers, each a complete document, not one root
        # with $refs into the others. This step runs before the frontend
        # regeneration below because contracts/speed.yaml is that
        # leg's input: orval must consume the fresh merge, not a merged
        # document this job will overwrite later in the same run.
        run: |
          mkdir -p contracts
          pnpm --package=@redocly/cli@2.51.1 dlx redocly join \
            go/authn/api/openapi.yaml \
            go/notification/api/openapi.yaml \
            go/billing/api/openapi.yaml \
            go/admin/api/openapi.yaml \
            go/ai-gateway/api/openapi.yaml \
            go/integration/api/openapi.yaml \
            go/org/api/openapi.yaml \
            go/pki/api/openapi.yaml \
            go/sharing/api/openapi.yaml \
            go/storage/api/openapi.yaml \
            go/config/api/openapi.yaml \
            -o contracts/speed.yaml
      - name: Stamp the merged document's info block (deterministic post-join fixup)
        # redocly's join keeps the FIRST input's info block, so without
        # this stamp the merged application-wide document inherits the
        # first fragment's own title and description -- authn's, whose
        # per-fragment identity does not describe the whole surface --
        # and orval's generated header would read "Source: authn" for
        # the whole application. The same command as Taskfile.yml's
        # api:merge task --
        # keep the two in lockstep. The stamp fails loudly (exit non-zero)
        # if the info block is ever not exactly title/description/version.
        run: node web/scripts/redocly-join-fixup.mjs
      - name: Lint the merged document against the naming-convention rules
        # redocly.yaml's own header explains what each rule checks and why
        # (operationId format, component schema-name format, tag format --
        # the naming conventions that keep fragments from colliding under
        # the merge) and what is deliberately not checked yet.
        run: pnpm --package=@redocly/cli@2.51.1 dlx redocly lint contracts/speed.yaml --config redocly.yaml
      - name: Refresh the documentation site's copy of the merged document
        # The site's interactive API reference (docs/site/content.*/docs/
        # user-guide/api-reference.md) serves this merged document from
        # docs/site/static/apidocs/speed.yaml. Same copy as Taskfile.yml's
        # api:merge task -- keep the two in lockstep -- so the porcelain
        # gate below covers the site copy too: a fragment change without
        # the refreshed, committed copy fails here.
        run: cp contracts/speed.yaml docs/site/static/apidocs/speed.yaml
      - name: Generated merged document must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: merging the eleven platform fragments (plus the"
            echo "info-block stamp) left the tree dirty. The checked-in"
            echo "contracts/speed.yaml is not what the eleven platform-module"
            echo "fragments (admin, ai-gateway, authn, billing, config,"
            echo "integration, notification, org, pki,"
            echo "sharing and storage) merge -- and"
            echo "web/scripts/redocly-join-fixup.mjs stamps -- to"
            echo "today: did a fragment change"
            echo "without running 'task api:merge' and committing the"
            echo "result? Per docs/internal/21-api-contract.md, spec +"
            echo "generated artifact + implementation ship in the same"
            echo "PR."
            exit 1
          fi
      - name: Install web workspace dependencies (frozen lockfile)
        # --frozen-lockfile doubles as the importer check: a PR that adds
        # or renames a web/ package without its pnpm-lock.yaml entry fails
        # here.
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Regenerate the frontend SDK from the merged document (pinned orval 8.17.0)
        # The same command pair as Taskfile.yml's api:gen frontend leg --
        # keep the two in lockstep (both pin orval at 8.17.0; orval is
        # never a workspace dependency, so the lockfile cannot pin it).
        # Run from web/ with the relative config path, then the
        # nodenext fixup rewrites the mutator import to its explicit .js
        # form (why: @speed/api-sdk's AGENTS.md). The input is the merged
        # document produced above -- the eleven platform-module fragments
        # (see the api:merge task); the reference app's own fragments
        # feed its own app-owned SDK instead (Taskfile's api:gen:app).
        run: |
          pnpm dlx orval@8.17.0 --config orval.config.ts
          node scripts/orval-nodenext-fixup.mjs
        working-directory: web
      - name: Generated frontend SDK must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in web/packages/api-sdk/src/index.ts is"
            echo "not what the merged document (the eleven platform-module"
            echo "fragments: admin, ai-gateway, authn, billing, config,"
            echo "integration, notification, org, pki, sharing and"
            echo "storage) generates --"
            echo "did you"
            echo "change the spec or web/orval.config.ts without running"
            echo "'task api:gen' and committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: Handler must still implement the generated ServerInterface
        # The compile-enforcement half: if a spec change (and with it the
        # generated interface) outgrew its Handler -- org's,
        # storage's, notification's, sharing's, pki's, admin's,
        # integration's, ai-gateway's, billing's or config's -- this build of the
        # reference app fails on the owning handler's compile-time
        # assertion and shows exactly which method is missing. This same
        # reference-app build is the compile-enforcement leg for every
        # fragment-shipping platform module: examples/reference-app
        # imports every fragment-shipping module named above -- go/pki
        # as authn's KeySource, the rest through the
        # mandatory-first-consumer rule -- so no module of the set needs
        # a build step of its own. (The reference app's own notes, cases
        # and smilesim handlers compile against the app-owned generated
        # interfaces, which this pipeline does not regenerate; their
        # handler-vs-interface enforcement is the app's own build, run
        # by full-check's reference-app job and fast-check's
        # repo-checks app build.)
        run: |
          cd examples/reference-app
          go build ./...
      - name: Regenerate authn's API surface (pinned oapi-codegen v2.8.0)
        # The same command as Taskfile.yml's api:gen task's authn leg --
        # keep the two in lockstep. Run from the fragment's own directory,
        # where oapi-codegen.yaml's paths are relative, exactly like the org leg above.
        run: |
          cd go/authn/api
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml openapi.yaml
      - name: Generated authn artifact must match the committed spec
        # Porcelain gate, not git diff --exit-code -- see the org
        # gate's comment above for why.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating from the committed spec left the tree"
            echo "dirty. The checked-in go/authn/api/authn-server.gen.go is"
            echo "not what go/authn/api/openapi.yaml generates -- did you"
            echo "change the spec without running 'task api:gen' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: authn's Handler must still implement the generated ServerInterface
        # The same compile-enforcement guarantee as the reference-app build
        # above, for authn's own handler.go compile-time assertion. go/authn
        # is a real module (not behind full-ci), so this leg runs on every
        # PR this workflow triggers on, unlike the reference app's build
        # above.
        run: |
          cd go/authn
          go build ./...
