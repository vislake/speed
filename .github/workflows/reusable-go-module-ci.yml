name: go-module-ci
# Reusable per-module Go CI, called by the pipeline orchestrators
# (fast-check and full-check). Callers enumerate one matrix row per
# module, so adding a module means adding one row to a caller's matrix --
# never copying this file's legs into a workflow.
#
# INPUT
# `module` is the module's directory relative to the repository root
# (e.g. go/pkgcore). Every leg runs from inside that directory, because
# the repository root is a go.work workspace, not a module: bare ./...
# patterns do not resolve there.
#
# LEGS -- unit tier only, container-free by design:
#   1. golangci-lint run ./...   the project-standard lint leg (.golangci.yml
#                                at the repo root, v2 schema; the
#                                discipline rows that have golangci
#                                tooling today -- errcheck, gosec, govet's
#                                shadow check, depguard's pkgcore-root
#                                module-boundary rule plus the concrete-
#                                infrastructure import bans on redis /
#                                minio / asynq outside their owning
#                                modules). The binary comes
#                                from setup-go-env, pinned and checksummed.
#   2. go vet ./...              static analysis, kept as its own leg: vet is
#                                the go-version-coupled check that runs on
#                                every module, while golangci-lint carries the
#                                discipline rules on top.
#   3. go test -race ./...       unit suite under the race detector. The
#                                Docker-backed integration tiers
#                                (-tags=integration: PostgreSQL for dbkit
#                                and tenancy, Redis for jobs, and Redis
#                                plus RustFS/S3 for pkgcore -- its
#                                integration_test/ runs both tiers)
#                                intentionally do NOT run here: the
#                                layered-triggering rule puts them in the
#                                pre-merge full matrix (full-check), not in
#                                the fast per-PR check.
#   3b. Coverage gate            docs/internal/20-quality-and-security.md's
#     (every module)             coverage rule for every released module:
#                                tools/check_coverage_baseline.py measures
#                                the module's exact unit-suite statement
#                                coverage, excluding generated files
#                                (.gen.go -- the census is hand-written
#                                code only), and fails when the measured
#                                total sits more than the size-calibrated
#                                tolerance below either bound -- the 80%
#                                floor (the 2026-09 product decision) or
#                                the committed tools/coverage-baselines.json
#                                row (the no-decline rule, which predates
#                                the floor and survives it). The tolerance
#                                is the wider of 0.15 points and the points
#                                two statements are worth in the module
#                                under measurement (2 * 100 / statements)
#                                -- a 2-statement floor that keeps the
#                                jitter budget size-invariant, absorbing
#                                statement-granular scheduling noise in
#                                small modules while the 0.15-point main
#                                tolerance governs the larger ones -- and
#                                a failure names the effective tolerance
#                                and the census it was calibrated against.
#                                A module
#                                outside the gated set (a new go/ module
#                                not yet added to the tool's list) prints
#                                a notice and passes; the baseline file's
#                                own health is gated by the same script's
#                                --selfcheck in fast-check's repo-checks
#                                job, so a stale or missing row cannot
#                                silently rot into a row nobody compares
#                                against. The reference app is not a row
#                                of this matrix: its coverage gate runs
#                                in full-check's reference-app job (the
#                                app's unit suite is full-check-only, so
#                                its measurement belongs beside it).
#   4. go build ./...            module build in workspace context.
#   5. GOWORK=off go build ./... standalone build proving the module's
#                                go.mod/go.sum suffice outside the
#                                workspace. The standalone build guards
#                                (go/pkgcore, go/tenancy) stay for local
#                                runs and still execute under leg 3 on CI.
#
# jobs.timeout-minutes bounds every run; the caller additionally cancels
# stale runs via concurrency.

on:
  workflow_call:
    inputs:
      module:
        description: >-
          Module directory relative to the repository root, e.g. go/pkgcore.
        required: true
        type: string

permissions:
  contents: read

jobs:
  go-module-ci:
    name: ${{ inputs.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Go toolchain, golangci-lint and caches
        uses: ./.github/actions/setup-go-env
        with:
          # The golangci-lint leg below needs the binary; the install is
          # opt-in so the non-linting setup-go-env callers (fast-check's
          # repo-checks job, full-check's integration-tiers rows) do not pay
          # for a download and cache round-trip they never use.
          install-golangci: true
      - name: golangci-lint
        working-directory: ${{ inputs.module }}
        run: golangci-lint run ./...
      - name: go vet
        working-directory: ${{ inputs.module }}
        run: go vet ./...
      - name: Unit tests under the race detector
        working-directory: ${{ inputs.module }}
        run: go test -race ./...
      - name: Coverage gate (80% floor and no-decline vs baseline)
        # The docs/internal/20 coverage rule for every released module:
        # the measured unit-suite statement coverage must clear the 80%
        # floor (excluding .gen.go statements) and must not drop below
        # the committed tools/coverage-baselines.json row
        # (tools/check_coverage_baseline.py's own header has the full
        # mechanism and the breach-response contract). Runs in every
        # module's job and passes with a notice for a module outside the
        # gated set, so adding the leg here never needs a caller-side
        # list to keep in step.
        working-directory: ${{ inputs.module }}
        run: python3 "${{ github.workspace }}/tools/check_coverage_baseline.py" --check --module "${{ inputs.module }}"
      - name: Build in workspace context
        working-directory: ${{ inputs.module }}
        run: go build ./...
      - name: Build standalone outside the workspace (GOWORK=off)
        working-directory: ${{ inputs.module }}
        env:
          GOWORK: "off"
        run: go build ./...
