name: pr-full

# STUB -- not implemented. Triggered runs fail loudly at the guard step
# below; nothing in this pipeline can pass silently.
#
# PIPELINE (docs/internal/18-cicd.md pipeline table, pr-full row): the
# pre-merge FULL MATRIX, target under 25 minutes -- every module through the
# unit suite with -race and coverage, plus the Docker-backed integration
# tiers, and eventually the dual deployment mode x dual dialect matrix. This
# is 18-cicd's layered-triggering layer 2: integration runs live here, NOT
# in the fast per-PR check (pr-check).
#
# DESIGN-TABLE TRIGGER: a PR labeled `full-ci`, and before every merge
# (merge gating itself is branch protection -- 18-cicd branch-protection
# section -- which is configured on GitHub, not in this file). Those triggers
# are enabled by the implementing round: until real legs exist, a labeled PR
# must not be sprayed with failing stub runs.
#
# WHAT WIRES WHEN THIS IS IMPLEMENTED -- content that exists TODAY:
#   * one matrix row per real module through reusable go-module-ci
#     (.github/workflows/reusable/go-module-ci.yml), i.e. the pr-check
#     matrix plus -race -cover;
#   * the Docker-backed integration tiers, one leg per module with an
#     integration_test/ directory, run from inside the module:
#     go test -race -tags=integration ./...
#     PostgreSQL via testcontainers: go/dbkit, go/tenancy
#     Redis via testcontainers: go/jobs; Redis + MinIO/S3 via testcontainers:
#     go/pkgcore (its integration_test/ runs both tiers)
#     (exact mirror of Taskfile test:full's INTEGRATION_DIRS loop; Docker is
#     preinstalled on ubuntu-latest runners);
#   * the reference-app module unit suite (examples/reference-app: its own
#     module, listed in go.work but outside go/ -- covered by neither the
#     pr-check module matrix nor the go/... import-path build, so run it
#     dir-scoped from inside the module, as Taskfile's APP_DIR legs do).
#
# GATE: the roadmap M0 full-matrix acceptance (dual deployment mode x dual
# dialect across every module). The integration-tier legs above are real
# today, so this workflow may also be enabled earlier, as soon as the team
# wants pre-merge integration runs -- the change is flipping the guard off
# and adding the legs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-matrix:
    name: full matrix (stub guard -- not implemented yet)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Stub guard
        run: |
          echo "error: pr-full is not implemented. This failing run is its"
          echo "stub guard, so the pipeline can never pass silently. Wire the"
          echo "full matrix per the file header (go-module-ci matrix +"
          echo "-tags=integration tiers + reference-app suite) when the"
          echo "roadmap M0 full-matrix acceptance lands."
          exit 1
