name: security
# Supply-chain and security scans: dependency vulnerabilities, secret
# scanning, SAST, license compliance, container image scanning. Target
# under 10 minutes for the per-PR legs; every job carries a timeout and
# stale runs are cancelled via concurrency.
#
# TRIGGER: every PR plus a daily run. The daily cron (05:37 UTC) exists
# because the advisory databases this pipeline consults -- npm, Go's
# vuln DB, CodeQL -- move between PRs; the scheduled run re-checks the
# default branch.
#
# TOOL POSTURE:
#   * pnpm audit for npm dependencies -- LIVE (deps-js job). web/ ships a
#     pnpm lockfile with real runtime dependencies (@speed/i18n carries
#     i18next/react-i18next), so the audit scans a real graph; the
#     frozen-lockfile CI install resolves exactly what the lockfile
#     pins, which is what the audit consults. Renovate, the
#     automated-update half of the documented posture, is not wired: it
#     needs its own app-level credentials, and this repo never holds
#     credentials (see SECRETS below).
#   * gitleaks for secret leakage -- LIVE (secrets job), the CI half of
#     the documented posture; the pre-commit-hook half is
#     developer-local tooling, not CI. The binary is pinned by release
#     and verified by checksum; the default rule set is used --
#     .gitleaks.toml extends it with exactly one path allowlist, for
#     the go/observability redaction-test fixtures (secret-shaped
#     stand-in values are the point of that test code; the allowlist
#     comment records the reasoning). Any further allowlist entry must
#     arrive with its own justification in that file.
#   * GitHub CodeQL for static analysis -- LIVE (sast job), Go and
#     TypeScript/JavaScript in one database. CodeQL runs only in CI: the
#     codeql-action is the tool (no offline equivalent), and it pins its
#     own extractor bundle. The repository root is a go.work workspace
#     with no go.mod at the root; the CodeQL Go extractor supports
#     go.work workspaces natively (module discovery from the workspace
#     file), so autobuild at the checkout root covers every module.
#   * license scan -- LIVE (license job): tools/license_scan.py. The
#     committed manifest (tools/dependency-licenses.json) is re-derived
#     from the live tree on every run -- a newly required dependency, an
#     orphan entry, a version change or a used_by drift all fail with an
#     actionable message -- and every entry must satisfy the copyleft
#     policy: GPL/AGPL banned outright (this repo scaffolds commercial
#     deliveries, so dependency licenses transmit to customer projects),
#     MPL/LGPL only with a recorded ADR (github.com/hashicorp/vault/api
#     carries one), unknown ids fail closed pending adjudication.
#   * govulncheck for Go dependencies -- LIVE (deps-go job), see TOOLCHAIN
#     below.
#   * trivy for container images -- NOT WIRED, see DEFERRED.
#
# TOOLCHAIN (govulncheck's prerequisites):
#   * stdlib class: the go directive is 1.26.8, the patched line that
#     clears the accumulated Go-standard-library advisories (net/url,
#     crypto/tls, crypto/x509, encoding/xml, encoding/asn1 among them);
#     a fresh govulncheck baseline finds zero stdlib findings across all
#     modules. The .mise.toml mirror carries the same version, proven in
#     step by tools/check_toolchain.py's own drift gate.
#   * module class: golang.org/x/crypto sits at v0.56.0 in the modules
#     whose Docker-integration test-support packages reach it
#     (testcontainers' transitive chain), which cleared the ssh
#     deadlock-DoS advisory pair (GO-2026-6355/6354); every module that
#     `replace`s one of the bumped modules was re-tidied under GOWORK=off
#     so its own go.mod resolves the bumped version transitively. A
#     govulncheck run finds zero findings in every module.
#   * deps-go job: one row per derived module (reusable-go-module-set.yml
#     reads the go.work use entries outside examples/ -- the go/ modules
#     plus tools/configrefgen), `go run
#     golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...` with
#     working-directory set to the row's module after setup-go-env.
#     Govulncheck version stays pinned at v1.1.4.
#
# DEFERRED (a real prerequisite is still missing; wiring it now would
# produce a permanently red check):
#   * trivy (container image scanning): the repository builds a real
#     image (examples/reference-app/Dockerfile, proven via
#     docker-image-ci.yml calling reusable-docker-build.yml), but that
#     workflow builds only on push to main behind a path set (plus
#     workflow_dispatch -- its own header) and its images carry
#     run-scoped CI proof tags -- there is no STANDING image this job
#     could reach to scan on its own every-PR/daily schedule.
#
# SECRETS: the repo holds no real credentials of any kind and must never
# acquire any; CI secrets belong to GitHub Environments. Every tool
# download below is pinned by commit SHA or release checksum.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily 05:37 UTC -- advisory databases move between PRs; the
    # scheduled run re-checks the default branch.
    - cron: "37 5 * * *"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deps-js:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Node.js and pnpm (store cache skipped)
        # pnpm audit reads the committed lockfile (the frozen-lockfile CI
        # install resolves exactly what it pins), so no install step is
        # needed -- and precisely because nothing here ever populates the
        # pnpm store, the store cache is disabled (use-store-cache:
        # false): an install-less job on a cold cache key would save an
        # EMPTY store under the primary key at job end, which
        # actions/cache never overwrites, freezing every later install
        # job's cache save for that key's lifetime -- the identical
        # hazard setup-go-env's own header records for its install-less
        # golangci-lint callers (setup-node-env's CACHE section has the
        # full argument).
        uses: ./.github/actions/setup-node-env
        with:
          use-store-cache: "false"
      # The audit itself reads the committed lockfile and consults the
      # live npm advisory database.
      - name: Audit npm dependencies (pnpm audit)
        working-directory: web
        run: pnpm audit

  secrets:
    name: secret leakage scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks detects against the commit history, not just the
          # working tree: the default shallow checkout would silently
          # limit the scan to the single head commit. Full history is
          # ~200 commits here (the scan itself measured 614 ms locally
          # over the whole history), so the cost is negligible.
          fetch-depth: 0
      - name: Download gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/gitleaks"
          curl -fsSL -o "$RUNNER_TOOL_CACHE/gitleaks/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TOOL_CACHE/gitleaks/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TOOL_CACHE/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TOOL_CACHE/gitleaks" gitleaks
          chmod +x "$RUNNER_TOOL_CACHE/gitleaks/gitleaks"
      # Scans the working tree and the full commit history (the checkout
      # above fetches everything -- a shallow one would silently limit
      # this scan to a single commit): .gitleaks.toml extends the default
      # rule set with the one path allowlist the tree needs
      # (observability redaction-test fixtures -- see the header). Exit
      # 0: no leaks; exit 1: leaks found.
      - name: Secret scan (gitleaks detect)
        run: "$RUNNER_TOOL_CACHE/gitleaks/gitleaks detect --config .gitleaks.toml --source . --no-banner"

  license:
    name: dependency license compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The planted-fixture suite proves the scanner's verdicts (clean,
      # GPL, MPL without ADR, MPL with ADR, unknown license, drift
      # shapes) before the real check runs against the tree.
      - name: License scanner self-tests (tools/license_scan_testdata)
        run: python3 tools/license_scan.py --selftest
      - name: License scan against the live tree
        run: python3 tools/license_scan.py

  sast:
    name: CodeQL static analysis (Go + TypeScript/JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # SARIF upload -- the only job that needs it
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The CodeQL Go extractor builds with a real Go toolchain; the
      # pinned one comes from go.work via setup-go-env, matching every
      # other CI job.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: Initialize CodeQL (Go + TypeScript/JavaScript)
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9
        with:
          languages: go, javascript-typescript
      # Autobuild runs the CodeQL Go extractor at the checkout root; the
      # extractor discovers the go.work workspace natively and covers
      # every module under it. TypeScript/JavaScript needs no build step.
      - name: Autobuild (Go workspace)
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9
      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9

  module-set:
    # The derived module set the row job below feeds from: go.work is the
    # membership authority, so a module is scanned the moment its go.work
    # use entry lands.
    uses: ./.github/workflows/reusable-go-module-set.yml

  deps-go:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: module-set
    strategy:
      fail-fast: false
      # The matrix is derived from go.work at run time
      # (reusable-go-module-set.yml -- the same derivation fast-check's
      # and full-check's go-modules matrices feed from), so every member
      # is scanned and adding a module means adding one go.work use
      # entry, never a row here.
      matrix: ${{ fromJSON(needs.module-set.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      # govulncheck version stays pinned at v1.1.4 regardless of the Go
      # toolchain version (which setup-go-env resolves from go.work, per
      # the TOOLCHAIN section above) -- `go run` fetches and caches the
      # pinned scanner module, never a floating latest.
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
