name: npm-package-ci
# Reusable per-package npm CI, called by the pipeline orchestrators
# (fast-check; full-check when it grows npm legs). Callers enumerate one
# matrix row per package, so adding a package means adding one row to a
# caller's matrix -- never copying this file's legs into a workflow.
#
# INPUT
# `package` is the package's directory relative to the repository root
# (e.g. web/packages/tokens). All toolchain versions come from
# setup-node-env, whose single sources are web/.nvmrc (Node) and
# web/package.json's packageManager field (pnpm) -- CI never states a
# version of its own, so the local workflow and CI cannot drift.
#
# LEGS
#   0. pnpm install --frozen-lockfile from the web/ workspace root. The
#      committed web/pnpm-lock.yaml must satisfy every package manifest
#      exactly; a stale lockfile fails the install, which is how a new
#      dependency forces its lockfile update into the same commit. The
#      pnpm store is cached by setup-node-env under a lockfile-hash key.
#   1..4 run from inside the package directory, matching the local
#      workflow of web/AGENTS.md: the scripts resolve against the
#      package's own dependencies while ESLint and tsconfig walk up to the
#      workspace-level files in web/.
#   1. pnpm lint     the project-standard lint leg: flat config at web/
#                    (eslint.config.mjs -- typescript-eslint recommended
#                    plus '@typescript-eslint/no-explicit-any' as an
#                    error); the eslint/typescript-eslint versions are
#                    pinned in the shared web/package.json
#                    devDependencies. The workspace's own rules live
#                    behind the speed/ plugin namespace (implementations
#                    and rule tests in web/eslint-rules/): no-literal-text
#                    errors on user-facing text written inline in package
#                    src, and no-direct-http errors on hand-written HTTP
#                    (fetch / XMLHttpRequest / axios / node-fetch).
#                    Package tests and test-utils are exempt by config
#                    (fixture strings and scripted stand-ins are data),
#                    and packages/api-client is no-direct-http's single
#                    whitelist -- api-client src is where hand-written
#                    HTTP is designed to live, and the rule is the guard
#                    that keeps it there. The rules' unit tests live
#                    outside every package; fast-check runs them once per
#                    PR in its repo-checks job, not in these per-package
#                    legs.
#   2. pnpm typecheck
#                    tsc --noEmit under the strict web/tsconfig.base.json
#                    settings (each package's tsconfig extends it).
#   3. pnpm test      the package's vitest unit suite, run with
#                    --coverage so the per-package gate in the package's
#                    vitest.config.ts enforces the web coverage floor of
#                    docs/internal/20-quality-and-security.md -- 80%
#                    statements and 80% branches over the package's own
#                    src/** -- and a package below either fails its job
#                    (vitest exits non-zero on a missed threshold). No
#                    e2e or component-preview legs exist (see
#                    DELIBERATELY NOT WIRED below); a package's tests
#                    are its only runtime checks.
#   4. pnpm build     emits dist/ via each package's project build. The
#                    package.json exports map to those emitted files, so a
#                    build that stops compiling fails here before any
#                    consumer resolves the exports at runtime.
#
# DELIBERATELY NOT WIRED -- checks whose tooling does not exist in the
# repository yet (wiring them now would be fake checks):
#   * ESLint rules that need the generated api-sdk consumer surface --
#     request-shape checks against the generated types -- need the types
#     to check against, which exist only in the generated package. (The
#     hand-written-calls half of the API-contract family is wired:
#     speed/no-direct-http covers package src from the shared flat config
#     with packages/api-client as its single whitelist, and the JSX
#     family's no-bare-text half likewise with no-literal-text; see leg 1.)
#   * Repo-level i18n key parity over package locale files
#     (tools/check_i18n_keys.py's web JSON extension) is wired in the
#     repo-level docs-check pipeline, whose path filter already covers
#     **/locales/**; the parity runtime half stays in code (@speed/i18n's
#     registerNamespace validates coverage and identical key sets at
#     registration).
#   * Storybook component previews: no package ships a preview harness.
#   * publint publish-shape validation and changesets wiring: no @speed/*
#     package is published yet, and no release machinery is wired.
#
# jobs.timeout-minutes bounds every run; the caller additionally cancels
# stale runs via concurrency.

on:
  workflow_call:
    inputs:
      package:
        description: >-
          Package directory relative to the repository root, e.g.
          web/packages/tokens.
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm-package-ci:
    name: ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        uses: ./.github/actions/setup-node-env
      - name: Install workspace dependencies (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ${{ inputs.package }}
        run: pnpm lint
      - name: Typecheck
        working-directory: ${{ inputs.package }}
        run: pnpm typecheck
      - name: Test with the coverage gate
        working-directory: ${{ inputs.package }}
        run: pnpm test --coverage
      - name: Build
        working-directory: ${{ inputs.package }}
        run: pnpm build
