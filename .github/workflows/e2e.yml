name: e2e
# PURPOSE: the reference-app's browser-level end-to-end suite on real
# runners -- daily, on demand, and on every push to main (TRIGGER
# below). A real browser drives
# the real web host against a real, freshly booted reference-app server
# (standalone deployment mode, SQLite, zero external dependencies), and
# reaches the smile-simulation vendor through the suite's own
# deterministic fake image endpoint -- no live provider credential is
# involved anywhere; real vendor calls happen only during milestone
# acceptance and demos. Target duration and the merge-time guarantee
# are docs/internal/18-cicd.md's pipeline table (the e2e row).
#
# WHAT EXISTS: the suite (27 spec files plus the shared test-utils under
# examples/reference-app/web/e2e), its Playwright config with three
# projects (chromium, webkit, ipad), the fake image provider, and the
# app's vite dev server the config boots beside the Go server.
# Selection counts, measured with `--list`: the default tier selects 81
# tests (27 per project), the @budget tier 93 (31 per project), and
# `pnpm test:e2e:pending` selects none. e2e/README.md is the authority
# on what each tier means and on the constraints below.
#
# COVERAGE -- what runs, and why it is shaped this way:
#   * three matrix rows, one per Playwright project (chromium, webkit,
#     ipad); every row runs the default tier and then the @budget tier.
#     One engine per invocation is a correctness constraint, not
#     tidiness: all three engines in one invocation share one server
#     process and that server's in-memory rate-limit counters, and the
#     registering specs draw on go/authn's ten-registrations-per-hour
#     per-IP limit -- the third engine is answered 429 (e2e/README.md,
#     "One engine per invocation, and why pacing cannot fix it"). A row
#     per engine gives each its own server process and its own
#     counters, and the rows run in parallel so the wall clock is one
#     row's. That parallelism is a wall-clock choice only: matrix rows
#     are separate runners with their own CPU and memory, so serializing
#     them would not make any row's work lighter.
#   * both tiers in every row: the two invocations together run every
#     gate expected to pass, and each invocation boots its own server,
#     which is exactly what resets the counters @budget's separate
#     invocation depends on.
#   * @pending is never invoked here: it selects zero tests today, and
#     its gates are acceptance criteria for surfaces not yet built, so
#     a red would express no product fact. @deployment is not invoked
#     either -- without E2E_BASE_URL those gates skip themselves, which
#     is why a default-tier run reports a few skipped tests.
#
# TRIGGER: workflow_dispatch, a daily schedule at 04:23 UTC, and every
# push to main. The schedule is offset from scaffold-verify's 03:00 and
# security's 05:37 so the three do not contend for runner capacity. The
# push-to-main trigger stands on its recorded argument -- a dispatched
# run on this file that went green: run 34625987669, 2026-09-11, all
# three legs success. The daily schedule remains the standing coverage
# and workflow_dispatch serves on-demand and milestone runs.
#
# BUDGET: target under 20 minutes; every job carries timeout-minutes 30
# as a hang ceiling, not a target. A row spends 4-6 minutes in setup
# (Go toolchain, workspace install, browser download with its apt
# dependencies), 1-4 minutes on the pre-build (cold Go build cache),
# and minutes rather than seconds in the two tiers: the default tier's
# local pure test time is about twenty-five seconds (e2e/README.md), a
# runner runs slower, and @budget spends part of its time waiting on
# the sign-in budget. The three rows run in parallel, so the pipeline's
# wall clock is one row plus queueing.
#
# ENVIRONMENT FACTS: a step before the two tiers runs on every job and
# prints the runner's os-release, kernel, the apparmor unprivileged-
# userns sysctl (where the key exists), /dev/shm, memory and the
# resolved Playwright and browser builds into the CI log. It exists for
# the WebKit network-process crash this suite keeps meeting: every
# instance so far has been a WebKit-engine row in the @budget tier on
# this runner family, chromium has never shown it, and the machine
# facts that could size it are gone by the time a red is read -- so the
# next red carries them itself. e2e/README.md ("The browser
# network-process crash on CI, and the machine facts it needs") holds
# the evidence chain, what the next red should be read for, and the
# upstream issues to file against. No userns sysctl mitigation is
# applied: no official documentation ties the Ubuntu 24.04 AppArmor
# userns restriction to a mid-run sub-process crash (Playwright's own
# CI command against it is scoped to Electron's sandbox not starting
# at all), and the step records the sysctl's own value instead, so the
# red that would justify a decision carries the fact the decision
# would rest on. The step costs seconds.
#
# NO WORKFLOW-LEVEL ENVIRONMENT IS NEEDED, and none is set: the config
# picks its own random ports and run-unique SQLite, login-ledger and
# server-log paths under the OS temp directory; the demo passphrase and
# the fake provider's key are fixed non-secret values the config
# injects itself; and GitHub sets CI=true (the github + list reporters,
# forbidOnly). Fixed ports were a measured hazard in this suite (two
# worktrees adopting each other's server); CI must not reintroduce one.
# Caches ride the two setup actions: setup-go-env restores the Go
# module and build caches keyed on the go.sum files (the same key
# family fast-check and full-check fill), setup-node-env the pnpm
# store keyed on web/pnpm-lock.yaml. Playwright's browser download is
# deliberately not cached (a later optional optimization, not
# correctness).
#
# NOTHING CAN PASS SILENTLY -- the property the stub predecessor
# existed to state, now carried by the real steps: no step tolerates
# its own failure, and no command's exit code is erased by a fallback;
# no retry count is handed to Playwright (the suite's retries: 0 is a
# deliberate decision -- every flake in its history was a gate defect,
# and a retry hides exactly those); an empty selection exits non-zero
# (measured: `playwright test --grep @pending` prints "No tests found"
# and exits 1), so a renamed or retagged suite reddens this pipeline
# instead of passing empty. A failed run uploads its test-results --
# traces retained on failure and failure screenshots -- for 7 days, and
# prints the run's server logs into the CI log itself (the last step):
# the webServer's Go process writes its structured log into a run-unique
# file under the OS temp directory rather than into the report, so
# without that step a server that dies during boot says only "was not
# able to start. Exit code: 1" and never why.
#
# COST: every run pays three concurrent rows of roughly ten
# runner-minutes each. No path filtering, matching fast-check's call
# that the set is small enough to run everything on every trigger; if
# that changes, a paths filter is a caller-side change. The concurrency
# group cancels in-progress runs on the same ref, so a run triggered
# while a scheduled run is still going cancels the scheduled one --
# expected, not a bug.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          # The iPad device's default engine is webkit, so this row
          # reuses that browser download.
          - project: ipad
            browser: webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Go toolchain and module/build caches
        uses: ./.github/actions/setup-go-env
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        uses: ./.github/actions/setup-node-env
      - name: Install workspace dependencies (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install the row's browser with its system dependencies
        # --with-deps installs the shared libraries and fonts the
        # browser needs on the runner (apt), so no separate font step
        # exists.
        working-directory: examples/reference-app/web
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Pre-build the reference-app server
        # Moves the cold Go compile out of the config's webServer
        # timeout (300 s) into its own visible step, and warms the
        # build cache for the specs that boot their own servers via
        # `go run` during the test run (e2e/test-utils/servers.ts).
        working-directory: examples/reference-app
        run: go build ./cmd/server
      - name: Record the runner's environment facts
        # Runs on every job before the tiers; see the ENVIRONMENT FACTS
        # note at the top of this file and e2e/README.md ("The browser
        # network-process crash on CI, and the machine facts it needs").
        # Every probe degrades to an explicit line instead of an error,
        # because these keys are Linux-specific and this script also
        # runs on developer machines, where /etc/os-release and the
        # userns sysctl do not exist.
        working-directory: examples/reference-app/web
        run: |
          echo "::group::runner environment facts"
          echo "-- os-release:"
          if [ -r /etc/os-release ]; then
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          else
            echo "/etc/os-release not present (non-Linux host)"
          fi
          echo "-- kernel:"
          uname -sr
          echo "-- unprivileged user namespaces:"
          if value="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)"; then
            echo "kernel.apparmor_restrict_unprivileged_userns = ${value}"
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not readable on this host"
          fi
          if [ -d /proc/sys/kernel ]; then
            echo "userns-related keys under /proc/sys/kernel:"
            ls /proc/sys/kernel | grep -i userns || echo "(none)"
          fi
          echo "-- /dev/shm:"
          if [ -d /dev/shm ]; then
            df -h /dev/shm
          else
            echo "/dev/shm not present (non-Linux host)"
          fi
          echo "-- memory:"
          if [ -r /proc/meminfo ]; then
            grep -E '^(MemTotal|MemAvailable|SwapTotal):' /proc/meminfo
          else
            echo "no /proc/meminfo; hw.memsize = $(sysctl -n hw.memsize 2>/dev/null || echo unreadable)"
          fi
          echo "-- Playwright:"
          if command -v pnpm >/dev/null 2>&1; then
            pnpm exec playwright --version 2>/dev/null || echo "playwright not resolvable from this directory"
          else
            echo "pnpm not on PATH"
          fi
          echo "-- installed browsers (ms-playwright cache):"
          if [ -d "${HOME}/.cache/ms-playwright" ]; then
            ls "${HOME}/.cache/ms-playwright"
          else
            echo "no ms-playwright cache under ${HOME}/.cache"
          fi
          echo "::endgroup::"
      - name: Default tier
        working-directory: examples/reference-app/web
        run: pnpm test:e2e --project=${{ matrix.project }}
      - name: "@budget tier"
        working-directory: examples/reference-app/web
        run: pnpm test:e2e:budget --project=${{ matrix.project }}
      - name: Upload test results
        # !cancelled() rather than failure(): a cancelled run's partial
        # traces are as worth keeping as a failed run's, and on success
        # the directory may not exist (if-no-files-found: ignore).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-test-results-${{ matrix.project }}
          path: examples/reference-app/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show the run's server logs
        # The webServer starts the Go server with its stdout redirected
        # into a run-unique file under the OS temp directory
        # (playwright.config.ts), which is what lets the invitation
        # journey read the console mailer -- and the price is that a
        # server which exits during boot writes its own explanation
        # where no report reaches it, surfacing in the step above it as
        # "Process from config.webServer was not able to start. Exit
        # code: 1" and nothing more. This step is where that price is
        # paid back: on a failure, print each of the run's server logs
        # so the reason is in the CI log itself. A failed boot writes
        # nothing else to its file, so that file's tail is the error;
        # a longer-lived server's tail is still where its last complaint
        # sits.
        if: ${{ failure() }}
        run: |
          found=0
          printed=""
          for file in "${TMPDIR:-/tmp}"/reference-app-e2e-*.log /tmp/reference-app-e2e-*.log; do
            if [ ! -f "$file" ]; then
              continue
            fi
            case " $printed " in
              *" $file "*) continue ;;
            esac
            printed="$printed $file"
            found=1
            echo "::group::server log: $file (last 80 lines)"
            tail -n 80 "$file"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "no reference-app server log under ${TMPDIR:-/tmp} or /tmp"
          fi
