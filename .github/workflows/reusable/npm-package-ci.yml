name: npm-package-ci

# Reusable per-package npm CI, called by the pipeline orchestrators
# (pr-check today; pr-full, nightly and release when they grow npm legs).
# docs/internal/18-cicd.md's reusable-workflow design section is the
# governing spec: callers enumerate one matrix row per package, so adding a
# package means adding one row to a caller's matrix -- never copying this
# file's legs into a workflow.
#
# INPUT
# `package` is the package's directory relative to the repository root
# (e.g. web/packages/tokens). All toolchain versions come from
# setup-node-env, whose single sources are web/.nvmrc (Node) and
# web/package.json's packageManager field (pnpm) -- CI never states a
# version of its own, so the local workflow and CI cannot drift.
#
# LEGS
#   0. pnpm install --frozen-lockfile from the web/ workspace root. The
#      committed web/pnpm-lock.yaml must satisfy every package manifest
#      exactly; a stale lockfile fails the install, which is how a new
#      dependency forces its lockfile update into the same commit. The
#      pnpm store is cached by setup-node-env under a lockfile-hash key
#      (18-cicd cost-control rule 3).
#   1..4 run from inside the package directory, matching the local
#      workflow of web/AGENTS.md: the scripts resolve against the
#      package's own dependencies while ESLint and tsconfig walk up to the
#      workspace-level files in web/.
#   1. pnpm lint     the project-standard lint leg: flat config at web/
#                    (eslint.config.mjs -- typescript-eslint recommended
#                    plus '@typescript-eslint/no-explicit-any' as an
#                    error); the eslint/typescript-eslint versions are
#                    pinned in the shared web/package.json
#                    devDependencies. The workspace's own rules live
#                    behind the speed/ plugin namespace: no-literal-text
#                    (implementation and rule tests in web/eslint-rules/)
#                    errors on user-facing text written inline in package
#                    src -- package tests and test-utils are exempt by
#                    config (fixture strings are data). The rule's unit
#                    tests live outside every package; pr-check runs them
#                    once per PR in its repo-checks job, not in these
#                    per-package legs.
#   2. pnpm typecheck
#                    tsc --noEmit under the strict web/tsconfig.base.json
#                    settings (each package's tsconfig extends it).
#   3. pnpm test      the package's vitest unit suite. No e2e or
#                    component-preview legs exist until that tooling
#                    lands (see DELIBERATELY NOT WIRED below); a package's
#                    tests are its only runtime checks today.
#   4. pnpm build     emits dist/ via each package's project build. The
#                    package.json exports map to those emitted files, so a
#                    build that stops compiling fails here before any
#                    consumer resolves the exports at runtime.
#
# DELIBERATELY NOT WIRED HERE (18-cicd discipline-table rows whose tooling
# does not exist in the repository yet; each lands with the round that
# introduces it -- wiring them now would be fake checks):
#   * ESLint rules that need the generated api-sdk consumer surface --
#     no hand-written backend calls -- land with the api-client/api-sdk
#     round, where the types to check against exist. (The no-bare-text
#     half of the JSX family is wired: speed/no-literal-text covers
#     React package src from the shared flat config; see leg 1.)
#   * Repo-level i18n key parity over package locale files
#     (tools/check_i18n_keys.py's web JSON extension) is wired in the
#     repo-level docs-check pipeline, whose path filter already covers
#     **/locales/**; the parity runtime half stays in code (@speed/i18n's
#     registerNamespace validates coverage and identical key sets at
#     registration).
#   * Storybook component previews: ui-kit shipped without a preview
#     harness; the round that introduces one wires it here.
#   * publint publish-shape validation and changesets wiring: with the
#     web release-machinery round -- no @speed/* package is published yet,
#     and the release pipeline stub is gated until that round.
#
# jobs.timeout-minutes bounds every run (18-cicd cost control); the caller
# additionally cancels stale runs via concurrency.

on:
  workflow_call:
    inputs:
      package:
        description: >-
          Package directory relative to the repository root, e.g.
          web/packages/tokens.
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm-package-ci:
    name: ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        uses: ./.github/actions/setup-node-env
      - name: Install workspace dependencies (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ${{ inputs.package }}
        run: pnpm lint
      - name: Typecheck
        working-directory: ${{ inputs.package }}
        run: pnpm typecheck
      - name: Test
        working-directory: ${{ inputs.package }}
        run: pnpm test
      - name: Build
        working-directory: ${{ inputs.package }}
        run: pnpm build
