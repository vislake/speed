name: go-module-ci

# Reusable per-module Go CI, called by the pipeline orchestrators (pr-check
# and pr-full today; nightly when it lands). docs/internal/18-cicd.md's
# reusable-workflow design section is the governing spec: callers enumerate
# one matrix row per module, so adding a module means adding one row to a
# caller's matrix -- never copying this file's legs into a workflow.
#
# INPUT
# `module` is the module's directory relative to the repository root
# (e.g. go/pkgcore). Every leg runs from inside that directory, because the
# repository root is a go.work workspace, not a module: bare ./... patterns
# do not resolve there (root CLAUDE.md, "Traps"; Taskfile.yml's package-
# patterns note).
#
# LEGS -- unit tier only, container-free by design:
#   1. golangci-lint run ./...   the project-standard lint leg (.golangci.yml
#                                at the repo root, v2 schema; 18-cicd
#                                discipline-table rows that have golangci
#                                tooling today -- errcheck, gosec, govet's
#                                shadow check, depguard's pkgcore-root
#                                module-boundary rule). The binary comes
#                                from setup-go-env, pinned and checksummed.
#   2. go vet ./...              static analysis, kept as its own leg: vet is
#                                the go-version-coupled check that runs on
#                                every module, while golangci-lint carries the
#                                discipline rules on top.
#   3. go test -race ./...       unit suite under the race detector. The
#                                Docker-backed integration tiers
#                                (-tags=integration: PostgreSQL for dbkit
#                                and tenancy, Redis for jobs, and Redis
#                                plus MinIO/S3 for pkgcore -- its
#                                integration_test/ runs both tiers)
#                                intentionally do NOT run here: 18-cicd's
#                                layered-triggering rule puts them in the
#                                pre-merge full matrix (pr-full), not in
#                                the fast per-PR check.
#   4. go build ./...            module build in workspace context.
#   5. GOWORK=off go build ./... standalone build proving the module's
#                                go.mod/go.sum suffice outside the
#                                workspace. This is the CI replacement for
#                                the interim standalone_build_test.go
#                                guards (go/pkgcore, go/tenancy), per the
#                                last row of 18-cicd's discipline table;
#                                those tests stay for local runs and still
#                                execute under leg 3 on CI.
#
# jobs.timeout-minutes bounds every run (18-cicd cost control); the caller
# additionally cancels stale runs via concurrency.

on:
  workflow_call:
    inputs:
      module:
        description: >-
          Module directory relative to the repository root, e.g. go/pkgcore.
        required: true
        type: string

permissions:
  contents: read

jobs:
  go-module-ci:
    name: ${{ inputs.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Go toolchain, golangci-lint and caches
        uses: ./.github/actions/setup-go-env
        with:
          # The golangci-lint leg below needs the binary; the install is
          # opt-in so the non-linting setup-go-env callers (pr-check's
          # repo-checks job, pr-full's integration-tiers rows) do not pay
          # for a download and cache round-trip they never use.
          install-golangci: true
      - name: golangci-lint
        working-directory: ${{ inputs.module }}
        run: golangci-lint run ./...
      - name: go vet
        working-directory: ${{ inputs.module }}
        run: go vet ./...
      - name: Unit tests under the race detector
        working-directory: ${{ inputs.module }}
        run: go test -race ./...
      - name: Build in workspace context
        working-directory: ${{ inputs.module }}
        run: go build ./...
      - name: Build standalone outside the workspace (GOWORK=off)
        working-directory: ${{ inputs.module }}
        env:
          GOWORK: "off"
        run: go build ./...
