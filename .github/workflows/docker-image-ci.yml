name: docker-image-ci

# Manual proof that the reusable Docker build (reusable-docker-build.yml)
# genuinely works, over the reference app's real Dockerfile
# (examples/reference-app/Dockerfile, the reference-app-docker-image
# round). workflow_dispatch-only, matching this repository's stated
# boundary for this round: e2e, release and nightly -- the reusable
# workflow's own eventual real callers -- are not live yet (each stays a
# gated stub in its own right), so this file is the one live caller until
# one of those three rounds lands and wires it in for real.
#
# As of chore/docker-build-native-arm, the reusable workflow this file
# calls no longer builds linux/arm64 by QEMU emulation on a single
# x86_64 runner: it runs two native builder jobs in parallel (amd64 on
# ubuntu-latest, arm64 on GitHub's real, GA, hosted ubuntu-24.04-arm
# runner) and combines their independently-pushed images into one real
# multi-arch manifest via `docker buildx imagetools create`. No
# `platforms` input exists any more -- both architectures are always
# built, natively, every dispatch. The push target is this repository's
# own GHCR namespace under the workflow's built-in GITHUB_TOKEN (see
# reusable-docker-build.yml's own header for why that is not a new
# credential), not a no-op discard as the prior QEMU-based leg's
# never-loaded multi-arch build used to be -- so a dispatch of this
# workflow now leaves behind three real, architecture- and run-scoped CI
# proof tags (`<tag>-amd64`, `<tag>-arm64`, the plain `<tag>` manifest
# list) in this repository's GHCR packages, not a release artifact.
#
# Flat under .github/workflows/, never a subdirectory -- this repository
# hit a real GitHub Actions constraint earlier over exactly that mistake
# (workflows must live directly under .github/workflows/ to be discovered
# at all).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to build the image as (defaults to this run's own id, so repeated dispatches never collide).
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-reference-app:
    name: build examples/reference-app
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: speed-reference-app
      image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || format('ci-{0}', github.run_id) }}
      context: .
      dockerfile: examples/reference-app/Dockerfile
      healthcheck_path: /healthz
      healthcheck_port: "8080"
