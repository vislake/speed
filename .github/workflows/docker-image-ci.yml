name: docker-image-ci
# Manual proof that the reusable Docker build (reusable-docker-build.yml)
# genuinely works, over the reference app's real Dockerfile
# (examples/reference-app/Dockerfile). workflow_dispatch-only: e2e,
# release and nightly -- the reusable workflow's eventual real callers --
# are not live yet (each stays a gated stub in its own right), so this
# file is the one live caller of the reusable build.
#
# The reusable workflow builds linux/amd64 and linux/arm64 on two
# parallel native builder jobs (amd64 on ubuntu-latest, arm64 on GitHub's
# hosted ubuntu-24.04-arm runner) and combines their independently-pushed
# images into one multi-arch manifest via `docker buildx imagetools
# create`; both architectures are always built on every dispatch, and no
# `platforms` input exists. The push target is this repository's own
# GHCR namespace under the workflow's built-in GITHUB_TOKEN (see
# reusable-docker-build.yml's own header for why that is not a new
# credential). A dispatch leaves behind three real, architecture- and
# run-scoped CI proof tags (`<tag>-amd64`, `<tag>-arm64`, the plain
# `<tag>` manifest list) in this repository's GHCR packages, not a
# release artifact.
#
# Flat under .github/workflows/, never a subdirectory: GitHub Actions
# discovers workflows only directly under .github/workflows/.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to build the image as (defaults to this run's own id, so repeated dispatches never collide).
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-reference-app:
    name: build examples/reference-app
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: speed-reference-app
      image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || format('ci-{0}', github.run_id) }}
      context: .
      dockerfile: examples/reference-app/Dockerfile
      healthcheck_path: /healthz
      healthcheck_port: "8080"
