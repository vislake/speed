name: full-check
# Pre-merge FULL MATRIX pipeline: every module through the unit suite
# under the race detector, plus the Docker-backed integration tiers and
# the reference-app suite. This is the layered-triggering layer 2:
# integration runs live here, NOT in the fast per-PR check (fast-check).
# Target duration under 35 minutes; every job carries a timeout and
# stale runs are cancelled via concurrency.
#
# TRIGGERS: a PR labeled `full-ci`, every direct push to main, and
# workflow_dispatch. Label-only events do not re-run on later pushes, so
# the pull_request types cover the opened/synchronize/reopened flow
# (re-run on every push while the label is present) plus labeled (first
# run on labeling), and every job gates itself on
# workflow_dispatch/push/the label: an unlabeled, non-push PR run skips
# every job. workflow_dispatch runs the same jobs bypassing the label
# gate, for manual full-matrix runs. The push trigger exists because
# main allows direct pushes and that is the normal path here -- a push
# carries no PR to label at all, so without this trigger the Docker-
# backed integration tiers would only ever run when a human remembers
# to workflow_dispatch them by hand. This mirrors fast-check's own
# push-to-main trigger one layer up, at real cost: every push now pays
# this pipeline's ~35-minute budget -- the reference-app job (lint,
# unit suite, coverage gate and the Docker-backed tier) is the measured
# tail; see that job's timeout-minutes comment.
#
# COVERAGE -- what runs:
#   * go-modules job: the same module matrix as fast-check through the
#     reusable go-module-ci workflow (golangci-lint, go vet, unit tests
#     under -race, a workspace-context build and a GOWORK=off standalone
#     build) -- the full matrix runs the unit tier too. Per the
#     reusable-workflow design rule, this file adds one matrix row per
#     module and copies no legs. The matrix also carries
#     tools/configrefgen, the repository's tool module (a go.work entry
#     outside go/, consumer-module form): its suite is fast and
#     container-free, so unlike the reference app's it also rides the
#     fast per-PR matrix.
#   * integration-tiers job: the Docker-backed integration tiers
#     (-tags=integration), one matrix row per module that ships a tier,
#     run from inside the module: go test -race -tags=integration ./...
#     -- the exact command shape and module enumeration of Taskfile
#     test:full's INTEGRATION_DIRS loop (the source of truth for which
#     modules carry an integration_test/ directory). Docker is
#     preinstalled on ubuntu-latest runners; testcontainers pulls images
#     per leg on first use. The legs, module by module:
#       go/dbkit     PostgreSQL
#       go/tenancy   PostgreSQL (its tier lives under
#                    tenancytest/integration_test/; ./... covers it)
#       go/config    PostgreSQL and Redis
#       go/jobs      Redis
#       go/pkgcore   Redis and RustFS/S3
#       go/rbac      PostgreSQL and Redis (migrations and AssertIsolated
#                    on the second dialect; cross-replica cache
#                    invalidation a revoke depends on)
#       go/org       PostgreSQL (materialized-path dialect-identity
#                    proof and the tenant-scoped AssertIsolated suites)
#       go/authn     PostgreSQL (migrations zero-to-head, isolation
#                    suite, blind-index uniqueness and concurrent
#                    refresh-token rotation; no Redis tier -- authn
#                    touches KVStore only through ratelimit and the
#                    revocation list, covered by their owning modules'
#                    tiers)
#       go/storage   PostgreSQL and RustFS/S3
#       go/notification PostgreSQL and Redis (schema and isolation
#                       semantics of the five tables, the consent-ledger
#                       single-winner verify, and cross-replica inbox
#                       delivery: a delivery written on one replica
#                       announcing its inbox row on the bus the other
#                       replica reads)
#       go/integration  PostgreSQL (migrations from zero and the
#                       WebhookSubscription mark-delete/restore
#                       mechanism against a real server -- a PostgreSQL-
#                       specific class the unit tier's SQLite-only proof
#                       cannot rule out)
#       go/metering   PostgreSQL (migrations from zero, the tenant-
#                     scoped repositories' AssertIsolated suites, and
#                     the PostgreSQL-only regressions: Enqueue's
#                     idempotent retry inside a caller transaction, the
#                     redelivered-event no-op, the redelivered outbox
#                     row retiring instead of failing forever, and
#                     validate's byte bounds)
#       go/billing    PostgreSQL (migrations from zero, both
#                     tenant-scoped models' AssertIsolated suites, the
#                     PreDeduct unique-violation recovery regression --
#                     a retried reservation read the duplicate row back
#                     on the transaction a unique-violation error had
#                     aborted, so it could never succeed on PostgreSQL
#                     though SQLite stayed green -- plus the
#                     reserve/confirm/refund lifecycle and the
#                     concurrent over-balance single-winner proof)
#       go/pki        PostgreSQL (the migration-dedupe regression
#                     against a real server: a database stranded at
#                     migration 0008 with duplicate certificate-
#                     revocation ledger rows upgrades through the
#                     registry to exactly one row per certificate --
#                     the one regression whose second dialect no SQLite
#                     proof can rule out)
#     Modules without a matrix row here: go/sharing, go/compliance and
#     go/admin (see each module's AGENTS.md for what each ships).
#   * reference-app job: examples/reference-app's golangci-lint leg,
#     unit suite under -race, and its Docker-backed integration tier
#     (-tags=integration -- testcontainers Redis, RustFS and a Mailpit
#     SMTP catcher), plus the app-owned generation leg: the job
#     regenerates the reference app's own API surface (its three
#     fragments' backend artifacts, the app-owned merged document and
#     the app-owned SDK -- Taskfile's api:gen:app commands) and runs a
#     porcelain gate over the committed app-owned artifacts, the app's
#     own minimal equivalent of the platform api-contract consistency
#     gate (the app is a consumer; its generation consistency is not the
#     platform pipeline's business -- docs/internal/21-api-contract.md
#     records the split). The app is its own module, listed in go.work
#     but outside go/, so neither the module matrix above nor the go/...
#     import-path build of fast-check covers it (Taskfile's APP_DIR legs
#     are the local mirror). The app's integration_test/ carries two
#     proofs: redis_eventbus_composition_test.go boots the real server
#     with a real Redis Streams EventBus in a STANDALONE topology (the
#     proof that implementation composition is orthogonal to deployment
#     mode), and distributed_mode_test.go boots the real server TWICE,
#     both replicas under APP_DEPLOYMENT_MODE=distributed against the
#     same real Redis/RustFS/SMTP-catcher infrastructure. Replica B
#     boots with APP_DISABLE_QUEUE_WORKER=true so it can never
#     self-produce a delivery; the test opens replica B's own SSE inbox
#     stream (GET /api/v1/notifications/stream) before replica A creates
#     the note, and asserts the EventInboxCreated announcement still
#     reaches B -- provable only if the real Redis-backed EventBus
#     crossed the process boundary, since the two replicas share one
#     SQLite file and a shared jobs table alone could not explain it. A
#     second sub-assertion drives one wrong-password login against each
#     replica for the same account and checks replica B sees the
#     account-locked state replica A's attempt wrote, proving the KVStore
#     seam crossed the same boundary; a negative-path sub-test proves an
#     incompletely-composed distributed boot fails closed through the
#     real binary's own process exit code. The job also runs the app's
#     coverage gate (tools/check_coverage_baseline.py --check --module
#     examples/reference-app -- the 80% floor plus no-decline vs the
#     baseline, measured excluding .gen.go statements) right after the
#     unit suite, on the same unit-test-only scope. The app is not a
#     go-module-ci matrix row (it lives outside go/), so its coverage
#     gate has no reusable leg to ride: this job is its home, because
#     the app's unit suite runs nowhere else. fast-check deliberately
#     does not gate the app's coverage on every PR -- its suite is
#     full-check-only (kept out of the fast per-PR check for budget),
#     so an every-PR measurement would duplicate a run that does not
#     exist there; every push to main pays full-check, and that is where
#     the app's coverage stays enforced. The app's lint lives here too,
#     not in fast-check, keeping the fast per-PR pipeline on its 8-minute
#     budget; the app's go.mod is still validated on every PR by
#     fast-check's repo-checks workspace build.
#
# KNOWN LIMITATIONS (listed honestly):
#   * the dual deployment mode x dual dialect full-matrix acceptance
#     across every module does not exist. What runs above is the real
#     part of the matrix: the standalone-mode unit suites, the
#     PostgreSQL / Redis / RustFS-S3 integration tiers, and the
#     reference-app job's two integration-tier proofs -- both replicas
#     still on the app's own hard-coded SQLite dialect, so the
#     deployment-mode axis is real while the second-dialect axis is not
#     (distributed_mode_test.go's own header records that combination
#     as a recorded deviation, not a silently worked-around one).
#   * coverage reporting: Taskfile test:full passes -cover, but CI has
#     no collector for coverage output, so -cover is deliberately not
#     passed on the legs above (and the go-module-ci legs are shared
#     with fast-check unchanged -- zero regression risk on the every-PR
#     workflow). The coverage GATE is a different mechanism and is not
#     part of this limitation: it runs its own go test -coverprofile
#     measurement (go-module-ci leg 3b, plus the reference-app job's
#     gate step below) and compares against tools/coverage-baselines.json,
#     no collector involved.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # main allows direct pushes and that is the normal path here, not an
  # edge case -- most commits land on main by a direct push rather than a
  # merged, full-ci-labeled pull request, so without this trigger the
  # Docker-backed integration tiers below almost never run at all: a push
  # carries no PR to label, so it could only ever be caught by
  # workflow_dispatch, i.e. a human remembering to run it by hand. This
  # mirrors fast-check's own push-to-main trigger and closes the same gap
  # one layer up, at real cost -- every push now pays this pipeline's
  # ~35-minute budget (its measured tail is the reference-app job: lint,
  # unit suite, coverage gate, Docker-backed tier -- see that job's
  # timeout-minutes comment), not just fast-check's few minutes.
  push:
    branches: [main]

concurrency:
  group: full-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-modules:
    name: go-module-ci (${{ matrix.module }})
    # Label gate: pull_request runs only while the full-ci label is on the
    # PR (unlabeled, non-push runs skip every job -- reported neutral,
    # never blocking a merge); workflow_dispatch and push (every push to
    # main) both bypass the label gate and always run.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Timeout and runner live in the reusable workflow; the callee's
    # timeout-minutes bounds each call (caller jobs may not set their own).
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/pkgcore
          - go/dbkit
          - go/tenancy
          - go/observability
          - go/config
          - go/jobs
          - go/ratelimit
          - go/rbac
          - go/org
          - go/authn
          - go/saasctl
          - go/storage
          - go/notification
          - go/pki
          - go/integration
          - go/metering
          - go/sharing
          - go/billing
          - go/ai-gateway
          - go/compliance
          - go/admin
          - tools/configrefgen
    uses: ./.github/workflows/reusable-go-module-ci.yml
    with:
      module: ${{ matrix.module }}

  integration-tiers:
    name: integration tier (${{ matrix.module }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    # Per-leg cap. Rows run in parallel with each other and with the unit
    # matrix and the reference-app job, so wall-clock stays the slowest leg
    # -- a cold testcontainers image pull plus a -race suite fits this cap
    # with room to spare under the 35-minute pipeline budget.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/dbkit
          - go/tenancy
          - go/jobs
          - go/pkgcore
          - go/config
          - go/rbac
          - go/org
          - go/authn
          - go/storage
          - go/notification
          - go/integration
          - go/metering
          - go/billing
          - go/pki
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # golangci-lint is deliberately not installed here (setup-go-env's
      # install-golangci input, default false): this job never lints, and
      # an unconditional install would mean a ~15 MB download and an
      # analysis-cache round-trip per matrix row for nothing.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: Integration tier under the race detector (testcontainers)
        working-directory: ${{ matrix.module }}
        run: go test -race -tags=integration ./...

  reference-app:
    name: reference-app lint + unit + integration (-race)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    # Raised from 20 when the -race suites outgrew it, then to 35 when
    # the coverage-gate step joined. Measured on the last fully passing
    # run: lint ~1.2m, unit ~7.5m and the Docker-backed integration tier
    # ~7.2m in CI. The unit suite has since grown to ~400s locally and
    # clears 10m on the slow shared runner -- the d31a3b95 run was
    # killed by `go test`'s default 10m per-package timeout, a
    # legitimately slow package, not a hang -- which is why both test
    # legs below pass an explicit -timeout: 15m for the unit suite
    # (~2.25x the ~400s local run, above its 1.5-2x slower CI
    # projection) and 20m for the integration tier (~2.8x its measured
    # 7.2m, cold testcontainers pulls included). Those budgets bound a
    # single package's test binary, never the whole leg -- packages run
    # in parallel, so a leg's wall time is its slowest package -- and the
    # job cap stays the outer bound. The coverage-gate step adds a
    # second, non-race run of the unit suite under -coverprofile
    # (measured ~3m locally; the tool's own header has the mechanism),
    # ~4-5m on the slow runner. The legs sum to ~24-27m normally and
    # ~30m on a slow runner, which no longer fits a 30m cap; this job is
    # the pipeline's measured tail, so the raised cap keeps the run
    # under the 35-minute pipeline target above.
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Go toolchain, golangci-lint and caches
        uses: ./.github/actions/setup-go-env
        with:
          # This job runs the app's golangci-lint leg below; the install is
          # opt-in so the non-linting setup-go-env callers (fast-check's
          # repo-checks, the integration-tiers rows) do not pay for a
          # download and cache round-trip they never use.
          install-golangci: true
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        # The app-owned generation leg below runs the pinned redocly and
        # orval CLIs via pnpm dlx (never a workspace dependency, so no
        # web install is needed here).
        uses: ./.github/actions/setup-node-env
      - name: Regenerate the app-owned API surface (task api:gen:app)
        # The reference app owns its own API: the three fragments under
        # examples/reference-app/internal/{notes,cases,smilesim}/api
        # regenerate through the app-owned generation leg, the
        # consumer-shaped twin of the platform api-contract pipeline
        # (docs/internal/21-api-contract.md records the split). The
        # committed artifacts -- the three backend <name>-server.gen.go
        # files, the app-owned merged document (examples/reference-app/
        # web/app-openapi.yaml) and the app-owned SDK entry
        # (examples/reference-app/web/src/app-api/index.ts) -- must be
        # exactly what the specs generate; the porcelain gate in the next
        # step fails the job otherwise. The same commands as Taskfile.yml's
        # api:gen:app task -- keep the two in lockstep (pinned redocly
        # 2.51.1, orval 8.17.0 and oapi-codegen v2.8.0; the two fixup
        # scripts run with the app-owned targets passed explicitly).
        run: |
          (cd examples/reference-app/internal/notes/api && \
            go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
              -config oapi-codegen.yaml openapi.yaml)
          (cd examples/reference-app/internal/cases/api && \
            go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
              -config oapi-codegen.yaml openapi.yaml)
          (cd examples/reference-app/internal/smilesim/api && \
            go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
              -config oapi-codegen.yaml openapi.yaml)
          mkdir -p examples/reference-app/web
          pnpm --package=@redocly/cli@2.51.1 dlx redocly join \
            examples/reference-app/internal/notes/api/openapi.yaml \
            examples/reference-app/internal/cases/api/openapi.yaml \
            examples/reference-app/internal/smilesim/api/openapi.yaml \
            -o examples/reference-app/web/app-openapi.yaml
          node web/scripts/redocly-join-fixup.mjs \
            examples/reference-app/web/app-openapi.yaml \
            reference-app \
            'The reference-app application OpenAPI document: the redocly join of the application own three fragments (notes, cases and smilesim), regenerated by `task api:gen:app` and committed. Each fragment stays authoritative for its own operations; this merged document is the app-owned SDK generation input and the linted whole-surface view.'
          pnpm --package=@redocly/cli@2.51.1 dlx redocly lint \
            examples/reference-app/web/app-openapi.yaml --config redocly.yaml
          cd examples/reference-app/web
          pnpm dlx orval@8.17.0 --config orval.config.ts
          node ../../../web/scripts/orval-nodenext-fixup.mjs \
            src/app-api/index.ts src/app-api/runtime.ts
      - name: App-owned generated artifacts must match the committed specs
        # Porcelain gate, not `git diff --exit-code`: `git diff` reports
        # only modifications to TRACKED files, so a regeneration that
        # CREATES a file -- an artifact generated before its first commit
        # -- would pass a diff gate silently (the identical reason
        # api-contract.yml's own gates are porcelain).
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: regenerating the app-owned API surface left the"
            echo "tree dirty. A committed artifact under"
            echo "examples/reference-app (the internal/*/api .gen.go"
            echo "files, web/app-openapi.yaml or web/src/app-api) is not"
            echo "what its spec generates -- did you change an app"
            echo "fragment spec without running 'task api:gen:app' and"
            echo "committing the result?"
            echo "Per docs/internal/21-api-contract.md, spec + generated"
            echo "artifact + implementation ship in the same PR."
            exit 1
          fi
      - name: golangci-lint
        working-directory: examples/reference-app
        run: golangci-lint run ./...
      - name: Unit tests under the race detector
        working-directory: examples/reference-app
        # Explicit per-package -timeout; budget rationale in the
        # timeout-minutes comment above (go test's default 10m killed the
        # d31a3b95 run on a legitimately slow package).
        run: go test -race -timeout 15m ./...
      # The app's own coverage gate: docs/internal/20's rule for every
      # released module (80% floor plus no-decline vs the baseline,
      # .gen.go statements excluded), run by the same script the
      # go-module-ci coverage legs use. The app is not a go-module-ci
      # matrix row -- it lives outside go/ -- and its unit suite runs
      # nowhere but this job, so this is where its measurement belongs.
      # The leg runs the suite again without -race under -coverprofile
      # (~2-4 min; the tool's own header has the mechanism). No
      # explicit per-package -timeout needed: the same packages just
      # cleared 15m under the race detector, and a non-race run is
      # strictly faster. Budget in the timeout-minutes comment above.
      - name: Coverage gate (80% floor and no-decline vs baseline)
        working-directory: examples/reference-app
        run: python3 "${{ github.workspace }}/tools/check_coverage_baseline.py" --check --module examples/reference-app
      # The app's own Docker-backed tier, mirroring Taskfile test:full's
      # APP_DIR integration leg. golangci-lint is not needed here, but
      # setup-go-env already installed it above for the lint step; the cost
      # is the one install this job pays for anyway.
      - name: Integration tier under the race detector (testcontainers)
        working-directory: examples/reference-app
        # Explicit per-package -timeout; budget rationale in the
        # timeout-minutes comment above.
        run: go test -race -tags=integration -timeout 20m ./...
