name: full-check

# Pre-merge FULL MATRIX pipeline -- docs/internal/18-cicd.md's pipeline
# table, full-check row: every module through the unit suite under the race
# detector, plus the Docker-backed integration tiers and the reference-app
# suite. This is 18-cicd's layered-triggering layer 2: integration runs live
# here, NOT in the fast per-PR check (fast-check). Target duration under 25
# minutes; every job carries a timeout and stale runs are cancelled via
# concurrency (18-cicd cost-control rules 4 and 5).
#
# DESIGN-TABLE TRIGGER: a PR labeled `full-ci`, plus every direct push to
# main, plus workflow_dispatch. Label-only events do not re-run on later
# pushes, so the pull_request types cover the opened/synchronize/reopened
# flow (re-run on every push while the label is present) plus labeled
# (first run on labeling), and every job gates itself on
# workflow_dispatch/push/the label: an unlabeled, non-push PR run skips
# every job, a labeled PR re-runs on each push. workflow_dispatch (kept
# from the stub) runs the same jobs bypassing the label gate, for manual
# full-matrix runs. The push trigger exists because main allows direct
# pushes and that is the normal path here (18-cicd's branch-protection
# section), not an edge case a `full-ci` label could be relied on to
# catch -- a push carries no PR to label at all, so without this trigger
# the Docker-backed integration tiers below would only ever run when a
# human remembers to workflow_dispatch them by hand. This mirrors
# fast-check's own push-to-main trigger one layer up, at real cost: every
# push now pays this pipeline's ~25-minute Docker-backed budget.
#
# COVERAGE -- what genuinely runs today
#   * go-modules job: the same twenty-one-module matrix as fast-check through
#     the reusable go-module-ci workflow (golangci-lint, go vet, unit tests
#     under -race, a workspace-context build and a GOWORK=off standalone
#     build) -- the full matrix runs the unit tier too. Per 18-cicd's
#     reusable-workflow design rule, this file adds one matrix row per
#     module and copies no legs. go/sharing, go/billing, go/compliance and
#     go/admin ship no Docker-backed integration_test/ tier this round, so
#     they are deliberately absent from the integration-tiers matrix below,
#     the same absence go/pki's and go/metering's own rounds recorded for
#     themselves.
#   * integration-tiers job: the Docker-backed integration tiers
#     (-tags=integration), one matrix row per module that ships a tier, run
#     from inside the module: go test -race -tags=integration ./... -- the
#     exact command shape and module enumeration of Taskfile test:full's
#     INTEGRATION_DIRS loop (the source of truth for which modules carry an
#     integration_test/ directory). Docker is preinstalled on ubuntu-latest
#     runners; testcontainers pulls images per leg on first use:
#       go/dbkit     PostgreSQL
#       go/tenancy   PostgreSQL (its tier lives under
#                    tenancytest/integration_test/; ./... covers it)
#       go/config    PostgreSQL and Redis -- its integration_test/ runs
#                    both legs (postgres_leg_test.go,
#                    redis_leg_test.go)
#       go/jobs      Redis
#       go/pkgcore   Redis and MinIO/S3 -- its integration_test/ runs both
#                    tiers (redis_container_test.go/redis_kv_test.go/
#                    redis_eventbus_test.go against Redis,
#                    minio_container_test.go/s3_objectstore_test.go against
#                    MinIO/S3)
#       go/rbac      PostgreSQL and Redis -- its integration_test/ runs
#                    both legs (postgres_leg_test.go for the second
#                    dialect's migrations and AssertIsolated,
#                    redis_leg_test.go for the cross-replica cache
#                    invalidation a revoke depends on)
#       go/org       PostgreSQL -- its integration_test/ re-runs the A1
#                    materialized-path dialect-identity proof
#                    (postgres_tree_test.go) and the three tenant-scoped
#                    repositories' AssertIsolated suite
#                    (postgres_isolation_test.go) against a real server
#       go/authn     PostgreSQL -- migrations zero-to-head, the mandatory
#                    tenancytest isolation suite, blind-index uniqueness
#                    and concurrent refresh-token rotation, all proven
#                    against real PostgreSQL rather than SQLite (no Redis
#                    tier: authn touches KVStore only through ratelimit and
#                    the revocation list, both already covered by their own
#                    owning module's tier -- go/authn/AGENTS.md)
#       go/storage   PostgreSQL and MinIO/S3 -- its integration_test/ runs
#                    both legs (postgres_leg_test.go for the module's
#                    migrations applied from zero on the second dialect and
#                    the tenant-scoped repositories' AssertIsolated suite,
#                    minio_leg_test.go for object-store round-trips against
#                    MinIO through pkgcore.NewS3ObjectStore)
#       go/notification PostgreSQL and Redis -- its integration_test/
#                       runs both legs (postgres_leg_test.go for the
#                       schema and isolation semantics of the five
#                       tables -- migrations zero to head,
#                       AssertIsolated against a real server, and the
#                       consent-ledger single-winner verify whose
#                       compare-and-swap SQLite cannot even put at
#                       risk -- and redis_leg_test.go for the
#                       cross-replica inbox delivery: two booted
#                       modules over one shared Redis client and
#                       database, a delivery written on one replica
#                       announcing its inbox row on the bus the other
#                       replica reads)
#       go/integration  PostgreSQL -- its integration_test/
#                       (postgres_softdelete_test.go, added in the
#                       soft-delete-adoption round) applies the module's
#                       migrations from zero and re-proves
#                       WebhookSubscription's mark-delete/restore
#                       mechanism against a real server, a PostgreSQL-
#                       specific mistake the unit tier's SQLite-only
#                       proof cannot rule out
#   * reference-app job: examples/reference-app's golangci-lint leg, unit
#     suite under -race, and its Docker-backed integration tier
#     (-tags=integration -- testcontainers Redis, MinIO and a Mailpit SMTP
#     catcher) -- reference-app is its own module, listed in go.work but
#     outside go/, so neither the module matrix above nor the go/...
#     import-path build of fast-check covers it (Taskfile's APP_DIR legs
#     are the local mirror, and Taskfile test:full runs the app's
#     integration tier the same way this job does). The app's
#     integration_test/ carries two proofs at this point:
#     redis_eventbus_composition_test.go boots the real server with a real
#     Redis Streams EventBus in a STANDALONE topology (the
#     deployment-composition retrofit's original proof that implementation
#     composition is orthogonal to deployment mode), and
#     distributed_mode_test.go (this round) boots the real server TWICE,
#     both replicas under SPEED_DEPLOYMENT_MODE=distributed against the
#     same real Redis/MinIO/SMTP-catcher infrastructure, and proves a
#     notification triggered through replica A's HTTP port is read back
#     through replica B's -- the positive half of the M0 exit condition
#     this file's own NOT YET section used to record as entirely missing --
#     plus a negative-path sub-test proving an incompletely-composed
#     distributed boot still fails closed through the real binary's own
#     process exit code, not just server_test.go's in-process form. Its
#     lint lives here, not in fast-check, keeping the fast per-PR pipeline
#     on its 8-minute budget; the app's go.mod is still validated on every
#     PR by fast-check's repo-checks workspace build.
#
# NOT YET -- listed honestly, roadmap M0:
#   * the dual deployment mode x dual dialect full-matrix acceptance across
#     every module. What runs above is the real part of the matrix that
#     exists today: the standalone-mode unit suites, the PostgreSQL /
#     Redis / MinIO-S3 integration tiers, and the reference-app job's two
#     integration-tier proofs (a real-Redis composition in a STANDALONE
#     topology, and -- new this round -- a genuine two-replica DISTRIBUTED
#     boot against real Redis/MinIO/SMTP, both still on the app's own
#     hard-coded SQLite dialect: the deployment-mode axis this condition
#     names is now real, the second-dialect axis is not, and
#     distributed_mode_test.go's own header records that combination
#     explicitly as a recorded, not silently worked around, deviation from
#     what a genuinely dual-dialect distributed run would need). No
#     dual-mode-x-dual-dialect combined tier exists to run yet.
#   * coverage reporting: Taskfile test:full passes -cover, but CI has no
#     collector for coverage output, so -cover is deliberately not passed
#     on the legs above (and the go-module-ci legs are shared with fast-check
#     unchanged -- zero regression risk on the every-PR workflow).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # main allows direct pushes (18-cicd.md's branch-protection section) and
  # that is the normal path here, not an edge case -- most commits land on
  # main by a direct push rather than a merged, full-ci-labeled pull
  # request, so without this trigger the Docker-backed integration tiers
  # below almost never run at all: a push carries no PR to label, so it
  # could only ever be caught by workflow_dispatch, i.e. a human
  # remembering to run it by hand. This mirrors fast-check's own
  # push-to-main trigger and closes the same gap one layer up, at real
  # cost -- every push now pays this pipeline's ~25-minute Docker-backed
  # budget, not just fast-check's few minutes.
  push:
    branches: [main]

concurrency:
  group: full-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-modules:
    name: go-module-ci (${{ matrix.module }})
    # Label gate: pull_request runs only while the full-ci label is on the
    # PR (unlabeled, non-push runs skip every job -- reported neutral,
    # never blocking a merge); workflow_dispatch and push (every push to
    # main) both bypass the label gate and always run.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Timeout and runner live in the reusable workflow; the callee's
    # timeout-minutes bounds each call (caller jobs may not set their own).
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/pkgcore
          - go/dbkit
          - go/tenancy
          - go/observability
          - go/config
          - go/jobs
          - go/ratelimit
          - go/rbac
          - go/org
          - go/authn
          - go/saasctl
          - go/storage
          - go/notification
          - go/pki
          - go/integration
          - go/metering
          - go/sharing
          - go/billing
          - go/ai-gateway
          - go/compliance
          - go/admin
    uses: ./.github/workflows/reusable-go-module-ci.yml
    with:
      module: ${{ matrix.module }}

  integration-tiers:
    name: integration tier (${{ matrix.module }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    # Per-leg cap. Rows run in parallel with each other and with the unit
    # matrix and the reference-app job, so wall-clock stays the slowest leg
    # -- a cold testcontainers image pull plus a -race suite fits this cap
    # with room to spare under the 25-minute pipeline budget.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/dbkit
          - go/tenancy
          - go/jobs
          - go/pkgcore
          - go/config
          - go/rbac
          - go/org
          - go/authn
          - go/storage
          - go/notification
          - go/integration
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # golangci-lint is deliberately not installed here (setup-go-env's
      # install-golangci input, default false): this job never lints, and
      # an unconditional install would mean a ~15 MB download and an
      # analysis-cache round-trip per matrix row for nothing.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: Integration tier under the race detector (testcontainers)
        working-directory: ${{ matrix.module }}
        run: go test -race -tags=integration ./...

  reference-app:
    name: reference-app lint + unit + integration (-race)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    # Raised from 10 when the Docker-backed integration tier landed below: a
    # cold testcontainers image pull plus the -race suites, the same budget
    # as the integration-tiers rows (this job runs in parallel with them,
    # so the wall clock stays inside the 25-minute pipeline target).
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up pinned Go toolchain, golangci-lint and caches
        uses: ./.github/actions/setup-go-env
        with:
          # This job runs the app's golangci-lint leg below; the install is
          # opt-in so the non-linting setup-go-env callers (fast-check's
          # repo-checks, the integration-tiers rows) do not pay for a
          # download and cache round-trip they never use.
          install-golangci: true
      - name: golangci-lint
        working-directory: examples/reference-app
        run: golangci-lint run ./...
      - name: Unit tests under the race detector
        working-directory: examples/reference-app
        run: go test -race ./...
      # The app's own Docker-backed tier, mirroring Taskfile test:full's
      # APP_DIR integration leg. golangci-lint is not needed here, but
      # setup-go-env already installed it above for the lint step; the cost
      # is the one install this job pays for anyway.
      - name: Integration tier under the race detector (testcontainers)
        working-directory: examples/reference-app
        run: go test -race -tags=integration ./...
