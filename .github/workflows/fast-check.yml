name: fast-check

# Fast per-PR check pipeline -- docs/internal/18-cicd.md's pipeline table,
# fast-check row: lint + unit tests + build of the modules a PR can affect,
# plus the repository-level discipline checks that exist today. Target
# duration under 8 minutes; every job carries a timeout and stale runs are
# cancelled via concurrency (18-cicd cost-control rules 4 and 5).
#
# COVERAGE -- what genuinely runs today
#   * go-modules job: the twenty-one modules with real, tested implementation
#     (the thirteen root CLAUDE.md's Repository Status census already
#     records, plus go/pki, go/integration, go/metering, go/sharing,
#     go/billing, go/ai-gateway, go/compliance and go/admin -- their own
#     rounds' additions, documented in go/pki/AGENTS.md,
#     go/integration/AGENTS.md, go/metering/AGENTS.md, go/sharing/AGENTS.md,
#     go/billing/AGENTS.md, go/ai-gateway/AGENTS.md, go/compliance/AGENTS.md
#     and go/admin/AGENTS.md respectively) each run through the reusable
#     go-module-ci workflow: golangci-lint (the
#     project-standard lint leg, .golangci.yml at the repo root -- pinned,
#     checksummed binary and analysis cache from setup-go-env), go vet,
#     unit tests under -race, a workspace-context build and a GOWORK=off
#     standalone build. Stub modules (a go.mod + doc.go only) are
#     deliberately absent: they have no code to check, and listing them
#     would imply coverage that does not exist. Adding a module to this
#     matrix is the whole cost of adding it to CI.
#   * npm-packages job: the npm packages with real, tested implementation
#     (@speed/tokens, @speed/i18n, @speed/ui-kit, @speed/api-client,
#     @speed/api-sdk -- the generated frontend SDK, orval output from
#     the merged speed.yaml, notes + authn fragments, whose regenerated
#     src/ must keep passing these same legs -- @speed/layout-kit, the
#     shared AppShell/RouteGuard app-chrome layer with no auth-mechanism
#     opinion, and @speed/auth-core, the headless session layer over
#     the generated authn surface (the api-sdk's first in-workspace
#     compile consumer, and @speed/auth-ui, the sign-in component
#     family over that session, whose usage example drives the composed
#     flows through a real api-client over a scripted fetch -- the
#     authn surface's runtime end-to-end consumption discharged in
#     form, and @speed/tenancy-ui, the tenant-switch affordance over
#     that same session (its usage example pins one login and three
#     switch attempts the same in-form way), and @speed/product-shell,
#     the tenant-facing assembly shell composing the AppShell frame,
#     the sign-in family and the session hooks into one three-branch
#     view machine with zero text of its own -- the whole
#     sign-in/switch/sign-out journey discharged in form, the browser
#     and real-server leg still the reference-app shell's), and
#     @speed/account-ui, the signed-in account-management surface over
#     that same session -- session and login-history lists, social
#     bindings and step-up-gated two-factor management -- the account
#     face the authn and auth-ui rounds deferred); root
#     CLAUDE.md, Repository Status) each
#     run through the reusable npm-package-ci workflow: a frozen-lockfile
#     workspace install from the web/ root, then lint (the flat-config
#     ESLint at web/ -- typescript-eslint recommended, no-explicit-any,
#     plus the workspace speed/no-literal-text rule over package src and
#     speed/no-direct-http -- whose single config-level whitelist is
#     packages/api-client, where hand-written HTTP is designed to live),
#     strict typecheck, the vitest unit suite and the dist/ build. Node
#     and pnpm versions come from setup-node-env's single sources
#     (web/.nvmrc, web/package.json's packageManager field); the pnpm
#     store cache is keyed on the lockfile hash (18-cicd cost-control
#     rule 3). Adding a package to this matrix is the whole cost of
#     adding it to CI.
#   * repo-checks job, repository-level, all existing today:
#       - tools/scan_cjk.py -- the CJK discipline scanner enforcing the root
#         CLAUDE.md Language Rule (18-cicd discipline table row). Scans the
#         whole tree including this .github directory: comments in these
#         files must stay English.
#       - tools/check_toolchain.py -- the .mise.toml drift gate: every
#         version the root .mise.toml pins (task/go/node/pnpm/
#         golangci-lint) must mirror its authoritative source (Taskfile.yml
#         header, go.work, web/.nvmrc, web/package.json, setup-go-env's
#         GOLANGCI_VERSION). CI reads those sources, never the .mise.toml
#         -- actions/setup-go and setup-node cannot parse it -- so this
#         gate is what proves a local `mise install` (Taskfile setup)
#         installs exactly the toolchain CI runs with.
#       - tools/semgrep_rules/ -- the architecture-discipline semgrep
#         ruleset: six rules, each mapping to an 18-cicd discipline-table
#         row (deployment-mode branching outside kernel wiring,
#         non-constant log messages, raw-GORM bypasses, AutoMigrate,
#         tenant_id metric labels, hand-written tenant filters), each with
#         planted-violation fixtures under tools/semgrep_rules/testdata/.
#         The step below pip-installs semgrep into a throwaway venv and
#         scans go/ examples/ tools/ with the fixture subtree excluded at
#         the CLI level; any finding fails the PR. The same step then runs
#         tools/semgrep_fixture_check.py: every rule must fire on its own
#         planted positive fixture and stay silent on its negative, so a
#         semgrep upgrade that silently stops matching a rule cannot pass
#         the green tree scan unnoticed (the mirror of how the
#         no-literal-text rule's own unit tests keep that rule honest).
#         Pinned at 1.176.0 -- the version the rules' local proofs ran
#         against -- so the only merge-gating tool in the repository is no
#         longer a floating version (see tools/README.md, execution status).
#       - go build github.com/vislake/speed/go/... -- every module compiles
#         in workspace context from the go.work root.
#       - go build ./... (workspace context) then GOWORK=off go build ./...
#         in examples/reference-app -- the app's module lives outside the
#         go/... pattern, and the standalone leg proves its own go.mod is
#         tidy enough to resolve every import without go.work (the shape
#         the notification round's missing replace shipped as).
#       - go work sync + git diff --exit-code -- the checked-in workspace
#         sum files must be canonical. This repo has been bitten by a stale
#         go.work.sum before; the fix discipline (Taskfile setup) is to
#         commit the sync result together with dependency changes.
#       - the workspace eslint rules' own unit tests -- vitest over
#         web/eslint-rules/no-literal-text.test.mjs and
#         web/eslint-rules/no-direct-http.test.mjs from the web/ root.
#         The rules and their tests live outside every package, so no
#         per-package suite picks them up; running them here, once per
#         PR, is what keeps a future rule change honest. Node/pnpm come
#         from setup-node-env's single sources and the frozen-lockfile
#         workspace install (steps at the end of this job).
#
# DELIBERATELY NOT WIRED HERE (18-cicd discipline table rows whose tooling
# does not exist in the repository yet; each lands with its tooling round --
# wiring them now would be fake checks):
#   * oasdiff and Playwright e2e -- that tooling does not exist yet
#     (see the gated pipeline stubs e2e/scaffold-verify/nightly in this
#     directory for where each wires in; security.yml is no longer a
#     stub -- its scans moved to the live security pipeline, and
#     release.yml is its own live pipeline, dispatched manually). Spec
#     merging and the redocly naming lint are real, but they run in the
#     API-contract pipeline below, not here. The ESLint foundation is wired, not
#     deferred: the workspace's speed/no-literal-text rule enforces
#     i18n-sourced text over React package src, and speed/no-direct-http
#     enforces the API-contract HTTP discipline (hand-written
#     fetch/XMLHttpRequest/axios/node-fetch is an error everywhere
#     except packages/api-client, the rule's single config-level
#     whitelist), both in eslint.config.mjs + web/eslint-rules/, both
#     firing in every npm-packages lint leg, and both with their own
#     unit tests in the repo-checks job described above -- the rules
#     live outside any package, so only a repo-level run exercises
#     them. The react-hooks plugin awaits a stateful-components round.
#     The API-contract toolchain runs as its own path-filtered
#     pipeline, api-contract.yml: on PRs touching one of the six
#     module fragments (notes, org, storage, authn, notification,
#     sharing) or the generator side it regenerates the touched
#     fragments' backend interfaces via pinned oapi-codegen -- three of
#     the six (notes, authn, notification) also feed the merged
#     document's frontend SDK via pinned orval into @speed/api-sdk (the
#     merge itself -- notes + authn + notification joined by pinned
#     redocly, linted against redocly.yaml; org/storage/sharing stay
#     backend-only), every regenerated artifact diffed against the
#     committed one, and builds the reference app so a spec that
#     outgrew its handler fails compilation without needing a full-ci
#     label.
#     i18n key-parity wiring exists and runs in docs-check on
#     doc/i18n-touching PRs -- deliberately not here, so this fast
#     per-PR check stays under its 8-minute budget.
#   * reference-app lint and unit suite: the reference app runs its
#     golangci-lint leg and unit suite in full-check's reference-app job
#     (full-ci-labeled PRs), keeping this per-PR check on its budget. Its
#     compilation is NOT deferred, though: repo-checks builds the app
#     directly (the workspace-wide go/... build does not reach it -- the
#     app's module path is outside that pattern), so a handler that no
#     longer satisfies the generated ServerInterface fails here. The app
#     is also built standalone (GOWORK=off) here, mirroring the go/ module
#     matrix's own standalone leg: the workspace-context build resolves
#     the app's imports against go.work, so a missing require+replace
#     pair in the app's own go.mod -- the shape the notification round
#     shipped and that only a standalone build surfaces -- cannot slip
#     through green.
#   * Docker-backed integration tiers (-tags=integration): wired, but in
#     full-check -- 18-cicd's layered-triggering rule assigns them to the
#     pre-merge full matrix (PRs labeled full-ci), not to the fast per-PR
#     check.
#   * dorny/paths-filter path filtering: the module set is small enough that
#     every PR runs every real module; when the set grows, adopt paths-
#     filter with the downstream-dependency derivation of 18-cicd's cost-
#     control section -- a caller-side change only, thanks to the reusable
#     go-module-ci workflow.

on:
  pull_request:
  workflow_dispatch:
  # A commit that lands on main without going through a pull_request (a
  # locally-merged worktree round pushed straight to origin, an admin
  # merge, anything else that bypasses PR review) gets none of the checks
  # above -- pull_request only fires for the PR's own commits, and
  # workflow_dispatch only runs when someone remembers to trigger it by
  # hand. Without this, "is main healthy" after such a push is answered by
  # a human manually running `gh workflow run`, which is exactly the gap
  # this trigger closes: every push to main now gets this same fast
  # lint/vet/build/test matrix automatically, no manual step required.
  # Scoped to main only, and deliberately just this workflow -- full-check's
  # expensive Docker-backed integration tiers stay label-gated per its own
  # cost-control rationale, and security's daily schedule already covers
  # its own periodic default-branch re-check.
  push:
    branches: [main]

concurrency:
  group: fast-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-modules:
    name: go-module-ci (${{ matrix.module }})
    # Timeout and runner live in the reusable workflow; the callee's
    # timeout-minutes bounds each call (caller jobs may not set their own).
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/pkgcore
          - go/dbkit
          - go/tenancy
          - go/observability
          - go/config
          - go/jobs
          - go/ratelimit
          - go/rbac
          - go/org
          - go/authn
          - go/saasctl
          - go/storage
          - go/notification
          - go/pki
          - go/integration
          - go/metering
          - go/sharing
          - go/billing
          - go/ai-gateway
          - go/compliance
          - go/admin
    uses: ./.github/workflows/reusable-go-module-ci.yml
    with:
      module: ${{ matrix.module }}

  npm-packages:
    name: npm-package-ci (${{ matrix.package }})
    # Timeout and runner live in the reusable workflow; the callee's
    # timeout-minutes bounds each call (caller jobs may not set their own).
    strategy:
      fail-fast: false
      matrix:
        package:
          - web/packages/tokens
          - web/packages/i18n
          - web/packages/ui-kit
          - web/packages/api-client
          - web/packages/api-sdk
          - web/packages/layout-kit
          - web/packages/auth-core
          - web/packages/auth-ui
          - web/packages/tenancy-ui
          - web/packages/product-shell
          - web/packages/account-ui
          # The reference-app web host: an external workspace member under
          # examples/reference-app/web, running the same lint/typecheck/
          # test/build matrix through the same reusable.
          - examples/reference-app/web
    uses: ./.github/workflows/reusable-npm-package-ci.yml
    with:
      package: ${{ matrix.package }}

  repo-checks:
    name: repository-level checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # golangci-lint is deliberately not installed here (setup-go-env's
      # install-golangci input, default false): this job never lints, and
      # an unconditional install would mean a ~15 MB download and an
      # analysis-cache round-trip on every run for nothing.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: CJK discipline scan (Language Rule)
        run: python3 tools/scan_cjk.py
      - name: Toolchain drift gate (.mise.toml mirrors)
        run: python3 tools/check_toolchain.py
      # Semgrep into a throwaway venv: the runner has no pinned semgrep
      # and this job's toolchain setup is the Go/Node actions only. The
      # pip install is the deliberately-unpinned piece -- see the COVERAGE
      # note and tools/README.md; it is pinned here once CI is green.
      - name: Semgrep architecture-discipline rules (tools/semgrep_rules)
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet semgrep==1.176.0
          # Fixtures stay out of the real-tree scan: planted violations
          # are the rules' proofs, not tree state -- excluded at the CLI
          # level, the same shape as the local proof runs.
          /tmp/semgrep-venv/bin/semgrep scan \
            --config tools/semgrep_rules --error \
            --exclude tools/semgrep_rules \
            go examples tools
          # Fixture self-check: every rule must fire on its own planted
          # positive fixture and stay silent on its negative -- without
          # it, a semgrep upgrade that silently stopped matching a rule
          # would leave the real-tree scan green with nothing to catch.
          python3 tools/semgrep_fixture_check.py /tmp/semgrep-venv/bin/semgrep
      - name: Build every module in workspace context
        run: go build github.com/vislake/speed/go/...
      # The pattern above resolves against the go/ module paths only, so it
      # matches nothing in the reference app, whose module is
      # github.com/vislake/speed/examples/reference-app. Without this step
      # the app -- CLAUDE.md's mandatory first consumer of every module, and
      # the only artifact that boots -- is never built on an ordinary PR:
      # api-contract.yml's path filter does not cover its handler, and an
      # unlabeled PR skips every full-check job (label-gated; a skipped job
      # satisfies a required check) -- full-check's own push trigger covers
      # main after the fact, but not the PR itself -- so a PR deleting a
      # handler method would break the ServerInterface assertion and still
      # merge green. One build against an already-warm Go cache closes that.
      - name: Build the reference app (its module lives outside go/...)
        working-directory: examples/reference-app
        run: go build ./...
      # The workspace-context build above resolves the app's imports
      # against go.work, so it cannot see a missing require+replace pair
      # in the app's own go.mod -- a gap the notification round shipped
      # and that only the standalone leg surfaces. The go/ module matrix
      # runs the same standalone leg through go-module-ci; the app gets
      # its own here so CLAUDE.md's per-module standalone-build rule
      # (`GOWORK=off go build`, and a tidy that resolves without the
      # workspace) genuinely covers every implemented module the app
      # imports.
      - name: Build the reference app standalone (GOWORK=off)
        working-directory: examples/reference-app
        env:
          GOWORK: "off"
        run: go build ./...
      - name: Workspace integrity (go.work.sum must be canonical)
        # git status, not git diff: `git diff --exit-code` reports only
        # modifications to TRACKED files, so a `go work sync` that CREATES a
        # file passed this gate silently. That is not hypothetical -- the
        # fourteen stub modules under go/ carry no go.sum yet, so the first
        # dependency any of them gains makes go work sync write a brand-new
        # untracked go.sum, exactly the artifact this gate exists to force
        # into the commit. --untracked-files=all still honours .gitignore.
        run: |
          go work sync
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: 'go work sync' left the tree dirty -- commit the"
            echo "workspace sync together with your dependency changes"
            echo "(go.work.sum / go.mod / go.sum), see Taskfile setup."
            exit 1
          fi
      # The eslint rules' own unit tests (web/eslint-rules/) live outside
      # every package, so no npm-package-ci leg picks them up; they run
      # here, once per PR, against the same frozen-lockfile install and
      # Node/pnpm single sources the npm-packages job uses.
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        uses: ./.github/actions/setup-node-env
      - name: Install workspace dependencies (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: ESLint workspace rule unit tests (vitest)
        working-directory: web
        run: pnpm exec vitest run eslint-rules/no-literal-text.test.mjs eslint-rules/no-direct-http.test.mjs
