name: fast-check
# Fast per-PR check pipeline: lint + unit tests + build of every real
# module and package, plus the repository-level discipline checks that
# exist. Target duration ~10 minutes (written when the coverage-gate
# measurement ran for six modules only; since the gate covers every
# matrix row, each module job also runs its suite a second time without
# -race under -coverprofile -- leg 3b below -- and the slowest row sets
# the wall clock); every job carries a timeout and stale runs are
# cancelled via concurrency.
#
# COVERAGE -- what runs:
#   * go-modules job: the modules with real, tested implementation --
#     every row of the matrix below -- each run through the reusable
#     go-module-ci workflow: golangci-lint (the project-standard lint
#     leg, .golangci.yml at the repo root -- pinned, checksummed binary
#     and analysis cache from setup-go-env), go vet, unit tests under
#     -race, the coverage gate (leg 3b: the module's exact statement
#     coverage under an 80% floor and against its committed baseline,
#     measured excluding .gen.go statements), a workspace-context build
#     and a GOWORK=off standalone build. Stub modules (a go.mod +
#     doc.go only) are deliberately absent: they have no code to check,
#     and listing them would imply coverage that does not exist. Adding
#     a module to this matrix is the whole cost of adding it to CI.
#     The last row, tools/configrefgen, is the repository's tool module
#     (a go.work entry outside go/, in the same consumer-module form as
#     examples/reference-app): it carries real, tested generator code,
#     its suite is fast and container-free, and this row is the only
#     place that suite runs -- the docs-check pipeline runs the
#     generator itself (--check), never its tests.
#   * npm-packages job: the packages with real, tested implementation --
#     every row of the matrix below -- each run through the reusable
#     npm-package-ci workflow: a frozen-lockfile workspace install from
#     the web/ root, then lint (the flat-config ESLint at web/ --
#     typescript-eslint recommended, no-explicit-any, plus the workspace
#     speed/no-literal-text rule over package src and speed/no-direct-http,
#     whose single config-level whitelist is packages/api-client, where
#     hand-written HTTP is designed to live), strict typecheck, the
#     vitest unit suite and the dist/ build. Node and pnpm versions come
#     from setup-node-env's single sources (web/.nvmrc, web/package.json's
#     packageManager field); the pnpm store cache is keyed on the
#     lockfile hash. Adding a package to this matrix is the whole cost
#     of adding it to CI.
#   * repo-checks job, repository-level:
#       - tools/scan_cjk.py -- the CJK discipline scanner enforcing the
#         repository Language Rule (docs/internal/ is Chinese; everything
#         else is English). Scans the whole tree including this .github
#         directory: comments in these files must stay English.
#       - tools/check_toolchain.py -- the .mise.toml drift gate: every
#         version the root .mise.toml pins (task/go/node/pnpm/
#         golangci-lint) must mirror its authoritative source (Taskfile.yml
#         header, go.work, web/.nvmrc, web/package.json, setup-go-env's
#         GOLANGCI_VERSION). CI reads those sources, never the .mise.toml
#         -- actions/setup-go and setup-node cannot parse it -- so this
#         gate is what proves a local `mise install` (Taskfile setup)
#         installs exactly the toolchain CI runs with.
#       - tools/check_repo_isolation.py -- the tenant-isolation test
#         coverage checker (the 18-cicd discipline-table row "every
#         Repository must run the isolation test suite"): every
#         tenant-data Repository type (a struct embedding
#         dbkit.Repository[T]) must be covered by tenancytest.
#         AssertIsolated in its own package's tests, or by the equivalent
#         Test<TypeName>_AssertIsolated store-level suite a repository
#         whose record cannot satisfy tenancytest's ID convention ships
#         instead; internal/testutil fakes (the repo-mandated shared
#         test-helpers home, root CLAUDE.md's Testing rule) are not
#         candidates.
#       - tools/check_coverage_baseline.py --selfcheck -- the
#         coverage-baseline file's own health gate for docs/internal/20's
#         coverage rule (every released module: an 80% floor measured
#         excluding .gen.go statements, plus no decline against the
#         recorded baseline): every row in tools/coverage-baselines.json
#         must name one of the 22 gated modules (the 21 go/ modules with
#         a go.mod plus examples/reference-app) with a real go.mod, and
#         every gated module must have a row -- so a stale or missing
#         row cannot silently exempt a module from the comparisons the
#         go-module-ci coverage leg (reusable-go-module-ci.yml leg 3b)
#         runs on every module job. The reference app's own coverage
#         check is not gated here: its unit suite is full-check-only,
#         so the measurement rides full-check's reference-app job.
#       - tools/check_spec_request_tenant_id.py -- the API-spec lint for
#         the 18-cicd discipline row "the API layer must not accept an
#         externally supplied tenant_id": every backend fragment's
#         requests (requestBody schemas and parameters) are scanned for
#         a tenant_id declaration, with authn's four pre-auth
#         tenant-naming request schemas the one recorded exception.
#       - tools/check_migration_cross_module_fks.py -- the migration
#         lint for the 18-cicd discipline row "no cross-module database
#         foreign keys": a REFERENCES target in a module's migration
#         files must belong to that module, measured by where the
#         target is CREATEd. The tree ships no REFERENCES today; the
#         rule's planted fixtures are its teeth.
#       - tools/check_migration_parity.py -- the dual-dialect migration
#         parity gate: every shipped migration's sqlite/ and postgres/
#         copies must both exist and be identical modulo comments,
#         whitespace and the declared column-type synonyms, with the
#         deliberate departures (dialect-only files and sets,
#         structurally divergent pairs) declared -- and kept live -- in
#         tools/migration_parity_exceptions.json. Its planted-drift
#         suite (tools/test_check_migration_parity.py) runs in the same
#         step pair below.
#       - tools/check_host_core_parity.py -- the shared-host-kernel gate:
#         package hostcore exists as one file carried byte-identically by
#         the reference app and the saasctl template (the copy
#         materialized into every generated project), and neither host
#         may re-declare its symbols or re-grow its statements (the serve
#         loop, the liveness/authn path literals) outside that copy. Its
#         planted-drift suite (tools/test_check_host_core_parity.py)
#         runs in the same step pair below.
#       - tools/semgrep_rules/ -- the architecture-discipline semgrep
#         ruleset: seven rules, each mapping to an 18-cicd discipline-table
#         row (deployment-mode branching outside kernel wiring,
#         non-constant log messages, raw-GORM bypasses, AutoMigrate,
#         tenant_id metric labels, hand-written tenant filters,
#         non-snake_case log attribute keys), each with
#         planted-violation fixtures under tools/semgrep_rules/testdata/.
#         The semgrep step below pip-installs into a throwaway venv and
#         scans go/ examples/ tools/ with the fixture subtree excluded at
#         the CLI level; any finding fails the PR. The same step then runs
#         tools/semgrep_fixture_check.py: every rule must fire on its own
#         planted positive fixture and stay silent on its negative, so a
#         semgrep upgrade that silently stops matching a rule cannot pass
#         the green tree scan unnoticed (the mirror of how the
#         no-literal-text rule's own unit tests keep that rule honest).
#         The fixture checker's own unit suite
#         (tools/test_semgrep_fixture_check.py) runs as its own
#         stdlib-only step just before the semgrep step, pinning the
#         env-literal reader's recognized shapes -- no semgrep needed.
#         Pinned at 1.176.0 -- the version the rules' local proofs ran
#         against -- so the merge-gating semgrep cannot float (see
#         tools/README.md).
#       - go build github.com/vislake/speed/go/... -- every module compiles
#         in workspace context from the go.work root.
#       - go build ./... (workspace context) then GOWORK=off go build ./...
#         in examples/reference-app -- the app's module lives outside the
#         go/... pattern, and the standalone leg proves its own go.mod is
#         tidy enough to resolve every import without go.work.
#       - go work sync + git diff --exit-code -- the checked-in workspace
#         sum files must be canonical: a stale go.work.sum can hide
#         dependency drift, so the sync result is committed together with
#         dependency changes (Taskfile setup runs the sync).
#       - the workspace eslint rules' own unit tests -- vitest over
#         web/eslint-rules/no-literal-text.test.mjs and
#         web/eslint-rules/no-direct-http.test.mjs from the web/ root.
#         The rules and their tests live outside every package, so no
#         per-package suite picks them up; running them here, once per
#         PR, is what keeps a future rule change honest. Node/pnpm come
#         from setup-node-env's single sources and the frozen-lockfile
#         workspace install (steps at the end of this job).
#
# DELIBERATELY NOT WIRED HERE -- checks whose tooling or venue lies
# elsewhere (wiring them here would be fake checks or budget waste):
#   * oasdiff and Playwright e2e: that tooling does not exist yet (the
#     gated pipeline stubs in this directory -- e2e, nightly -- carry
#     the plans; security.yml is live and release.yml is its own live
#     pipeline, dispatched manually). Spec merging and the redocly
#     naming lint are real, but they run in the API-contract pipeline,
#     not here. The ESLint foundation is wired: speed/no-literal-text
#     and speed/no-direct-http fire in every npm-packages lint leg and
#     have their own unit tests in the repo-checks job. The react-hooks
#     plugin does not exist yet. i18n key-parity wiring runs in
#     docs-check on doc/i18n-touching PRs -- deliberately not here, so
#     this fast per-PR check stays under its 8-minute budget.
#   * reference-app lint and unit suite: the reference app runs its
#     golangci-lint leg and unit suite in full-check's reference-app job
#     (full-ci-labeled PRs), keeping this per-PR check on its budget. Its
#     compilation is NOT deferred, though: repo-checks builds the app
#     directly (the workspace-wide go/... build does not reach it -- the
#     app's module path is outside that pattern), so a handler that no
#     longer satisfies the generated ServerInterface fails here. The app
#     is also built standalone (GOWORK=off) here, mirroring the go/ module
#     matrix's own standalone leg: the workspace-context build resolves
#     the app's imports against go.work, so a missing require+replace
#     pair in the app's own go.mod -- a shape only a standalone build
#     surfaces -- cannot slip through green.
#   * Docker-backed integration tiers (-tags=integration): wired, but in
#     full-check -- the layered-triggering rule assigns them to the
#     pre-merge full matrix (PRs labeled full-ci), not to the fast per-PR
#     check.
#   * dorny/paths-filter path filtering: the module set is small enough
#     that every PR runs every real module; if the set grows past that,
#     paths-filter with downstream-dependency derivation is a caller-side
#     change only, thanks to the reusable go-module-ci workflow.

on:
  pull_request:
  workflow_dispatch:
  # A commit that lands on main without going through a pull_request (a
  # locally-merged worktree pushed straight to origin, an admin
  # merge, anything else that bypasses PR review) gets none of the checks
  # above -- pull_request only fires for the PR's own commits, and
  # workflow_dispatch only runs when someone remembers to trigger it by
  # hand. Without this, "is main healthy" after such a push is answered by
  # a human manually running `gh workflow run`, which is exactly the gap
  # this trigger closes: every push to main now gets this same fast
  # lint/vet/build/test matrix automatically, no manual step required.
  # Scoped to main only, and deliberately just this workflow -- full-check's
  # expensive Docker-backed integration tiers stay label-gated per its own
  # cost-control rationale, and security's daily schedule already covers
  # its own periodic default-branch re-check.
  push:
    branches: [main]

concurrency:
  group: fast-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-modules:
    name: go-module-ci (${{ matrix.module }})
    # Timeout and runner live in the reusable workflow; the callee's
    # timeout-minutes bounds each call (caller jobs may not set their own).
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/pkgcore
          - go/dbkit
          - go/tenancy
          - go/observability
          - go/config
          - go/jobs
          - go/ratelimit
          - go/rbac
          - go/org
          - go/authn
          - go/saasctl
          - go/storage
          - go/notification
          - go/pki
          - go/integration
          - go/metering
          - go/sharing
          - go/billing
          - go/ai-gateway
          - go/compliance
          - go/admin
          - tools/configrefgen
    uses: ./.github/workflows/reusable-go-module-ci.yml
    with:
      module: ${{ matrix.module }}

  npm-packages:
    name: npm-package-ci (${{ matrix.package }})
    # Timeout and runner live in the reusable workflow; the callee's
    # timeout-minutes bounds each call (caller jobs may not set their own).
    strategy:
      fail-fast: false
      matrix:
        package:
          - web/packages/tokens
          - web/packages/i18n
          - web/packages/ui-kit
          - web/packages/api-client
          - web/packages/api-sdk
          - web/packages/layout-kit
          - web/packages/auth-core
          - web/packages/auth-ui
          - web/packages/tenancy-ui
          - web/packages/product-shell
          - web/packages/account-ui
          - web/packages/billing-ui
          # The reference-app web host: an external workspace member under
          # examples/reference-app/web, running the same lint/typecheck/
          # test/build matrix through the same reusable.
          - examples/reference-app/web
    uses: ./.github/workflows/reusable-npm-package-ci.yml
    with:
      package: ${{ matrix.package }}

  repo-checks:
    name: repository-level checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # golangci-lint is deliberately not installed here (setup-go-env's
      # install-golangci input, default false): this job never lints, and
      # an unconditional install would mean a ~15 MB download and an
      # analysis-cache round-trip on every run for nothing.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: CJK discipline scan (Language Rule)
        run: python3 tools/scan_cjk.py
      - name: Toolchain drift gate (.mise.toml mirrors)
        run: python3 tools/check_toolchain.py
      # Repository-isolation coverage: every tenant-data Repository type
      # (an embedding of dbkit.Repository[T]) must be covered by
      # tenancytest.AssertIsolated in its own package's tests, or by the
      # equivalent Test<TypeName>_AssertIsolated suite (see the script's
      # module docstring). Pure-python, no Go toolchain needed -- a plain
      # step like the CJK scan above it.
      - name: Tenant-isolation coverage check (Repository isolation suites)
        run: python3 tools/check_repo_isolation.py
      # Coverage-baseline file health: every row must name a gated
      # module (docs/internal/20's released set: the 21 go/ modules with
      # a go.mod plus examples/reference-app) with a real go.mod, and
      # every gated module must have a row -- the baselines the
      # go-module-ci coverage leg compares against must themselves be
      # complete and current, or a missing row would silently exempt a
      # module from the 80% floor and the no-decline rule.
      - name: Coverage-baseline file self-check
        run: python3 tools/check_coverage_baseline.py --selfcheck
      # API-spec lint for the discipline-table row "the API layer must
      # not accept an externally supplied tenant_id": every fragment's
      # requests are scanned for a requestBody property or parameter
      # named tenant_id, with authn's four pre-auth tenant-naming
      # schemas the one recorded exception (its spec header argues the
      # "request, never a grant" shape). Pure python, like the
      # isolation check above.
      - name: API-spec caller-tenant_id check
        run: python3 tools/check_spec_request_tenant_id.py
      # Migration lint for the discipline-table row "no cross-module
      # database foreign keys": a REFERENCES target inside a module's
      # migration files must belong to that module (measured by where
      # the target is CREATEd). Pure python; the tree ships no
      # REFERENCES today, so the planted fixtures are the teeth.
      - name: Cross-module foreign-key check (migration lint)
        run: python3 tools/check_migration_cross_module_fks.py
      # Dual-dialect migration parity: every migrations/sqlite/<name>.sql
      # needs its postgres/ sibling, the pair must be identical modulo
      # comments, whitespace and the declared type synonyms, and the
      # deliberate exceptions (dialect-only files/sets, structurally
      # divergent pairs) must be declared with their reasons in
      # tools/migration_parity_exceptions.json -- where a stale entry
      # fails too, so the registry cannot accumulate dead entries. The
      # planted-drift suite runs first (its fixtures are the rules'
      # proof), then the gate over the real tree: pure python, like the
      # checks above.
      - name: Migration parity checker's planted-drift suite (tools/test_check_migration_parity.py)
        run: python3 tools/test_check_migration_parity.py
      - name: Dual-dialect migration parity check
        run: python3 tools/check_migration_parity.py
      # Shared host kernel: package hostcore exists as one file carried
      # byte-identically by the reference app and the saasctl template
      # (the copy `saasctl new` materializes into generated projects), and
      # neither host may re-declare its symbols or re-grow its statements
      # outside that copy. The planted-drift suite runs first; then the
      # gate over the real tree. Pure python, like the checks above.
      - name: Host-core parity checker's planted-drift suite (tools/test_check_host_core_parity.py)
        run: python3 tools/test_check_host_core_parity.py
      - name: Shared host-kernel parity check (internal/hostcore copies)
        run: python3 tools/check_host_core_parity.py
      # The fixture checker's own unit suite: stdlib-only unittest over
      # the env-literal reader the fixture-liveness expectation reads
      # the tree with -- direct os.Getenv/os.LookupEnv arguments,
      # same-file consts (single and block declarations) and
      # config:"env=NAME" loader tag pins in either Go string spelling.
      # Pure python, so it needs no semgrep binary and runs before the
      # venv step below.
      - name: Fixture-checker unit suite (tools/test_semgrep_fixture_check.py)
        run: python3 tools/test_semgrep_fixture_check.py
      # Semgrep into a throwaway venv: the runner has no pinned semgrep
      # and this job's toolchain setup is the Go/Node actions only. The
      # pip install pins the version the rules' local proofs ran against
      # -- see the COVERAGE note and tools/README.md.
      - name: Semgrep architecture-discipline rules (tools/semgrep_rules)
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet semgrep==1.176.0
          # Fixtures stay out of the real-tree scan: planted violations
          # are the rules' proofs, not tree state -- excluded at the CLI
          # level, the same shape as the local proof runs.
          /tmp/semgrep-venv/bin/semgrep scan \
            --config tools/semgrep_rules --error \
            --exclude tools/semgrep_rules \
            go examples tools
          # Fixture self-check: every rule must fire on its own planted
          # positive fixture and stay silent on its negative -- without
          # it, a semgrep upgrade that silently stopped matching a rule
          # would leave the real-tree scan green with nothing to catch.
          python3 tools/semgrep_fixture_check.py /tmp/semgrep-venv/bin/semgrep
      - name: Build every module in workspace context
        run: go build github.com/vislake/speed/go/...
      # The pattern above resolves against the go/ module paths only, so it
      # matches nothing in the reference app, whose module is
      # github.com/vislake/speed/examples/reference-app. Without this step
      # the app -- CLAUDE.md's mandatory first consumer of every module, and
      # the only artifact that boots -- is never built on an ordinary PR:
      # api-contract.yml's path filter does not cover its handler, and an
      # unlabeled PR skips every full-check job (label-gated; a skipped job
      # satisfies a required check) -- full-check's own push trigger covers
      # main after the fact, but not the PR itself -- so a PR deleting a
      # handler method would break the ServerInterface assertion and still
      # merge green. One build against an already-warm Go cache closes that.
      - name: Build the reference app (its module lives outside go/...)
        working-directory: examples/reference-app
        run: go build ./...
      # The workspace-context build above resolves the app's imports
      # against go.work, so it cannot see a missing require+replace pair
      # in the app's own go.mod -- a shape only the standalone leg
      # surfaces. The go/ module matrix runs the same standalone leg
      # through go-module-ci; the app gets its own here so the per-module
      # standalone-build rule (`GOWORK=off go build`, and a tidy that
      # resolves without the workspace) genuinely covers every implemented
      # module the app imports.
      - name: Build the reference app standalone (GOWORK=off)
        working-directory: examples/reference-app
        env:
          GOWORK: "off"
        run: go build ./...
      - name: Workspace integrity (go.work.sum must be canonical)
        # git status, not git diff: `git diff --exit-code` reports only
        # modifications to TRACKED files, so a `go work sync` that CREATES a
        # file passed this gate silently. That is not hypothetical -- the
        # fourteen stub modules under go/ carry no go.sum yet, so the first
        # dependency any of them gains makes go work sync write a brand-new
        # untracked go.sum, exactly the artifact this gate exists to force
        # into the commit. --untracked-files=all still honours .gitignore.
        run: |
          go work sync
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "error: 'go work sync' left the tree dirty -- commit the"
            echo "workspace sync together with your dependency changes"
            echo "(go.work.sum / go.mod / go.sum), see Taskfile setup."
            exit 1
          fi
      # The eslint rules' own unit tests (web/eslint-rules/) live outside
      # every package, so no npm-package-ci leg picks them up; they run
      # here, once per PR, against the same frozen-lockfile install and
      # Node/pnpm single sources the npm-packages job uses.
      - name: Set up pinned Node.js, pnpm and the pnpm store cache
        uses: ./.github/actions/setup-node-env
      - name: Install workspace dependencies (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: ESLint workspace rule unit tests (vitest)
        working-directory: web
        run: pnpm exec vitest run eslint-rules/no-literal-text.test.mjs eslint-rules/no-direct-http.test.mjs
