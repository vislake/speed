# full-matrix half went live with full-check in the M0 CI round. What still
# blocks the pipeline as a whole is the flaky-test auto-issue mechanism,
# whose token requirement is external to this repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: nightly full matrix (stub guard -- not implemented yet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Stub guard
        run: |
          echo "error: the nightly pipeline is not implemented. This failing"
          echo "run is its stub guard, so the pipeline can never pass"
          echo "silently. Benchmark suites have landed with their owning"
          echo "modules (go/jobs, go/notification, go/authn, go/rbac) and"
          echo "full-check covers the full matrix; the remaining gate is the"
          echo "flaky-detection auto-issue token with issues: write."
          exit 1
