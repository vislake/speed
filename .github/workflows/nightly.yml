name: nightly

# STUB -- not implemented. Triggered runs fail loudly at the guard step
# below; nothing in this pipeline can pass silently.
#
# PIPELINE (docs/internal/18-cicd.md pipeline table, nightly row): the full
# matrix plus performance-benchmark regression detection and flaky-test
# detection, unbounded duration. Runs daily.
#
# DESIGN-TABLE TRIGGER: a daily schedule; enabled by the implementing round
# (a scheduled stub would only produce daily noise).
#
# CONTENT PLANNED:
#   * the full matrix -- inherits everything full-check runs, so nightly could
#     not be meaningfully implemented before full-check existed; full-check is
#     live now, so this half is unblocked;
#   * benchmark regression: docs/internal/20-quality-and-security.md names
#     the planned hotspots (tenant-filtered repository queries,
#     authorization decisions, dynamic-config reads, session validation
#     under immediate-invalidation, metering throughput) -- the first
#     module-owned suites now exist, landed with the modules that own the
#     hotspots as the roadmap M1-M3 plan records: go/jobs (StandaloneQueue
#     enqueue and round-trip latency), go/notification (delivery-key
#     derivation and per-delivery preference resolution), go/authn
#     (argon2id hash/verify at the cost floor, access-token issue/verify)
#     and go/rbac (cached and post-invalidation decisions; grep "func
#     Benchmark" over go/ and examples/ returns matches today). What the
#     regression leg still needs is the baseline capture and threshold
#     wiring, which lands with this pipeline's implementing round;
#   * flaky detection: nightly reruns mark unstable tests and auto-open
#     tracking issues (20-quality-and-security.md flaky-test governance);
#     the auto-issue mechanism needs a token with issues: write, reviewed
#     when the round lands.
#
# GATE: the flaky-detection token -- a token with issues: write, reviewed
# when the implementing round lands. The benchmark half of this pipeline's
# content is no longer missing: module-owned benchmark suites exist in the
# tree now (go/jobs, go/notification, go/authn and go/rbac; see the
