name: pr-check

# Fast per-PR check pipeline -- docs/internal/18-cicd.md's pipeline table,
# pr-check row: lint + unit tests + build of the modules a PR can affect,
# plus the repository-level discipline checks that exist today. Target
# duration under 8 minutes; every job carries a timeout and stale runs are
# cancelled via concurrency (18-cicd cost-control rules 4 and 5).
#
# COVERAGE -- what genuinely runs today
#   * go-modules job: the six modules with real, tested implementation
#     (root CLAUDE.md, Repository Status) each run through the reusable
#     go-module-ci workflow: golangci-lint (the project-standard lint leg,
#     .golangci.yml at the repo root -- pinned, checksummed binary and
#     analysis cache from setup-go-env), go vet, unit tests under -race, a
#     workspace-context build and a GOWORK=off standalone build. Stub
#     modules (a go.mod + doc.go only) are deliberately absent: they have no
#     code to check, and listing them would imply coverage that does not
#     exist. Adding a module to this matrix is the whole cost of adding it
#     to CI.
#   * npm-packages job: the npm packages with real, tested implementation
#     (@speed/tokens, @speed/i18n, @speed/ui-kit -- root CLAUDE.md,
#     Repository Status) each run through the reusable npm-package-ci
#     workflow: a frozen-lockfile workspace install from the web/ root,
#     then lint (the flat-config ESLint at web/ -- typescript-eslint
#     recommended, no-explicit-any, plus the workspace speed/no-literal-
#     text rule over package src), strict typecheck, the vitest unit
#     suite and the dist/ build. Node and pnpm versions come from
#     setup-node-env's single sources (web/.nvmrc, web/package.json's
#     packageManager field); the pnpm store cache is keyed on the
#     lockfile hash (18-cicd cost-control rule 3). Adding a package to
#     this matrix is the whole cost of adding it to CI.
#   * repo-checks job, repository-level, all existing today:
#       - tools/scan_cjk.py -- the CJK discipline scanner enforcing the root
#         CLAUDE.md Language Rule (18-cicd discipline table row). Scans the
#         whole tree including this .github directory: comments in these
#         files must stay English.
#       - go build github.com/vislake/speed/go/... -- every module compiles
#         in workspace context from the go.work root.
#       - go work sync + git diff --exit-code -- the checked-in workspace
#         sum files must be canonical. This repo has been bitten by a stale
#         go.work.sum before; the fix discipline (Taskfile setup) is to
#         commit the sync result together with dependency changes.
#
# DELIBERATELY NOT WIRED HERE (18-cicd discipline table rows whose tooling
# does not exist in the repository yet; each lands with its tooling round --
# wiring them now would be fake checks):
#   * semgrep rules, spec merging, redocly rules, oasdiff, Playwright e2e
#     -- none of that tooling exists yet (see the gated pipeline stubs
#     e2e/security/scaffold-verify/release/nightly in this directory for
#     where each wires in). The ESLint foundation now exists and runs on
#     the npm packages above: the workspace's speed/no-literal-text rule
#     (eslint.config.mjs + web/eslint-rules/, rule tests under vitest
#     there) enforces i18n-sourced text over React package src. The
#     remaining JSX-era rule (no hand-written backend calls) needs the
#     generated api-sdk consumer surface and lands with the
#     api-client/api-sdk round; the react-hooks plugin awaits a
#     stateful-components round. The
#     API-contract toolchain's backend half is real but lives in its own
#     path-filtered pipeline, api-contract.yml, so it is not wired into
#     this check: on PRs touching the notes module's spec fragment or the
#     generator side it regenerates the fragment's API surface, diffs the
#     committed artifact, and builds the reference app so a spec that
#     outgrew its handler fails compilation without needing a full-ci
#     label. The frontend sdk (orval) is a later web/ workspace round
#     (api-client/api-sdk). i18n key-parity wiring exists and runs in
#     docs-check on doc/i18n-touching PRs -- deliberately not here, so
#     this fast per-PR check stays under its 8-minute budget.
#   * reference-app lint and unit suite: the reference app runs its
#     golangci-lint leg and unit suite in pr-full's reference-app job
#     (full-ci-labeled PRs), keeping this per-PR check on its budget; the
#     app's go.mod is still validated here, by repo-checks' workspace-wide
#     build.
#   * Docker-backed integration tiers (-tags=integration): wired, but in
#     pr-full -- 18-cicd's layered-triggering rule assigns them to the
#     pre-merge full matrix (PRs labeled full-ci), not to the fast per-PR
#     check.
#   * dorny/paths-filter path filtering: the module set is small enough that
#     every PR runs every real module; when the set grows, adopt paths-
#     filter with the downstream-dependency derivation of 18-cicd's cost-
#     control section -- a caller-side change only, thanks to the reusable
#     go-module-ci workflow.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-modules:
    name: go-module-ci (${{ matrix.module }})
    # Timeout and runner live in the reusable workflow; the callee's
    # timeout-minutes bounds each call (caller jobs may not set their own).
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/pkgcore
          - go/dbkit
          - go/tenancy
          - go/observability
          - go/jobs
          - go/ratelimit
    uses: ./.github/workflows/reusable/go-module-ci.yml
    with:
      module: ${{ matrix.module }}

  npm-packages:
    name: npm-package-ci (${{ matrix.package }})
    # Timeout and runner live in the reusable workflow; the callee's
    # timeout-minutes bounds each call (caller jobs may not set their own).
    strategy:
      fail-fast: false
      matrix:
        package:
          - web/packages/tokens
          - web/packages/i18n
          - web/packages/ui-kit
    uses: ./.github/workflows/reusable/npm-package-ci.yml
    with:
      package: ${{ matrix.package }}

  repo-checks:
    name: repository-level checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # golangci-lint is deliberately not installed here (setup-go-env's
      # install-golangci input, default false): this job never lints, and
      # an unconditional install would mean a ~20 MB download and an
      # analysis-cache round-trip on every run for nothing.
      - name: Set up pinned Go toolchain and caches
        uses: ./.github/actions/setup-go-env
      - name: CJK discipline scan (Language Rule)
        run: python3 tools/scan_cjk.py
      - name: Build every module in workspace context
        run: go build github.com/vislake/speed/go/...
      - name: Workspace integrity (go.work.sum must be canonical)
        run: |
          go work sync
          git diff --exit-code || {
            echo "error: 'go work sync' left the tree dirty -- commit the"
            echo "workspace sync together with your dependency changes"
            echo "(go.work.sum / go.mod / go.sum), see Taskfile setup."
            exit 1
          }
