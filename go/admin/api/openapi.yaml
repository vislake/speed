openapi: 3.0.3
info:
  title: admin
  description: >-
    The operations-console backend: the tenant ledger (list/create/get/
    rename/suspend/resume -- record-only, whose suspension enforcement
    takes effect through tenancy's status-resolution seam, never a route
    of its own), the impersonation pipeline (list/start/end), cross-tenant
    user search with membership listing, audit-event query with an
    asynchronous export (a go/jobs task delivered as a short-lived
    go/sharing link), role management wrapping rbac.Service (declared-
    permission listing, role definition, role binding), a cross-tenant
    usage/billing dashboard stitched from metering's and billing's own
    per-tenant methods (no new aggregate table), and cross-tenant
    notification send-record search. This fragment follows the operationId
    (admin_<action><Resource>) and schema-name (Admin<Type>) naming
    conventions. task api:gen regenerates admin-server.gen.go (in this
    directory) from this file, with oapi-codegen pinned at v2.8.0 -- see
    oapi-codegen.yaml. api-contract.yml's regenerate-then-diff gate
    covers this fragment exactly as it covers every other one, so a spec
    edit needs no hand regeneration and no hand diffing.

    Every operation here is a platform-operations action gated on a
    rbac.SystemDomain permission (admin:access, admin:tenants_manage,
    admin:search_users, admin:impersonate, admin:audit_read,
    admin:audit_export, admin:roles_manage, admin:usage_read,
    admin:notifications_read) -- it is deliberately NOT downstream of the
    ordinary tenancy.Middleware tenant resolution the way notes' or org's
    routes are, because these routes are about tenants as data, not scoped
    to any one of them. The one exception to "no ordinary tenant
    resolution" is impersonation's OWN downstream effect on the REST of the
    application's routes, which is a request-pipeline decorator
    (admin.ImpersonationMiddleware, pipeline.go) inserted ahead of
    tenancy.Middleware for those other routes, not for admin's own.

    This fragment is part of the application-wide contracts/speed.yaml
    merge (task api:merge, redocly pinned at 2.51.1), the frontend SDK's
    generation input: every platform module with an HTTP fragment joins the
    merged document and the generated @speed/api-sdk.
  version: 0.0.0
paths:
  /api/v1/admin/tenants:
    get:
      operationId: admin_listTenants
      tags: [admin]
      summary: List the operator-facing tenant ledger.
      description: >-
        Record-only: this ledger is an operator convenience, never the
        authoritative source of tenant existence -- a tenant with no
        ledger row is reported active, not refused (see
        TenantService.Status's own doc comment).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AdminTenantStatus'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The matching ledger rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListTenantsResponse'
    post:
      operationId: admin_createTenant
      tags: [admin]
      summary: Manually register a tenant ledger row.
      description: >-
        For pre-registering a tenant's name before any business write has
        happened (for example, before an operator opens an account for a
        new customer). The ledger is also populated automatically: a
        tenant's root org-node creation event lazily registers an active
        row, without overwriting an operator's own edits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateTenantRequest'
      responses:
        '201':
          description: The ledger row was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        '400':
          description: tenantId was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '409':
          description: A ledger row for this tenantId already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/tenants/{id}:
    get:
      operationId: admin_getTenant
      tags: [admin]
      summary: Read one tenant ledger row.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The ledger row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        '404':
          description: No ledger row exists for this tenant id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
    patch:
      operationId: admin_updateTenant
      tags: [admin]
      summary: Rename, suspend or resume a tenant ledger row.
      description: >-
        Writing status=suspended here records the ledger row's status;
        the refusal that makes it bite belongs to tenancy's own
        status-resolution gate -- wired to this ledger through
        TenantService.Status, it refuses every request against a tenant
        it reports suspended. Suspension has no route of its own.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateTenantRequest'
      responses:
        '200':
          description: The updated ledger row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        '404':
          description: No ledger row exists for this tenant id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/users:
    get:
      operationId: admin_searchUsers
      tags: [admin]
      summary: Cross-tenant user search.
      description: >-
        Exactly one of email, phone or displayNamePrefix must be given, in
        that precedence order when more than one is present -- see
        authn.UserSearchQuery's own doc comment.
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: displayNamePrefix
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The matching users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSearchUsersResponse'
        '400':
          description: The query named none of email, phone or displayNamePrefix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/users/{id}/memberships:
    get:
      operationId: admin_listUserMemberships
      tags: [admin]
      summary: List every tenant a user currently has an active membership in.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The tenants this user belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListUserMembershipsResponse'
  /api/v1/admin/impersonation:
    get:
      operationId: admin_listImpersonationGrants
      tags: [admin]
      summary: List currently-active impersonation grants.
      responses:
        '200':
          description: The active grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListImpersonationGrantsResponse'
    post:
      operationId: admin_startImpersonation
      tags: [admin]
      summary: Start an impersonation session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStartImpersonationRequest'
      responses:
        '201':
          description: The grant was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImpersonationGrant'
        '400':
          description: >-
            reason was empty, targetUserId/targetTenantId was empty, or
            targetUserId named the caller themselves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/impersonation/{id}:
    delete:
      operationId: admin_endImpersonation
      tags: [admin]
      summary: End an impersonation session early.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The ended grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImpersonationGrant'
        '404':
          description: No grant exists for this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '409':
          description: The grant was already ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/audit-events:
    get:
      operationId: admin_listAuditEvents
      tags: [admin]
      summary: Query the audit trail, single-tenant or cross-tenant.
      description: >-
        A thin HTTP shell over compliance.AuditQuery -- see AuditService's
        own doc comment. tenantId absent means "every tenant this operator
        is entitled to see" (the cross-tenant, system-context-gated path);
        present means the single-tenant path. onBehalfOf narrows the
        result to rows written during an impersonation session whose real
        administrator (the row's on-behalf-of identity) is the given id --
        the impersonation-accountability read dimension: an administrator
        never appears as the actor on such a row, so only this filter can
        answer "what did this administrator do through impersonation".
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: onBehalfOf
          in: query
          required: false
          schema:
            type: string
        - name: resource
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: success
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The matching audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListAuditEventsResponse'
  /api/v1/admin/audit-events/export:
    post:
      operationId: admin_exportAuditEvents
      tags: [admin]
      summary: Kick off an asynchronous audit-event export for one tenant.
      description: >-
        Wraps compliance.ExportService.Export, which gathers every
        registered participant's data for the tenant, stores it and
        delivers it as a short-lived, single-view go/sharing link. This is
        necessarily asynchronous -- the handler enqueues one go/jobs task
        and returns immediately with its id, never running Export
        synchronously inside the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminExportAuditEventsRequest'
      responses:
        '202':
          description: The export job was enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExportAuditEventsResponse'
        '400':
          description: tenantId was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/roles:
    get:
      operationId: admin_listDeclaredPermissions
      tags: [admin]
      summary: List every permission any module has declared.
      description: >-
        Wraps rbac.Service.DeclaredPermissions -- the frozen catalog
        snapshot, not any one subject's own granted permissions
        (ListPermissions answers that, and is not exposed here).
      responses:
        '200':
          description: The declared permission catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListDeclaredPermissionsResponse'
    post:
      operationId: admin_defineRole
      tags: [admin]
      summary: Define or update a role inside one tenant, wrapping rbac.Service.DefineRole.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDefineRoleRequest'
      responses:
        '201':
          description: The defined role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRole'
        '400':
          description: tenantId, key was empty, or permissions named one rbac has not declared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/roles/{id}/bindings:
    post:
      operationId: admin_createRoleBinding
      tags: [admin]
      summary: >-
        Assign a role to a user, optionally scoped to one org node,
        wrapping rbac.Service.AssignRole.
      parameters:
        - name: id
          in: path
          required: true
          description: The role's Key (rbac.RoleDefinition.Key), not its database id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateRoleBindingRequest'
      responses:
        '201':
          description: The binding was created (idempotent -- AssignRole's own contract).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleBinding'
        '400':
          description: tenantId or userId was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/usage-summary:
    get:
      operationId: admin_getUsageSummary
      tags: [admin]
      summary: Cross-tenant usage/billing dashboard.
      description: >-
        Stitched from go/metering's and go/billing's already-real,
        per-tenant query methods, looped once per tenant in admin's own
        ledger under tenancy.WithSystemContext, the audited
        system-context wrapper -- no new database table.
        meteringSummaries/creditBalance/activeSubscription
        are absent from a row when the corresponding module was never
        wired through WithMetering/WithBilling.
      responses:
        '200':
          description: One row per tenant in admin's own ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsageSummaryResponse'
        '500':
          description: Neither go/metering nor go/billing was wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
  /api/v1/admin/notifications/send-records:
    get:
      operationId: admin_listSendRecords
      tags: [admin]
      summary: Cross-tenant notification send-record search.
      description: >-
        Wraps notification.SendRecordRepository.ListByFilter. tenantId
        absent means every tenant in admin's own ledger (a per-tenant
        loop under tenancy.WithSystemContext); present means the
        single-tenant path.
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The matching send records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListSendRecordsResponse'
components:
  schemas:
    AdminTenantStatus:
      type: string
      enum: [active, suspended]
    AdminTenant:
      type: object
      required: [tenantId, displayName, status, createdAt, createdBy, notes]
      properties:
        tenantId:
          type: string
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/AdminTenantStatus'
        suspendedReason:
          type: string
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        notes:
          type: string
    AdminListTenantsResponse:
      type: object
      required: [tenants]
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/AdminTenant'
    AdminCreateTenantRequest:
      type: object
      required: [tenantId]
      properties:
        tenantId:
          type: string
        displayName:
          type: string
        notes:
          type: string
    AdminUpdateTenantRequest:
      type: object
      properties:
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/AdminTenantStatus'
        suspendedReason:
          type: string
        notes:
          type: string
    AdminUser:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
        phone:
          type: string
    AdminSearchUsersResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AdminListUserMembershipsResponse:
      type: object
      required: [tenantIds]
      properties:
        tenantIds:
          type: array
          items:
            type: string
    AdminImpersonationGrant:
      type: object
      required: [id, adminUserId, targetUserId, targetTenantId, reason, createdAt, expiresAt]
      properties:
        id:
          type: string
        adminUserId:
          type: string
        targetUserId:
          type: string
        targetTenantId:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        endedBy:
          type: string
    AdminListImpersonationGrantsResponse:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/AdminImpersonationGrant'
    AdminStartImpersonationRequest:
      type: object
      required: [targetUserId, targetTenantId, reason]
      properties:
        targetUserId:
          type: string
        targetTenantId:
          type: string
        reason:
          type: string
        locale:
          type: string
    AdminAuditEvent:
      type: object
      required: [id, actorType, actorId, action, resourceType, resourceId, success, occurredAt]
      description: >-
        One audit event, the six-element audit shape of the platform's
        append-only trail. changes is present only when the recorded action
        carried a before/after diff: for an impersonation start, after
        names the operator's own mandatory reason alongside the grant's
        shape, so the operator who wrote it can read it back once the grant
        has ended.
      properties:
        id:
          type: string
        actorType:
          type: string
        actorId:
          type: string
        actorDisplayName:
          type: string
        onBehalfOfType:
          type: string
        onBehalfOfId:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        success:
          type: boolean
        failureReason:
          type: string
        tenantId:
          type: string
        changes:
          $ref: '#/components/schemas/AdminAuditChanges'
        occurredAt:
          type: string
          format: date-time
    AdminAuditChanges:
      type: object
      description: >-
        The before/after diff an audit event recorded, when its action had
        one to show. Each side is a free-form object whose keys are the
        audited module's own field names.
      properties:
        before:
          type: object
          description: The resource's state before the audited action, when the action recorded one.
          additionalProperties: true
        after:
          type: object
          description: The resource's state after the audited action, when the action recorded one.
          additionalProperties: true
    AdminListAuditEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditEvent'
    AdminExportAuditEventsRequest:
      type: object
      required: [tenantId]
      properties:
        tenantId:
          type: string
    AdminExportAuditEventsResponse:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
    AdminListDeclaredPermissionsResponse:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string
    AdminDefineRoleRequest:
      type: object
      required: [tenantId, key, permissions]
      properties:
        tenantId:
          type: string
        key:
          type: string
        descriptionKey:
          type: string
        permissions:
          type: array
          items:
            type: string
    AdminRole:
      type: object
      required: [id, tenantId, key, descriptionKey, permissions]
      properties:
        id:
          type: string
        tenantId:
          type: string
        key:
          type: string
        descriptionKey:
          type: string
        permissions:
          type: array
          items:
            type: string
    AdminCreateRoleBindingRequest:
      type: object
      required: [tenantId, userId]
      properties:
        tenantId:
          type: string
        userId:
          type: string
        nodeId:
          type: string
    AdminRoleBinding:
      type: object
      required: [tenantId, userId, role]
      properties:
        tenantId:
          type: string
        userId:
          type: string
        role:
          type: string
        nodeId:
          type: string
    AdminUsageFeatureSummary:
      type: object
      required: [feature, periodStart, periodEnd, quantity]
      properties:
        feature:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        quantity:
          type: number
    AdminCreditBalance:
      type: object
      required: [available, reserved]
      properties:
        available:
          type: integer
        reserved:
          type: integer
    AdminSubscription:
      type: object
      required: [id, planId, status, createdAt]
      properties:
        id:
          type: string
        planId:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    AdminUsageSummaryRow:
      type: object
      required: [tenantId, displayName]
      properties:
        tenantId:
          type: string
        displayName:
          type: string
        meteringSummaries:
          type: array
          items:
            $ref: '#/components/schemas/AdminUsageFeatureSummary'
        creditBalance:
          $ref: '#/components/schemas/AdminCreditBalance'
        activeSubscription:
          $ref: '#/components/schemas/AdminSubscription'
    AdminUsageSummaryResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AdminUsageSummaryRow'
    AdminSendRecord:
      type: object
      required: [id, tenantId, typeKey, channel, recipientClass, status, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        typeKey:
          type: string
        channel:
          type: string
        recipientClass:
          type: string
        recipientUserId:
          type: string
        contactId:
          type: string
        status:
          type: string
        error:
          type: string
        idempotencyKey:
          type: string
        createdAt:
          type: string
          format: date-time
    AdminListSendRecordsResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AdminSendRecord'
    AdminError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API
        returns instead of localized text: code is a stable
        machine-readable identifier naming exactly one failure, and
        params carries the structured per-code details when the failure
        has any. The server never renders a message -- a client maps
        each code to its own locale's text.
      properties:
        code:
          type: string
          example: admin.tenant_not_found
        params:
          type: object
          additionalProperties: true
