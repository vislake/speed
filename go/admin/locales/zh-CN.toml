# admin 的中文消息包。每个 id 在 en-US.toml 里都有完全对应的一份
# （pkgcore/i18n 的 Builder.AddModule 在启动时强制校验一致性；
# tools/check_i18n_keys.py 对原始文件做同样的校验）。这里包含两类 id：
# 错误码描述（"admin.<reason>"，对应 errors.go 里的每个 *apperr.Error）
# 以及 admin.impersonation_started 通知类型的双语模板
# （"admin.impersonation_started.<channel>.<part>"，遵循
# docs/internal/07-platform-services.md 的 id 约定）及其目录描述
# （"admin.impersonation_started.description"）。
