openapi: 3.0.3
info:
  title: billing
  description: >-
    The read surface a tenant-facing billing page needs from both of
    this module's billing modes: the invoice list and one-invoice
    detail (billing_listInvoices / billing_getInvoice -- the billing
    documents this module's plain-Go lifecycle wrote, newest first,
    open/paid/void) and the credits ledger's balance and recent rows
    (billing_getCreditBalance / billing_listCreditTransactions), so a
    credit view can render the number and a refund is observable as a
    ledger row carrying its reserve/confirm/refund classification --
    never a silent balance change. This fragment follows the
    operationId (billing_<verb><Resource>) and schema-name
    (Billing<Type>) naming conventions. task api:gen
    regenerates billing-server.gen.go (in this directory) from this
    file, with oapi-codegen pinned at v2.8.0 -- see oapi-codegen.yaml.

    There is deliberately no tenant_id anywhere on this surface, in any
    path, query, header or request/response body: the tenant is always the
    one tenancy.Middleware already resolved from the request -- never a
    caller-supplied value.

    READ-ONLY BY DESIGN THIS ROUND: every operation below is a GET, and
    that is the whole surface. Credit consumption in this codebase happens
    service-side, never over HTTP -- internal/smilesim's reserve/confirm/
    refund wiring calls billing.CreditService's own Go API in-process
    (PreDeduct at Simulate time, Confirm on success, Refund on failure),
    so there is no credit-consuming HTTP journey whose write this surface
    must carry, and no caller that would invoke one. What the credit view
    and the refund-observability story genuinely need is the read side
    this fragment ships: the balance number, and the ledger rows whose
    type/status vocabulary classifies every movement (a deduct row at
    pending IS the reservation, at confirmed the permanent spend, at
    refunded the refund; grant and expire rows are single-phase). The
    invoice half is read-only for the same reason, in the same shape:
    Invoice rows are written only by the module's plain-Go lifecycle --
    invoice.go's CreateInvoice/MarkPaid/Void, which as of this round
    still has no caller at all -- never
    over HTTP, so there is no invoice write journey whose endpoint this
    surface must carry, and what a tenant-facing invoice page genuinely
    needs is the read side this round adds. A later round that builds a
    caller-driven write journey (an operator grant or refund, gated on
    the module's declared billing:credit:manage permission) will add
    that POST surface here; until such a journey exists this fragment
    stays read-only rather than shipping an endpoint nothing calls.

    This fragment is part of the application-wide contracts/speed.yaml
    merge (task api:merge, redocly pinned at 2.51.1), the frontend SDK's
    generation input: every platform module with an HTTP fragment joins the
    merged document and the generated @speed/api-sdk.
  version: 0.0.0
paths:
  /api/v1/billing/credits/balance:
    get:
      tags: [billing]
      operationId: billing_getCreditBalance
      summary: Read the caller's tenant credit balance.
      description: >-
        The tenant's current credit balance: how many credits are freely
        spendable (available) and how many are set aside by not-yet-
        resolved reservations (reserved). A tenant that has never been
        granted or charged credits -- no ledger rows at all -- answers an
        all-zero balance, never an error, so the credit view renders a
        zero state rather than a missing-resource refusal. The number is
        read from the same CreditService.Balance call business code uses,
        so this route and a service-side reservation never disagree about
        what the tenant holds.
      responses:
        '200':
          description: The tenant's current credit balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCreditBalance'
        '500':
          description: An unexpected server failure (billing.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
  /api/v1/billing/credits/transactions:
    get:
      tags: [billing]
      operationId: billing_listCreditTransactions
      summary: List the caller's tenant's recent credit transactions, newest first.
      description: >-
        The recent window of the tenant's append-only credit ledger: at
        most limit rows (1-100, default 50), newest first. Every balance
        movement the tenant ever experienced is a row here and only here:
        a grant (type "grant", status "confirmed") is a top-up, an expire
        (type "expire", status "confirmed") a single-phase deduction, and
        a deduct row is the two-phase reservation lifecycle itself --
        status "pending" while its credits sit in the balance's reserved
        bucket, "confirmed" once the reservation became a permanent spend,
        "refunded" once it was released back to available. A refund is
        therefore observable as that one deduct row's status transition
        (plus the balance delta the balance route reports), never as a
        row that silently disappears or a balance-only change with no
        ledger trace. The window is served from the module's full
        newest-first listing; a keyset-paginated read over the whole
        ledger is future work -- a credit view needs the recent rows, and the
        ledger itself is reconstructable in full service-side today.
      parameters:
        - name: limit
          in: query
          required: false
          description: The page size, from 1 through 100. Defaults to 50.
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: The matching credit transactions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingListCreditTransactionsResponse'
        '400':
          description: >-
            limit is outside the 1-100 bound (billing.invalid_limit), or
            is not an integer at all (billing.invalid_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
        '500':
          description: An unexpected server failure (billing.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
  /api/v1/billing/invoices:
    get:
      tags: [billing]
      operationId: billing_listInvoices
      summary: List the caller's tenant's invoices, newest first.
      description: >-
        The tenant's billing documents, newest first -- every Invoice
        row the module's plain-Go lifecycle wrote for the tenant
        (invoice.go's CreateInvoice/MarkPaid/Void; nothing writes
        invoices over HTTP, so this read and the lifecycle can never
        disagree about what exists). At most limit rows (1-100, default
        50). Newest first is creation order, the same ordering key the
        credit-transactions listing uses -- never the period an invoice
        bills, since a voided document and its replacement need not
        share cycle dates. Status is the lifecycle's own closed
        vocabulary: "open" awaiting payment, "paid" settled in full,
        "void" canceled before payment. A tenant that has never been
        issued an invoice answers an empty array, never an error, so
        the invoice page renders an empty state rather than a
        missing-resource refusal. The window is served from the
        module's full newest-first listing; a keyset-paginated read
        over a whole history is future work -- an invoice page needs the recent
        documents, and the full history stays reconstructable
        service-side today.
      parameters:
        - name: limit
          in: query
          required: false
          description: The page size, from 1 through 100. Defaults to 50.
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: The matching invoices, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingListInvoicesResponse'
        '400':
          description: >-
            limit is outside the 1-100 bound (billing.invalid_limit), or
            is not an integer at all (billing.invalid_request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
        '500':
          description: An unexpected server failure (billing.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
  /api/v1/billing/invoices/{id}:
    get:
      tags: [billing]
      operationId: billing_getInvoice
      summary: Get one of the caller's tenant's invoices.
      description: >-
        The full shape of one billing document: the row the module's
        plain-Go lifecycle wrote, exactly as the model carries it (see
        BillingInvoice's own description and billing_listInvoices' for
        the status vocabulary). The read is tenant-scoped like every
        other operation on this surface: id must name an invoice of the
        caller's own tenant.
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            An application-generated UUID naming an invoice of the
            caller's tenant (Invoice.ID).
          schema:
            type: string
      responses:
        '200':
          description: The invoice's full shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '404':
          description: >-
            id names no invoice of the caller's tenant -- never created,
            or another tenant's. code is always billing.invoice_not_found
            for both reasons, so the answer discloses nothing about
            whether the id exists at all: a caller can only ever learn
            about its own tenant's invoices, and an id that is not one
            of them is indistinguishable from one that never existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
        '500':
          description: An unexpected server failure (billing.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
components:
  schemas:
    BillingCreditBalance:
      type: object
      description: >-
        The caller's tenant credit balance. The two buckets never overlap:
        a credit is in exactly one of available or reserved. The number a
        credit view renders is available -- what the tenant can spend
        right now.
      properties:
        available:
          type: integer
          format: int64
          description: The freely spendable credit count.
        reserved:
          type: integer
          format: int64
          description: >-
            The credit count set aside by reservations whose jobs have not
            reached a terminal status yet (each one a deduct row at
            status "pending" in the ledger).
        updatedAt:
          type: string
          format: date-time
          description: When the balance row was last touched by a ledger mutation.
      required:
        - available
        - reserved
        - updatedAt
    BillingCreditTransaction:
      type: object
      description: >-
        One append-only entry in the tenant's credit ledger. Amount is
        always positive; the entry's direction is implied by type and
        status together, never a signed value. A deduct row is inserted
        at status "pending" by the reservation half of the two-phase
        pattern, then moved in place to "confirmed" (permanent spend) or
        "refunded" (released back to available) -- the refund IS that
        status transition on the same row, never a second row.
      properties:
        id:
          type: string
          description: >-
            The ledger row's id: an application-generated UUID for a
            grant or expire row, or the caller's own idempotency key for
            a deduct row. Not globally unique across tenants.
        type:
          type: string
          enum: [grant, deduct, expire]
          description: >-
            The entry's kind: "grant" is a top-up (a plan's included
            credits, an admin top-up), "deduct" the two-phase
            reservation, "expire" a single-phase deduction. "refund" is
            deliberately not a row type -- a refund is a deduct row whose
            status became "refunded" (see status).
        status:
          type: string
          enum: [pending, confirmed, refunded]
          description: >-
            The entry's resolution state. Grant and expire rows are
            single-phase and always "confirmed". A deduct row is
            "pending" while its reservation is outstanding, "confirmed"
            after the reservation was settled as a permanent spend,
            "refunded" after it was released back to the balance.
        amount:
          type: integer
          format: int64
          description: >-
            The credit count this entry moves, always positive: a
            confirmed deduct permanently removed it, a refunded deduct
            removed nothing net, a grant added it, an expire removed it.
        reason:
          type: string
          description: >-
            A short note recorded when the entry was written (for
            example "smilesim:<job id>" for a smile-simulation
            reservation, "demo:seed" for a boot-time demo grant). Free
            text on the ledger; the credit view may display it verbatim.
        createdAt:
          type: string
          format: date-time
          description: When the entry was written.
      required:
        - id
        - type
        - status
        - amount
        - reason
        - createdAt
    BillingListCreditTransactionsResponse:
      type: object
      description: One page of the tenant's recent credit transactions.
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/BillingCreditTransaction'
          description: At most limit rows, newest first; empty when the tenant has no ledger rows yet.
      required:
        - transactions
    BillingInvoice:
      type: object
      description: >-
        One billing document of the caller's tenant, exactly as the
        module's channel-agnostic Invoice model (go/billing/invoice.go)
        carries it -- and therefore the detail shape of
        billing_getInvoice and the row shape of billing_listInvoices at
        once, since the model has no extra detail fields a separate
        get-shape would add: no line items, no payment-channel
        reference of any kind (an invoice records a Subscription's
        billing cycle and its amount; which channel, if any, collected
        it is a later round's gateway settlement, never a field this
        round invents). Money is flattened the same way the model
        stores it: amountCents plus its ISO 4217 currency, never a
        floating-point amount.
      properties:
        id:
          type: string
          description: The invoice's application-generated UUID.
        subscriptionId:
          type: string
          description: >-
            The id of the Subscription this invoice bills -- an ID
            reference only, never an embedded subscription (no
            cross-module foreign keys; this is an in-module reference
            under the same discipline).
        status:
          type: string
          enum: [open, paid, void]
          description: >-
            The invoice's lifecycle state: "open" is awaiting payment,
            "paid" settled in full, "void" canceled before payment
            (e.g. a subscription canceled before its invoice was paid).
            Paid and void are terminal -- the invoice is the record of
            the settlement or the cancellation, and neither is ever
            rewritten.
        amountCents:
          type: integer
          format: int64
          description: >-
            The invoice amount in the currency's minor unit (cents for
            a two-decimal currency like USD or CNY).
        currency:
          type: string
          description: The amount's ISO 4217 currency code (e.g. "USD", "CNY").
        periodStart:
          type: string
          format: date-time
          description: When the billed billing cycle starts.
        periodEnd:
          type: string
          format: date-time
          description: When the billed billing cycle ends.
        createdAt:
          type: string
          format: date-time
          description: When the invoice was issued.
        updatedAt:
          type: string
          format: date-time
          description: >-
            When the invoice row was last touched -- a status
            transition (open to paid or void) updates it, an
            unmodified invoice carries its issue time.
      required:
        - id
        - subscriptionId
        - status
        - amountCents
        - currency
        - periodStart
        - periodEnd
        - createdAt
        - updatedAt
    BillingListInvoicesResponse:
      type: object
      description: One page of the tenant's invoices, newest first.
      properties:
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoice'
          description: >-
            At most limit rows, newest first; empty when the tenant has
            no invoices yet.
      required:
        - invoices
    BillingError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API
        returns instead of localized text: code is a stable
        machine-readable identifier naming exactly one failure, and
        params carries the structured per-code details when the failure
        has any. The server never renders a message -- a client maps
        each code to its own locale's text.
      properties:
        code:
          type: string
          example: billing.invalid_limit
        params:
          type: object
          additionalProperties: true
      required:
        - code
