# billing 模块的消息包，简体中文。
#
# 每条 go/billing/errors.go 声明的错误码对应一条顶层平铺条目，id 即完整的
# 带引号错误码。en-US.toml 必须携带完全相同的 id 集合。
#
# 插值名称直接来自该错误自身的 apperr 参数键，原样使用 snake_case：消息
# 渲染自 API 返回的结构化参数，因此两者不一致会渲染出空位而非实际值。

"billing.plan_not_found" = "未找到 key 为 \"{{.key}}\" 的套餐。"

"billing.plan_key_required" = "套餐必须包含 key。"

"billing.duplicate_plan_key" = "租户 \"{{.tenant_id}}\" 下 key 为 \"{{.key}}\" 的套餐已存在。"

"billing.subscription_not_found" = "未找到 id 为 \"{{.id}}\" 的订阅。"

"billing.invalid_subscription_transition" = "订阅无法从 \"{{.from}}\" 迁移到 \"{{.to}}\"。"

"billing.invoice_not_found" = "未找到 id 为 \"{{.id}}\" 的账单。"

"billing.invalid_amount" = "金额 {{.amount}} 非法，必须是正数。"

"billing.idempotency_key_required" = "必须提供幂等键。"

"billing.insufficient_credits" = "租户可用信用点余额不足以覆盖 {{.amount}} 点。"

"billing.credit_transaction_not_found" = "未找到幂等键为 \"{{.idempotency_key}}\" 的待处理信用点交易。"

"billing.credit_transaction_already_resolved" = "信用点交易 \"{{.idempotency_key}}\" 已被处理为 \"{{.status}}\"。"

"billing.credit_balance_inconsistent" = "交易 \"{{.idempotency_key}}\" 的信用点余额与其流水记录不一致。"
