# notification 的消息包,简体中文。
#
# 每条 go/notification/errors.go 声明的错误码对应一条扁平的顶层条目,id 就是带引号的
# 完整错误码。en-US.toml 必须携带完全相同的 id 集合。
#
# 插值名直接使用错误自身的 apperr 参数键,原样保留 snake_case
# (是 "type_key" 而不是 "TypeKey"):消息由 API 返回的结构化参数渲染,
# 两边对不上就会渲染出一个空位而不是真实值。

"notification.recipient_required" = "通知偏好设置需要指明接收人。"

"notification.type_not_found" = "通知类型 {{.type_key}} 不存在。"

"notification.preference_invalid_channels" = "为 {{.type_key}} 选择的渠道不合法:{{.channels}}。"

"notification.preference_optout_not_allowed" = "{{.type_key}} 这类通知无法全部关闭,请至少保留一个渠道。"

"notification.internal_error" = "通知服务未能完成本次请求。"
