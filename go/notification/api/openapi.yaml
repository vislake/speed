openapi: 3.0.3
info:
  title: notification
  description: >-
    The recipient-facing inbox and contact-consent surface of the
    notification module: the tenant's in-app message inbox, the
    notification-type directory it renders from, per-type channel
    preferences, and the verified contacts (email and SMS addresses a
    tenant may send to -- the module's double opt-in consent flow, per the
    root CLAUDE.md security rule that no message goes to an unverified
    external address). This fragment follows the operationId
    (notification_<action><Resource>) and schema-name
    (Notification<Type>) conventions from
    .claude/skills/backend-coding-standards/SKILL.md §6.1. task api:gen
    regenerates notification-server.gen.go (in this directory) from this
    file, with oapi-codegen pinned at v2.8.0 -- see oapi-codegen.yaml and
    .github/workflows/api-contract.yml.

    There is deliberately no tenant_id anywhere on this surface, in any
    path, query, header or request/response body: the tenant is always the
    one tenancy.Middleware already resolved from the request
    (docs/internal/04-data-and-tenancy.md; root CLAUDE.md's multi-tenant
    isolation rule). Recipients and addresses are likewise never named by
    the client: the caller's identity comes from the host-injected subject
    seam (handler.go's SubjectResolver, the org seam pattern), and every
    query is scoped through it. Inbox rows and preferences are the calling
    user's own -- a message id that belongs to another user answers 404,
    never another user's data -- while contacts are the tenant's
    external-recipient roster, shared by the tenant's identified users:
    an external contact exists only inside the tenant that verified it
    (docs/internal/07-platform-services.md), so the contact surface is
    tenant-scoped like the rest of the module's tables, gated on an
    identified caller, never on per-user ownership.

    One surface is deliberately absent from this document: the live
    in-app delivery channel, GET /api/v1/notifications/stream, an SSE
    stream of inbox rows pushed as they arrive. It is hand-mounted on the
    handler's inner mux (see handler.go) rather than spec'd here because
    SSE framing is not an OpenAPI 3.0 media type; handler_test.go and the
    reference app's flow test pin its behaviour.
  version: 0.0.0
paths:
  /api/v1/notifications/messages:
    get:
      tags: [notification]
      operationId: notification_listMessages
      summary: List the caller's inbox messages, newest first.
      description: >-
        Returns the caller's own inbox rows (recipient_user_id matches the
        subject seam's caller), newest first, ordered by created_at then
        id so paging is stable. Messages whose expiry passed are still
        listed -- expiry governs the unread predicate only
        (read_at IS NULL AND expiry not passed), never list membership --
        but a message that reached its expiry_at renders with the unread
        affordance already gone, which is what the frontend's per-row
        state derives from read_at. group filters to one notification
        group (a type-classification namespace like "appointments");
        unknown groups answer an empty list, never an error.
      parameters:
        - in: query
          name: group
          description: Return only messages of this notification group.
          schema:
            type: string
        - in: query
          name: limit
          description: >-
            The maximum number of rows to return. The module's read
            surface caps the page at 200 rows; larger limits are refused
            rather than silently truncated.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          description: The number of rows to skip before the returned page.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The requested page of the caller's inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListMessagesResponse'
        '400':
          description: limit or offset was not a valid integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/unread-count:
    get:
      tags: [notification]
      operationId: notification_getUnreadCount
      summary: Count the caller's unread inbox messages.
      description: >-
        The number of the caller's inbox rows whose read_at is still nil
        and whose expiry_at -- when set -- has not passed (the module's
        unread predicate, applied with the server's own clock). A message
        that is unread but expired does not count, and a read-then-expired
        message never counts twice.
      responses:
        '200':
          description: The count of unread messages, possibly zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/read-all:
    post:
      tags: [notification]
      operationId: notification_markAllMessagesRead
      summary: Mark every unread message of the caller as read.
      description: >-
        Applies the same unread predicate as the unread count to the
        caller's own rows: every message that was still unread becomes
        read, expired or not (marking read is not gated on expiry, only
        counting is). The answer names how many rows the call actually
        flipped, so a client can distinguish "nothing was unread" from
        "everything was already read" without a second round trip.
      responses:
        '200':
          description: The messages that this call marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/{messageId}/read:
    post:
      tags: [notification]
      operationId: notification_markMessageRead
      summary: Mark one of the caller's messages as read.
      description: >-
        Marks the named message read. Idempotent: a message already read
        answers 204 exactly like a first read. The row must be the
        caller's own and exist in the caller's tenant; a message id that
        is unknown, expired into a different tenant, or belongs to another
        recipient answers 404 -- never another user's message state.
      parameters:
        - in: path
          name: messageId
          required: true
          description: The id of the message to mark read.
          schema:
            type: string
      responses:
        '204':
          description: The message is read (it already was, or this call marked it).
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: >-
            The message id names no message of the caller's own inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/types:
    get:
      tags: [notification]
      operationId: notification_listTypes
      summary: List the notification types this tenant's deployment declares.
      description: >-
        The live type directory: every notification type every module of
        the host declared at bootstrap (the registry's frozen
        taxonomy -- new types arrive with a new release, never at
        runtime), each with its group classification, its default channel
        set for a recipient who has expressed no preference, and whether
        the recipient may opt out of it at all (the module's
        non-unsubscribable types carry delivery the host guarantees, such
        as security or billing receipts). description is the type's copy
        rendered from the declaring module's own locale bundle in the
        language the request negotiates (Accept-Language; zh-CN is the
        default when nothing negotiates), the same catalog delivery
        renders from -- the directory a client renders must be the copy
        its recipient would have received.
      responses:
        '200':
          description: The declared notification types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListTypesResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/preferences:
    get:
      tags: [notification]
      operationId: notification_listPreferences
      summary: List the caller's channel preferences per notification type.
      description: >-
        The caller's effective channel preference for every declared
        notification type: a type the caller never touched answers with
        its default channel set, one they opted out of on some channels
        answers the surviving set. Every declared type appears exactly
        once, so a client renders one row per type without merging against
        the type directory. Channel vocabulary is the module's closed set:
        in_app, email, sms.
      responses:
        '200':
          description: The caller's preference state per declared type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListPreferencesResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/preferences/{typeKey}/{channel}:
    put:
      tags: [notification]
      operationId: notification_updatePreference
      summary: Enable or disable one channel of one notification type for the caller.
      description: >-
        Sets whether the caller wants delivery over channel for typeKey.
        enabled=true restores a channel the caller had opted out of;
        enabled=false is the opt-out, refused for a type whose
        unsubscribable flag is false (delivery the host guarantees must
        not be switched off through a preference). The answer is the
        type's updated effective state (channels), so a client applying a
        toggle can overwrite its row from the response without recomputing
        the merge. Channel vocabulary is the module's closed set: in_app,
        email, sms.
      parameters:
        - in: path
          name: typeKey
          required: true
          description: >-
            The type key, <module>.<entity>.<action> (for example
            "clinic.appointment_reminder").
          schema:
            type: string
        - in: path
          name: channel
          required: true
          description: The channel to enable or disable.
          schema:
            type: string
            enum: [in_app, email, sms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUpdatePreferenceRequest'
      responses:
        '200':
          description: The type's updated effective channel state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '400':
          description: >-
            The request body was missing or malformed, channel was not a
            known channel, or enabled=false was asked for a type whose
            unsubscribable flag is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: typeKey names no declared notification type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts:
    get:
      tags: [notification]
      operationId: notification_listContacts
      summary: List the tenant's verified and pending contacts.
      description: >-
        The tenant's external-recipient roster, newest first: every
        address this tenant has put through the module's consent flow.
        The list is tenant-scoped, not per-user -- a contact belongs to
        the tenant that verified it, so any identified caller of the
        tenant sees the roster the tenant's staff manages. A contact row
        never echoes its address: the plaintext address is PII and the
        blind-index column would be an offline brute-force surface, so a
        list consumer sees id, channel, status and timestamps only --
        which is all the UI's manage-addresses surface needs (the address
        itself is shown at the moment of submission, never re-served).
      responses:
        '200':
          description: The tenant's contacts, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListContactsResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
    post:
      tags: [notification]
      operationId: notification_createContact
      summary: Add a contact address to the tenant's roster through double opt-in.
      description: >-
        Registers channel address as a contact of the tenant and starts
        the module's consent flow: the row is created pending and a
        verification code is sent to the address (the one message the
        module's security rule allows to an unverified address -- the
        verification message itself -- rate limited per tenant and per
        recipient). The address is normalized before storage (email
        lowercased, phone to E.164) and encrypted at rest under a
        blind-index column for exact-match dedupe. Submitting an address
        already on file (any status) answers the existing contact
        unchanged and sends nothing -- re-adding is not a resend, resend
        is its own operation. Codes expire; delivery to the address is
        refused until the contact is verified, by the delivery pipeline's
        send-time recheck, never only at enqueue time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreateContactRequest'
      responses:
        '201':
          description: >-
            The contact row -- freshly created pending, or the already
            existing row when this address was on file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationContact'
        '400':
          description: >-
            The request body was missing or malformed, channel was not
            email or sms, or address had no valid form for its channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: >-
            The caller has asked for too many verification codes; retry
            later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts/{contactId}/verify:
    post:
      tags: [notification]
      operationId: notification_verifyContact
      summary: Verify a pending contact with its code.
      description: >-
        Answers the code that was sent to the contact's address. A
        correct code within its expiry verifies the contact -- the
        consent record the delivery pipeline's send-time recheck demands
        -- and answers the verified row; a wrong or expired code leaves
        the contact pending and answers 400. The contact must be the
        tenant's own and still pending: resubmitting to one already
        verified answers 400 just like a wrong code -- wrong, expired,
        replayed and already-verified are deliberately one answer --
        while an unsubscribed or bounced contact answers 409, its
        address never messaged again. Attempts are rate limited.
      parameters:
        - in: path
          name: contactId
          required: true
          description: The id of the pending contact to verify.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationVerifyContactRequest'
      responses:
        '200':
          description: The contact, now verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationContact'
        '400':
          description: >-
            The request body was missing or malformed, or the code did not
            verify: wrong, expired, replayed, or aimed at a contact that
            is already verified -- deliberately one answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: The contact id names no contact of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '409':
          description: The contact has unsubscribed or bounced and will not be messaged again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: >-
            Too many verification attempts; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts/{contactId}/resend:
    post:
      tags: [notification]
      operationId: notification_resendContactCode
      summary: Issue a fresh verification code to a still-pending contact.
      description: >-
        Re-issues the verification code of a pending contact -- the flow
        for a code that expired before it was entered. Only a pending
        contact can be resent to: an unsubscribed or bounced contact
        answers 409, its address never messaged again, and one already
        verified answers 400 like a wrong code (deliberately one
        answer). The fresh code replaces the old one; rate limited like
        the original send.
      parameters:
        - in: path
          name: contactId
          required: true
          description: The id of the pending contact to resend to.
          schema:
            type: string
      responses:
        '204':
          description: A fresh code is on its way to the contact's address.
        '400':
          description: >-
            The code did not verify: wrong, expired, replayed, or aimed
            at a contact that is already verified -- deliberately one
            answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: The contact id names no contact of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '409':
          description: The contact has unsubscribed or bounced and will not be messaged again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: >-
            The caller has asked for too many verification codes; retry
            later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
components:
  schemas:
    NotificationListMessagesResponse:
      type: object
      description: One page of the caller's inbox.
      properties:
        items:
          type: array
          description: The page's messages, newest first.
          items:
            $ref: '#/components/schemas/NotificationMessage'
      required: [items]
    NotificationMessage:
      type: object
      description: >-
        One inbox row: a message rendered for this recipient at delivery
        time, in the recipient's locale. title and body are the rendered
        text -- never template ids, which a client cannot resolve -- and
        params is the interpolation map that produced them, for a client
        that renders its own richer copy from the type directory.
      properties:
        id:
          type: string
          description: The message's id.
        type_key:
          type: string
          description: >-
            The notification type this message was rendered from,
            <module>.<entity>.<action>.
        group:
          type: string
          description: >-
            The message's group classification, taken from its type at
            delivery time.
        title:
          type: string
          description: The rendered headline of the message.
        body:
          type: string
          description: The rendered body of the message.
        params:
          type: object
          description: >-
            The template parameters that produced title and body, keyed
            by the names the templates' placeholders spell out.
          additionalProperties: true
        link:
          type: string
          description: >-
            The optional deep link the message points at; empty when the
            message has none.
        expiry_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the message stops counting as unread, server time; null
            when it never expires.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the recipient read the message; null while it is unread.
        created_at:
          type: string
          format: date-time
          description: When the message was delivered into the inbox.
      required: [id, type_key, group, title, body, params, link, created_at]
    NotificationUnreadCountResponse:
      type: object
      description: The caller's unread message count.
      properties:
        count:
          type: integer
          description: The number of unread messages.
      required: [count]
    NotificationReadAllResponse:
      type: object
      description: The outcome of a mark-all-read call.
      properties:
        read_count:
          type: integer
          description: The number of messages this call marked read.
      required: [read_count]
    NotificationListTypesResponse:
      type: object
      description: The deployment's declared notification types.
      properties:
        items:
          type: array
          description: The declared types, in declaration order.
          items:
            $ref: '#/components/schemas/NotificationType'
      required: [items]
    NotificationType:
      type: object
      description: >-
        One declared notification type. Unsubscribable=false marks
        delivery the host guarantees: the recipient cannot switch these
        channels off through a preference.
      properties:
        type_key:
          type: string
          description: >-
            The type key, <module>.<entity>.<action>.
        group:
          type: string
          description: The type's inbox classification group.
        default_channels:
          type: array
          description: >-
            The channels a recipient gets by default, before expressing
            any preference. The closed vocabulary: in_app, email, sms.
          items:
            type: string
        unsubscribable:
          type: boolean
          description: >-
            Whether the recipient may opt out of this type's channels.
        description:
          type: string
          description: >-
            The type's copy, rendered from the declaring module's locale
            bundle in the negotiated language.
      required: [type_key, group, default_channels, unsubscribable, description]
    NotificationListPreferencesResponse:
      type: object
      description: The caller's channel preferences per declared type.
      properties:
        items:
          type: array
          description: >-
            One entry per declared type, effective channels merged with
            defaults.
          items:
            $ref: '#/components/schemas/NotificationPreference'
      required: [items]
    NotificationPreference:
      type: object
      description: >-
        The caller's effective channel state for one notification type:
        the set of channels the caller currently receives, the type's
        defaults reduced by the caller's opt-outs.
      properties:
        type_key:
          type: string
          description: The type key this state belongs to.
        channels:
          type: array
          description: >-
            The channels currently enabled for the caller, a subset of
            the type's vocabulary.
          items:
            type: string
      required: [type_key, channels]
    NotificationUpdatePreferenceRequest:
      type: object
      description: One channel toggle for one notification type.
      properties:
        enabled:
          type: boolean
          description: >-
            Whether the caller wants this type over this channel.
      required: [enabled]
    NotificationListContactsResponse:
      type: object
      description: The tenant's contacts, newest first.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationContact'
      required: [items]
    NotificationContact:
      type: object
      description: >-
        One contact row. The address itself never appears in this
        document's responses: plaintext addresses are PII and the
        blind-index would be an offline brute-force surface, so the API
        serves id, channel, status and timestamps only.
      properties:
        id:
          type: string
          description: The contact's id.
        channel:
          type: string
          description: The address's channel.
          enum: [email, sms]
        status:
          type: string
          description: >-
            The contact's consent status: pending (code issued, awaiting
            verification), verified (consent proven), unsubscribed
            (consent withdrawn), or bounced (delivery failed hard).
          enum: [pending, verified, unsubscribed, bounced]
        created_at:
          type: string
          format: date-time
          description: When the contact was added.
      required: [id, channel, status, created_at]
    NotificationCreateContactRequest:
      type: object
      description: A new contact address to register through double opt-in.
      properties:
        channel:
          type: string
          description: The address's channel.
          enum: [email, sms]
        address:
          type: string
          description: >-
            The address itself: an email address, or a phone number in a
            form the module can normalize to E.164. Never logged; stored
            encrypted.
      required: [channel, address]
    NotificationVerifyContactRequest:
      type: object
      description: The code the contact's address received.
      properties:
        code:
          type: string
          description: >-
            The verification code from the contact's message.
      required: [code]
    NotificationError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API
        returns instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code
        through its own i18n catalog, populated from this module's
        Locales() resources for the codes documented in its error index.
      properties:
        code:
          type: string
          example: notification.contact_code_invalid
        params:
          type: object
          additionalProperties: true
