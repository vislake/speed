# pki 的消息包,简体中文。
#
# 每条 go/pki/errors.go 声明的错误码对应一条扁平的顶层条目,id 就是带引号的
# 完整错误码。en-US.toml 必须携带完全相同的 id 集合。
#
# 插值名直接使用错误自身的 apperr 参数键,原样保留 snake_case:消息由 API
# 返回的结构化参数渲染,两边对不上就会渲染出一个空位而不是真实值。

"pki.authority_not_found" = "该证书颁发机构不存在。"

"pki.key_not_found" = "该密钥不存在。"

"pki.no_active_key" = "该用途当前没有可用的签名密钥。"

"pki.algorithm_unsupported_by_signer" = "所选的签名器不支持算法 {{.algorithm}}。"

"pki.certificate_revoked" = "该证书(或其颁发链中的某个机构)已被吊销。"

"pki.signer_unavailable" = "签名器暂时不可用,请稍后重试。"

"pki.propagation_window_not_elapsed" = "传播窗口尚未届满,暂时无法提升该待启用密钥。"

"pki.crl_not_generated" = "该证书颁发机构尚未生成过吊销列表(CRL)。"

"pki.internal_error" = "服务器内部错误,请稍后重试。"
