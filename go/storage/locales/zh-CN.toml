# storage 的消息包,简体中文。
#
# 每条 go/storage/errors.go 声明的错误码对应一条扁平的顶层条目,id 就是带引号的
# 完整错误码。en-US.toml 必须携带完全相同的 id 集合。
#
# 插值名直接使用错误自身的 apperr 参数键,原样保留 snake_case
# (是 "max_bytes" 而不是 "MaxBytes"):消息由 API 返回的结构化参数渲染,
# 两边对不上就会渲染出一个空位而不是真实值。

"storage.object_not_found" = "该文件不存在。"

"storage.object_not_uploading" = "该文件当前不在可上传状态,无法执行此操作。"

"storage.object_uploading" = "该文件仍在上传中,无法删除。"

"storage.object_too_large" = "文件过大,单个文件最多 {{.max_bytes}} 字节。"

"storage.invalid_checksum" = "校验值格式不正确,应为 64 位小写十六进制字符。"

"storage.checksum_mismatch" = "文件内容与声明的校验值不一致。"

"storage.size_mismatch" = "文件大小与声明不符:声明 {{.declared}} 字节,实际为 {{.actual}} 字节。"

"storage.content_length_mismatch" = "请求体长度与声明不符,应为 {{.declared}} 字节。"

"storage.content_missing" = "尚未收到该文件的内容,无法完成此操作。"

"storage.type_not_allowed" = "不允许该文件类型。仅允许:{{.allowed}}。"

"storage.type_mismatch" = "文件的实际类型与声明不符。"

"storage.pixel_limit_exceeded" = "图片尺寸超过上限,最多 {{.max_pixels}} 像素。"

"storage.image_unreadable" = "无法读取该图片。"

"storage.invalid_expiry" = "保留期限无效,最长 {{.max_lifetime_days}} 天。"

"storage.store_unavailable" = "文件存储暂不可用,请稍后重试。"

"storage.store_error" = "文件存储操作失败,请稍后重试。"

"storage.invalid_size" = "声明的文件大小必须为正数。"

"storage.internal_error" = "服务器内部错误,请稍后重试。"

"storage.queue_required" = "服务配置不完整:缺少任务队列。"
