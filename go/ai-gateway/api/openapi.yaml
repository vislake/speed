openapi: 3.0.3
info:
  title: ai-gateway
  description: >-
    Writing and reading the platform-wide and tenant BYOK credentials
    go/ai-gateway's Gateway resolves at call time -- the HTTP surface that
    closes this module's own AGENTS.md "No admin/HTTP surface for writing
    platform or tenant BYOK credentials" gap. This fragment follows the
    operationId (aiGateway_<verb><Resource>) and schema-name
    (AiGateway<Type>) conventions from
    .claude/skills/backend-coding-standards/SKILL.md §6.1 -- "aiGateway"
    rather than the module directory's literal "ai-gateway" spelling,
    since neither an operationId nor a Go schema name may contain a
    hyphen; the path prefix keeps the literal directory name instead,
    exactly as every other module fragment's "/api/v1/<module>" prefix
    does. task api:gen regenerates ai-gateway-server.gen.go (in this
    directory) from this file, with oapi-codegen pinned at v2.8.0 -- see
    oapi-codegen.yaml and .github/workflows/api-contract.yml.

    The credential's own API key is NEVER read back over this surface, on
    either write operation's response or the read operation below --
    write-only, mirroring every other secret-handling precedent in this
    repository (go/integration's API-key surface never re-returns a raw
    key after creation). The read operation exists purely so a caller can
    confirm what is CONFIGURED -- which scope actually answers for a
    provider, and its base URL -- without ever seeing the secret again.

    Two materially different privilege levels are gated by two
    DISTINCTLY NAMED permissions, never one shared between them: setting
    the CALLER'S OWN tenant's BYOK credential
    (aiGateway_setTenantCredential) is an ordinary tenant-scoped write,
    while setting the PLATFORM-WIDE default every tenant without its own
    BYOK row falls back to (aiGateway_setPlatformCredential) is a
    strictly more privileged operation -- see go/ai-gateway/module.go's
    PermissionWrite / PermissionManagePlatform doc comments, and this
    reference app's demo_subject.go for how the two map to distinct rbac
    grants. The read operation (aiGateway_getCredential) is gated on a
    third, weaker permission (PermissionRead) of the same resource.

    There is deliberately no tenant_id anywhere on this surface, in any
    path, query, header or request/response body: the tenant a
    setTenantCredential call writes under, and a getCredential call
    resolves for, is always the one tenancy.Middleware already resolved
    from the request (docs/internal/04-data-and-tenancy.md; root
    CLAUDE.md's multi-tenant isolation rule). setPlatformCredential
    writes no tenant row at all -- see its own description.

    Merging this fragment into the application-wide build/openapi/
    speed.yaml stays future work, like go/storage's, go/sharing's and
    go/integration's own fragments: this module has no in-workspace web
    consumer yet (go/ai-gateway/AGENTS.md's own reference-app-consumer
    section), so joining it into the merge and running it through orval
    would generate frontend code nothing calls.
  version: 0.0.0
paths:
  /api/v1/ai-gateway/credentials/{provider}:
    get:
      operationId: aiGateway_getCredential
      summary: Report which scope currently answers for a provider.
      description: >-
        The exact CredentialService.Resolve answer for provider under the
        caller's own tenant context: the caller's tenant BYOK row when one
        exists, the platform-wide row otherwise. Never returns the api
        key -- only which scope answered and the credential's base URL,
        so a caller can confirm what is configured without ever seeing
        the secret. A context carrying no tenant (a system-context caller)
        resolves straight to the platform-wide row, mirroring Resolve's
        own documented behavior.
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: The resolved credential's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayCredential'
        '404':
          description: >-
            Neither the caller's tenant nor the platform-wide scope has a
            credential for provider (aigateway.credential_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayError'
  /api/v1/ai-gateway/credentials/{provider}/tenant:
    put:
      operationId: aiGateway_setTenantCredential
      summary: Set the caller's own tenant's BYOK credential.
      description: >-
        Writes or overwrites (upsert, keyed on provider and the caller's
        own tenant) the calling tenant's bring-your-own-key credential for
        provider -- CredentialService.SetTenantCredential verbatim, with
        the owning tenant read from the request's already-resolved tenant
        context, never from a request parameter, header or body. Gated on
        PermissionWrite ("ai-gateway:write"), an ordinary tenant-scoped
        permission -- see this fragment's own header for the contrast
        with the platform write below.
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGatewaySetCredentialRequest'
      responses:
        '200':
          description: The tenant credential was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayCredential'
        '400':
          description: >-
            The request body was missing or malformed, or apiKey was
            empty (aigateway.credential_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayError'
  /api/v1/ai-gateway/credentials/{provider}/platform:
    put:
      operationId: aiGateway_setPlatformCredential
      summary: Set the platform-wide default credential.
      description: >-
        Writes or overwrites (upsert, keyed on provider alone -- there is
        no owning tenant) the platform-wide default credential for
        provider that every tenant without its own BYOK row falls back
        to -- CredentialService.SetPlatformCredential verbatim. The
        Handler itself builds the audited system-context reason
        (pkgcore.WithSystemContext under SystemPurposeCredentialWrite)
        this write requires; the caller supplies only the credential.
        This is a MATERIALLY MORE PRIVILEGED operation than the
        tenant-scoped write above -- it changes the default every tenant
        on the platform without its own override resolves to -- and is
        gated on a DISTINCT, more restrictive permission,
        PermissionManagePlatform ("ai-gateway:manage_platform"), never
        PermissionWrite.
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGatewaySetCredentialRequest'
      responses:
        '200':
          description: The platform-wide credential was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayCredential'
        '400':
          description: >-
            The request body was missing or malformed, or apiKey was
            empty (aigateway.credential_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayError'
components:
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: >-
        A ChatProviderRegistry or ImageProviderRegistry name, for example
        "chat.openai-compatible" or "image.openai-compatible" -- the same
        provider string CredentialService's methods already take.
      schema:
        type: string
  schemas:
    AiGatewayCredential:
      type: object
      description: >-
        A resolved or just-written credential's metadata. Never carries
        the api key.
      properties:
        provider:
          type: string
          description: The ChatProviderRegistry or ImageProviderRegistry name.
        scope:
          type: string
          description: >-
            "system" or "tenant" -- which scope this metadata describes.
            On aiGateway_getCredential this is whichever scope actually
            answered (CredentialService.Resolve's own fallback order); on
            the two write operations it is always the scope that
            operation just wrote.
        baseUrl:
          type: string
          description: >-
            The credential's configured base URL; empty when the
            provider's own constructor supplies a default and none was
            set here.
      required:
        - provider
        - scope
    AiGatewaySetCredentialRequest:
      type: object
      required:
        - apiKey
      properties:
        apiKey:
          type: string
          minLength: 1
          description: The vendor API key. Never echoed back on any response.
        baseUrl:
          type: string
          description: >-
            The OpenAI-compatible endpoint's base URL for this credential.
            Omit to leave the provider's own default in effect.
    AiGatewayError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API
        returns instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code
        through its own i18n catalog. This module renders no user-facing
        text of its own (go/ai-gateway/module.go's Locales doc comment),
        so a client resolves these codes through its own catalog exactly
        as it already does for every other structured error this module
        returns from its non-HTTP surface.
      properties:
        code:
          type: string
          example: aigateway.credential_not_found
        params:
          type: object
          additionalProperties: true
