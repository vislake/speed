# metering 的消息包,简体中文。
#
# 每条 go/metering/errors.go 声明的错误码对应一条扁平的顶层条目,id 就是带引号的
# 完整错误码。en-US.toml 必须携带完全相同的 id 集合。
#
# 插值名直接使用错误自身的 apperr 参数键,原样保留 snake_case:消息由 API
# 返回的结构化参数渲染,两边对不上就会渲染出一个空位而不是真实值。

"metering.missing_tenant_id" = "用量事件必须携带租户。"

"metering.missing_feature" = "用量事件必须携带计量维度。"

"metering.missing_idempotency_key" = "用量事件必须携带幂等键。"

"metering.invalid_quantity" = "用量数值 {{.quantity}} 无效,必须是非负的有限数。"

"metering.metadata_too_large" = "用量事件的元数据过大。"

"metering.invalid_period_bucket" = "“{{.bucket}}”不是合法的周期粒度。"
