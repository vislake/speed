"org.invalid_request_body" = "无法解析请求内容。"

"org.subject_unresolved" = "无法确认你当前的登录身份。"

# 邀请邮件正文。这是 org 唯一会发出的消息,并且按照**收件人**的语言渲染
# ——即邀请记录上保存的 locale,而不是发起邀请的操作者的界面语言。
#
# 插值名使用 snake_case,与 mail.go 构造的参数表一致。node_name 进入 HTML
# 正文前会做转义,纯文本正文里原样使用。

"org.invitation.subject" = "邀请你加入 {{.node_name}}"

"org.invitation.body_text" = """
你好,

有人邀请你加入 {{.node_name}}。

打开下面的链接即可接受邀请:
{{.accept_url}}

如果你并没有在等待这封邀请,忽略这封邮件即可。
"""

"org.invitation.body_html" = """
<p>你好,</p>
<p>有人邀请你加入 {{.node_name}}。</p>
<p><a href="{{.accept_url}}">接受邀请</a></p>
<p>如果你并没有在等待这封邀请,忽略这封邮件即可。</p>
"""

# org 为“有租户但还没有树”的新用户自动创建根节点时使用的名称。
# 租户随时可以把它改成对自己有意义的名字。
"org.default_workspace_name" = "工作区"
