# authn 模块面向用户的中文（zh-CN）文案。
#
# 每条 id 与 errors.go 中的一个 apperr.Error.Code 一一对应。接口本身从不直接
# 返回这段文案：它只返回结构化错误码与参数，由客户端按错误码在自己的 i18n 目录
# 中查找，本文件就是 authn 模块为该目录提供的资源。后端生成的内容（验证邮件、
# 安全通知）通过合并后的消息目录渲染，用的是**收件人**的语言，而不是操作者的
# 界面语言。
#
# 文件契约（见 go/pkgcore/i18n）：每条消息是扁平的一条顶层条目——不允许
# [errors] 这类分组 section（go-i18n 会把 section 名折进消息 id）——且
# en-US.toml 必须携带完全相同的 id 集合，否则 Builder.AddModule 会让启动失败。

