# English (en-US) user-facing text for the authn module.
#
# Every id here matches one apperr.Error.Code in errors.go. The API itself
# never returns this text: it returns the structured code plus parameters, and
# a client resolves the code through its own catalog, of which this file is
# authn's contribution. Backend-generated content (a verification email, a
# security notice) renders through the merged catalog in the RECIPIENT's
# language, not the operator's.
#
# File contract (see go/pkgcore/i18n): every entry is one flat top-level
# message -- no [errors]-style grouping sections, which go-i18n would fold
# into the message ids -- and zh-CN.toml must carry exactly the same id set.
# Builder.AddModule fails the bootstrap if the two sets differ.

