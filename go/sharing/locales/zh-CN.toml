# sharing 的消息包,简体中文。
#
# 每条 go/sharing/errors.go 声明的错误码对应一条扁平的顶层条目,id 就是带引
# 号的完整错误码。en-US.toml 必须携带完全相同的 id 集合。
#
# 插值名直接使用错误自身的 apperr 参数键,原样保留 snake_case:消息由 API
# 返回的结构化参数渲染,两边对不上就会渲染出一个空位而不是真实值。

"sharing.resource_ref_required" = "分享必须指定所暴露的资源。"

"sharing.expiry_required" = "分享链接必须设置过期时间;不允许创建永不过期的链接。"

"sharing.invalid_max_views" = "访问次数上限 {{.max_views}} 无效,必须是正数。"

"sharing.not_accessible" = "该分享链接当前不可访问。"

"sharing.share_not_found" = "该分享不存在。"

"sharing.internal_error" = "出现问题,请稍后重试。"

"sharing.rate_limited" = "尝试次数过多,请稍后再试。"

"sharing.resource_unavailable" = "该分享有效,但暂时无法读取被分享的资源。"
