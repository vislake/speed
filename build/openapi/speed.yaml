        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    AuthnListIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/AuthnIdentity'
    AuthnEnrollTOTPResponse:
      type: object
      properties:
        secret:
          type: string
        provisioning_uri:
          type: string
    AuthnConfirmTOTPRequest:
      type: object
