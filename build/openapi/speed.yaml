openapi: 3.0.3
info:
  title: speed
  description: "The speed application-wide OpenAPI document: the redocly join of the module fragments (the notes, cases, smilesim, authn and notification fragments today), regenerated by `task api:merge` and committed. Each module fragment stays authoritative for its own operations; this merged document is the frontend SDK's generation input and the linted whole-surface view (docs/internal/21-api-contract.md)."
  version: 0.0.0
tags:
  - name: openapi_other
    x-displayName: other
  - name: cases
    x-displayName: cases
  - name: smilesim
    x-displayName: smilesim
  - name: authn
    x-displayName: authn
  - name: authn (authenticated)
    x-displayName: authn (authenticated)
  - name: notification
    x-displayName: notification
paths:
  /api/v1/notes:
    servers: []
    post:
      operationId: notes_createNote
      summary: Create a note for the caller's tenant.
      description: >-
        The tenant is always the one tenancy.Middleware already resolved from
        the request; there is no tenant_id field anywhere on this request, by
        design (root CLAUDE.md's multi-tenant isolation rule).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotesCreateNoteRequest'
      responses:
        '201':
          description: The note was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesNote'
        '400':
          description: >-
            The request body was missing, malformed, had empty text, or text
            exceeding the maxLength declared below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesError'
      tags:
        - openapi_other
    get:
      operationId: notes_listNotes
      summary: List every note belonging to the caller's tenant.
      responses:
        '200':
          description: The caller's tenant's notes, oldest registration order first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesListNotesResponse'
      tags:
        - openapi_other
  /api/v1/cases:
    servers: []
    post:
      operationId: cases_createCase
      tags:
        - cases
      summary: Create a case under the caller's tenant.
      description: >-
        The case groups one patient (the clinic-given name required, the
        optional clinic-given reference) with the photos of the case as
        already-uploaded go/storage object ids, in attachment order. Both the
        photo list and the reference may be absent or empty -- a case can be
        created for an intake whose photos arrive later. There is deliberately
        no tenant_id field and no creator field anywhere on the request: the
        tenant is the one tenancy.Middleware already resolved into the request
        context, and the creator comes from the host's SubjectResolver seam,
        never from the request (a request no resolver can attribute is refused
        with cases.subject_unresolved before the body is even read).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasesCreateCaseRequest'
      responses:
        '201':
          description: The case was created, with its photos in attachment order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesCase'
        '400':
          description: >-
            The request body was missing or malformed, or a documented bound was
            violated (cases.invalid_request_body, cases.patient_name_required,
            cases.patient_name_too_long, cases.patient_ref_too_long,
            cases.photo_object_id_required, cases.duplicate_photo_object,
            cases.too_many_photos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '401':
          description: >-
            The request could not be attributed to a user
            (cases.subject_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '409':
          description: >-
            A named photo object is already attached to another case of the same
            tenant (cases.photo_already_attached).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '500':
          description: An unexpected server failure (cases.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
    get:
      operationId: cases_listCases
      tags:
        - cases
      summary: List the caller's own cases.
      description: >-
        Lists every case the caller created, newest first, each entry carrying
        its photos in attachment order (an empty list for a case whose photos
        arrive later). The list is keyed on the creator the host's
        SubjectResolver seam attributes the request to; a request no resolver
        can attribute is refused with cases.subject_unresolved.
      responses:
        '200':
          description: The caller's own cases, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesListResponse'
        '401':
          description: >-
            The request could not be attributed to a user
            (cases.subject_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '500':
          description: An unexpected server failure (cases.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
  /api/v1/cases/{caseId}:
    servers: []
    get:
      operationId: cases_getCase
      tags:
        - cases
      summary: Read one case of the caller's tenant.
      description: >-
        Reads one case of the caller's tenant with its photos in attachment
        order. An unknown case id, and a case of another tenant, both answer
        cases.not_found -- never a cross-tenant confirmation of a case's
        existence.
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
          description: The case's application-generated id.
      responses:
        '200':
          description: The case, with its photos in attachment order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesCase'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '404':
          description: >-
            No such case under the caller's tenant (cases.not_found -- the same
            answer for another tenant's case id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
        '500':
          description: An unexpected server failure (cases.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesError'
  /api/v1/smile-simulation/simulate:
    servers: []
    post:
      operationId: smilesim_simulate
      tags:
        - smilesim
      summary: Enqueue one smile-simulation job for a completed photo.
      description: >-
        The photo must be an existing, completed go/storage object of the
        caller's own tenant; the job itself is async -- the 202 answer carries
        only its job id, and the job-status route below is how its outcome is
        observed. Options are optional: an absent options object (or an absent
        field inside it) inherits the service's documented default for that
        dimension, while an explicitly present out-of-vocabulary or out-of-range
        value is refused with its coded smilesim.* 400 before anything is
        reserved or enqueued. A recipient_user_id, when given, receives a
        completion notification once the job reaches a terminal status. There is
        deliberately no tenant_id field anywhere on this request: the tenant is
        the one tenancy.Middleware already resolved into the request context
        (root CLAUDE.md's multi-tenant isolation rule).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmilesimSimulateRequest'
      responses:
        '202':
          description: >-
            The simulation job was enqueued; poll the job-status route for its
            outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimJobRef'
        '400':
          description: >-
            The request body was missing or malformed, photo_object_id was
            absent, or an explicitly present option was out of vocabulary or out
            of range (smilesim.unsupported_smile_style,
            smilesim.unsupported_tooth_shade, smilesim.strength_out_of_range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '401':
          description: The access token was missing or invalid (authn.token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '409':
          description: >-
            The credit reservation was refused: the tenant's balance cannot
            cover one simulation's cost (billing's coded 409).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '500':
          description: An unexpected server failure (smilesim.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
  /api/v1/smile-simulation/jobs/{jobID}:
    servers: []
    get:
      operationId: smilesim_getJob
      tags:
        - smilesim
      summary: Poll one smile-simulation job's live status.
      description: >-
        Answers the same jobs.Queue this app shares with go/ai-gateway: the
        status is the job's live status, an unknown or another tenant's job id
        answers 404 exactly like an unknown one. Once the job has succeeded, the
        answer carries the generated image's go/storage object id and the real
        vendor usage the job recorded; when a durable per-photo record exists
        for the job, it also echoes the effective options the simulation was
        generated with.
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
          description: The job id the simulate route's 202 answer carried.
      responses:
        '200':
          description: The job's live status, plus outcome fields once it is terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimJobStatus'
        '401':
          description: The access token was missing or invalid (authn.token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '404':
          description: >-
            No such job under the caller's tenant, or the job belongs to another
            tenant (jobs.job_not_found -- the same answer either way).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '500':
          description: An unexpected server failure (smilesim.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
  /api/v1/smile-simulation/photos/{photoObjectID}/simulations:
    servers: []
    get:
      operationId: smilesim_listPhotoSimulations
      tags:
        - smilesim
      summary: List every simulation generated from one photo.
      description: >-
        Lists every simulation generated from the photo under the caller's
        tenant, newest first -- the P3 gallery's data source for one case photo.
        Each entry carries the effective options it was generated with, its live
        status and, once the job succeeded, its output object id. An unknown
        photo id is an empty list, not an error: this route reads the durable
        per-photo result index, which simply holds no rows for a photo nothing
        was generated from.
      parameters:
        - name: photoObjectID
          in: path
          required: true
          schema:
            type: string
          description: >-
            The go/storage object id of the photo the simulations were generated
            from.
      responses:
        '200':
          description: The photo's simulations, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimPhotoSimulations'
        '401':
          description: The access token was missing or invalid (authn.token_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '403':
          description: >-
            The request carried no tenant -- an anonymous request to a
            tenant-scoped route (tenancy.tenant_unresolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
        '500':
          description: An unexpected server failure (smilesim.internal_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmilesimError'
  /api/v1/authn/register:
    servers: []
    post:
      operationId: authn_register
      tags:
        - authn
      summary: Register a new account.
      description: >-
        At least one of email and phone must be present. The response is the
        created account with no password field, ever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnRegisterRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnUser'
        '400':
          description: >-
            Neither email nor phone was supplied, or the password failed policy
            (authn.identifier_required, authn.password_too_short,
            authn.password_too_long, authn.password_too_weak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '409':
          description: >-
            The email or phone already belongs to an account
            (authn.email_already_registered, authn.phone_already_registered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '429':
          description: >-
            The per-IP registration rate limit was exceeded
            (authn.rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/login/password:
    servers: []
    post:
      operationId: authn_loginWithPassword
      tags:
        - authn
      summary: Sign in with an email or phone identifier and a password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnLoginWithPasswordRequest'
      responses:
        '200':
          description: A new session's token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '401':
          description: >-
            The identifier or password did not match any account
            (authn.invalid_credentials -- one answer for every failure reason,
            by design; see go/authn/errors.go).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '403':
          description: >-
            The account authenticated but is not an active member of the
            requested tenant (authn.tenant_membership_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '429':
          description: >-
            The account or IP is rate-limited or locked out (authn.rate_limited,
            authn.account_locked). The response carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/login/sms/request:
    servers: []
    post:
      operationId: authn_requestSMSCode
      tags:
        - authn
      summary: Request a one-time SMS sign-in code for a phone number.
      description: >-
        Always answers 202 whether or not the phone number belongs to an account
        -- go/authn/verification.go's RequestSMSCode never discloses
        registration status. There is nothing here for a legitimate caller to
        branch on either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnRequestSMSCodeRequest'
      responses:
        '202':
          description: The request was accepted (a code was sent, or silently was not).
        '429':
          description: >-
            The phone number or IP is rate-limited (authn.rate_limited). The
            response carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/login/sms:
    servers: []
    post:
      operationId: authn_loginWithSMSCode
      tags:
        - authn
      summary: Sign in with a phone number and the SMS code sent to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnLoginWithSMSCodeRequest'
      responses:
        '200':
          description: A new session's token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '401':
          description: >-
            The code was missing, wrong, expired, locked or already used
            (authn.verification_code_invalid -- one answer for every reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '429':
          description: The phone number or IP is rate-limited (authn.rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/token/refresh:
    servers: []
    post:
      operationId: authn_refreshToken
      tags:
        - authn
      summary: Rotate a refresh token for a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnRefreshTokenRequest'
      responses:
        '200':
          description: >-
            A new access token, and a new refresh token replacing the presented
            one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '401':
          description: >-
            The refresh token is unknown, expired, or was already consumed
            (authn.refresh_token_invalid, authn.refresh_token_reused -- the
            latter revokes the whole token family and the session as a side
            effect).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/logout:
    servers: []
    post:
      operationId: authn_logout
      tags:
        - authn (authenticated)
      summary: Sign out the calling session.
      description: >-
        Revokes the session the caller's own access token belongs to. Every
        other device's session is untouched -- see revoke-others for that.
      responses:
        '204':
          description: The session was revoked (or already was).
  /api/v1/authn/social/{provider}/authorize:
    servers: []
    get:
      operationId: authn_socialAuthorize
      tags:
        - authn
      summary: Build the authorization URL for a social sign-in channel.
      description: >-
        Signed in and calling this with a valid Principal turns the flow into
        BINDING a new identity to the caller's own account instead of signing in
        -- see the callback operation's response.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          example: google
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The URL to send the browser to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnSocialAuthorizeResponse'
        '400':
          description: >-
            The channel is unknown, or the redirect URI is not on the
            deployment's allowlist (authn.provider_unknown,
            authn.redirect_uri_not_allowed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/social/{provider}/callback:
    servers: []
    post:
      operationId: authn_socialCallback
      tags:
        - authn
      summary: Complete a social sign-in or account-binding authorization flow.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnSocialCallbackRequest'
      responses:
        '200':
          description: >-
            The completed flow: a new session (tokens set) for a sign-in, or the
            bound identity alone (tokens unset) for an already-signed-in caller
            binding a new channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnSocialLoginResponse'
        '401':
          description: >-
            The state was invalid, expired or already used, or the provider
            refused the code (authn.oauth_state_invalid,
            authn.social_exchange_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '409':
          description: >-
            The verified email belongs to an existing account this channel is
            not trusted to auto-link to (authn.identity_requires_binding), or
            the external identity is already bound to a different account
            (authn.identity_already_bound).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/identities:
    servers: []
    get:
      operationId: authn_listIdentities
      tags:
        - authn (authenticated)
      summary: List the caller's own bound external identities.
      responses:
        '200':
          description: The caller's bound identities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnListIdentitiesResponse'
  /api/v1/authn/identities/{identityId}:
    servers: []
    delete:
      operationId: authn_unbindIdentity
      tags:
        - authn (authenticated)
      summary: Unbind one of the caller's own external identities.
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The identity was unbound.
        '404':
          description: >-
            No such identity, or it does not belong to the caller
            (authn.identity_not_found -- the same answer either way, so the
            endpoint never confirms another account's binding).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '409':
          description: >-
            Unbinding would leave the account with no way to sign in at all
            (authn.last_login_method).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/mfa/totp/enroll:
    servers: []
    post:
      operationId: authn_enrollTOTP
      tags:
        - authn (authenticated)
      summary: Start TOTP enrollment for the caller's account.
      description: >-
        Replaces any existing TOTP factor (pending or active) with a fresh
        pending one, which must be confirmed with authn_confirmTOTP before it
        can satisfy a step-up.
      responses:
        '200':
          description: The shared secret and its otpauth:// provisioning URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnEnrollTOTPResponse'
  /api/v1/authn/mfa/totp/confirm:
    servers: []
    post:
      operationId: authn_confirmTOTP
      tags:
        - authn (authenticated)
      summary: Confirm a pending TOTP enrollment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnConfirmTOTPRequest'
      responses:
        '200':
          description: >-
            The factor is now active. The response carries ten recovery codes in
            PLAINTEXT -- the only time they are ever available in that form; the
            caller must show them to the user immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnRecoveryCodesResponse'
        '400':
          description: >-
            No pending enrollment exists, one is already active, or the code did
            not validate (authn.mfa_not_enrolled, authn.mfa_already_enrolled,
            authn.mfa_invalid_code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/mfa/recovery-codes/regenerate:
    servers: []
    post:
      operationId: authn_regenerateRecoveryCodes
      tags:
        - authn (authenticated)
      summary: Discard the caller's recovery codes and issue a fresh batch.
      description: >-
        Requires an ACTIVE TOTP factor; every previous code stops working at
        once.
      responses:
        '200':
          description: The new recovery codes, in plaintext, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnRecoveryCodesResponse'
        '400':
          description: No active TOTP factor exists (authn.mfa_not_enrolled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/mfa/step-up:
    servers: []
    post:
      operationId: authn_verifyStepUp
      tags:
        - authn (authenticated)
      summary: Re-prove a second factor for the caller's CURRENT session.
      description: >-
        Mints a fresh access token whose amr carries the factor just verified,
        without otherwise changing the session (the refresh token is untouched).
        The elevation lives only in that access token's own lifetime -- a later
        natural refresh reverts to the session's original amr.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnVerifyStepUpRequest'
      responses:
        '200':
          description: A freshly minted access token carrying the enriched amr.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '401':
          description: >-
            The code was wrong, replayed, or an unknown or already-used recovery
            code (authn.mfa_invalid_code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
        '429':
          description: The step-up rate limit was exceeded (authn.rate_limited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/tenant/switch:
    servers: []
    post:
      operationId: authn_switchTenant
      tags:
        - authn (authenticated)
      summary: Reissue an access token for a different tenant, reusing the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthnSwitchTenantRequest'
      responses:
        '200':
          description: A freshly minted access token for the target tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnTokenPair'
        '403':
          description: >-
            The caller is not an active member of the target tenant
            (authn.tenant_membership_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/me:
    servers: []
    get:
      operationId: authn_getMe
      tags:
        - authn (authenticated)
      summary: Return the caller's own authenticated identity.
      responses:
        '200':
          description: The calling Principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnPrincipal'
  /api/v1/authn/sessions:
    servers: []
    get:
      operationId: authn_listSessions
      tags:
        - authn (authenticated)
      summary: List every one of the caller's own sessions (their device list).
      description: >-
        Includes revoked sessions -- Status tells them apart -- so the owner can
        see which device they signed out and when. is_current marks the session
        the request's own access token belongs to.
      responses:
        '200':
          description: The caller's sessions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnListSessionsResponse'
  /api/v1/authn/sessions/{sessionId}:
    servers: []
    delete:
      operationId: authn_revokeSession
      tags:
        - authn (authenticated)
      summary: Sign out one of the caller's own devices.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The session was revoked.
        '404':
          description: >-
            No such session, or it does not belong to the caller
            (authn.session_not_found -- the same answer either way, so the
            endpoint never confirms another account's session id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnError'
  /api/v1/authn/sessions/revoke-others:
    servers: []
    post:
      operationId: authn_revokeOtherSessions
      tags:
        - authn (authenticated)
      summary: Sign out every one of the caller's sessions except the current one.
      responses:
        '200':
          description: How many sessions were revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnRevokeOtherSessionsResponse'
  /api/v1/authn/login-history:
    servers: []
    get:
      operationId: authn_listLoginHistory
      tags:
        - authn (authenticated)
      summary: List the caller's own recent login attempts, successful or not.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: The caller's login history, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthnListLoginHistoryResponse'
  /api/v1/notifications/messages:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_listMessages
      summary: List the caller's inbox messages, newest first.
      description: >-
        Returns the caller's own inbox rows (recipient_user_id matches the
        subject seam's caller), newest first, ordered by created_at then id so
        paging is stable. Messages whose expiry passed are still listed --
        expiry governs the unread predicate only (read_at IS NULL AND expiry not
        passed), never list membership -- but a message that reached its
        expiry_at renders with the unread affordance already gone, which is what
        the frontend's per-row state derives from read_at. group filters to one
        notification group (a type-classification namespace like
        "appointments"); unknown groups answer an empty list, never an error.
      parameters:
        - in: query
          name: group
          description: Return only messages of this notification group.
          schema:
            type: string
        - in: query
          name: limit
          description: >-
            The maximum number of rows to return. The module's read surface caps
            the page at 200 rows; larger limits are refused rather than silently
            truncated.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          description: The number of rows to skip before the returned page.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The requested page of the caller's inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListMessagesResponse'
        '400':
          description: limit or offset was not a valid integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/unread-count:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_getUnreadCount
      summary: Count the caller's unread inbox messages.
      description: >-
        The number of the caller's inbox rows whose read_at is still nil and
        whose expiry_at -- when set -- has not passed (the module's unread
        predicate, applied with the server's own clock). A message that is
        unread but expired does not count, and a read-then-expired message never
        counts twice.
      responses:
        '200':
          description: The count of unread messages, possibly zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/read-all:
    servers: []
    post:
      tags:
        - notification
      operationId: notification_markAllMessagesRead
      summary: Mark every unread message of the caller as read.
      description: >-
        Applies the same unread predicate as the unread count to the caller's
        own rows: every message that was still unread becomes read, expired or
        not (marking read is not gated on expiry, only counting is). The answer
        names how many rows the call actually flipped, so a client can
        distinguish "nothing was unread" from "everything was already read"
        without a second round trip.
      responses:
        '200':
          description: The messages that this call marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/messages/{messageId}/read:
    servers: []
    post:
      tags:
        - notification
      operationId: notification_markMessageRead
      summary: Mark one of the caller's messages as read.
      description: >-
        Marks the named message read. Idempotent: a message already read answers
        204 exactly like a first read. The row must be the caller's own and
        exist in the caller's tenant; a message id that is unknown, expired into
        a different tenant, or belongs to another recipient answers 404 -- never
        another user's message state.
      parameters:
        - in: path
          name: messageId
          required: true
          description: The id of the message to mark read.
          schema:
            type: string
      responses:
        '204':
          description: The message is read (it already was, or this call marked it).
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: The message id names no message of the caller's own inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/types:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_listTypes
      summary: List the notification types this tenant's deployment declares.
      description: >-
        The live type directory: every notification type every module of the
        host declared at bootstrap (the registry's frozen taxonomy -- new types
        arrive with a new release, never at runtime), each with its group
        classification, its default channel set for a recipient who has
        expressed no preference, and whether the recipient may opt out of it at
        all (the module's non-unsubscribable types carry delivery the host
        guarantees, such as security or billing receipts). description is the
        type's copy rendered from the declaring module's own locale bundle in
        the language the request negotiates (Accept-Language; zh-CN is the
        default when nothing negotiates), the same catalog delivery renders from
        -- the directory a client renders must be the copy its recipient would
        have received.
      responses:
        '200':
          description: The declared notification types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListTypesResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/preferences:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_listPreferences
      summary: List the caller's channel preferences per notification type.
      description: >-
        The caller's effective channel preference for every declared
        notification type: a type the caller never touched answers with its
        default channel set, one they opted out of on some channels answers the
        surviving set. Every declared type appears exactly once, so a client
        renders one row per type without merging against the type directory.
        Channel vocabulary is the module's closed set: in_app, email, sms.
      responses:
        '200':
          description: The caller's preference state per declared type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListPreferencesResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/preferences/{typeKey}/{channel}:
    servers: []
    put:
      tags:
        - notification
      operationId: notification_updatePreference
      summary: Enable or disable one channel of one notification type for the caller.
      description: >-
        Sets whether the caller wants delivery over channel for typeKey.
        enabled=true restores a channel the caller had opted out of;
        enabled=false is the opt-out, refused for a type whose unsubscribable
        flag is false (delivery the host guarantees must not be switched off
        through a preference). The answer is the type's updated effective state
        (channels), so a client applying a toggle can overwrite its row from the
        response without recomputing the merge. Channel vocabulary is the
        module's closed set: in_app, email, sms.
      parameters:
        - in: path
          name: typeKey
          required: true
          description: >-
            The type key, <module>.<entity>.<action> (for example
            "clinic.appointment_reminder").
          schema:
            type: string
        - in: path
          name: channel
          required: true
          description: The channel to enable or disable.
          schema:
            type: string
            enum:
              - in_app
              - email
              - sms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUpdatePreferenceRequest'
      responses:
        '200':
          description: The type's updated effective channel state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '400':
          description: >-
            The request body was missing or malformed, channel was not a known
            channel, or enabled=false was asked for a type whose unsubscribable
            flag is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: typeKey names no declared notification type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts:
    servers: []
    get:
      tags:
        - notification
      operationId: notification_listContacts
      summary: List the tenant's verified and pending contacts.
      description: >-
        The tenant's external-recipient roster, newest first: every address this
        tenant has put through the module's consent flow. The list is
        tenant-scoped, not per-user -- a contact belongs to the tenant that
        verified it, so any identified caller of the tenant sees the roster the
        tenant's staff manages. A contact row never echoes its address: the
        plaintext address is PII and the blind-index column would be an offline
        brute-force surface, so a list consumer sees id, channel, status and
        timestamps only -- which is all the UI's manage-addresses surface needs
        (the address itself is shown at the moment of submission, never
        re-served).
      responses:
        '200':
          description: The tenant's contacts, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListContactsResponse'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
    post:
      tags:
        - notification
      operationId: notification_createContact
      summary: Add a contact address to the tenant's roster through double opt-in.
      description: >-
        Registers channel address as a contact of the tenant and starts the
        module's consent flow: the row is created pending and a verification
        code is sent to the address (the one message the module's security rule
        allows to an unverified address -- the verification message itself --
        rate limited per tenant and per recipient). The address is normalized
        before storage (email lowercased, phone to E.164) and encrypted at rest
        under a blind-index column for exact-match dedupe. Submitting an address
        already on file (any status) answers the existing contact unchanged and
        sends nothing -- re-adding is not a resend, resend is its own operation.
        Codes expire; delivery to the address is refused until the contact is
        verified, by the delivery pipeline's send-time recheck, never only at
        enqueue time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreateContactRequest'
      responses:
        '201':
          description: >-
            The contact row -- freshly created pending, or the already existing
            row when this address was on file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationContact'
        '400':
          description: >-
            The request body was missing or malformed, channel was not email or
            sms, or address had no valid form for its channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: The caller has asked for too many verification codes; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts/{contactId}/verify:
    servers: []
    post:
      tags:
        - notification
      operationId: notification_verifyContact
      summary: Verify a pending contact with its code.
      description: >-
        Answers the code that was sent to the contact's address. A correct code
        within its expiry verifies the contact -- the consent record the
        delivery pipeline's send-time recheck demands -- and answers the
        verified row; a wrong or expired code leaves the contact pending and
        answers 400. The contact must be the tenant's own and still pending:
        resubmitting to one already verified answers 400 just like a wrong code
        -- wrong, expired, replayed and already-verified are deliberately one
        answer -- while an unsubscribed or bounced contact answers 409, its
        address never messaged again. Attempts are rate limited.
      parameters:
        - in: path
          name: contactId
          required: true
          description: The id of the pending contact to verify.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationVerifyContactRequest'
      responses:
        '200':
          description: The contact, now verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationContact'
        '400':
          description: >-
            The request body was missing or malformed, or the code did not
            verify: wrong, expired, replayed, or aimed at a contact that is
            already verified -- deliberately one answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: The contact id names no contact of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '409':
          description: >-
            The contact has unsubscribed or bounced and will not be messaged
            again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: Too many verification attempts; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
  /api/v1/notifications/contacts/{contactId}/resend:
    servers: []
    post:
      tags:
        - notification
      operationId: notification_resendContactCode
      summary: Issue a fresh verification code to a still-pending contact.
      description: >-
        Re-issues the verification code of a pending contact -- the flow for a
        code that expired before it was entered. Only a pending contact can be
        resent to: an unsubscribed or bounced contact answers 409, its address
        never messaged again, and one already verified answers 400 like a wrong
        code (deliberately one answer). The fresh code replaces the old one;
        rate limited like the original send.
      parameters:
        - in: path
          name: contactId
          required: true
          description: The id of the pending contact to resend to.
          schema:
            type: string
      responses:
        '204':
          description: A fresh code is on its way to the contact's address.
        '400':
          description: >-
            The code did not verify: wrong, expired, replayed, or aimed at a
            contact that is already verified -- deliberately one answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '401':
          description: The caller could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '404':
          description: The contact id names no contact of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '409':
          description: >-
            The contact has unsubscribed or bounced and will not be messaged
            again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
        '429':
          description: The caller has asked for too many verification codes; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationError'
components:
  schemas:
    NotesCreateNoteRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The note's placeholder content.
    NotesNote:
      type: object
      properties:
        id:
          type: string
          description: Application-generated UUID.
        text:
          type: string
        created_at:
          type: string
          format: date-time
    NotesListNotesResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NotesNote'
    NotesError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code through its
        own i18n catalog, populated from this module's Locales() resources for
        the codes documented in its error index.
      properties:
        code:
          type: string
          example: notes.text_required
        params:
          type: object
          additionalProperties: true
    CasesCreateCaseRequest:
      type: object
      required:
        - patient_name
      properties:
        patient_name:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            The patient's display name as the clinic entered it at intake.
            Required, length-bounded in the application (SQLite does not enforce
            a VARCHAR length limit, so the check lives in the service).
        patient_ref:
          type: string
          maxLength: 64
          description: >-
            The optional clinic-given identifier for the patient (a chart
            number, an internal reference). An absent or empty value means the
            clinic gave none.
        photo_object_ids:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
          description: >-
            The case's initial photos, in attachment order: references to
            already-uploaded go/storage objects of the caller's tenant. Optional
            -- an absent or empty list creates a case with no photos yet. Each
            entry must be a non-empty object id, unique within the list and not
            already attached to another case of the same tenant.
      description: The create route's request body.
    CasesPhoto:
      type: object
      required:
        - object_id
      properties:
        object_id:
          type: string
          description: >-
            The referenced go/storage photo object's id -- the value that feeds
            the smile-simulation surface's per-photo enumeration.
      description: One photo of a case, as a case read answers it.
    CasesCase:
      type: object
      required:
        - id
        - patient_name
        - patient_ref
        - creator_user_id
        - created_at
        - photos
      properties:
        id:
          type: string
          description: The case's application-generated id.
        patient_name:
          type: string
          description: The patient's display name as the clinic entered it.
        patient_ref:
          type: string
          description: >-
            The clinic-given patient reference; empty means the clinic gave
            none.
        creator_user_id:
          type: string
          description: >-
            The user id of the staff member who created the case -- the "my
            cases" list's key.
        created_at:
          type: string
          format: date-time
          description: When the case was created, whole seconds, UTC.
        photos:
          type: array
          items:
            $ref: '#/components/schemas/CasesPhoto'
          description: >-
            The case's photos in attachment order. Always present -- an empty
            list for a case whose photos arrive later.
      description: >-
        A case as the create answer, the list entries and the detail answer all
        render it -- one shape a P3 view renders with one component.
    CasesListResponse:
      type: object
      required:
        - cases
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CasesCase'
          description: The caller's own cases, newest first.
      description: The list route's 200 answer.
    CasesError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code through its
        own i18n catalog.
      properties:
        code:
          type: string
          example: cases.patient_name_required
        params:
          type: object
          additionalProperties: true
    SmilesimSimulateRequest:
      type: object
      required:
        - photo_object_id
      properties:
        photo_object_id:
          type: string
          minLength: 1
          description: The completed go/storage object id of the patient photo to simulate.
        recipient_user_id:
          type: string
          description: >-
            The user id of the recipient to notify once the job reaches a
            terminal status. Omitted (or empty) enqueues the job with no
            notification.
        options:
          $ref: '#/components/schemas/SmilesimSimulationOptions'
      description: >-
        The simulate route's request body. Every options field is a
        pointer-shaped optional: an omitted field inherits the service's
        documented default, while an explicitly present field -- including an
        out-of-range strength of 0 -- is passed through verbatim and refused by
        the service's own validation rather than silently replaced by a default.
    SmilesimSimulationOptions:
      type: object
      properties:
        smile_style:
          type: string
          enum:
            - subtle
            - natural
            - bright
          description: >-
            The character of the simulated smile. Defaults to natural when
            omitted.
        tooth_shade:
          type: string
          enum:
            - natural
            - white
            - ultra-white
          description: >-
            The tooth color the simulated smile is asked to show. Defaults to
            natural when omitted.
        strength:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          description: >-
            How strongly the transformation moves the photo toward the requested
            smile: the lower bound is exclusive (0 is a billed no-op and is
            refused) and 1 is the complete simulated smile. Defaults to full
            strength when omitted.
      description: >-
        One simulation's parameterized option set, shared by the simulate
        route's request body and by every response that echoes the effective
        options a simulation was generated with.
    SmilesimJobRef:
      type: object
      required:
        - job_id
      properties:
        job_id:
          type: string
          description: >-
            The enqueued go/jobs job's id -- the value the job-status route's
            {jobID} path parameter takes.
      description: >-
        The simulate route's 202 answer: a reference to the async job, which has
        not run yet.
    SmilesimUsage:
      type: object
      required:
        - image_count
        - steps
        - resolution_tier
      properties:
        image_count:
          type: integer
          description: How many images the vendor generated for the job.
        steps:
          type: integer
          description: The inference step count the vendor reported.
        resolution_tier:
          type: string
          description: >-
            The resolution tier the vendor generated at (its normalized size
            string).
      description: The real vendor usage a succeeded job recorded.
    SmilesimJobStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - running
            - retrying
            - succeeded
            - dead_letter
            - cancelled
          description: The job's live go/jobs status.
        options:
          $ref: '#/components/schemas/SmilesimSimulationOptions'
          description: >-
            The effective options the job was generated with, present when a
            durable per-photo record exists for it.
        output_object_id:
          type: string
          description: >-
            The generated image's go/storage object id, present once the job has
            succeeded.
        usage:
          $ref: '#/components/schemas/SmilesimUsage'
          description: >-
            The real vendor usage the job recorded, present once it has
            succeeded.
        error:
          type: string
          description: >-
            The job's recorded failure message, present when the job carries one
            (dead-lettered, cancelled after a failed attempt, or retrying).
      description: The job-status route's 200 answer for one job.
    SmilesimSimulation:
      type: object
      required:
        - job_id
        - photo_object_id
        - options
        - status
        - created_at
      properties:
        job_id:
          type: string
          description: The generation job's id.
        photo_object_id:
          type: string
          description: >-
            The go/storage object id of the photo the simulation was generated
            from -- the enumeration's grouping key, echoed per entry for a
            caller rendering a row on its own.
        options:
          $ref: '#/components/schemas/SmilesimSimulationOptions'
          description: The effective option set that produced this simulation.
        status:
          type: string
          enum:
            - pending
            - running
            - retrying
            - succeeded
            - dead_letter
            - cancelled
          description: >-
            The job's live status, read from the queue at call time -- never a
            snapshot stored by the service, so an enumeration always reflects
            what a job-status poll would answer right now.
        created_at:
          type: string
          format: date-time
          description: When the generation was requested, whole seconds, UTC.
        output_object_id:
          type: string
          description: >-
            The generated image's go/storage object id, present only when the
            job has succeeded and its result names one.
        error:
          type: string
          description: >-
            The job's recorded failure message, present only when the job
            carries one.
      description: One simulation in the per-photo enumeration.
    SmilesimPhotoSimulations:
      type: object
      required:
        - simulations
      properties:
        simulations:
          type: array
          items:
            $ref: '#/components/schemas/SmilesimSimulation'
          description: The photo's simulations, newest first.
      description: The per-photo enumeration route's 200 answer.
    SmilesimError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code through its
        own i18n catalog.
      properties:
        code:
          type: string
          example: smilesim.invalid_request_body
        params:
          type: object
          additionalProperties: true
    AuthnRegisterRequest:
      type: object
      required:
        - password
      properties:
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        display_name:
          type: string
        locale:
          type: string
    AuthnUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        phone:
          type: string
        display_name:
          type: string
        locale:
          type: string
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    AuthnLoginWithPasswordRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: An email address or phone number.
        password:
          type: string
        tenant_id:
          type: string
          description: >-
            Requests this tenant's first access token; empty means the caller's
            first tenant. A request, never a grant.
        device:
          type: string
    AuthnRequestSMSCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
    AuthnLoginWithSMSCodeRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
        code:
          type: string
        tenant_id:
          type: string
        device:
          type: string
    AuthnRefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    AuthnTokenPair:
      type: object
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: >-
            Absent when this response did not mint a new refresh token (a tenant
            switch or a step-up, both of which reuse the caller's existing one).
        refresh_expires_at:
          type: string
          format: date-time
        principal:
          $ref: '#/components/schemas/AuthnPrincipal'
    AuthnPrincipal:
      type: object
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
        session_id:
          type: string
        email:
          type: string
        amr:
          type: array
          items:
            type: string
    AuthnSocialAuthorizeResponse:
      type: object
      properties:
        authorize_url:
          type: string
    AuthnSocialCallbackRequest:
      type: object
      required:
        - code
        - state
      properties:
        code:
          type: string
        state:
          type: string
        tenant_id:
          type: string
    AuthnSocialLoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthnUser'
        identity:
          $ref: '#/components/schemas/AuthnIdentity'
        tokens:
          $ref: '#/components/schemas/AuthnTokenPair'
        created:
          type: boolean
        bound:
          type: boolean
        auto_linked:
          type: boolean
    AuthnIdentity:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    AuthnListIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/AuthnIdentity'
    AuthnEnrollTOTPResponse:
      type: object
      properties:
        secret:
          type: string
        provisioning_uri:
          type: string
    AuthnConfirmTOTPRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    AuthnRecoveryCodesResponse:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    AuthnVerifyStepUpRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    AuthnSwitchTenantRequest:
      type: object
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
    AuthnSession:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        device:
          type: string
        user_agent:
          type: string
        ip:
          type: string
        amr:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_current:
          type: boolean
    AuthnListSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AuthnSession'
    AuthnRevokeOtherSessionsResponse:
      type: object
      properties:
        revoked_count:
          type: integer
    AuthnLoginAttempt:
      type: object
      properties:
        id:
          type: string
        method:
          type: string
        result:
          type: string
        failure_reason:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
    AuthnListLoginHistoryResponse:
      type: object
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AuthnLoginAttempt'
    AuthnError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text (backend coding standard §6.2) -- a client
        resolves code through its own i18n catalog, populated from this module's
        Locales() resources for the codes documented on each operation above.
      properties:
        code:
          type: string
          example: authn.invalid_credentials
        params:
          type: object
          additionalProperties: true
    NotificationListMessagesResponse:
      type: object
      description: One page of the caller's inbox.
      properties:
        items:
          type: array
          description: The page's messages, newest first.
          items:
            $ref: '#/components/schemas/NotificationMessage'
      required:
        - items
    NotificationMessage:
      type: object
      description: >-
        One inbox row: a message rendered for this recipient at delivery time,
        in the recipient's locale. title and body are the rendered text -- never
        template ids, which a client cannot resolve -- and params is the
        interpolation map that produced them, for a client that renders its own
        richer copy from the type directory.
      properties:
        id:
          type: string
          description: The message's id.
        type_key:
          type: string
          description: >-
            The notification type this message was rendered from,
            <module>.<entity>.<action>.
        group:
          type: string
          description: >-
            The message's group classification, taken from its type at delivery
            time.
        title:
          type: string
          description: The rendered headline of the message.
        body:
          type: string
          description: The rendered body of the message.
        params:
          type: object
          description: >-
            The template parameters that produced title and body, keyed by the
            names the templates' placeholders spell out.
          additionalProperties: true
        link:
          type: string
          description: >-
            The optional deep link the message points at; empty when the message
            has none.
        expiry_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the message stops counting as unread, server time; null when it
            never expires.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: When the recipient read the message; null while it is unread.
        created_at:
          type: string
          format: date-time
          description: When the message was delivered into the inbox.
      required:
        - id
        - type_key
        - group
        - title
        - body
        - params
        - link
        - created_at
    NotificationUnreadCountResponse:
      type: object
      description: The caller's unread message count.
      properties:
        count:
          type: integer
          description: The number of unread messages.
      required:
        - count
    NotificationReadAllResponse:
      type: object
      description: The outcome of a mark-all-read call.
      properties:
        read_count:
          type: integer
          description: The number of messages this call marked read.
      required:
        - read_count
    NotificationListTypesResponse:
      type: object
      description: The deployment's declared notification types.
      properties:
        items:
          type: array
          description: The declared types, in declaration order.
          items:
            $ref: '#/components/schemas/NotificationType'
      required:
        - items
    NotificationType:
      type: object
      description: >-
        One declared notification type. Unsubscribable=false marks delivery the
        host guarantees: the recipient cannot switch these channels off through
        a preference.
      properties:
        type_key:
          type: string
          description: The type key, <module>.<entity>.<action>.
        group:
          type: string
          description: The type's inbox classification group.
        default_channels:
          type: array
          description: >-
            The channels a recipient gets by default, before expressing any
            preference. The closed vocabulary: in_app, email, sms.
          items:
            type: string
        unsubscribable:
          type: boolean
          description: Whether the recipient may opt out of this type's channels.
        description:
          type: string
          description: >-
            The type's copy, rendered from the declaring module's locale bundle
            in the negotiated language.
      required:
        - type_key
        - group
        - default_channels
        - unsubscribable
        - description
    NotificationListPreferencesResponse:
      type: object
      description: The caller's channel preferences per declared type.
      properties:
        items:
          type: array
          description: >-
            One entry per declared type, effective channels merged with
            defaults.
          items:
            $ref: '#/components/schemas/NotificationPreference'
      required:
        - items
    NotificationPreference:
      type: object
      description: >-
        The caller's effective channel state for one notification type: the set
        of channels the caller currently receives, the type's defaults reduced
        by the caller's opt-outs.
      properties:
        type_key:
          type: string
          description: The type key this state belongs to.
        channels:
          type: array
          description: >-
            The channels currently enabled for the caller, a subset of the
            type's vocabulary.
          items:
            type: string
      required:
        - type_key
        - channels
    NotificationUpdatePreferenceRequest:
      type: object
      description: One channel toggle for one notification type.
      properties:
        enabled:
          type: boolean
          description: Whether the caller wants this type over this channel.
      required:
        - enabled
    NotificationListContactsResponse:
      type: object
      description: The tenant's contacts, newest first.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationContact'
      required:
        - items
    NotificationContact:
      type: object
      description: >-
        One contact row. The address itself never appears in this document's
        responses: plaintext addresses are PII and the blind-index would be an
        offline brute-force surface, so the API serves id, channel, status and
        timestamps only.
      properties:
        id:
          type: string
          description: The contact's id.
        channel:
          type: string
          description: The address's channel.
          enum:
            - email
            - sms
        status:
          type: string
          description: >-
            The contact's consent status: pending (code issued, awaiting
            verification), verified (consent proven), unsubscribed (consent
            withdrawn), or bounced (delivery failed hard).
          enum:
            - pending
            - verified
            - unsubscribed
            - bounced
        created_at:
          type: string
          format: date-time
          description: When the contact was added.
      required:
        - id
        - channel
        - status
        - created_at
    NotificationCreateContactRequest:
      type: object
      description: A new contact address to register through double opt-in.
      properties:
        channel:
          type: string
          description: The address's channel.
          enum:
            - email
            - sms
        address:
          type: string
          description: >-
            The address itself: an email address, or a phone number in a form
            the module can normalize to E.164. Never logged; stored encrypted.
      required:
        - channel
        - address
    NotificationVerifyContactRequest:
      type: object
      description: The code the contact's address received.
      properties:
        code:
          type: string
          description: The verification code from the contact's message.
      required:
        - code
    NotificationError:
      type: object
      description: >-
        The structured {code, params} error envelope every speed API returns
        instead of localized text (backend coding standard §6.2;
        docs/internal/11-cross-cutting.md) -- a client resolves code through its
        own i18n catalog, populated from this module's Locales() resources for
        the codes documented in its error index.
      properties:
        code:
          type: string
          example: notification.contact_code_invalid
        params:
          type: object
          additionalProperties: true
