# Raw-GORM bypass of dbkit.Repository[T]
#
# Discipline row: docs/internal/18-cicd.md architecture-discipline table,
# "raw-GORM bypass around the Repository" row (semgrep custom
# rule), and the root CLAUDE.md bullets under "Multi-tenant isolation":
# business repositories for tenant-owned data must embed
# dbkit.Repository[T], and db.Table / db.Model / db.Raw must not be used
# to work around the Repository -- tenant filtering is injected by the
# GORM plugin and the Repository, so bypassing them bypasses the guard.
#
# What fires: any call to the three bypass entry points -- .Table(...),
# .Model(...), .Raw(...) -- on any receiver, in shipped (non-test) code.
#
# ALLOWLIST (paths.exclude below) -- the sites where the raw *gorm.DB
# surface is the legitimate tool, all documented in the owning module:
#   * go/dbkit/**            -- dbkit owns the *gorm.DB wrapper, the
#     tenant-scoping plugin, the MigrationRegistry and Open(); it is the
#     infrastructure the discipline is built on, not a consumer of it.
#   * go/jobs/store.go       -- jobRecord is platform data whose dispatch
#     query must scan candidate Jobs across every tenant at once (see
#     docs/internal/17-risks.md row 46 and the store.go file-header
#     comment); the plain *gorm.DB dbkit.Open returns is the documented
#     pattern for that data domain.
#   * go/authn/internal/testutil/testutil.go -- a test-fixture helper,
#     the same category the wholesale "**/*_test.go" exclude already
#     covers, but it cannot be named "*_test.go" itself: authn's own
#     external test files (package authn_test) import this package, and
#     a "_test.go"-suffixed file is only ever compiled into its own
#     package's test binary, never importable by another package's tests.
#     Its one flagged call (ExpireSession) reaches the raw "sessions"
#     table on purpose, to force a decayed-session state no production
#     path ever writes, precisely so a real test can prove the read-time
#     check catches it -- the same reason test files are excluded
#     wholesale rather than enumerated (see header below).
#   * go/pki/internal/testutil/migration_dedupe.go -- a test-fixture
#     helper, the same category the wholesale "**/*_test.go" exclude
#     already covers, but it cannot be named "*_test.go" itself: the
#     migration-0008 duplicate-ledger regression's SQLite unit legs
#     (migration_dedupe_test.go) and its real-PostgreSQL leg
#     (go/pki/integration_test/postgres_migration_dedupe_test.go, a
#     separate package) both import these helpers, and a "_test.go"-
#     suffixed file is only ever compiled into its own package's test
#     binary. Its flagged calls probe state no dbkit.Repository serves
#     -- revocation-ledger row counts and ids, each dialect's index
#     catalog (sqlite_master / pg_indexes), and the schema_migrations
#     ledger -- registry/platform rows, never tenant-owned data,
#     observed to rewind a deployment stranded at migration 0008 and
#     assert the remediated end state (go/pki/AGENTS.md's Testing
#     section records the round).
#   * go/authn/identity.go   -- identity-domain rows (users,
#     user_identities) that dbkit.Repository[T] cannot serve: the generic
#     constraint requires TenantScoped, which identity data deliberately
#     does not implement (this module's model comments and repository.go
#     file comment document that, pinned by its AssertNotTenantScoped
#     suite), and the raw *gorm.DB dbkit.Open returns is that domain's
#     documented pattern. One flagged call, DeleteUnlessLastLoginMethod's
#     serializing touch-lock (tx.Model(&User{}).Where("id = ?", userID).
#     Update("updated_at", at)): a value-preserving single-column
#     conditional UPDATE gorm can only express anchored to a model -- the
#     struct-argument Updates idiom every other authn write uses would
#     send updated_at through the auto-update-time machinery, which
#     overwrites the explicit value, and a row Save would clobber every
#     column from a stale read. The method's doc comment records why the
#     UPDATE-touch is the lock at all (the dialect-neutral SELECT ... FOR
#     UPDATE equivalent).
#
# Residual gaps: only the three named entry points are matched -- a
# workaround through another method on *gorm.DB (e.g. Exec with hand-
# written SQL) is not caught here (Exec is separately shape-controlled by
# the WHERE-tenant_id rule's review net and dbkit's own discipline), and
# tests deliberately write banned patterns to prove the guards, which is
# why test files are excluded wholesale rather than enumerated.
rules:
  - id: raw-gorm-bypass
    message: >-
      direct call to a raw-GORM bypass entry point (.Table/.Model/.Raw).
      Tenant-owned data must be reached through dbkit.Repository[T],
      whose tenant filter is injected by the plugin; a raw call bypasses
      the guard. Legitimate sites are allowlisted in the rule header
      (go/dbkit internals, go/jobs/store.go platform-data queries).
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $RECV.Table($ARGS, ...)
          - pattern: $RECV.Model($ARGS, ...)
          - pattern: $RECV.Raw($ARGS, ...)
    paths:
      exclude:
        - "**/*_test.go"
        - "**/integration_test/**"
        # Allowlist (see header).
        - "**/go/dbkit/**"
        - "**/go/jobs/store.go"
        - "**/go/authn/internal/testutil/testutil.go"
        - "**/go/pki/internal/testutil/migration_dedupe.go"
        - "**/go/authn/identity.go"
