# Raw-GORM bypass of dbkit.Repository[T]
#
# Discipline row: docs/internal/18-cicd.md architecture-discipline table,
# "raw-GORM bypass around the Repository" row (semgrep custom
# rule), and the root CLAUDE.md bullets under "Multi-tenant isolation":
# business repositories for tenant-owned data must embed
# dbkit.Repository[T], and db.Table / db.Model / db.Raw must not be used
# to work around the Repository -- tenant filtering is injected by the
# GORM plugin and the Repository, so bypassing them bypasses the guard.
#
# What fires: any call to the three bypass entry points -- .Table(...),
# .Model(...), .Raw(...) -- on any receiver, in shipped (non-test) code.
#
# ALLOWLIST (paths.exclude below) -- the sites where the raw *gorm.DB
# surface is the legitimate tool, all documented in the owning module:
#   * go/dbkit/**            -- dbkit owns the *gorm.DB wrapper, the
#     tenant-scoping plugin, the MigrationRegistry and Open(); it is the
#     infrastructure the discipline is built on, not a consumer of it.
#   * go/jobs/store.go       -- jobRecord is platform data whose dispatch
#     query must scan candidate Jobs across every tenant at once (see
#     docs/internal/17-risks.md row 46 and the store.go file-header
#     comment); the plain *gorm.DB dbkit.Open returns is the documented
#     pattern for that data domain.
#   * go/notification/repository.go -- the inbox unread-count's single
#     flagged call, a tenant-scoped COUNT query (UnreadCount). The COUNT
#     is gorm's Count finisher, which can only be anchored to a table
#     through a Model destination; Repository[T]'s minimal surface grows
#     no Count of its own, and dbkit's tenant-scoping plugin is designed
#     around exactly this shape (its own doc comment names
#     db.Model(&Widget{}).Count(&n)), injecting WHERE tenant_id from the
#     Model's TenantScoped type -- so the one .Model call is what makes
#     the count tenant-scoped rather than a bypass of the guard. The
#     method's doc comment records the choice; nothing else in the file
#     (or module) uses the three bypass entry points.
#   * **/internal/testutil/** and **/internal/apptest/** -- Go
#     test-support packages: test-only helper packages whose files carry
#     no "_test.go" suffix -- internal/testutil is the home root
#     CLAUDE.md's Testing rule mandates for shared test helpers, and
#     internal/apptest is the reference app's package of the same kind.
#     They are the same testing surface the wholesale "**/*_test.go"
#     exclude covers, in a different file shape: the suffix is
#     unavailable to them because a "_test.go" file compiles only into
#     its own package's test binary, never importable by another
#     package's tests -- which is what these helpers exist to be -- so
#     the exclusion keys on the package, not the file name. What they
#     reach through the raw *gorm.DB surface is the throwaway state the
#     test-file exclusion already covers:
#     go/authn/internal/testutil/testutil.go's ExpireSession forces a
#     decayed-session state no production path writes;
#     go/pki/internal/testutil/migration_dedupe.go probes the revocation
#     ledger, each dialect's index catalog (sqlite_master / pg_indexes)
#     and the schema_migrations ledger -- registry/platform rows no
#     dbkit.Repository serves -- to rewind a database to the state a
#     deployment stranded at migration 0008 is left in and assert the
#     deduped end state; examples/reference-app/internal/testutil/
#     selfservice.go polls, through a second connection, the test's own
#     throwaway SQLite file (the one the test started its server
#     against) for the membership row a retried provisioning attempt
#     writes, applying the same cross-tenant filter go/org's own query
#     applies. The exemption's premise -- these packages serve the
#     tree's tests and nothing else -- holds for every importer in the
#     tree (each import of either package is a *_test.go file or another
#     test-support package, e.g. pkgcore/redistest), and the premise is
#     enforced in the other direction for the host trees' two packages
#     by tools/check_host_composition.py, which reports an import of one
#     from production code.
#   * go/authn/identity.go   -- identity-domain rows (users,
#     user_identities) that dbkit.Repository[T] cannot serve: the generic
#     constraint requires TenantScoped, which identity data deliberately
#     does not implement (this module's model comments and repository.go
#     file comment document that, pinned by its AssertNotTenantScoped
#     suite), and the raw *gorm.DB dbkit.Open returns is that domain's
#     documented pattern. One flagged call, DeleteUnlessLastLoginMethod's
#     serializing touch-lock (tx.Model(&User{}).Where("id = ?", userID).
#     Update("updated_at", at)): a value-preserving single-column
#     conditional UPDATE gorm can only express anchored to a model -- the
#     struct-argument Updates idiom every other authn write uses would
#     send updated_at through the auto-update-time machinery, which
#     overwrites the explicit value, and a row Save would clobber every
#     column from a stale read. The method's doc comment records why the
#     UPDATE-touch is the lock at all (the dialect-neutral SELECT ... FOR
#     UPDATE equivalent).
#
# Residual gaps: only the three named entry points are matched -- a
# workaround through another method on *gorm.DB (e.g. Exec with hand-
# written SQL) is not caught here (Exec is separately shape-controlled by
# the WHERE-tenant_id rule's review net and dbkit's own discipline), and
# tests deliberately write banned patterns to prove the guards, which is
# why test files -- and the test-support packages allowlisted above --
# are excluded wholesale rather than enumerated.
rules:
  - id: raw-gorm-bypass
    message: >-
      direct call to a raw-GORM bypass entry point (.Table/.Model/.Raw).
      Tenant-owned data must be reached through dbkit.Repository[T],
      whose tenant filter is injected by the plugin; a raw call bypasses
      the guard. Legitimate sites are allowlisted in the rule header
      (go/dbkit internals, go/jobs/store.go platform-data queries,
      test-support packages excluded wholesale like test files).
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $RECV.Table($ARGS, ...)
          - pattern: $RECV.Model($ARGS, ...)
          - pattern: $RECV.Raw($ARGS, ...)
    paths:
      exclude:
        - "**/*_test.go"
        - "**/integration_test/**"
        # Allowlist (see header).
        - "**/go/dbkit/**"
        - "**/go/jobs/store.go"
        - "**/go/notification/repository.go"
        - "**/internal/testutil/**"
        - "**/internal/apptest/**"
        - "**/go/authn/identity.go"
