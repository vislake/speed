# Deployment-mode branching outside kernel wiring -- residual-risk detector
#
# Discipline row: docs/internal/18-cicd.md architecture-discipline table,
# "deployment-mode branching outside kernel wiring" row (semgrep: only the
# kernel-wiring packages are allowed), and the root CLAUDE.md Architecture
# Discipline bullet "Deployment modes: do not branch on
# `if mode == \"standalone\"` in business logic".
#
# The deployment-composition retrofit (docs/internal/03-deployment-modes.md)
# turned the mode from a selector into a constraint: the assembly takes no
# per-call deployment mode, each seam value comes from a selected component
# declaring its own capabilities, and Prepare fails assembly when a selected
# component cannot satisfy the configured mode's RequiredCapabilities().
# What survives of the mode is a few wiring-time sites -- the
# RequiredCapabilities() dispatch in deployment_mode.go, the
# consumer binary's command entry reading APP_DEPLOYMENT_MODE, and the
# assembly-time seam check go/authn performs against the mode a host wired
# (module.go, below) -- plus the mode constants themselves, still part of
# the public API and still comparable. Business modules receive
# already-resolved, capability-checked infrastructure through the Registry
# and have no mode left to inspect, so this rule lives on as a residual-risk
# detector: a mode comparison outside the allowlisted sites means a mode
# decision has regressed into library code.
#
# ALLOWLIST (paths.exclude below) -- the mode-decision sites the retrofit
# left, each a deliberate, documented wiring-time decision:
#   * go/pkgcore/deployment_mode.go -- the mode constants + parser +
#     RequiredCapabilities() dispatch (the one place library code consults
#     the mode value, deciding which capabilities assembly must demand of
#     the resolved implementations)
#   * examples/reference-app/internal/app/bootstrap.go -- the assembly
#     resolves APP_DEPLOYMENT_MODE there (ConfigFromEnv's loader-driven
#     bootstrap: the loader target pins the variable, the transform parses
#     the value) and defaults it to standalone
#   * examples/reference-app/internal/app/host_wiring.go -- the assembly's
#     authn construction: the host-side "SMS sender" seam three-way (a
#     configured gateway URL always wins; absent it, a non-distributed
#     mode falls back to the console transport while the distributed
#     mode is left deliberately UNWIRED), whose distributed branch
#     go/authn/module.go's own newOptions check below refuses to let
#     assemble silently
#   * go/authn/module.go -- the newOptions check refusing a distributed
#     composition that wired no explicit WithSMSSender
#     (ErrMissingDistributedSMSSender) instead of silently defaulting to
#     the console sender nobody in that deployment mode reads. It is
#     authn's construction-time counterpart of pkgcore Kernel's own
#     resolveMailer/resolveObjectStore: authn owns its SMSSender seam and
#     does not register it on the pkgcore registry, so the assembly-time
#     constraint lives in the module's own constructor -- wiring-time only,
#     never in Service's request path, per WithDeploymentMode's own doc
#     comment. The site arrived with the SMS round, after the retrofit
#     alignment commit's empirical scan (whose two-file result missed it),
#     and is exempted as the same kind of assembly-time constraint the
#     other two sites make.
#   * go/saasctl/internal/template/project/cmd/server/config.go -- the
#     embedded generated app's own command entry reading
#     APP_DEPLOYMENT_MODE (through its hostConfig loader target's env
#     pin, the same loader-tag shape the reference-app bootstrap.go
#     exemption covers) at bootstrap. The file carries the template's
#     //go:build ignore compile-containment marker and materializes into
#     consumer projects outside this tree, where repo-checks does not
#     scan it; the in-tree copy is the template, not library code.
#   * go/saasctl/internal/template/project/selection/{authn,authn+org,
#     authn+rbac,authn+org+rbac}/server.go -- the saasctl-distributed-mode
#     round's port of the reference-app's own authn "SMS sender"
#     seam three-way conditional injection (an unreachable-under-
#     distributed-mode console fallback would leave a distributed replica
#     pool silently unwarned) into each authn-containing selection's own
#     command-entry wiring. Byte-for-byte the same wiring-time decision the
#     reference-app host_wiring.go exemption and go/authn/module.go's own
#     ErrMissingDistributedSMSSender check already cover, and the identical
#     "template, not library code, materializes outside this tree" argument
#     config.go's own entry above makes -- these four files just carry the
#     comparison in server.go instead of config.go because the SMS-sender
#     seam is authn-specific, and the `none` selection (no authn module) has
#     no such comparison to make at all.
# The other former entries are deliberately NOT exempted: registry.go,
# observability's init.go and the reference-app main.go no longer carry a
# mode decision since the retrofit removed their switches, and a comparison
# re-added there must fire on sight. go/saasctl/internal/db/migrate.go's
# own command-entry gate is the same story one round later: the
# standalone-only refusal this header used to exempt was removed once its
# premise was shown false (a generated project's deployment mode changes
# which infrastructure seams its server composes, never which SQL dialect
# its own database speaks), so migrate.go's paths.exclude entry went with
# it -- a comparison re-added there must fire on sight too. The reference
# app's own server.go is the same story: it carries the resolved mode into
# the wiring -- a ServerConfig field, put into the composition's
# "deployment" key -- but compares it nowhere, the assembly's mode
# decision living in host_wiring.go above, so server.go needs no
# paths.exclude entry of its own: a comparison re-added there must fire
# on sight.
#
# What fires: string-literal and constant comparisons against the two mode
# values (both operand orders, == and !=), case labels naming the mode
# values (unqualified or through any qualifier), and reads of the
# APP_DEPLOYMENT_MODE environment variable -- each is a mode decision. The
# env-read coverage spans the direct read (os.Getenv/os.LookupEnv) and the
# pkgcore/config loader pin that names the variable in a struct tag
# (`config:"env=APP_DEPLOYMENT_MODE"`, in either Go string spelling) --
# the shape a loader target consumes the variable in.
#
# Out of scope: branching on a Capability -- caps.Has(MultiReplicaSafe), a
# case label on a capability value. Capabilities are the retrofit's new
# vocabulary for "may this implementation run in this topology", and no
# architecture-discipline row governs where a capability may gate behavior
# yet; that branch is a code-review question until such a row (and its own
# rule) exists. The negative fixture pins these shapes clean.
#
# Constant propagation: semgrep resolves same-package literal-valued
# consts before matching, so a mode decision smuggled through a local
# `const modeAlias = "standalone"` still fires -- matching is by VALUE,
# not by identifier name (the positive fixture's constEscaper proves it,
# the negative fixture's sqliteFlavor / logLevelEnv consts prove the
# flip side: consts holding other values stay clean).
#
# Residual gap: a module could still smuggle a mode decision behind an
# indirection that neither a text match nor value propagation reaches --
# e.g. a helper living inside an allowlisted file, a cross-package alias
# constant, or a decision computed at runtime. The rule sees the
# comparison sites, not the control flow that reaches them; review still
# owns those evasions. The saasctl CLI's own bootstrap read
# (go/saasctl/internal/appconfig/appconfig.go, DeploymentModeEnv through
# its lookup helper) is one such function-parameter indirection; it is
# consumer-command-entry wiring -- the class the allowlisted command
# entries above belong to -- never a business-module decision, and review
# owns it. A loader pin whose tag value carries another loader option
# beside the variable (`config:"env=APP_DEPLOYMENT_MODE,required"` is a
# different string literal) escapes the tag patterns the same way, and
# review owns that spelling.
rules:
  - id: deployment-mode-branch-outside-kernel-wiring
    message: >-
      deployment-mode comparison or APP_DEPLOYMENT_MODE read (direct env
      access or a config:"env=APP_DEPLOYMENT_MODE" loader pin) outside
      the kernel-wiring allowlist. The retrofit confined the mode to
      wiring: the RequiredCapabilities() dispatch
      (go/pkgcore/deployment_mode.go) and consumer command entries
      reading APP_DEPLOYMENT_MODE (the reference app's internal/app
      bootstrap + modules wiring and the saasctl CLI's embedded
      generated-app config.go and authn-containing server.go files) are
      the only allowlisted sites; business code receives
      already-resolved, capability-checked infrastructure and must never
      branch on the mode. See the rule header for the exact allowlist.
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $X == "standalone"
          - pattern: '"standalone" == $X'
          - pattern: $X != "standalone"
          - pattern: '"standalone" != $X'
          - pattern: $X == "distributed"
          - pattern: '"distributed" == $X'
          - pattern: $X != "distributed"
          - pattern: '"distributed" != $X'
          # A bare `case "standalone":` label is not a parseable Go
          # statement, so the case forms are anchored inside the switch
          # statement they belong to (the whole switch is the match).
          - pattern: |
              switch $X {
              case "standalone":
                  ...
              }
          - pattern: |
              switch $X {
              case "distributed":
                  ...
              }
          - pattern: $OBJ.DeploymentModeStandalone == $X
          - pattern: $X == $OBJ.DeploymentModeStandalone
          - pattern: $OBJ.DeploymentModeStandalone != $X
          - pattern: $X != $OBJ.DeploymentModeStandalone
          - pattern: $OBJ.DeploymentModeDistributed == $X
          - pattern: $X == $OBJ.DeploymentModeDistributed
          - pattern: $OBJ.DeploymentModeDistributed != $X
          - pattern: $X != $OBJ.DeploymentModeDistributed
          - pattern: |
              switch $X {
              case $OBJ.DeploymentModeStandalone:
                  ...
              }
          - pattern: |
              switch $X {
              case $OBJ.DeploymentModeDistributed:
                  ...
              }
          - pattern: 'os.Getenv("APP_DEPLOYMENT_MODE")'
          # The pkgcore/config loader pin: a struct field tagged with the
          # variable's exact name -- the shape the loader targets (and the
          # allowlisted bootstrap.go / config.go sites) consume it in. Go
          # has two string spellings, so the tag is matched by literal in
          # each (raw backtick form and interpreted form).
          - pattern: '`config:"env=APP_DEPLOYMENT_MODE"`'
          - pattern: '"config:\"env=APP_DEPLOYMENT_MODE\""'
    paths:
      exclude:
        - "**/*_test.go"
        - "**/integration_test/**"
        # Kernel-wiring allowlist (see header).
        - "**/go/pkgcore/deployment_mode.go"
        - "**/examples/reference-app/internal/app/bootstrap.go"
        - "**/examples/reference-app/internal/app/host_wiring.go"
        - "**/go/authn/module.go"
        # Consumer-command-entry sites (see header).
        - "**/go/saasctl/internal/template/project/cmd/server/config.go"
        - "**/go/saasctl/internal/template/project/selection/authn/server.go"
        - "**/go/saasctl/internal/template/project/selection/authn+org/server.go"
        - "**/go/saasctl/internal/template/project/selection/authn+rbac/server.go"
        - "**/go/saasctl/internal/template/project/selection/authn+org+rbac/server.go"
