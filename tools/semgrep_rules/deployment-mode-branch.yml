# Deployment-mode branching outside kernel wiring -- residual-risk detector
#
# Discipline row: docs/internal/18-cicd.md architecture-discipline table,
# "deployment-mode branching outside kernel wiring" row (semgrep: only the
# kernel-wiring packages are allowed), and the root CLAUDE.md Architecture
# Discipline bullet "Deployment modes: do not branch on
# `if mode == \"standalone\"` in business logic".
#
# The deployment-composition retrofit (docs/internal/03-deployment-modes.md)
# turned the mode from a selector into a constraint: NewKernel takes no
# deployment mode, each seam is resolved from its registry of
# capability-declaring implementations, and Bootstrap fails assembly when a
# resolved implementation cannot satisfy the declared mode's
# RequiredCapabilities(). What survives of the mode is a few wiring-time
# sites -- the RequiredCapabilities() dispatch in deployment_mode.go, the
# consumer binary's command entry reading SPEED_DEPLOYMENT_MODE, and the
# assembly-time seam check go/authn performs against the mode a host wired
# (module.go, below) -- plus the mode constants themselves, still part of
# the public API and still comparable. Business modules receive
# already-resolved, capability-checked infrastructure through the Registry
# and have no mode left to inspect, so this rule lives on as a residual-risk
# detector: a mode comparison outside the allowlisted sites means a mode
# decision has regressed into library code.
#
# ALLOWLIST (paths.exclude below) -- the mode-decision sites the retrofit
# left, each a deliberate, documented wiring-time decision:
#   * go/pkgcore/deployment_mode.go -- the mode constants + parser +
#     RequiredCapabilities() dispatch (the one place library code consults
#     the mode value, deciding which capabilities assembly must demand of
#     the resolved implementations)
#   * examples/reference-app/cmd/server/server.go -- the command entry
#     reads SPEED_DEPLOYMENT_MODE, parses it and passes the result to
#     Kernel.Bootstrap via WithDeploymentMode (kernel assembly is the
#     consumer binary's job, not a library module's)
#   * go/authn/module.go -- the newOptions check refusing a distributed
#     composition that wired no explicit WithSMSSender
#     (ErrMissingDistributedSMSSender) instead of silently defaulting to
#     the console sender nobody in that deployment mode reads. It is
#     authn's construction-time counterpart of pkgcore Kernel's own
#     resolveMailer/resolveObjectStore: authn owns its SMSSender seam and
#     does not register it on the pkgcore registry, so the assembly-time
#     constraint lives in the module's own constructor -- wiring-time only,
#     never in Service's request path, per WithDeploymentMode's own doc
#     comment. The site arrived with the SMS round, after the retrofit
#     alignment commit's empirical scan (whose two-file result missed it),
#     and is exempted as the same kind of assembly-time constraint the
#     other two sites make.
# The other former entries are deliberately NOT exempted: registry.go,
# observability's init.go and the reference-app main.go no longer carry a
# mode decision since the retrofit removed their switches, and a comparison
# re-added there must fire on sight.
#
# What fires: string-literal and constant comparisons against the two mode
# values (both operand orders, == and !=), case labels naming the mode
# values (unqualified or through any qualifier), and reads of the
# SPEED_DEPLOYMENT_MODE environment variable -- each is a mode decision.
#
# Out of scope: branching on a Capability -- caps.Has(MultiReplicaSafe), a
# case label on a capability value. Capabilities are the retrofit's new
# vocabulary for "may this implementation run in this topology", and no
# architecture-discipline row governs where a capability may gate behavior
# yet; that branch is a code-review question until such a row (and its own
# rule) exists. The negative fixture pins these shapes clean.
#
# Constant propagation: semgrep resolves same-package literal-valued
# consts before matching, so a mode decision smuggled through a local
# `const modeAlias = "standalone"` still fires -- matching is by VALUE,
# not by identifier name (the positive fixture's constEscaper proves it,
# the negative fixture's sqliteFlavor / logLevelEnv consts prove the
# flip side: consts holding other values stay clean).
#
# Residual gap: a module could still smuggle a mode decision behind an
# indirection that neither a text match nor value propagation reaches --
# e.g. a helper living inside an allowlisted file, a cross-package alias
# constant, or a decision computed at runtime. The rule sees the
# comparison sites, not the control flow that reaches them; review still
# owns those evasions.
rules:
  - id: deployment-mode-branch-outside-kernel-wiring
    message: >-
      deployment-mode comparison or SPEED_DEPLOYMENT_MODE read outside the
      kernel-wiring allowlist. The retrofit confined the mode to wiring:
      the RequiredCapabilities() dispatch (go/pkgcore/deployment_mode.go)
      and the consumer command entry's env read (the reference-app
      cmd/server/server.go) are the only allowlisted sites; business code
      receives already-resolved, capability-checked infrastructure and must
      never branch on the mode. See the rule header for the exact allowlist.
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $X == "standalone"
          - pattern: '"standalone" == $X'
          - pattern: $X != "standalone"
          - pattern: '"standalone" != $X'
          - pattern: $X == "distributed"
          - pattern: '"distributed" == $X'
          - pattern: $X != "distributed"
          - pattern: '"distributed" != $X'
          # A bare `case "standalone":` label is not a parseable Go
          # statement, so the case forms are anchored inside the switch
          # statement they belong to (the whole switch is the match).
          - pattern: |
              switch $X {
              case "standalone":
                  ...
              }
          - pattern: |
              switch $X {
              case "distributed":
                  ...
              }
          - pattern: $OBJ.DeploymentModeStandalone == $X
          - pattern: $X == $OBJ.DeploymentModeStandalone
          - pattern: $OBJ.DeploymentModeStandalone != $X
          - pattern: $X != $OBJ.DeploymentModeStandalone
          - pattern: $OBJ.DeploymentModeDistributed == $X
          - pattern: $X == $OBJ.DeploymentModeDistributed
          - pattern: $OBJ.DeploymentModeDistributed != $X
          - pattern: $X != $OBJ.DeploymentModeDistributed
          - pattern: |
              switch $X {
              case $OBJ.DeploymentModeStandalone:
                  ...
              }
          - pattern: |
              switch $X {
              case $OBJ.DeploymentModeDistributed:
                  ...
              }
          - pattern: 'os.Getenv("SPEED_DEPLOYMENT_MODE")'
    paths:
      exclude:
        - "**/*_test.go"
        - "**/integration_test/**"
        # Kernel-wiring allowlist (see header).
        - "**/go/pkgcore/deployment_mode.go"
        - "**/examples/reference-app/cmd/server/server.go"
        - "**/go/authn/module.go"
