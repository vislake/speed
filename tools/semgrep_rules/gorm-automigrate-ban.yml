# GORM AutoMigrate ban
#
# Discipline row: docs/internal/18-cicd.md architecture-discipline table,
# "AutoMigrate ban" row (semgrep: production migrations must be
# versioned SQL), and the root CLAUDE.md "Database and migrations" rule:
# never use AutoMigrate -- migrations are versioned SQL generated by Atlas
# from the GORM models, one set per dialect.
#
# STATUS: future guard. Zero real AutoMigrate call sites exist in the
# repository today -- every schema change ships as versioned migration
# SQL, and the mentions that do exist live in tests and comments (the
# discipline's own proof suites are excluded wholesale with the rest of
# the test files). The rule ships now so that the first AutoMigrate that
# lands anywhere in shipped code fails the scan immediately instead of
# waiting for review.
#
# What fires: any call to .AutoMigrate(...) on any receiver, in shipped
# (non-test) code.
rules:
  - id: gorm-automigrate-ban
    message: >-
      AutoMigrate call. Production migrations must be versioned SQL
      generated by Atlas from the GORM models (one set per dialect),
      never AutoMigrate -- see the rule header. A repository with zero
      AutoMigrate call sites today, this rule is the standing guard that
      keeps it that way.
    languages:
      - go
    severity: WARNING
    patterns:
      - pattern: $RECV.AutoMigrate($ARGS, ...)
    paths:
      exclude:
        - "**/*_test.go"
        - "**/integration_test/**"
