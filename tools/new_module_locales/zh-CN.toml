# __NAME__ 模块面向用户的中文（zh-CN）文案。
#
# 这里的 id 与 __NAME__ 模块 HTTP 处理器返回的 apperr.Error.Code 一一对应
# （见 handler.go）：接口本身从不直接返回这段文案——按后端编码规范的错误处理
# 规则，接口只返回结构化错误码与参数，由客户端根据错误码在自己的 i18n 目录中
# 查找文案，本文件就是本模块为该目录提供的一份资源。
#
# 文件契约（见 go/pkgcore/i18n）：每条消息是扁平的一条顶层条目——不允许
# [errors] 这类分组 section——且 zh-CN.toml 与 en-US.toml 必须携带完全相同的
# id 集合。

"__NAME__.name_required" = "名称不能为空。"
"__NAME__.name_too_long" = "名称不能超过 200 个字符。"
"__NAME__.invalid_request_body" = "请求体不是合法的 JSON。"
"__NAME__.internal_error" = "服务器内部发生错误，请稍后重试。"
