# golangci-lint configuration for the speed monorepo.
# Schema: golangci-lint v2 (see docs/internal/20-quality-and-security.md).
#
# This file establishes the standard early, so linting is never retrofitted
# after the fact. Taskfile.yml's lint task invokes it (from each module
# directory in turn, once golangci-lint is on PATH -- see the lint task's
# comment for why it cannot run from the go.work workspace root).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - gosec        # security-focused static analysis
    - bodyclose    # HTTP response bodies must be closed
    - depguard     # restricts which packages a file is allowed to import
    - errorlint    # correct error wrapping and comparison
    - misspell
    - rowserrcheck # database/sql Rows.Err() must be checked
    - sqlclosecheck

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        # Struct field ordering is not worth the churn on domain models.
        - fieldalignment
    staticcheck:
      checks:
        - all
    gosec:
      excludes:
        # Audited case-by-case in review rather than blanket-failed.
        - G104
    depguard:
      rules:
        # pkgcore is the dependency floor of the monorepo (see
        # go/pkgcore/AGENTS.md): every other module imports it, and it must
        # import none of them. This covers only the files directly in
        # go/pkgcore/ — the package's own root files — not its apperr/ or
        # config/ subpackages, which are separate packages under no such
        # constraint.
        #
        # No other module gets a rule here. The CLAUDE.md system-context
        # whitelist (admin/compliance/jobs/authn, plus tenancy's own audited
        # wrapper) is deliberately NOT encoded as a second depguard rule --
        # and, now that go/tenancy/system_context.go is real code calling
        # pkgcore.WithSystemContext, this is no longer a "those modules are
        # still stubs" gap for tenancy specifically. It is a hard limit of
        # depguard itself: depguard allows/denies a whole import path per
        # file, it cannot single out one symbol (WithSystemContext) from the
        # rest of an otherwise-needed package. pkgcore's root package is
        # also where TenantID, WithTenant, apperr and friends live, and
        # go/dbkit -- real, shipped, and NOT on the whitelist -- legitimately
        # imports those for reasons that have nothing to do with
        # WithSystemContext. Verified directly against this repo: a rule
        # shaped "only admin/compliance/jobs/authn/tenancy may import
        # github.com/vislake/speed/go/pkgcore" does correctly flag a probe's
        # WithSystemContext use from go/dbkit, but it also flags 23 of
        # go/dbkit's pre-existing, unrelated TenantID/apperr imports as
        # collateral damage -- and would do the same to every other module
        # the moment it stops being a stub, since pkgcore is the dependency
        # floor nearly everything sits above. That draft rule was reverted,
        # not merged.
        #
        # The caller whitelist is therefore enforced by code review /
        # CODEOWNERS on go/pkgcore and go/tenancy plus the doc comments on
        # pkgcore.WithSystemContext and tenancy.WithSystemContext (business
        # code should call the latter, which adds the audit publish), not by
        # static analysis. Making it depguard-checkable would mean moving
        # WithSystemContext into its own pkgcore subpackage with its own
        # import path (like apperr/ and config/ already have) -- a public
        # API change subject to CLAUDE.md's "treat public API as frozen"
        # rule, and a deliberate call for whoever owns go/pkgcore, not a
        # side effect of a lint-config edit.
        pkgcore-root:
          files:
            - "**/go/pkgcore/*.go"
          list-mode: lax
          allow:
            # The package's own import path, so its external black-box tests
            # (package pkgcore_test, in example_test.go) can still import the
            # package they test.
            - github.com/vislake/speed/go/pkgcore
          deny:
            - pkg: github.com/vislake/speed/go/
              desc: "pkgcore is the dependency floor of the monorepo: its root package must not import any other module under github.com/vislake/speed/go/"
        # --- Concrete-infrastructure import bans -------------------------
        # CLAUDE.md "Dependencies and module boundaries" (18-cicd
        # discipline-table row): "Do not import concrete infrastructure
        # implementations in business code. Depend on the pkgcore
        # interfaces (KVStore, EventBus, ObjectStore, Mailer), never on
        # go-redis, an S3 SDK, and so on."
        #
        # Each rule constrains only files under go/ -- the module
        # collection -- so examples/reference-app, a CONSUMER that wires
        # its own kernel at the command-entry layer, is never constrained
        # by these rules. The allowlist is the files list -- everything
        # under go/ except the package that owns the implementation -- and
        # the deny list names the client family by prefix, so subpackages
        # (minio-go's pkg/credentials) are covered as well. Depguard
        # denies whole import paths per file: the one or a few packages
        # whose code legitimately owns an implementation could not be
        # singled out any other way. Paths are resolved relative to this
        # config file, so the same rule is live whether golangci-lint runs
        # from the workspace root or from inside a module directory (the
        # go-module-ci shape: working-directory go/<module>).
        #
        # redis-only-in-pkgcore-and-jobs and minio-only-in-pkgcore exempt a
        # package, not a module: the Redis and S3 implementations that used
        # to sit in go/pkgcore's own root package (redis_eventbus.go,
        # redis_kv.go, s3_objectstore.go) moved into
        # go/pkgcore/eventbus/redis, go/pkgcore/kv/redis and
        # go/pkgcore/objectstore/s3 (issue #1 site 2), so the exemption
        # narrowed with them -- a redis or minio-go import anywhere else
        # under go/pkgcore, including a sibling implementation package, now
        # fails exactly like it would in any business module. This is the
        # acceptance criterion the split's own issue named: depguard was
        # structurally blind to "an implementation must not share a package
        # with a different seam's implementation" while the exemption
        # covered the whole module; it is not blind to it now.
        # asynq-only-in-jobs stays module-scoped -- go/jobs' own asynq
        # split, if it lands, is a separate round's job.
        #
        # Deliberately NOT encoded as depguard rules yet, each waiting for
        # its own round or for modules to exist to lint:
        #   * gorm -- imported so broadly by the real tree (dbkit's
        #     Repository internals, dbkit.Open()'s plain *gorm.DB for the
        #     identity and platform data domains, jobs' SQLite store) that
        #     a deny list would have to be as long as the allowlist. The
        #     discipline rows that DO constrain gorm usage -- no
        #     db.Table/db.Model/db.Raw around the Repository, no
        #     AutoMigrate -- are enforced by the semgrep rules in
        #     tools/semgrep_rules/.
        #   * the OTel / LGTM stack -- business modules legitimately touch
        #     span attributes (the sanctioned home of the tenant
        #     dimension); what else beyond attribute/ modules may import
        #     is a decision for the observability round.
        #   * rbac importing authn -- encoded below as the
        #     rbac-must-not-import-authn rule now that M1 business modules
        #     are real and the go-module-ci matrix lints them (the old
        #     "still stubs" deferral died with the stubs). The GENERAL
        #     discipline rows -- importing another business module's
        #     structs for database relations, and the whole module-import
        #     graph -- remain unencoded: they need either go-arch-lint or
        #     a per-module fan-in transcription of docs/internal/
        #     01-architecture.md's graph (an allow-list per module whose
        #     mistakes would redden every module at once), which no round
        #     has chosen yet; code review owns them.
        redis-only-in-pkgcore-and-jobs:
          # go/jobs' own exemption is narrowed to its queue/asynq
          # subpackage, not the whole module: the deployment-composition
          # retrofit's dependency-cost rule (root CLAUDE.md's "Do not put a
          # backend implementation in the same package as the interface it
          # implements") moved every go-redis import in go/jobs into
          # queue/asynq, so a business file dropped directly under
          # go/jobs/ (outside that subpackage) that reached for go-redis
          # again would now be a regression this rule catches, exactly as
          # it always has for go/pkgcore.
          #
          # Two pkgcore test-support exemptions, each narrower than a
          # package. eventbustest's own *_test.go driver of the shared suite
          # over a miniredis-backed pair of real eventbus/redis instances
          # (assert_conforms_redis_pair_test.go) must construct those
          # instances, and NewEventBus takes the concrete client, so the
          # driver needs go-redis exactly as the implementations' own test
          # files do -- but only that package's test files get it, since
          # the suite's shipped code (assert_conforms.go) may never import
          # the client and the package is not an implementation.
          # unittest's factory-path driver
          # proves the typed-configuration loop end to end -- register under
          # an alias name, select it from a composition, resolve it -- over
          # the two Redis-backed seams sharing one client
          # concrete *redis.Client by design, so the driver cannot exist
          # without the import; it is exempted per file, and every other
          # file under go/pkgcore/unittest stays under the ban.
          files:
            - "**/go/**"
            - "!**/go/pkgcore/eventbus/redis/**"
            - "!**/go/pkgcore/kv/redis/**"
            - "!**/go/jobs/queue/asynq/**"
            - "!**/go/pkgcore/eventbustest/*_test.go"
            - "!**/go/pkgcore/unittest/factory_registration_test.go"
          list-mode: lax
          deny:
            - pkg: github.com/redis/go-redis
              desc: "concrete Redis client imports belong to go/pkgcore/eventbus/redis, go/pkgcore/kv/redis and go/jobs/queue/asynq (the asynq Queue implementation) alone; business code depends on the pkgcore KVStore/EventBus interfaces or the jobs.Queue interface"
            - pkg: github.com/go-redis/redis
              desc: "legacy go-redis module path (archived) -- same ban as github.com/redis/go-redis"
        minio-only-in-pkgcore:
          files:
            - "**/go/**"
            - "!**/go/pkgcore/objectstore/s3/**"
          list-mode: lax
          deny:
            - pkg: github.com/minio/minio-go
              desc: "the S3 client -- go/pkgcore/objectstore/s3's ObjectStore implementation and its pkg/credentials subpackage -- belongs there alone; business code depends on the pkgcore ObjectStore interface"
        nats-only-in-pkgcore:
          # Two distributed-mode implementations share this one rule:
          # go/pkgcore/eventbus/nats (a second EventBus implementation --
          # docs/internal/03-deployment-modes.md's seam table used to name
          # NATS a candidate; this package made it real) and
          # go/pkgcore/kv/nats (a second KVStore implementation, on a NATS
          # JetStream KV bucket). Both were added the same way
          # eventbus/redis and kv/redis were -- a package of its own so the
          # SDK never reaches a consumer that only wires the in-process or
          # Redis-backed implementations -- and both need nats.go, so one
          # rule exempts both subpackages rather than each round trying to
          # own a same-named key: a future third nats.go consumer in
          # go/pkgcore adds its own subpackage to this same files list.
          files:
            - "**/go/**"
            - "!**/go/pkgcore/eventbus/nats/**"
            - "!**/go/pkgcore/kv/nats/**"
          list-mode: lax
          deny:
            - pkg: github.com/nats-io/nats.go
              desc: "the NATS client (and its jetstream subpackage) -- go/pkgcore/eventbus/nats's EventBus implementation and go/pkgcore/kv/nats's KVStore implementation -- belongs there alone; business code depends on the pkgcore EventBus/KVStore interfaces"
        memcached-only-in-pkgcore:
          # go/pkgcore/kv/memcached is a second distributed-mode KVStore
          # implementation, added the same way eventbus/nats was: a package
          # of its own from day one so the client never reaches a consumer
          # that only wires the in-process or Redis-backed implementations.
          # Unlike kv.redis, this implementation is honestly NOT
          # SurvivesRestart (see the package's own doc comment) and is not
          # named by any built-in composition, but the packaging rule is
          # identical either way: an implementation must not share a
          # package with a different seam's implementation, or with the
          # KVStore interface itself.
          files:
            - "**/go/**"
            - "!**/go/pkgcore/kv/memcached/**"
          list-mode: lax
          deny:
            - pkg: github.com/bradfitz/gomemcache
              desc: "the Memcached client -- go/pkgcore/kv/memcached's KVStore implementation -- belongs there alone; business code depends on the pkgcore KVStore interface"
        asynq-only-in-jobs:
          # Narrowed from the whole go/jobs module to its queue/asynq
          # subpackage by the jobs/asynq packaging-isolation round: asynq
          # (and go-redis, above) now sit in their own subpackage precisely
          # so a consumer that only ever runs jobs.StandaloneQueue never
          # pulls either in -- see go/jobs/AGENTS.md's dependency-cost
          # measurement. The exemption follows the implementation, not the
          # module, per root CLAUDE.md's "Do not put a backend
          # implementation in the same package as the interface it
          # implements" packaging rule.
          #
          # go/jobs/integration_test/ keeps its own exemption too: it is the
          # one other sanctioned place that legitimately drives the real
          # asynq library directly (building an asynq.RedisConnOpt from a
          # disposable testcontainer, tuning asynq.Config knobs for fast
          # tests) rather than through jobs.Queue -- exactly as it did
          # before this split, when the whole module shared one exemption.
          # Every file there carries `//go:build integration`, so this rule
          # never actually sees them in the default `golangci-lint run
          # ./...` CI leg (go-module-ci.yml never passes -tags=integration);
          # the exemption only matters for someone running the linter
          # locally with that tag set, matching `go test`'s own convention.
          files:
            - "**/go/**"
            - "!**/go/jobs/queue/asynq/**"
            - "!**/go/jobs/integration_test/**"
          list-mode: lax
          deny:
            - pkg: github.com/hibiken/asynq
              desc: "asynq is go/jobs/queue/asynq's distributed Queue implementation; business code depends on the jobs.Queue interface"
        # dbkit's two SQL dialect drivers are split into their own
        # dbkit/dialect subpackages (open.go's RegisterDialect / dialectRegistry,
        # mirroring database/sql's own driver-registration pattern -- see
        # go/dbkit/AGENTS.md's "One dependency, and why there is only one"
        # section). dbkit's root package no longer imports either driver
        # directly, so a caller wanting one blank-imports its subpackage,
        # e.g. `_ "github.com/vislake/speed/go/dbkit/dialect/sqlite"`. These
        # two rules are the acceptance gate for that split (issue #1): the
        # driver import stays denied everywhere under go/ except the one
        # subpackage that owns it, the same shape as the redis/minio/asynq
        # rules above.
        #
        # A handful of pre-existing dbkit-internal test-support files are
        # also excluded, for a reason unrelated to the split: they call
        # gorm.Open with the driver directly to get a plugin-less *gorm.DB
        # (migrations_test.go, audit/migrations_test.go --
        # MigrationRegistry.Apply's own subject is a raw connection;
        # encryption_test.go and internal/testutil/sqlite.go need one with
        # no tenant-scoping plugin installed and pinned to a single pooled
        # connection; integration_test/postgres_tenant_session_test.go opens
        # its own plain gorm.Open(postgres.Open(...)) connection, deliberately
        # bypassing dbkit.Open so its RLS test's restricted-role connection
        # carries no tenant-scoping plugin) or a short opportunistic-connect
        # timeout dbkit.Open does not expose (migrations_test.go's
        # openLocalPostgresForTest). None of them goes through dbkit.Open's
        # dialect registry at all, so the split gives them nothing to opt
        # into.
        sqlite-driver-only-in-dbkit-dialect-sqlite:
          files:
            - "**/go/**"
            - "!**/go/dbkit/dialect/sqlite/**"
            - "!**/go/dbkit/migrations_test.go"
            - "!**/go/dbkit/encryption_test.go"
            - "!**/go/dbkit/audit/migrations_test.go"
            - "!**/go/dbkit/internal/testutil/sqlite.go"
          list-mode: lax
          deny:
            - pkg: github.com/glebarez/sqlite
              desc: "the SQLite driver belongs to go/dbkit/dialect/sqlite alone; every other caller depends on dbkit.Open with dbkit.DialectSQLite and blank-imports that subpackage for its init side effect"
        postgres-driver-only-in-dbkit-dialect-postgres:
          files:
            - "**/go/**"
            - "!**/go/dbkit/dialect/postgres/**"
            - "!**/go/dbkit/migrations_test.go"
            - "!**/go/dbkit/audit/migrations_test.go"
            - "!**/go/dbkit/integration_test/postgres_tenant_session_test.go"
          list-mode: lax
          deny:
            - pkg: gorm.io/driver/postgres
              desc: "the PostgreSQL driver belongs to go/dbkit/dialect/postgres alone; every other caller depends on dbkit.Open with dbkit.DialectPostgres and blank-imports that subpackage for its init side effect"
        # rbac-must-not-import-authn: the 18-cicd discipline-table row
        # "rbac must not depend on authn" and root CLAUDE.md's
        # module-boundary rule ("authorization knows only
        # Subject{TenantID, UserID}; the authenticating side assembles
        # the Subject and calls authorization"). rbac never needs authn:
        # it declares the two structural seams (SubtreeResolver,
        # WithSubjectResolver) that hosts -- authn's module included --
        # implement. Files are constrained to the rbac module's own
        # tree; test files are exempted the same way the discipline
        # treats them elsewhere, because a module's tests may import a
        # sibling module's test-support packages to build subjects (no
        # such import exists in rbac today; the exemption keeps the
        # rule about the discipline, which governs shipped code).
        # Deny matches the module path and its subpackages, so an
        # authn-internal package import would fire the same way.
        rbac-must-not-import-authn:
          files:
            - "**/go/rbac/**"
            - "!**/go/rbac/**/*_test.go"
            - "!**/go/rbac/integration_test/**"
          list-mode: lax
          deny:
            - pkg: github.com/vislake/speed/go/authn
              desc: "rbac never imports authn: authorization knows only Subject{TenantID, UserID}, and the authenticating side (authn's module in a real host) assembles the Subject through rbac's own WithSubjectResolver seam"
        # go/observability's exporter split (issue #1 site 3): unlike the
        # three rules above, these two narrow their exemption to the
        # IMPLEMENTATION PACKAGE, not the owning module -- go/observability's
        # own root package (init.go) must not import either SDK either,
        # which is the whole point of the split (root CLAUDE.md's "do not
        # put a backend implementation in the same package as the interface
        # it implements"). Without this narrower shape, go/observability's
        # own root-package files would be exempt the same way pkgcore's and
        # jobs' are above, and depguard would never have caught the
        # regression this split fixes in the first place -- see issue #1's
        # own "depguard is currently blind to this" comment for the general
        # version of this finding, applying to all four of that issue's
        # sites.
        otlp-only-in-observability-exporter-otlp:
          files:
            - "**/go/**"
            - "!**/go/observability/exporter/otlp/**"
          list-mode: lax
          deny:
            - pkg: go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc
              desc: "the OTLP/gRPC metric exporter belongs to go/observability/exporter/otlp alone; go/observability's own root package resolves it through the RegisterOTLPExporters seam instead of importing it directly"
            - pkg: go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc
              desc: "the OTLP/gRPC trace exporter belongs to go/observability/exporter/otlp alone; go/observability's own root package resolves it through the RegisterOTLPExporters seam instead of importing it directly"
        prometheus-only-in-observability-exporter-prometheus:
          files:
            - "**/go/**"
            - "!**/go/observability/exporter/prometheus/**"
          list-mode: lax
          deny:
            - pkg: github.com/prometheus/client_golang
              desc: "the Prometheus client (promhttp included, as a subpackage of this import path) belongs to go/observability/exporter/prometheus alone; go/observability's own root package resolves a local metrics reader through the RegisterLocalMetricsReader seam instead of importing it directly"
            - pkg: go.opentelemetry.io/otel/exporters/prometheus
              desc: "the OTel-side Prometheus adapter is exporter-specific in exactly the same way as the client library above, and belongs alongside it in go/observability/exporter/prometheus alone"
        # go/pki's Signer provider split (round 4): the vault and kmsaws
        # subpackages are the first pki.Signer implementations that reach
        # for a third-party client, so they follow the same
        # narrowed-to-the-implementation-package shape the observability
        # exporter rules above use, not the module-wide shape the
        # redis/minio/asynq rules use -- go/pki's own root package (where
        # the Signer interface and LocalSigner live) must not import either
        # SDK either, which is the whole point of the split.
        hashicorp-vault-only-in-pki-signer-vault:
          files:
            - "**/go/**"
            - "!**/go/pki/signer/vault/**"
          list-mode: lax
          deny:
            - pkg: github.com/hashicorp/vault/api
              desc: "the Vault client belongs to go/pki/signer/vault alone; business code depends on the pki.Signer interface and resolves this implementation by name through pki.SignerRegistry, or by value through pki.WithSigner"
        aws-sdk-only-in-pki-signer-kmsaws:
          files:
            - "**/go/**"
            - "!**/go/pki/signer/kmsaws/**"
          list-mode: lax
          deny:
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: "the AWS SDK for Go v2 (its service/kms and credentials subpackages included, as subpackages of this import path) belongs to go/pki/signer/kmsaws alone; business code depends on the pki.Signer interface and resolves this implementation by name through pki.SignerRegistry, or by value through pki.WithSigner"
        # go/billing's PaymentGateway provider split (the gateway round):
        # stripe, alipay and wechat each reach for their own SDK/HTTP-client
        # material, and each rule is narrowed to its own implementation
        # subpackage, the identical shape the observability exporter rules
        # and go/pki's own vault/kmsaws rules above use -- go/billing's own
        # root package (where PaymentGateway and PaymentGatewayRegistry live,
        # gateway.go) must not import any of the three either, which is the
        # whole point of the split (docs/internal/06-billing-and-metering.md's
        # dependency-direction-must-be-one-way paragraph).
        stripe-sdk-only-in-billing-gateway-stripe:
          files:
            - "**/go/**"
            - "!**/go/billing/gateway/stripe/**"
          list-mode: lax
          deny:
            - pkg: github.com/stripe/stripe-go
              desc: "the Stripe Go SDK belongs to go/billing/gateway/stripe alone; business code depends on the billing.PaymentGateway interface and resolves this implementation by name through billing.PaymentGatewayRegistry, or by value through billing.WithGateways"
        alipay-sdk-only-in-billing-gateway-alipay:
          files:
            - "**/go/**"
            - "!**/go/billing/gateway/alipay/**"
          list-mode: lax
          deny:
            # alipay has no Go SDK maintained by Ant Group and no single
            # dominant community package (see go/billing/gateway/AGENTS.md's
            # own rationale for implementing directly against Alipay's
            # published API/signature documentation instead) -- this entry
            # exists so a future contributor who DOES pull in a third-party
            # Alipay SDK is stopped at the same boundary every other
            # provider's real SDK is, rather than the boundary silently
            # having no rule to catch it.
            - pkg: github.com/smartwalle/alipay
              desc: "a third-party Alipay SDK belongs to go/billing/gateway/alipay alone, if one is ever adopted; business code depends on the billing.PaymentGateway interface and resolves this implementation by name through billing.PaymentGatewayRegistry, or by value through billing.WithGateways"
        wechat-sdk-only-in-billing-gateway-wechat:
          files:
            - "**/go/**"
            - "!**/go/billing/gateway/wechat/**"
          list-mode: lax
          deny:
            # Same rationale as alipay-sdk-only-in-billing-gateway-alipay
            # above: no third-party WeChat Pay SDK is used by this round
            # (go/billing/gateway/AGENTS.md), but the most commonly reached-
            # for community package is denied here in advance of the
            # boundary being needed for real.
            - pkg: github.com/wechatpay-apiv3/wechatpay-go
              desc: "a third-party WeChat Pay SDK belongs to go/billing/gateway/wechat alone, if one is ever adopted; business code depends on the billing.PaymentGateway interface and resolves this implementation by name through billing.PaymentGatewayRegistry, or by value through billing.WithGateways"

  exclusions:
    generated: lax
    rules:
      # Test code may take shortcuts that production code may not.
      - path: _test\.go$
        linters:
          - gosec
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vislake/speed
