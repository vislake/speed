# golangci-lint configuration for the speed monorepo.
# Schema: golangci-lint v2 (see docs/internal/20-quality-and-security.md).
#
# This file establishes the standard now, while the modules are still stubs, so
# that linting is not retrofitted later. It is not yet invoked by Taskfile.yml.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - gosec        # security-focused static analysis
    - bodyclose    # HTTP response bodies must be closed
    - depguard     # restricts which packages a file is allowed to import
    - errorlint    # correct error wrapping and comparison
    - misspell
    - rowserrcheck # database/sql Rows.Err() must be checked
    - sqlclosecheck

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        # Struct field ordering is not worth the churn on domain models.
        - fieldalignment
    staticcheck:
      checks:
        - all
    gosec:
      excludes:
        # Audited case-by-case in review rather than blanket-failed.
        - G104
    depguard:
      rules:
        # pkgcore is the dependency floor of the monorepo (see
        # go/pkgcore/AGENTS.md): every other module imports it, and it must
        # import none of them. This covers only the files directly in
        # go/pkgcore/ — the package's own root files — not its apperr/ or
        # config/ subpackages, which are separate packages under no such
        # constraint.
        #
        # No other module gets a rule here. The CLAUDE.md system-context
        # whitelist (admin/compliance/jobs/authn, plus tenancy's own audited
        # wrapper) is deliberately NOT encoded as a second depguard rule --
        # and, now that go/tenancy/system_context.go is real code calling
        # pkgcore.WithSystemContext, this is no longer a "those modules are
        # still stubs" gap for tenancy specifically. It is a hard limit of
        # depguard itself: depguard allows/denies a whole import path per
        # file, it cannot single out one symbol (WithSystemContext) from the
        # rest of an otherwise-needed package. pkgcore's root package is
        # also where TenantID, WithTenant, apperr and friends live, and
        # go/dbkit -- real, shipped, and NOT on the whitelist -- legitimately
        # imports those for reasons that have nothing to do with
        # WithSystemContext. Verified directly against this repo: a rule
        # shaped "only admin/compliance/jobs/authn/tenancy may import
        # github.com/vislake/speed/go/pkgcore" does correctly flag a probe's
        # WithSystemContext use from go/dbkit, but it also flags 23 of
        # go/dbkit's pre-existing, unrelated TenantID/apperr imports as
        # collateral damage -- and would do the same to every other module
        # the moment it stops being a stub, since pkgcore is the dependency
        # floor nearly everything sits above. That draft rule was reverted,
        # not merged.
        #
        # The caller whitelist is therefore enforced by code review /
        # CODEOWNERS on go/pkgcore and go/tenancy plus the doc comments on
        # pkgcore.WithSystemContext and tenancy.WithSystemContext (business
        # code should call the latter, which adds the audit publish), not by
        # static analysis. Making it depguard-checkable would mean moving
        # WithSystemContext into its own pkgcore subpackage with its own
        # import path (like apperr/ and config/ already have) -- a public
        # API change subject to CLAUDE.md's "treat public API as frozen"
        # rule, and a deliberate call for whoever owns go/pkgcore, not a
        # side effect of a lint-config edit.
        pkgcore-root:
          files:
            - "**/go/pkgcore/*.go"
          list-mode: lax
          allow:
            # The package's own import path, so its external black-box tests
            # (package pkgcore_test, in example_test.go) can still import the
            # package they test.
            - github.com/vislake/speed/go/pkgcore
          deny:
            - pkg: github.com/vislake/speed/go/
              desc: "pkgcore is the dependency floor of the monorepo: its root package must not import any other module under github.com/vislake/speed/go/"

  exclusions:
    generated: lax
    rules:
      # Test code may take shortcuts that production code may not.
      - path: _test\.go$
        linters:
          - gosec
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vislake/speed
