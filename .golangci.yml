# golangci-lint configuration for the speed monorepo.
# Schema: golangci-lint v2 (see docs/internal/20-quality-and-security.md).
#
# This file establishes the standard now, while the modules are still stubs, so
# that linting is not retrofitted later. It is not yet invoked by Taskfile.yml.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - gosec        # security-focused static analysis
    - bodyclose    # HTTP response bodies must be closed
    - depguard     # restricts which packages a file is allowed to import
    - errorlint    # correct error wrapping and comparison
    - misspell
    - rowserrcheck # database/sql Rows.Err() must be checked
    - sqlclosecheck

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        # Struct field ordering is not worth the churn on domain models.
        - fieldalignment
    staticcheck:
      checks:
        - all
    gosec:
      excludes:
        # Audited case-by-case in review rather than blanket-failed.
        - G104
    depguard:
      rules:
        # pkgcore is the dependency floor of the monorepo (see
        # go/pkgcore/AGENTS.md): every other module imports it, and it must
        # import none of them. This covers only the files directly in
        # go/pkgcore/ — the package's own root files — not its apperr/ or
        # config/ subpackages, which are separate packages under no such
        # constraint.
        #
        # No other module gets a rule here yet. The CLAUDE.md system-context
        # whitelist (tenancy/jobs/admin/compliance/authn) is not encoded
        # because those modules are still stubs with no real code for an
        # import rule to check; this rule is added alone because pkgcore is
        # the one module whose dependency floor already has real code to
        # check it against.
        pkgcore-root:
          files:
            - "**/go/pkgcore/*.go"
          list-mode: lax
          allow:
            # The package's own import path, so its external black-box tests
            # (package pkgcore_test, in example_test.go) can still import the
            # package they test.
            - github.com/vislake/speed/go/pkgcore
          deny:
            - pkg: github.com/vislake/speed/go/
              desc: "pkgcore is the dependency floor of the monorepo: its root package must not import any other module under github.com/vislake/speed/go/"

  exclusions:
    generated: lax
    rules:
      # Test code may take shortcuts that production code may not.
      - path: _test\.go$
        linters:
          - gosec
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vislake/speed
